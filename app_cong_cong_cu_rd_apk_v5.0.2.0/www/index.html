lkaline hydroxide.", "1, tr.653"]], "d": [["Chất lỏng không màu hoặc vàng nhạt, mùi bùi nhẹ, vị nhạt hơi bùi; đục ở ~3 °C và đông đặc một phần ở nhiệt độ thấp hơn.", "1, tr.653"], ["Rất ít tan trong ethanol 95%; tan trong benzen, carbon tetraclorid và dầu; trộn lẫn với cloroform, ether và hexan.", "1, tr.653"]], "de": [["Colorless or light yellow liquid, mild odor, slightly bitter taste; opaque at ~3 °C and partially solidified at lower temperatures.", "1, tr.653"], ["Very slightly soluble in 95% ethanol; soluble in benzene, carbon tetrachloride and oil; miscible with chloroform, ether and hexane.", "1, tr.653"]], "a": "peanut oil dau lac dau dau phong arachis oil 8002-03-7 Peanut Oil Arachis Oil Arachis Oil, Refined Aextreff CT arachidis oleum raffinatum earthnut oil groundnut oil katchung oil solvent"}, {"id": "pectin", "n": "Pectin", "nv": "Pectin", "g": ["Chất nhũ hóa", "Chất tạo gel", "Chất làm tăng độ nhớt"], "ge": ["Emulsifying agent", "Gelling agent", "Viscosity-increasing agent"], "cas": "9000-65-5", "f": [["Dùng làm chất tạo gel trong chế phẩm nhỏ mũi để điều biến hấp thu thuốc; làm chất ổn định nhũ tương; nghiên cứu trong gel giải phóng kéo dài đường uống và hạt gel kiểm soát giải phóng ở đường tiêu hóa; dùng trong cốt pectin phân hủy ở đại tràng với màng bao nhạy pH.", "1, tr.656"]], "fe": [["Used as a gelling agent in nasal drops to modulate drug absorption; as emulsion stabilizer; studies in oral extended-release gels and gastrointestinal controlled-release gel beads; Used in colon-degradable pectin matrix with pH-sensitive coating.", "1, tr.656"]], "t": [["Tài liệu chưa đề cập.", "1, tr.656"]], "te": [["Documents not mentioned.", "1, tr.656"]], "d": [["Bột thô hoặc mịn màu trắng vàng, không mùi, vị nhầy.", "1, tr.656"], ["Tan trong nước; không tan trong ethanol 95% và các dung môi hữu cơ khác.", "1, tr.656"]], "de": [["Yellow-white coarse or fine powder, odorless, slimy taste.", "1, tr.656"], ["Soluble in water; Insoluble in 95% ethanol and other organic solvents.", "1, tr.656"]], "a": "pectin 9000-69-5 E440 Pectin Citrus pectin Genii', methopectin methyl pectin methyl pectinate mexpectin pectina pectinic acid Unipectine Ư"}, {"id": "pentetic-acid", "n": "Pentetic Acid", "nv": "Pentetic Acid", "g": ["Chất bảo quản kháng khuẩn", "Chất tạo phức"], "ge": ["Antimicrobial preservative", "Chelating / Complexing agent"], "cas": "", "f": [["Chủ yếu dùng làm chất tạo phức để điều chế thuốc cản quang/chất tương phản cho hình ảnh hạt nhân và cộng hưởng từ; làm tá dược mang đồng vị bắt neutron trong xạ trị; tạo hiệu ứng chống oxy hóa bằng cách tạo phức ion kim loại giảm gốc oxy hóa hoạt động khi đông khô.", "1, tr.658"]], "fe": [["Mainly used as a complexing agent to prepare contrast/contrast agents for nuclear and magnetic resonance imaging; as an excipient carrying neutron-capturing isotopes in radiotherapy; Creates an antioxidant effect by forming metal ion complexes to reduce active oxidant radicals when freeze-dried.", "1, tr.658"]], "t": [["Hoạt tính tạo phức có thể gây tác dụng không mong muốn trong công thức chứa ion kim loại; phức mong muốn có thể bị ion khác thay thế.", "1, tr.658"]], "te": [["Complexing activity may cause unwanted effects in formulations containing metal ions; The desired complex can be replaced by another ion.", "1, tr.658"]], "d": [["Chất rắn kết tinh màu trắng, gần như không mùi.", "1, tr.658"], ["Tan 1 trong 200 phần nước ở 25 °C.", "1, tr.658"]], "de": [["White, almost odorless crystalline solid.", "1, tr.658"], ["Dissolves 1 in 200 parts of water at 25 °C.", "1, tr.658"]], "a": "pentetic acid acid pentetic dtpa diethylenetriaminepentaacetic acid 67-43-6 Pentetic Acid Acidicum penteticum N,N-bis[2-[bis(carboxymethyl)amino]ethyl]glycine diethylenetriamine pentaacetic acid diethylenetriamineN,N,N',N',N\"-pentaacetic acid (diethylenetrinitrilo)pentaacetic acid DTPA glycine, N,N-bis[2-[bis(carboxymethyl)amino]ethyl] pentacarboxymethyl diethylenetriamine Versenex', ZK-43649"}, {"id": "petrolatum", "n": "Petrolatum", "nv": "Yellow Soft Paraffin; Yellow Petrolatum; Paraffin, Yellow Soft; Petrolatum", "g": ["Chất làm mềm da", "Tá dược thuốc mỡ"], "ge": ["Emollient", "Ointment base"], "cas": "8009-03-8", "f": [["Chủ yếu dùng trong chế phẩm dùng ngoài làm nền thuốc mỡ có tính làm mềm (ít được da hấp thu); dùng trong kem, chế phẩm qua da và làm chất bôi trơn. Nồng độ tham khảo: kem làm mềm dùng ngoài 10–30%, nhũ tương 4–25%, thuốc mỡ tới 100%.", "1, tr.659"]], "fe": [["Mainly used in topical preparations as an emollient ointment base (less absorbed by the skin); Used in creams, transdermal preparations and as lubricants. Reference concentrations: topical emollient cream 10–30%, emulsion 4–25%, ointment up to 100%.", "1, tr.659"]], "t": [["Là chất trơ, rất ít tương kỵ.", "1, tr.659"]], "te": [["It is an inert substance, with very few incompatibilities.", "1, tr.659"]], "d": [["Khối mềm trơn nhờn, trong mờ, màu vàng nhạt đến vàng, không mùi, không vị, ít huỳnh quang.", "1, tr.659"], ["Thực tế không tan trong aceton, ethanol, glycerin và nước; tan trong benzen, carbon disulfid, cloroform, ether, hexan và đa số dầu.", "1, tr.659"]], "de": [["Soft, greasy mass, translucent, light yellow to yellow, odorless, tasteless, low fluorescence.", "1, tr.659"], ["Practically insoluble in acetone, ethanol, glycerin and water; Soluble in benzene, carbon disulfide, chloroform, ether, hexane and most oils.", "1, tr.659"]], "a": "petrolatum vaselin petroleum jelly vaseline 8009-03-8 Yellow Soft Paraffin Yellow Petrolatum Paraffin, Yellow Soft Petrolatum Merkur mineral jelly Pinnacle Silk Silkolene Snow White Soft White vaselinum flavum yellow petrolatum oral capsules and tablets mineral oil light paraffin petrolatum and lanolin alcohols white petroleum jelly"}, {"id": "petrolatum-lanolin-alcohols", "n": "Petrolatum and Lanolin Alcohols", "nv": "Vaselin và alcol lanolin", "g": ["Chất làm mềm da", "Tá dược thuốc mỡ", "Chất hóa dẻo"], "ge": ["Emollient", "Ointment base", "Plasticizer"], "cas": "8009-03-8, 8027-33-6", "f": [["Dùng trong chế phẩm dùng ngoài làm nền thuốc mỡ có tính làm mềm và điều chế kem/lotion. Nồng độ tham khảo: thành phần nền hấp thu 10,0–50,0%; chất làm mềm và hóa dẻo trong thuốc mỡ 5,0–50,0%.", "1, tr.662"]], "fe": [["Used in external preparations as an emollient ointment base and in the preparation of creams/lotions. Reference concentration: background component absorbed 10.0–50.0%; emollients and plasticizers in ointments 5.0–50.0%.", "1, tr.662"]], "t": [["Tương kỵ với hắc ín than đá, ichthammol, phenol và resorcinol.", "1, tr.662"]], "te": [["Incompatible with coal tar, ichthammol, phenol and resorcinol.", "1, tr.662"]], "d": [["Chất rắn mềm màu ngà nhạt, mùi sterol nhẹ đặc trưng.", "1, tr.662"], ["Tan 1 trong 20 phần cloroform và 1 trong 100 phần dầu khoáng; tủa ở nồng độ cao hơn; tủa trong ethanol 95%, hexan và nước.", "1, tr.662"]], "de": [["Soft solid, light ivory color, characteristic mild sterol odor.", "1, tr.662"], ["Dissolves 1 in 20 parts of chloroform and 1 in 100 parts of mineral oil; precipitate at higher concentrations; precipitated in 95% ethanol, hexane and water.", "1, tr.662"]], "a": "petrolatum and lanolin alcohols vaselin va alcol lanolin Amerchol CAB Forlan 500 petrolatum and wool alcohols Vilvanolin CAB"}, {"id": "phenol", "n": "Phenol", "nv": "Phenol", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "108-95-2", "f": [["Chủ yếu dùng làm chất bảo quản kháng khuẩn trong thuốc tiêm; cũng dùng trong chế phẩm dùng ngoài. Không dùng cho chế phẩm đông khô. Nồng độ tham khảo: tiêm (bảo quản) 0,15–1,0%; gây tê tại chỗ 0,5–1,0%; sát khuẩn 5,0%; nước súc miệng <1,4%.", "1, tr.664"]], "fe": [["Mainly used as an antibacterial preservative in injectable drugs; Also used in preparations for external use. Do not use for freeze-dried preparations. Reference concentration: injection (storage) 0.15–1.0%; local anesthesia 0.5–1.0%; antiseptic 5.0%; mouthwash <1.4%.", "1, tr.664"]], "t": [["Có cấu trúc enol hơi acid, tạo muối với NaOH/KOH nhưng không với carbonat/bicarbonat; là chất khử, phản ứng với muối sắt (III) tạo phức màu xanh lục; làm mất màu dung dịch iod loãng.", "1, tr.664"]], "te": [["Has a slightly acidic enol structure, forms salt with NaOH/KOH but not with carbonate/bicarbonate; is a reducing agent, reacts with iron (III) salts to form a green complex; discolors dilute iodine solutions.", "1, tr.664"]], "d": [["Tinh thể dạng kim hoặc khối kết tinh màu không màu đến hồng nhạt, ăn da, chảy nước, mùi đặc trưng; nóng chảy thành chất lỏng chiết quang mạnh khi đun.", "1, tr.664"]], "de": [["Colorless to pale pink, needle-like crystals or crystalline masses, caustic, watery, characteristic odor; melts into a strongly refractive liquid when heated.", "1, tr.664"]], "a": "phenol carbolic acid 108-95-2 Phenol Benzophenol hydroxybenzene oxybenzene phenic acid phenolum phenyl hydrate phenyl hydroxide phenylic acid phenylic alcohol"}, {"id": "phenoxyethanol", "n": "Phenoxyethanol", "nv": "Phenoxyethanol", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "122-99-6", "f": [["Chất bảo quản kháng khuẩn dùng trong mỹ phẩm và chế phẩm dùng ngoài ở nồng độ 0,5–1,0%; cũng dùng làm chất bảo quản cho vaccine; hiệu quả trên khoảng pH rộng, mạnh nhất với Pseudomonas aeruginosa; thường phối hợp với chất bảo quản khác (paraben) để mở rộng phổ.", "1, tr.667"]], "fe": [["Antibacterial preservative used in cosmetics and topical preparations at concentrations of 0.5–1.0%; also used as a preservative for vaccines; Effective over a wide pH range, strongest against Pseudomonas aeruginosa; Often combined with other preservatives (parabens) to expand the spectrum.", "1, tr.667"]], "t": [["Hoạt tính có thể giảm do tương tác với chất diện hoạt không ion và bị hấp phụ bởi PVC; hoạt tính với Pseudomonas aeruginosa giảm khi có dẫn chất cellulose (methylcellulose, CMC natri, hypromellose).", "1, tr.667"]], "te": [["Activity may decrease due to interaction with non-ionic surfactants and adsorption by PVC; Activity against Pseudomonas aeruginosa decreases in the presence of cellulose derivatives (methylcellulose, CMC sodium, hypromellose).", "1, tr.667"]], "d": [["Chất lỏng không màu, hơi nhớt, mùi thơm nhẹ dễ chịu, vị nóng.", "1, tr.667"]], "de": [["Colorless liquid, slightly viscous, mild pleasant aroma, hot taste.", "1, tr.667"]], "a": "phenoxyethanol 2-phenoxyethanol 122-99-6 Phenoxyethanol Arosol Dowanol EPh Emeressence 1160 ethyleneglycol mono phenyl ether p-hydroxyethyl phenyl ether l-hydroxy-2-phenoxyethane Phenoxen Phenoxetol phenoxyethanolum Pphenoxyethyl alcohol Phenyl Cellosolve Protectol"}, {"id": "phenylethyl-alcohol", "n": "Phenylethyl Alcohol", "nv": "Phenylethyl Alcohol", "g": ["Chất bảo quản kháng khuẩn", "Chất tạo hương"], "ge": ["Antimicrobial preservative", "Flavoring agent"], "cas": "60-12-8", "f": [["Dùng làm chất bảo quản kháng khuẩn trong chế phẩm nhỏ mũi, nhỏ mắt và nhỏ tai ở nồng độ 0,25–0,5% tt/tt (thường phối hợp với chất bảo quản khác); dùng đơn độc tới 1% tt/tt trong chế phẩm dùng ngoài; cũng dùng làm chất tạo hương.", "1, tr.669"]], "fe": [["Used as an antibacterial preservative in nose drops, eye drops and ear drops at a concentration of 0.25–0.5% w/w (often combined with other preservatives); Used alone up to 1% wt/wt in preparations for external use; Also used as a flavoring agent.", "1, tr.669"]], "t": [["Tương kỵ với chất oxy hóa và protein (như huyết thanh); bị polysorbat bất hoạt một phần.", "1, tr.669"]], "te": [["Incompatible with oxidants and proteins (such as serum); partially inactivated by polysorbate.", "1, tr.669"]], "d": [["Chất lỏng trong, không màu, mùi hoa hồng; vị nóng gây kích ứng rồi gây tê niêm mạc.", "1, tr.669"]], "de": [["Clear, colorless liquid, rose odor; The hot taste causes irritation and then anesthetizes the mucosa.", "1, tr.669"]], "a": "phenylethyl alcohol alcol phenylethylic 2-phenylethanol 60-12-8 Phenylethyl Alcohol Benzeneethanol benzyl carbinol benzylmethanol p-fenylethanol P-fenethyIalkohol P\"hydroxyethyl benzene PEA phenethanol pphenylethyl alcohol 2-phenylethyl alcohol phenylethanol"}, {"id": "phenylmercuric-acetate", "n": "Phenylmercuric Acetate", "nv": "Phenylmercuric Acetate", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "62-38-4", "f": [["Dùng làm chất bảo quản kháng khuẩn thay phenylmercuric borat/nitrat trong một số mỹ phẩm và dược phẩm (thủy ngân không quá 0,007%); ưu tiên hơn phenylmercuric nitrat do độ tan cao hơn. Nồng độ tham khảo: diệt khuẩn trong thuốc tiêm và nhỏ mắt 0,001–0,002%; diệt tinh trùng (âm đạo) 0,02%.", "1, tr.671"]], "fe": [["Used as an antibacterial preservative to replace phenylmercuric borate/nitrate in some cosmetics and pharmaceuticals (mercury not exceeding 0.007%); preferred over phenylmercuric nitrate due to its higher solubility. Reference concentration: bactericidal in injections and eye drops 0.001–0.002%; Spermicide (vaginal) 0.02%.", "1, tr.671"]], "t": [["Như các muối phenylmercuric khác: tương kỵ với halogenid, chất nhũ hóa/gây treo anion, tragacanth, tinh bột, talc, natri metabisulfit, natri thiosulfat, dinatri edetat, silicat, nhôm và kim loại khác, amino acid, amoni; tương kỵ với cefuroxim và ceftazidim.", "1, tr.671"]], "te": [["As with other phenylmercuric salts: incompatible with halogenides, anionic emulsifiers/suspenders, tragacanth, starch, talc, sodium metabisulfite, sodium thiosulfate, disodium edetate, silicates, aluminum and other metals, amino acids, ammonium; Incompatible with cefuroxime and ceftazidime.", "1, tr.671"]], "d": [["Bột kết tinh màu trắng đến trắng kem, không mùi hoặc gần như không mùi, hoặc lăng trụ/phiến nhỏ màu trắng.", "1, tr.671"]], "de": [["White to creamy white crystalline powder, odorless or almost odorless, or white prisms/flakes.", "1, tr.671"]], "a": "phenylmercuric acetate phenylmercuric acetat 62-38-4 Phenylmercuric Acetate (Acetato-O)phenylmercury acetoxyphenylmercury phenylhydrargyri acetas phenylmercury acetate PMA PMAC PMAS"}, {"id": "phenylmercuric-borate", "n": "Phenylmercuric Borate", "nv": "Phenylmercuric Borate", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "102-98-7, 8017-88-7, 6273-99-0", "f": [["Dùng làm chất bảo quản kháng khuẩn thay phenylmercuric acetat/nitrat; tan tốt hơn phenylmercuric nitrat và được cho là ít kích ứng hơn cả hai muối kia.", "1, tr.673"]], "fe": [["Used as an antibacterial preservative instead of phenylmercuric acetate/nitrate; It is more soluble than phenylmercuric nitrate and is said to be less irritating than either salt.", "1, tr.673"]], "t": [["Như các muối phenylmercuric khác: tương kỵ với halogenid, chất nhũ hóa/gây treo anion, tragacanth, tinh bột, talc, natri metabisulfit, natri thiosulfat, dinatri edetat, silicat, nhôm và kim loại khác, amino acid, amoni.", "1, tr.673"]], "te": [["As with other phenylmercuric salts: incompatible with halogenides, anionic emulsifiers/suspenders, tragacanth, starch, talc, sodium metabisulfite, sodium thiosulfate, disodium edetate, silicates, aluminum and other metals, amino acids, ammonium.", "1, tr.673"]], "d": [["Vảy óng ánh không màu hoặc bột kết tinh màu trắng/hơi vàng, không mùi.", "1, tr.673"]], "de": [["Colorless iridescent flakes or white/yellowish crystalline powder, odorless.", "1, tr.673"]], "a": "phenylmercuric borate phenylmercuric borat 102-98-7 Phenylmercuric Borate (Dihydrogen borato)phenylmercury phenylhydrargyri boras phenylmercuriborate phenylmercury borate"}, {"id": "phenylmercuric-nitrate", "n": "Phenylmercuric Nitrate", "nv": "Phenylmercuric Nitrate", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "55-68-5, 8003-05-2", "f": [["Muối phenylmercuric dùng làm chất bảo quản kháng khuẩn chủ yếu trong chế phẩm nhỏ mắt; cũng dùng trong mỹ phẩm, thuốc tiêm và dùng ngoài; hoạt tính trên khoảng pH rộng (thường dùng ở môi trường trung tính đến kiềm). Trong công thức acid, phenylmercuric nitrat được ưu tiên vì không tủa.", "1, tr.675"]], "fe": [["Phenylmercuric salt is used as an antibacterial preservative mainly in eye drops; also used in cosmetics, injections and external use; Active over a wide pH range (usually used in neutral to alkaline environments). In acid formulations, phenylmercuric nitrate is preferred because it does not precipitate.", "1, tr.675"]], "t": [["Hoạt tính giảm khi có chất nhũ hóa/gây treo anion, tragacanth, tinh bột, talc, natri metabisulfit, natri thiosulfat, dinatri edetat và silicat (bentonit, magnesi nhôm silicat, magnesi trisilicat, kaolin); tương kỵ với halogenid (nhất là bromid, iodid) tạo hợp chất ít tan.", "1, tr.675"]], "te": [["Activity is reduced in the presence of anionic emulsifiers/suspenders, tragacanth, starch, talc, sodium metabisulfite, sodium thiosulfate, disodium edetate and silicates (bentonite, magnesium aluminum silicate, magnesium trisilicate, kaolin); Incompatible with halogenides (especially bromide, iodide) creating less soluble compounds.", "1, tr.675"]], "d": [["Bột kết tinh màu trắng, mùi thơm nhẹ; là hợp chất đẳng phân tử của phenylmercuric hydroxid và phenylmercuric nitrat.", "1, tr.675"]], "de": [["White crystalline powder, mild aroma; is an equimolecular compound of phenylmercuric hydroxide and phenylmercuric nitrate.", "1, tr.675"]], "a": "phenylmercuric nitrate phenylmercuric nitrat 55-68-5 Phenylmercuric Nitrate Basic phenylmercury nitrate mercuriphenyl nitrate merphenyl nitrate nitratophenylmercury phenylhydrargyri nitras phenylmer cury nitrate Phe-Mer-Nite"}, {"id": "phospholipids", "n": "Phospholipids", "nv": "Phospholipid", "g": ["Chất diện hoạt anion", "Vật liệu phân hủy sinh học", "Chất diện hoạt cation", "Chất phân tán", "Chất nhũ hóa", "Chất ổn định nhũ tương", "Chất tạo màng bán thấm", "Chất diện hoạt không ion hóa", "Chất làm tăng độ tan", "Chất gây treo"], "ge": ["Anionic surfactant", "Biodegradable material", "Cationic surfactant", "Dispersing agent", "Emulsifying agent", "Emulsion stabilizer", "Semipermeable membrane former", "Nonionic surfactant", "Solubilizing agent", "Suspending agent"], "cas": "", "f": [["Là phân tử lưỡng thân, thành phần chính của màng tế bào; tự tổ chức thành micelle và liposom; được dùng rộng rãi để tạo các loại liposom (đơn lớp, đa lớp, đa túi) trong nhiều hệ đưa thuốc.", "1, tr.678"]], "fe": [["Is a bicellular molecule, the main component of cell membranes; self-organizing into micelles and liposomes; widely used to create liposomes (monolayer, multilayer, multivesicle) in many drug delivery systems.", "1, tr.678"]], "t": [["Tài liệu chưa đề cập cụ thể (tùy loại phospholipid).", "1, tr.678"]], "te": [["The document does not mention specifically (depending on the type of phospholipid).", "1, tr.678"]], "d": [["Bột màu trắng; đôi khi cung cấp ở dạng dung dịch cloroform/methylen clorid trong; phosphatidylglycerol, acid phosphatidic và phosphatidylserin ở dạng muối natri/amoni.", "1, tr.678"]], "de": [["White powder; sometimes supplied as a clear chloroform/methylene chloride solution; phosphatidylglycerol, phosphatidic acid and phosphatidylserine as sodium/ammonium salts.", "1, tr.678"]], "a": "phospholipids phospholipid phosphatidylcholine lecithin phospholipid Coatsome glycerol phosphatides Lipoid phosphatides phosphatidic acid phosphatidylethanolamine phos phatidylglycerol phosphatidylinositol phosphatidylserine phosphoglycerides PhosphoLipid purified egg yolk PC"}, {"id": "phosphoric-acid", "n": "Phosphoric Acid", "nv": "Phosphoric Acid; Phosphoric Acid, Concentrated", "g": ["Chất acid hóa", "Chất đệm"], "ge": ["Acidifying agent", "Buffering agent"], "cas": "7664-38-2", "f": [["Dùng rộng rãi làm chất acid hóa trong nhiều chế phẩm; phối hợp với muối phosphat (natri phosphat mono/dibasic) tạo hệ đệm.", "1, tr.682"]], "fe": [["Widely used as an acidifying agent in many preparations; combined with phosphate salt (mono/dibasic sodium phosphate) to create a buffer system.", "1, tr.682"]], "t": [["Là acid mạnh, phản ứng với chất kiềm; hỗn hợp với nitromethan có thể nổ.", "1, tr.682"]], "te": [["Is a strong acid, reacts with alkalis; Mixtures with nitromethane may explode.", "1, tr.682"]], "d": [["Acid phosphoric đậm đặc là chất lỏng sánh như siro, không màu, không mùi.", "1, tr.682"], ["Trộn lẫn với ethanol 95% và nước (tỏa nhiệt).", "1, tr.682"]], "de": [["Concentrated phosphoric acid is a syrup-like liquid, colorless and odorless.", "1, tr.682"], ["Mix with 95% ethanol and water (exothermic).", "1, tr.682"]], "a": "phosphoric acid acid phosphoric 7664-38-2 E338 Phosphoric Acid Phosphoric Acid, Concentrated Acid fosforico acide phosphorique acidum phosphoricum concentratum hydrogen phosphate syrupy phosphoric acid"}, {"id": "polacrilex-resin", "n": "Polacrilex Resin", "nv": "Nhựa polacrilex", "g": ["Chất tạo phức", "Tá dược phóng thích biến đổi", "Chất làm tăng độ tan", "Chất che vị"], "ge": ["Chelating / Complexing agent", "Modified-release agent", "Solubilizing agent", "Taste-masking agent"], "cas": "9007-13-0", "f": [["Là nhựa trao đổi cation, tạo phức ('resinat') với phân tử thuốc qua trao đổi ion H⁺ để điều biến giải phóng, tăng độ ổn định, cải thiện độ tan và che vị; ví dụ tạo phức bền của cyanocobalamin và điều biến giải phóng nicotin (nicotine polacrilex trong kẹo cai thuốc).", "1, tr.684"]], "fe": [["It is a cation exchange resin that forms complexes ('resinates') with drug molecules through H⁺ ion exchange to modulate release, increase stability, improve solubility and cover taste; For example, stable complexation of cyanocobalamin and modulation of nicotine release (nicotine polacrilex in smoking cessation candy).", "1, tr.684"]], "t": [["Tương kỵ với chất oxy hóa.", "1, tr.684"]], "te": [["Incompatible with oxidizing agents.", "1, tr.684"]], "d": [["Bột màu trắng đến trắng ngà.", "1, tr.684"], ["Không tan trong nước và đa số dung môi.", "1, tr.684"]], "de": [["White to off-white powder.", "1, tr.684"], ["Insoluble in water and most solvents.", "1, tr.684"]], "a": "polacrilex resin nhua polacrilex nicotine polacrilex 9007-13-0 Amberlite IRP-64 polacrilex polacrilin resin polacrilin polycrilex resin"}, {"id": "polacrilin-potassium", "n": "Polacrilin Potassium", "nv": "Polacrilin Potassium", "g": ["Chất tạo phức", "Tá dược phóng thích biến đổi", "Tá dược rã (viên nén/nang)", "Chất che vị"], "ge": ["Chelating / Complexing agent", "Modified-release agent", "Tablet / capsule disintegrant", "Taste-masking agent"], "cas": "39394-76-5", "f": [["Là nhựa trao đổi cation acid yếu dùng trong chế phẩm uống làm tá dược rã; trong môi trường nước, nhựa trương do tính thân nước phá vỡ viên; nồng độ 2–10% kl/kl (thường 2% là đủ); cũng dùng làm chất che vị.", "1, tr.686"]], "fe": [["Is a weak acid cation exchange resin used in oral preparations as a disintegrant; In water, the resin swells due to its hydrophilic properties, breaking the pellet; concentration 2–10% w/kl (usually 2% is enough); Also used as a flavor masker.", "1, tr.686"]], "t": [["Tương kỵ với chất oxy hóa mạnh và amin, nhất là amin bậc ba.", "1, tr.686"]], "te": [["Incompatible with strong oxidizers and amines, especially tertiary amines.", "1, tr.686"]], "d": [["Bột trơn chảy màu kem, không mùi, không vị.", "1, tr.686"], ["Thực tế không tan trong nước và đa số chất lỏng, nhưng trương nhanh khi thấm ướt.", "1, tr.686"]], "de": [["Creamy, runny powder, odorless, tasteless.", "1, tr.686"], ["Practically insoluble in water and most liquids, but swells rapidly when wet.", "1, tr.686"]], "a": "polacrilin potassium polacrilin kali 39394-76-5 Polacrilin Potassium Amberlite IRP-88 polacrilinum kalii potassium methacrylate-divinylbenzene, copolymer"}, {"id": "poloxamer", "n": "Poloxamer", "nv": "Poloxamers", "g": ["Chất phân tán", "Chất nhũ hóa", "Chất diện hoạt không ion hóa", "Chất làm tăng độ tan", "Tá dược trơn bóng (viên nén/nang)"], "ge": ["Dispersing agent", "Emulsifying agent", "Nonionic surfactant", "Solubilizing agent", "Tablet / capsule glidant"], "cas": "9003-11-6", "f": [["Là chất diện hoạt copolymer polyoxyethylen–polyoxypropylen không ion; chủ yếu dùng làm chất nhũ hóa và tăng độ tan; phần polyoxyethylen thân nước, phần polyoxypropylen kỵ nước; các poloxamer khác nhau về tỷ lệ hai khối.", "1, tr.688"]], "fe": [["Is a non-ionic polyoxyethylene–polyoxypropylene copolymer surfactant; Mainly used as an emulsifier and solubility enhancer; The polyoxyethylene part is hydrophilic, the polyoxypropylene part is hydrophobic; poloxamers differ in their biblock ratio.", "1, tr.688"]], "t": [["Tùy nồng độ, poloxamer 188 tương kỵ với phenol và paraben; poloxamer 331 có thể phản ứng mãnh liệt với isocyanat; DMSO làm giảm nhiệt độ tạo micelle và tạo gel.", "1, tr.688"]], "te": [["Depending on concentration, poloxamer 188 is incompatible with phenol and paraben; poloxamer 331 can react violently with isocyanates; DMSO reduces micelle and gel formation temperatures.", "1, tr.688"]], "d": [["Poloxamer 188, 237, 338, 407 là bột/vảy sáp màu trắng/gần trắng; poloxamer 124 là chất lỏng không màu; gần như không mùi, không vị.", "1, tr.688"], ["Độ tan tùy loại; độ tan trong nước giảm khi nhiệt độ tăng (giảm hydrat hóa).", "1, tr.688"]], "de": [["Poloxamer 188, 237, 338, 407 are white/near white waxy powders/flakes; poloxamer 124 is a colorless liquid; Almost odorless and tasteless.", "1, tr.688"], ["Solubility depends on type; Water solubility decreases with increasing temperature (decreased hydration).", "1, tr.688"]], "a": "poloxamer pluronic lutrol poloxamer 188 poloxamer 407 9003-11-6 Poloxamers Poloxamer Lutrol Monolatv, Pluracare Pluronic poloxalkol poloxamera polyethylene—propylene glycol copolymer polyoxyethylene-polyoxypropylene copolymer Supronic, Surfonic^ Synperonic"}, {"id": "poly-dl-lactic-acid", "n": "Poly(DL-Lactic Acid)", "nv": "Poly(DL-lactic acid) (PDLLA)", "g": ["Vật liệu phân hủy sinh học", "Chất tạo màng bao", "Tá dược phóng thích biến đổi"], "ge": ["Biodegradable material", "Coating agent", "Modified-release agent"], "cas": "26023-30-3, 26680-10-4", "f": [["Dùng trong hệ đưa thuốc dạng cấy, tiêm và phân tán rắn uống; cũng dùng làm chất bao.", "1, tr.699"]], "fe": [["Used in drug delivery systems in culture, injection and oral solid dispersion; Also used as a coating.", "1, tr.699"]], "t": [["Tương kỵ với acid mạnh hoặc chất kiềm.", "1, tr.699"]], "te": [["Incompatible with strong acids or alkalis.", "1, tr.699"]], "d": [["Vật liệu dạng thủy tinh, viên hoặc hạt màu trắng đến vàng óng.", "1, tr.699"]], "de": [["Glassy, white to golden-yellow pellets or granules.", "1, tr.699"]], "a": "poly(dl-lactic acid) pdlla poly dl lactic acid 26680-10-4 DL-Dilactide homopolymer DL-dilactide polymer DL-PLA DL-3,6dimethyl-l,4-dioxane-2,5-dione homopolymer lactic acid homopolymer D,L-lactic acid homopolymer D,L-lactic acid poly mer D-lactic acid-L copolymer DL-lactide polymer D-lactide-Llactide copolymer PDLLA poly (R5)-2-hydroxypropanoic acid D,L-polylactic acid poly(J/-lactic acid) polylactide poly(DL-lactide) poly-DL-lactide"}, {"id": "pvm-ma-copolymer", "n": "Poly(methyl vinyl ether/maleic anhydride)", "nv": "Copolymer methyl vinyl ether/maleic anhydrid (Gantrez)", "g": ["Vật liệu kết dính sinh học", "Chất tạo phức", "Chất ổn định nhũ tương", "Chất tạo màng", "Thành phần hệ trị liệu qua da", "Chất làm tăng độ nhớt"], "ge": ["Bioadhesive material", "Chelating / Complexing agent", "Emulsion stabilizer", "Film-forming agent", "Transdermal delivery component", "Viscosity-increasing agent"], "cas": "", "f": [["Copolymer và dẫn chất dùng làm nền keo dán răng giả, màng bao giải phóng kiểm soát, màng bao tan ở ruột, keo dán túi hậu môn nhân tạo và hệ dẫn thuốc qua da.", "1, tr.718"]], "fe": [["Copolymers and derivatives are used as denture adhesive bases, controlled release coatings, enteric coatings, colostomy bag adhesives, and transdermal drug delivery systems.", "1, tr.718"]], "t": [["Tương kỵ với chất oxy hóa và khử mạnh, acid nitric/sulfuric đậm đặc, kali t-butoxid, nhôm và crotonaldehyd.", "1, tr.718"]], "te": [["Incompatible with strong oxidizing and reducing agents, concentrated nitric/sulfuric acid, potassium t-butoxide, aluminum and crotonaldehyde.", "1, tr.718"]], "d": [["Dạng rắn là bột trơn chảy màu trắng/trắng ngà, không mùi, hút ẩm; trong dung dịch là chất lỏng nhớt hơi đục, không mùi.", "1, tr.718"]], "de": [["The solid form is a white/ivory white, slippery, odorless, hygroscopic powder; In solution it is a slightly turbid, odorless viscous liquid.", "1, tr.718"]], "a": "poly(methyl vinyl ether/maleic anhydride) pvm/ma gantrez copolymer methyl vinyl ether maleic anhydrid 9011-16-9"}, {"id": "polycarbophil", "n": "Polycarbophil", "nv": "Polycarbophil", "g": ["Chất hấp phụ", "Vật liệu kết dính sinh học", "Chất nhũ hóa", "Chất tạo gel", "Tá dược phóng thích biến đổi", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Adsorbent", "Bioadhesive material", "Emulsifying agent", "Gelling agent", "Modified-release agent", "Suspending agent", "Tablet / capsule binder", "Viscosity-increasing agent"], "cas": "9003-97-8", "f": [["Thường dùng làm chất tăng độ nhớt ở nồng độ rất thấp (<1%) trong lotion, kem, gel dùng ngoài, hỗn dịch uống và bồn chứa gel qua da; làm chất nhũ hóa cho hệ dầu/nước dùng ngoài; là chất kết dính sinh học tốt (viên/miếng dán bám dính niêm mạc).", "1, tr.693"]], "fe": [["Often used as a viscosity increasing agent at very low concentrations (<1%) in lotions, creams, topical gels, oral suspensions and transdermal gel tanks; as an emulsifier for oil/water systems for external use; is a good biological adhesive (mucosal adhesion tablet/patch).", "1, tr.693"]], "t": [["Sinh nhiệt khi tiếp xúc chất base mạnh (amoniac, NaOH, KOH, amin base mạnh); không tương hợp với polymer cation, acid mạnh và nồng độ chất điện giải cao (chất điện giải làm giảm độ nhớt gel).", "1, tr.693"]], "te": [["Heat generation when exposed to strong bases (ammonia, NaOH, KOH, strong base amines); Incompatible with cationic polymers, strong acids and high electrolyte concentrations (electrolytes reduce gel viscosity).", "1, tr.693"]], "d": [["Bột polymer xốp màu trắng đến trắng ngà, hơi acid, mùi nhẹ như ester.", "1, tr.693"]], "de": [["White to off-white porous polymer powder, slightly acidic, mild ester-like odor.", "1, tr.693"]], "a": "polycarbophil 9003-97-8 Polycarbophil"}, {"id": "polydextrose", "n": "Polydextrose", "nv": "Polydextrose", "g": ["Tá dược dập thẳng", "Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Chất giữ ẩm", "Chất tạo màng bao"], "ge": ["Direct compression vehicle", "Tablet / capsule binder", "Tablet / capsule diluent", "Humectant", "Coating agent"], "cas": "68424-04-4", "f": [["Chủ yếu dùng trong dạng rắn; dung dịch polydextrose dùng làm tá dược dính khi xát hạt ướt; cũng dùng sản xuất tá dược dập thẳng và làm màng/bao viên phối hợp với vật liệu khác.", "1, tr.696"]], "fe": [["Mainly used in solid form; polydextrose solution used as a sticky excipient when rubbing wet seeds; Also used to produce excipients for straight stamping and film/tablet coating in combination with other materials.", "1, tr.696"]], "t": [["Tương kỵ với chất oxy hóa, acid mạnh và kiềm (tạo màu nâu và giải trùng hợp).", "1, tr.696"]], "te": [["Incompatible with oxidizing agents, strong acids and alkalis (browning and depolymerization).", "1, tr.696"]], "d": [["Bột màu trắng ngà đến nâu nhạt, không mùi, vị nhạt hơi ngọt/chua tùy grade; cũng có dạng lỏng (70% chất khô).", "1, tr.696"], ["Trộn lẫn hoàn toàn với nước (độ tan cao, pha được dung dịch 80% ở 20 °C); ít tan đến không tan trong đa số dung môi hữu cơ.", "1, tr.696"]], "de": [["Ivory white to light brown powder, odorless, slightly sweet/sour taste depending on grade; also available in liquid form (70% dry matter).", "1, tr.696"], ["Completely miscible with water (high solubility, 80% solution can be mixed at 20 °C); slightly soluble to insoluble in most organic solvents.", "1, tr.696"]], "a": "polydextrose litesse 68424-04-4 E1200 Polydextrose El200 Litesse polydextrose A polydextrose K STA-Lite"}, {"id": "polyethylene-glycol", "n": "Polyethylene Glycol", "nv": "Macrogols; Polyethylene Glycol", "g": ["Chất tạo màng bao", "Tá dược thuốc mỡ", "Chất hóa dẻo", "Dung môi", "Tá dược thuốc đạn/đặt", "Tá dược độn (viên nén/nang)", "Tá dược trơn bóng (viên nén/nang)"], "ge": ["Coating agent", "Ointment base", "Plasticizer", "Solvent", "Suppository base", "Tablet / capsule diluent", "Tablet / capsule glidant"], "cas": "25322-68-3", "f": [["Dùng rộng rãi trong chế phẩm tiêm, dùng ngoài, nhỏ mắt, uống và trực tràng; grade rắn dùng làm nền thuốc mỡ và nền thuốc đặt (thân nước, dễ rửa); PEG lỏng làm dung môi và chất hóa dẻo.", "1, tr.701"], ["Cũng dùng làm tá dược độn/trơn và chất bao viên.", "1, tr.701"]], "fe": [["Widely used in injectable, topical, ophthalmic, oral and rectal preparations; solid grade used as ointment base and suppository base (water-based, easy to wash); Liquid PEG as solvent and plasticizer.", "1, tr.701"], ["Also used as a filler/lubricant and tablet coating agent.", "1, tr.701"]], "t": [["Có thể oxy hóa nhẹ do vết peroxid; tương kỵ với một số chất màu; hoạt tính kháng khuẩn của một số kháng sinh giảm trong nền PEG (nhất là penicillin, bacitracin); có thể làm hóa dẻo và mềm chất dẻo trong bao bì.", "1, tr.701"]], "te": [["May be slightly oxidized due to peroxide stains; Incompatible with some colorants; Antibacterial activity of some antibiotics is reduced in PEG matrix (especially penicillin, bacitracin); can plasticize and soften plastics in packaging.", "1, tr.701"]], "d": [["PEG 200–600 là chất lỏng nhớt, trong, không màu hoặc vàng nhạt, mùi nhẹ đặc trưng, vị đắng hơi nóng; grade phân tử lượng cao (>1000) là chất rắn màu trắng.", "1, tr.701"], ["Mọi grade tan trong nước và trộn lẫn với nhau; PEG lỏng tan trong nhiều dung môi hữu cơ.", "1, tr.701"]], "de": [["PEG 200–600 is a viscous, clear, colorless or pale yellow liquid, with a characteristic mild odor and a slightly hot, bitter taste; High molecular weight grade (>1000) is a white solid.", "1, tr.701"], ["All grades are water soluble and miscible; Liquid PEG is soluble in many organic solvents.", "1, tr.701"]], "a": "polyethylene glycol peg macrogol carbowax polyethylen glycol 25322-68-3 Macrogol Macrogols Polyethylene Glycol Carbowax-, Carbowax Sentry Kollisolv Lipoxol Lutrol E macrogola PEG Pluriol E polyglykol polyoxyethylene glycol Ultrapeg"}, {"id": "polyethylene-oxide", "n": "Polyethylene Oxide", "nv": "Polyethylene Oxide", "g": ["Vật liệu kết dính sinh học", "Chất tạo màng bao", "Tá dược dính (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Bioadhesive material", "Coating agent", "Tablet / capsule binder", "Viscosity-increasing agent"], "cas": "25322-68-3", "f": [["Dùng làm tá dược dính viên nén (5–85%); grade phân tử lượng cao cho giải phóng kéo dài theo cơ chế cốt thân nước; hỗ trợ đùn tạo hạt và đùn nóng chảy; là polymer bám dính niêm mạc rất tốt; lượng thấp là chất làm đặc hiệu quả.", "1, tr.707"]], "fe": [["Used as an excipient to bind tablets (5–85%); High molecular weight grade for sustained release based on hydrophilic mechanism; Supports granulation extrusion and melt extrusion; is a polymer that adheres very well to mucous membranes; Low quantity is an effective thickener.", "1, tr.707"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.707"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.707"]], "d": [["Bột trơn chảy màu trắng đến trắng ngà, mùi amoniac nhẹ.", "1, tr.707"], ["Tan trong nước và một số dung môi hữu cơ (acetonitril, cloroform, methylen clorid); không tan trong hydrocarbon aliphatic.", "1, tr.707"]], "de": [["White to ivory white, slippery powder, mild ammonia odor.", "1, tr.707"], ["Soluble in water and some organic solvents (acetonitrile, chloroform, methylene chloride); Insoluble in aliphatic hydrocarbons.", "1, tr.707"]], "a": "polyethylene oxide peo polyox polyethylen oxid 25322-68-3 Polyethylene Oxide Polyox polyoxiante polyoxirane polyoxyethylene"}, {"id": "polymethacrylates", "n": "Polymethacrylates", "nv": "Amino Methacrylate Copolymer; Ammonio Methacrylate Copolymer Dispersion; Ethyl Acrylate and Methyl Methacrylate Copolymer", "g": ["Chất tạo màng", "Tá dược phóng thích biến đổi", "Chất làm tăng độ tan", "Tá dược dính (viên nén/nang)"], "ge": ["Film-forming agent", "Modified-release agent", "Solubilizing agent", "Tablet / capsule binder"], "cas": "24938-16-7 (Eudragit E); 25086-15-1 (L/S); 25212-88-8 (L100-55); 33434-24-1 (RL/RS)", "f": [["Chủ yếu dùng làm chất tạo màng bao viên nang và viên nén; tùy loại polymer cho màng có độ tan khác nhau: Eudragit E tan ở dịch vị pH <5 (chống ẩm, che vị, tăng độ tan); Eudragit L, S, FS tan ở ruột (bao tan ở ruột, tan ở pH khác nhau, vd. L tan ở pH >6).", "1, tr.709"]], "fe": [["Mainly used as a coating agent for capsules and tablets; Depending on the type of polymer, the membrane has different solubility: Eudragit E is soluble in gastric juice pH <5 (anti-humidity, masking taste, increasing solubility); Eudragit L, S, FS are enteric soluble (intestinal soluble, soluble at different pH, eg. L soluble at pH >6).", "1, tr.709"]], "t": [["Một số phân tán có thể đông tụ do chất điện giải tan, thay đổi pH, dung môi hữu cơ hoặc nhiệt độ cực trị; phân tán Eudragit L 30 D, RL 30 D, L 100-55, RS 30 D tương kỵ với magnesi stearat.", "1, tr.709"]], "te": [["Some dispersions may coagulate due to dissolved electrolytes, pH changes, organic solvents, or temperature extremes; Eudragit dispersion L 30 D, RL 30 D, L 100-55, RS 30 D are incompatible with magnesium stearate.", "1, tr.709"]], "d": [["Là polymer tổng hợp cation và anion của dimethylaminoethyl methacrylat, acid methacrylic và ester acid methacrylic ở các tỷ lệ khác nhau; có ở dạng bột khô, phân tán nước hoặc dung dịch hữu cơ.", "1, tr.709"]], "de": [["Is a cationic and anionic synthetic polymer of dimethylaminoethyl methacrylate, methacrylic acid and methacrylic acid ester in different ratios; Available as dry powder, water dispersion or organic solution.", "1, tr.709"]], "a": "polymethacrylates polymethacrylat eudragit kollicoat methacrylic acid copolymer 9010-88-2 Ammonio Methacrylate Copolymer (Type A) Amino Methacrylate Copolymer Acryl-EZEammonio methacrylatis copolymerum copolymerum methacrylatis butylati basicum Drugcoat Eastacryl Eudragit Kollicoat MAE polyacrylatis dispersio 30 per centum Ammonio Methacrylate Copolymer Ammonio Methacrylate Copolymer Dispersion Ethyl Acrylate and Methyl Methacrylate Copolymer"}, {"id": "polyoxyethylene-alkyl-ethers", "n": "Polyoxyethylene Alkyl Ethers", "nv": "Macrogol Cetostearyl Ether; Macrogol Lauryl Ether; Lauromacrogol; Polyoxyl 20 Cetostearyl Ether; Polyoxyl 10 Oleyl Ether; Polyoxyl Lauryl Ether", "g": ["Chất phân tán", "Chất nhũ hóa", "Chất tạo gel", "Chất diện hoạt không ion hóa", "Chất tăng thấm", "Chất làm tăng độ tan", "Chất làm tăng độ nhớt"], "ge": ["Dispersing agent", "Emulsifying agent", "Gelling agent", "Nonionic surfactant", "Permeation enhancer", "Solubilizing agent", "Viscosity-increasing agent"], "cas": "9004-95-9, 9002-92-0, 9004-98-2, 9005-00-9", "f": [["Là chất diện hoạt không ion dùng rộng rãi trong chế phẩm dùng ngoài và mỹ phẩm, chủ yếu làm chất nhũ hóa cho nhũ tương nước/dầu và dầu/nước và ổn định vi nhũ tương/nhũ tương kép; làm chất tăng độ tan cho tinh dầu, vitamin dầu và thuốc kém tan (cortison acetat, griseofulvin); làm chất thấm ướt/phân tán.", "1, tr.721"]], "fe": [["It is a non-ionic surfactant widely used in topical preparations and cosmetics, mainly as an emulsifier for water/oil and oil/water emulsions and stabilizes microemulsions/double emulsions; as a solubility enhancer for essential oils, vitamins and poorly soluble drugs (cortisone acetate, griseofulvin); as a wetting/dispersing agent.", "1, tr.721"]], "t": [["Đổi màu hoặc tủa với iodid, muối thủy ngân, phenol, salicylat, sulfonamid và tannin; hiệu lực chất bảo quản có nhóm phenol (như paraben) giảm do liên kết hydro.", "1, tr.721"]], "te": [["Discoloration or precipitation with iodides, mercury salts, phenols, salicylates, sulfonamides and tannins; The potency of preservatives with phenolic groups (such as parabens) is reduced due to hydrogen bonding.", "1, tr.721"]], "d": [["Hình thức đa dạng từ lỏng, bột nhão đến sáp rắn; màu không màu/trắng/kem/vàng nhạt, mùi nhẹ.", "1, tr.721"]], "de": [["Forms vary from liquid, paste to solid wax; colorless/white/cream/light yellow, mild odor.", "1, tr.721"]], "a": "polyoxyethylene alkyl ethers polyoxyethylen alkyl ether brij cetomacrogol 9002-92-0 Macrogol Cetostearyl Ether Lauromacrogol Polyoxyl 20 Cetostearyl Ether Cyclogol 1000 Emalex Emulgen Ethosperse Genapol Hetoxol Hostacerin jeecol Eipocol Lumulse Nikkol macrogol ethers macrogoli aether cetostearylicus macrogoli aether laurilicus macrogoli aether oleicus polyethylene glycol 1000 macrocetyl ether Cremophor AÓ. Briị CS-20 Ceteareth 20 CremophorA 20 polyether Genapol Ĩ200 Hetoxol CS-20 Jeecol CS-20 Lipocol SC-20 Lumulse CS-20 Rifacet 20. Briị CS25 Cefeareth 25 Cremophor A25 Hetoxol CS-25. Briị C2 ceteth-2 Hetoxol CA-2 Jeecol CA-10 Lipocol C-2 Nikkol BC-2 Procol CA-2. Bn'i c 10 ceteth-10 Lipocol C-10 Nikkol BC- 1 0TX Procol CA-10. Bn'i C20 ceteth-20 Hefoxol CA-20 Jeecol CA-20 Lipocol C-20 Nikkol BC-20TX. Ethosperse G-2Ó Genapol G-260 Glycereth-26 Hetoxide G-2Ố Jeechem GL-2Ố. Briị L4 Ethosperse LA-4 Genapol LA 040 Hetoxol LA-4 Jeecol LA-4 laureth-4 Lipocol L-4 Lumulse L-4 Nikkol BL-4.2 Procol LA-4. Briị L9 Hetoxol LA-9 Jeecol LA-9 laureth-9 lauromacrogol 400 Nikkol BL-9EX polidocanol. Hetoxol LA-12 Jeecol LA-12 laureth-12 Lipocol L-12 Lumulse L-12 Procol LA-12. Briị L23 Ethosperse LA-23 Genapol LA 230 Hetoxol LA-23 Jeecol LA-23 laureth-23 Lipocol L-23 Lumulse L-23 Procol LA23 Ritox 35. Brij 02 Genapol o 020 Jeecol OA-2 Lipocol 0-2 Nikkol BO-2V oleth-2 Procol OA-2 Ritoleth 2. Briị 010 Genapol o 100 Hetoxol OA-IO Jeecol OA-10 Lipocol 0-10 Nikkol BO-IOV oleth-10 polyethylene glycol monooleyl ether Procol OA-10 Ritoleth 10 g dung dịch acid/kiềm mạnh, phần ester bị xà phòng hóa; tương kỵ với thủy ngân (II) clorid (gây tủa); một số chất hữu cơ chứa nhóm phenol (phenol, resorcinol, tannin) có thể gây tủa.", "1, tr.728"]], "te": [["In strong acid/alkaline solutions, the ester portion is saponified; Incompatible with mercury (II) chloride (causes precipitation); Some organic substances containing phenol groups (phenol, resorcinol, tannin) can cause precipitation.", "1, tr.728"]], "d": [["Polyoxyl 35 castor oil là chất lỏng dạng dầu màu vàng nhạt (trong trên 26 °C); polyoxyl 40 hydrogenated castor oil là bột nhão nửa rắn màu trắng/vàng, hóa lỏng ở 30 °C.", "1, tr.728"]], "de": [["Polyoxyl 35 castor oil is a pale yellow oily liquid (clear above 26 °C); polyoxyl 40 hydrogenated castor oil is a white/yellow semi-solid paste that liquefies at 30 °C.", "1, tr.728"]], "a": "polyoxyethylene castor oil derivatives polyoxyl 35 castor oil cremophor el polyoxyl 40 hydrogenated castor oil kolliphor 61791-12-6 Macrogolglycerol Ricinoleate Etocas Eumulgin\\ Jeecbem-, Kollipbor Lipocol Lumulse macrogolglyceroli hydroxystearas macrogolglyceroli ricinoleas Nikkol Protacbem Simulsol Polyoxyl Castor Oil Hydrogenated Polyoxyl Castor Oil Macrogolglycerol Hydroxystearate Polyoxyl 35 Castor Oil Polyoxyl 40 Hydrogenated Castor Oil"}, {"id": "polysorbates", "n": "Polyoxyethylene Sorbitan Fatty Acid Esters", "nv": "Polysorbate 20; Polysorbate 40; Polysorbate 60; Polysorbate 80", "g": ["Chất phân tán", "Chất làm mềm da", "Chất nhũ hóa", "Chất diện hoạt không ion hóa", "Chất hóa dẻo", "Chất làm tăng độ tan", "Chất gây treo"], "ge": ["Dispersing agent", "Emollient", "Emulsifying agent", "Nonionic surfactant", "Plasticizer", "Solubilizing agent", "Suspending agent"], "cas": "9005-64-5 (PS20); 9005-66-7 (PS40); 9005-67-8 (PS60); 9005-65-6 (PS80)", "f": [["Dùng trong rất nhiều dạng thuốc (uống, nhỏ tai, nhỏ mắt, xịt mũi, dùng ngoài, đặt âm đạo và tiêm); polysorbat chứa 20 đơn vị oxyethylen là chất diện hoạt không ion thân ogol 15 Hydroxystearate Polyoxyl 15 Hydroxystearate macrogol 15 hydroxistearate macrogoli 15 hydroxystearas polyethylene glycol-15-hydroxystearate polyethyl ene glycol 660 12-hydroxystearate Solutol HS 15"}, {"id": "polyoxylglycerides", "n": "Polyoxylglycerides", "nv": "Caprylocaproyl Macrogolglycerides; Lauroyl Macrogolglycerides; Caprylocaproyl Polyoxylglycerides; Lauroyl Polyoxylglycerides", "g": ["Chất nhũ hóa", "Tá dược phóng thích biến đổi"], "ge": ["Emulsifying agent", "Modified-release agent"], "cas": "", "f": [["Dùng làm chất tự nhũ hóa và tăng độ tan trong chế phẩm uống và dùng ngoài; ứng dụng gồm hấp phụ lên viên nén, độn nang, tạo hạt nóng chảy, đông tụ phun và phun sấy.", "1, tr.748"]], "fe": [["Used as a self-emulsifier and to increase solubility in oral and topical preparations; Applications include adsorption onto tablets, capsule filling, molten granulation, spray coagulation and spray drying.", "1, tr.748"]], "t": [["Tài liệu chưa đề cập.", "1, tr.748"]], "te": [["Documents not mentioned.", "1, tr.748"]], "d": [["Vật liệu lỏng hoặc sáp nửa rắn, trơ, lưỡng thân; caprylocaproyl là lỏng dầu vàng nhạt; lauroyl và stearoyl là sáp rắn vàng nhạt.", "1, tr.748"], ["Loại caprylocaproyl và lauroyl phân tán trong nước nóng, dễ tan trong methylen clorid; loại linoleoyl và oleoyl thực tế không tan nhưng phân tán trong nước.", "1, tr.748"]], "de": [["Semi-solid, inert, amphiphilic liquid or waxy material; caprylocaproyl is pale yellow oily liquid; Lauroyl and stearoyl are pale yellow solid waxes.", "1, tr.748"], ["Types of caprylocaproyl and lauroyl disperse in hot water, easily soluble in methylene chloride; Linoleoyl and oleoyl types are practically insoluble but disperse in water.", "1, tr.748"]], "a": "polyoxylglycerides gelucire labrafil labrasol stearoyl polyoxylglycerides lauroyl polyoxylglycerides Caprylocaproyl Macrogolglycerides Caprylocaproyl Polyoxylglycerides Labrasol macrogolglyceridorum caprylocaprates Labrafil M2130CS Labrafil M2125CS DUBCARE OLGA SF Labrafil M1944CS macrogolglyceridorum oleates peglicol5-oleate Gelucire 50/13 macrogolglyceridorum stearates Lauroyl Macrogolglycerides Linoleoyl Macrogolglycerides Oleoyl Macrogolglycerides Stearoyl Macrogolglycerides Lauroyl Polyoxylglycerides Linoleoyl Polyoxylglycerides Oleoyl Polyoxylglycerides Stearoyl Polyoxylglycerides"}, {"id": "polyvinyl-acetate-dispersion", "n": "Polyvinyl Acetate Dispersion", "nv": "Polyvinyl Acetate Dispersion", "g": ["Chất tạo màng bao", "Chất tạo màng", "Tá dược phóng thích biến đổi"], "ge": ["Coating agent", "Film-forming agent", "Modified-release agent"], "cas": "9003-20-7", "f": [["Được phát triển làm chất tạo màng bao cho viên giải phóng kéo dài đường uống; thường cần chất hóa dẻo (triethyl citrat, triacetin hoặc propylen glycol) 5–10% theo khối lượng polymer; màng không tan trong nước (không phụ thuộc pH), là màng chắn khuếch tán hiệu quả; điều chỉnh độ thấm bằng chất tạo lỗ thân nước.", "1, tr.753"]], "fe": [["Developed as a coating agent for oral extended-release tablets; often requires a plasticizer (triethyl citrate, triacetin or propylene glycol) 5–10% by mass of polymer; Water-insoluble membrane (independent of pH), is an effective diffusion barrier; Adjust permeability with hydrophilic pore-forming agent.", "1, tr.753"]], "t": [["Thêm phân tán copolymer acid methacrylic–ethyl acrylat gây đông tụ không thuận nghịch; chất kiềm mạnh thúc đẩy thủy phân polymer; màng tan trong dung dịch natri lauryl sulfat.", "1, tr.753"]], "te": [["Adding methacrylic acid–ethyl acrylate copolymer dispersion causes irreversible coagulation; Strong alkalis promote polymer hydrolysis; The film is soluble in sodium lauryl sulfate solution.", "1, tr.753"]], "d": [["Chất lỏng đục màu trắng/trắng ngà, hơi nhớt; là phân tán keo nước của polyvinyl acetat, cỡ hạt ~170 nm.", "1, tr.753"], ["Trộn lẫn với nước, ethanol và aceton.", "1, tr.753"]], "de": [["White/ivory white cloudy liquid, slightly viscous; is an aqueous colloidal dispersion of polyvinyl acetate, particle size ~170 nm.", "1, tr.753"], ["Mix with water, ethanol and acetone.", "1, tr.753"]], "a": "polyvinyl acetate dispersion kollicoat sr 30 d phan tan polyvinyl acetat 9003-20-7 Poly(Vinyl Acetate) Dispersion 30 per cent Polyvinyl Acetate Dispersion Kollicoat SR 30 D"}, {"id": "polyvinyl-acetate-phthalate", "n": "Polyvinyl Acetate Phthalate", "nv": "Polyvinyl Acetate Phthalate", "g": ["Chất tạo màng bao", "Chất tạo màng", "Chất làm tăng độ tan", "Chất gây treo"], "ge": ["Coating agent", "Film-forming agent", "Solubilizing agent", "Suspending agent"], "cas": "34481-48-6", "f": [["Là polymer tạo màng bao tan ở ruột, tan ở môi trường đệm pH >5,0; chủ yếu dùng bao tan ở ruột cho viên nén và viên nang; cũng dùng làm màng chắn ẩm cho nhân viên trước bước bao đường.", "1, tr.755"]], "fe": [["It is an enteric-coating polymer that dissolves in a pH buffer environment >5.0; Mainly enteric coating is used for tablets and capsules; Also used as a moisture barrier for employees before the sugar coating step.", "1, tr.755"]], "t": [["Phản ứng với povidon tạo phức không tan; tương kỵ với benzocain; bị thủy phân khi có acid/kiềm mạnh.", "1, tr.755"]], "te": [["Reacts with povidone to form insoluble complexes; Incompatible with benzocaine; hydrolyzed in the presence of strong acid/alkali.", "1, tr.755"]], "d": [["Polymer anion tổng hợp, bột màu trắng/trắng ngà, có thể có mùi acid acetic nhẹ.", "1, tr.755"], ["Tan trong ethanol và methanol; tan trong hỗn hợp aceton/ethanol; ít tan trong nước.", "1, tr.755"]], "de": [["Synthetic anionic polymer, white/ivory white powder, may have a slight acetic acid odor.", "1, tr.755"], ["Soluble in ethanol and methanol; soluble in acetone/ethanol mixture; Slightly soluble in water.", "1, tr.755"]], "a": "polyvinyl acetate phthalate pvap polyvinyl acetat phthalat 34481-48-6 Polyvinyl Acetate Phthalate Phthalavin PVAP"}, {"id": "polyvinyl-alcohol", "n": "Polyvinyl Alcohol", "nv": "Poly(Vinyl Alcohol)", "g": ["Chất tạo màng bao", "Chất ổn định nhũ tương", "Chất tạo màng", "Tá dược trơn", "Chất làm tăng độ nhớt"], "ge": ["Coating agent", "Emulsion stabilizer", "Film-forming agent", "Lubricant", "Viscosity-increasing agent"], "cas": "9002-89-5", "f": [["Dùng làm chất tạo màng bao, chất ổn định nhũ tương, làm đặc và tăng độ nhớt; cũng dùng trong thuốc nhỏ mắt và làm màng bao viên; dùng trong tiểu phân nano polymer (như PLGA).", "1, tr.758"]], "fe": [["Used as a coating agent, emulsion stabilizer, thickener and viscosity increaser; also used in eye drops and as tablet coating; used in polymer nanoparticles (such as PLGA).", "1, tr.758"]], "t": [["Phản ứng như hợp chất có nhóm hydroxy bậc hai (ester hóa); phân hủy trong acid mạnh, mềm/tan trong acid và kiềm yếu; tương kỵ nồng độ cao với muối vô cơ (nhất là sulfat và phosphat); tạo gel khi có borax.", "1, tr.758"]], "te": [["Reacts like compounds with secondary hydroxy groups (esterification); Decomposes in strong acids, softens/soluble in weak acids and alkalis; Incompatible at high concentrations with inorganic salts (especially sulfate and phosphate); gel in the presence of borax.", "1, tr.758"]], "d": [["Bột hạt màu trắng đến kem, không mùi.", "1, tr.758"], ["Tan trong nước (cần phân tán rồi đun ~90 °C); ít tan trong ethanol 95%; không tan trong dung môi hữu cơ.", "1, tr.758"]], "de": [["White to cream granular powder, odorless.", "1, tr.758"], ["Soluble in water (needs to be dispersed and heated ~90 °C); Slightly soluble in 95% ethanol; insoluble in organic solvents.", "1, tr.758"]], "a": "polyvinyl alcohol pva polyvinyl alcol 9002-89-5 Poly(Vinyl Alcohol) Polyvinyl Alcohol Airvol Alcotex Celvol Elvanol Gelvatol Gohsenol Kollicoat Lemol Mowiol poly(alcohol vinylicus) Polyvinol PVA vinyl alcohol polymer"}, {"id": "potassium-alginate", "n": "Potassium Alginate", "nv": "Potassium Alginate", "g": ["Chất nhũ hóa", "Chất tạo gel", "Chất gây treo", "Chất làm tăng độ nhớt"], "ge": ["Emulsifying agent", "Gelling agent", "Suspending agent", "Viscosity-increasing agent"], "cas": "9005-36-1", "f": [["Dùng rộng rãi trong thực phẩm làm chất ổn định, làm đặc và nhũ hóa; trong dược phẩm hiện dùng hạn chế trong vật liệu lấy dấu răng và hệ hydrogel thử nghiệm.", "1, tr.760"]], "fe": [["Widely used in foods as a stabilizer, thickener and emulsifier; In pharmaceuticals, it is currently used in limited applications in dental impression materials and experimental hydrogel systems.", "1, tr.760"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.760"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.760"]], "d": [["Bột sợi hoặc hạt màu trắng đến vàng nhạt, gần như không mùi, không vị.", "1, tr.760"], ["Tan trong nước tạo dung dịch keo nhớt; không tan trong ethanol 95% và dung dịch cồn >30%.", "1, tr.760"]], "de": [["White to light yellow fibrous powder or granules, almost odorless and tasteless.", "1, tr.760"], ["Soluble in water to create a viscous colloidal solution; Insoluble in 95% ethanol and >30% alcohol solutions.", "1, tr.760"]], "a": "potassium alginate kali alginat 9005-36-1 E402 Potassium Alginate Alginic acid, potassium salt Improved Kelmar potassium polymannuronate Protanal. 2"}, {"id": "potassium-alum", "n": "Potassium Alum", "nv": "Alum; Aluminum Potassium Sulfate Hydrate; Potassium Alum", "g": ["Tá chất vaccine"], "ge": ["Vaccine adjuvant"], "cas": "10043-67-1, 7784-24-9", "f": [["Có khả năng tủa protein nên dùng sản xuất vaccine (đồng tủa và hấp phụ protein tinh khiết lên phèn); cũng dùng trong nước súc miệng và chế phẩm da liễu.", "1, tr.762"]], "fe": [["Has the ability to precipitate proteins so it can be used for vaccine production (co-precipitation and adsorption of pure proteins onto alum); Also used in mouthwash and dermatological preparations.", "1, tr.762"]], "t": [["Tương kỵ với chất oxy hóa mạnh, nhôm, đồng, thép và kẽm; khi trộn bột với phenol, salicylat hoặc tannic acid có thể sinh màu xám/lục do vết sắt.", "1, tr.762"]], "te": [["Incompatible with strong oxidizers, aluminum, copper, steel and zinc; When mixing the powder with phenol, salicylates or tannic acid, a gray/green color may result due to iron stains.", "1, tr.762"]], "d": [["Bột dạng hạt hoặc khối tinh thể không màu, trong; không mùi, vị hơi ngọt và rất chát.", "1, tr.762"], ["Dễ tan trong nước, rất dễ tan trong nước sôi; tan trong glycerol; thực tế không tan trong ethanol 96%.", "1, tr.762"]], "de": [["Colorless, clear granular powder or crystalline mass; Odorless, slightly sweet and very astringent.", "1, tr.762"], ["Easily soluble in water, very soluble in boiling water; soluble in glycerol; Practically insoluble in 96% ethanol.", "1, tr.762"]], "a": "potassium alum phen chua kali alum potassium aluminium sulfate 7784-24-9 Alum Aluminum Potassium Sulfate Hydrate Potassium Alum Alumen alum flour alum meal alum potassium aluminum potassium alum aluminum potassium disulfate aluminum potas sium sulfate dialuminum dipotassium sulfate kalinite potash alum potassium aluminum sulfate (1:1:2) potassium aluminum sulfate-12-hydrate rock alum"}, {"id": "potassium-benzoate", "n": "Potassium Benzoate", "nv": "Potassium Benzoate", "g": ["Chất bảo quản kháng khuẩn", "Tá dược trơn bóng (viên nén/nang)"], "ge": ["Antimicrobial preservative", "Tablet / capsule glidant"], "cas": "582-25-2", "f": [["Chủ yếu dùng làm chất bảo quản kháng khuẩn trong đồ uống, thực phẩm và một số chế phẩm dược; hiệu lực tăng khi pH giảm (mạnh nhất ở pH ≤4,5); dùng thay natri benzoat khi cần hàm lượng natri thấp. Nồng độ tham khảo <0,1%.", "1, tr.763"]], "fe": [["Mainly used as an antibacterial preservative in beverages, foods and some pharmaceutical preparations; Potency increases as pH decreases (strongest at pH ≤4.5); Use instead of sodium benzoate when low sodium content is required. Reference concentration <0.1%.", "1, tr.763"]], "t": [["Tương kỵ với acid mạnh và chất oxy hóa.", "1, tr.763"]], "te": [["Incompatible with strong acids and oxidizing agents.", "1, tr.763"]], "d": [["Bột kết tinh hoặc hạt màu trắng, hơi hút ẩm, không mùi hoặc gần như không mùi; dung dịch nước hơi kiềm, vị hơi ngọt chát.", "1, tr.763"]], "de": [["White crystalline powder or granules, slightly hygroscopic, odorless or almost odorless; The water solution is slightly alkaline, the taste is slightly sweet and acrid.", "1, tr.763"]], "a": "potassium benzoate kali benzoat 582-25-2 E212 Potassium Benzoate Benzoate of potash benzoic acid potassium salt kalium benzoat potassium salt trihydrate ProBenz PG"}, {"id": "potassium-bicarbonate", "n": "Potassium Bicarbonate", "nv": "Potassium Bicarbonate; Potassium Hydrogen Carbonate", "g": ["Chất kiềm hóa"], "ge": ["Alkalizing agent"], "cas": "298-14-6", "f": [["Dùng làm nguồn CO₂ trong chế phẩm sủi ở nồng độ 25–50% kl/kl; hữu ích khi natri bicarbonat không phù hợp (cần hạn chế natri); thường phối hợp với acid citric/tartaric trong viên/cốm sủi.", "1, tr.765"]], "fe": [["Used as a CO₂ source in effervescent preparations at concentrations of 25–50% w/kl; useful when sodium bicarbonate is not suitable (sodium restriction is required); Often combined with citric/tartaric acid in effervescent tablets/cereals.", "1, tr.765"]], "t": [["Phản ứng với acid và muối acid giải phóng CO₂.", "1, tr.765"]], "te": [["Reactions with acids and acid salts release CO₂.", "1, tr.765"]], "d": [["Tinh thể trong không màu hoặc bột kết tinh/hạt màu trắng, không mùi, vị mặn hoặc hơi kiềm.", "1, tr.765"], ["Tan 1 trong 2,8 phần nước ở 20 °C; thực tế không tan trong ethanol 95%.", "1, tr.765"]], "de": [["Colorless clear crystals or white crystalline powder/granules, odorless, salty or slightly alkaline.", "1, tr.765"], ["Soluble 1 in 2.8 parts water at 20 °C; Practically insoluble in 95% ethanol.", "1, tr.765"]], "a": "potassium bicarbonate kali bicarbonat 298-14-6 E501 Potassium Bicarbonate Potassium Hydrogen Carbonate Carbonic acid monopotassium salt kalii hydrogenocarbonas monopotassium carbonate potassium acid carbonate potas sium hydrogen carbonate"}, {"id": "potassium-chloride", "n": "Potassium Chloride", "nv": "Potassium Chloride", "g": ["Chất điều chỉnh đẳng trương"], "ge": ["Tonicity agent"], "cas": "7447-40-7", "f": [["Dùng rộng rãi trong chế phẩm tiêm và không tiêm; ứng dụng chính (tiêm và nhỏ mắt) là tạo dung dịch đẳng trương; cũng có nhiều dạng rắn (viên nén dập thẳng/xát hạt, viên sủi, viên bao giải phóng kéo dài).", "1, tr.766"]], "fe": [["Widely used in injectable and non-injectable preparations; The main application (injections and eye drops) is to create isotonic solutions; Several solid forms are also available (extruded/granulated tablets, effervescent tablets, extended-release coated tablets).", "1, tr.766"]], "t": [["Phản ứng mãnh liệt với brom trifluorid và hỗn hợp acid sulfuric–kali permanganat; dung dịch nước tạo tủa với muối chì và bạc; tiêm tĩnh mạch tương kỵ với dịch thủy phân protein.", "1, tr.766"]], "te": [["Reacts violently with bromine trifluoride and sulfuric acid–potassium permanganate mixture; Aqueous solutions precipitate with lead and silver salts; Intravenous administration is incompatible with protein hydrolyzate.", "1, tr.766"]], "d": [["Tinh thể không màu hoặc bột kết tinh màu trắng, không mùi, vị mặn khó chịu.", "1, tr.766"], ["Tan trong nước; thực tế không tan trong ethanol.", "1, tr.766"]], "de": [["Colorless crystals or white crystalline powder, odorless, unpleasant salty taste.", "1, tr.766"], ["Soluble in water; Practically insoluble in ethanol.", "1, tr.766"]], "a": "potassium chloride kali clorid 7447-40-7 E508 Potassium Chloride Chloride of potash chloropotassuril dipotassium dichloride kalii chloridum potassium monochloride potassium muriate"}, {"id": "potassium-citrate", "n": "Potassium Citrate", "nv": "Potassium Citrate", "g": ["Chất kiềm hóa", "Chất đệm", "Chất tạo phức"], "ge": ["Alkalizing agent", "Buffering agent", "Chelating / Complexing agent"], "cas": "6100-05-6, 866-84-2", "f": [["Dùng trong đồ uống, thực phẩm và chế phẩm uống làm chất đệm và kiềm hóa, và làm chất tạo phức. Nồng độ tham khảo: đệm 0,3–2,0%; tạo phức 0,3–2,0%.", "1, tr.769"]], "fe": [["Used in beverages, foods and oral preparations as a buffering and alkalizing agent, and as a complexing agent. Reference concentration: buffer 0.3–2.0%; complexation 0.3–2.0%.", "1, tr.769"]], "t": [["Dung dịch hơi kiềm nên phản ứng với chất acid; có thể tủa muối alkaloid khỏi dung dịch; muối calci và stronti gây tủa citrat tương ứng.", "1, tr.769"]], "te": [["The solution is slightly alkaline so it reacts with acids; can precipitate alkaloid salts from solution; Calcium and strontium salts cause citrate precipitation, respectively.", "1, tr.769"]], "d": [["Tinh thể hoặc bột màu trắng.", "1, tr.769"], ["Rất dễ tan trong nước (1 trong 0,65 phần); tan trong glycerin; thực tế không tan trong ethanol 95%.", "1, tr.769"]], "de": [["White crystal or powder.", "1, tr.769"], ["Very soluble in water (1 in 0.65 parts); soluble in glycerin; Practically insoluble in 95% ethanol.", "1, tr.769"]], "a": "potassium citrate kali citrat 866-84-2 E332 Potassium Citrate Citrate of potash citric acid potassium salt kalii citras"}, {"id": "potassium-hydroxide", "n": "Potassium Hydroxide", "nv": "Potassium Hydroxide", "g": ["Chất kiềm hóa"], "ge": ["Alkalizing agent"], "cas": "1310-58-3", "f": [["Dùng rộng rãi để điều chỉnh pH dung dịch; cũng dùng phản ứng với acid yếu để tạo muối.", "1, tr.771"]], "fe": [["Widely used to adjust solution pH; Also used to react with weak acids to form salts.", "1, tr.771"]], "t": [["Là base mạnh, tương kỵ với chất dễ thủy phân hoặc oxy hóa; không nên bảo quản trong bình thủy tinh hoặc nhôm; phản ứng với acid, ester và một số kim loại.", "1, tr.771"]], "te": [["A strong base, incompatible with substances that can easily be hydrolyzed or oxidized; Should not be stored in glass or aluminum containers; Reacts with acids, esters and some metals.", "1, tr.771"]], "d": [["Khối rắn nung chảy màu trắng/gần trắng (viên, mảnh, que), cứng giòn, vết vỡ tinh thể; hút ẩm mạnh, chảy nước, hấp thụ CO₂ tạo kali carbonat.", "1, tr.771"]], "de": [["White/nearly white molten solid mass (tablets, flakes, sticks), hard and brittle, crystalline fractures; strongly hygroscopic, watery, absorbs CO₂ to create potassium carbonate.", "1, tr.771"]], "a": "potassium hydroxide kali hydroxyd koh caustic potash 1310-58-3 E525 Potassium Hydroxide Caustic potash kalii hydroxidum kalium hydroxydatum potash lye potassium hydrate"}, {"id": "potassium-metabisulfite", "n": "Potassium Metabisulfite", "nv": "Potassium Metabisulfite", "g": ["Chất bảo quản kháng khuẩn", "Chất chống oxy hóa"], "ge": ["Antimicrobial preservative", "Antioxidant"], "cas": "16731-55-8", "f": [["Dùng làm chất chống oxy hóa và bảo quản kháng khuẩn trong chế phẩm dược (giải phóng SO₂).", "1, tr.772"]], "fe": [["Used as an antioxidant and antibacterial preservative in pharmaceutical preparations (releasing SO₂).", "1, tr.772"]], "t": [["Tương kỵ với acid mạnh, nước và đa số kim loại thông thường; phản ứng với nitrit và natri nitrat ở nhiệt độ phòng (có thể phát lửa/nổ nếu có nước); sulfit phản ứng với nhiều thuốc (epinephrin, cloramphenicol, cisplatin).", "1, tr.772"]], "te": [["Incompatible with strong acids, water and most common metals; reacts with nitrite and sodium nitrate at room temperature (may ignite/explode if water is present); Sulfites react with many drugs (epinephrine, chloramphenicol, cisplatin).", "1, tr.772"]], "d": [["Tinh thể trơn chảy không màu/trắng, bột kết tinh hoặc hạt, thường có mùi lưu huỳnh dioxid.", "1, tr.772"], ["Tan 1 trong 2,2 phần nước; thực tế không tan trong ethanol 96%.", "1, tr.772"]], "de": [["Colorless/white flowing crystals, crystalline powder or granules, often with a sulfur dioxide odor.", "1, tr.772"], ["Dissolve 1 in 2.2 parts water; Practically insoluble in 96% ethanol.", "1, tr.772"]], "a": "potassium metabisulfite kali metabisulfit dipotassium pyrosulfite 16731-55-8 E224 Potassium Metabisulfite Disulfurous acid dipotassium disulfite disulfurous acid dipotassium salt kalii disulfis kalii metabisulfis potassium disulfite"}, {"id": "potassium-metaphosphate", "n": "Potassium Metaphosphate", "nv": "Potassium Metaphosphate", "g": ["Chất đệm"], "ge": ["Buffering agent"], "cas": "7790-53-6", "f": [["Dùng làm chất đệm cho hỗn dịch uống.", "1, tr.774"]], "fe": [["Used as a buffer for oral suspension.", "1, tr.774"]], "t": [["Tài liệu chưa đề cập.", "1, tr.774"]], "te": [["Documents not mentioned.", "1, tr.774"]], "d": [["Bột màu trắng, không mùi.", "1, tr.774"], ["Không tan trong nước; tan trong dung dịch loãng muối natri.", "1, tr.774"]], "de": [["White powder, odorless.", "1, tr.774"], ["Insoluble in water; Soluble in dilute sodium salt solution.", "1, tr.774"]], "a": "potassium metaphosphate kali metaphosphat 7790-53-6 E452 Potassium Metaphosphate O' E452 Europhos KMP FC potassium KurroLs salt potassium polymetaphosphate potassium polyphosphate"}, {"id": "potassium-nitrate", "n": "Potassium Nitrate", "nv": "Potassium Nitrate", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "7757-79-1", "f": [["Dùng làm chất bảo quản trong dung dịch rửa mắt và thuốc nhỏ mắt; dùng rộng rãi trong thực phẩm và sản phẩm chăm sóc răng miệng (giảm ê buốt).", "1, tr.776"]], "fe": [["Used as a preservative in eyewash solutions and eye drops; Widely used in food and oral care products (reducing sensitivity).", "1, tr.776"]], "t": [["Tương kỵ với chất khử, acid mạnh, kim loại và hợp chất hữu cơ; phản ứng nổ với kali clorat hoặc brom trifluorid.", "1, tr.776"]], "te": [["Incompatible with reducing agents, strong acids, metals and organic compounds; Reacts explosively with potassium chlorate or bromine trifluoride.", "1, tr.776"]], "d": [["Bột kết tinh màu trắng/gần trắng hoặc tinh thể không màu, vị mặn mát và hăng.", "1, tr.776"], ["Dễ tan trong nước, rất dễ tan trong nước sôi; thực tế không tan trong alcol; tan trong glycerol.", "1, tr.776"]], "de": [["White/almost white crystalline powder or colorless crystals, cool salty and pungent taste.", "1, tr.776"], ["Easily soluble in water, very soluble in boiling water; practically insoluble in alcohol; soluble in glycerol.", "1, tr.776"]], "a": "potassium nitrate kali nitrat saltpeter 7757-79-1 E252 Potassium Nitrate kalii nitras kalium nitricum niter nitrate of potash nitric acid, potassium salt"}, {"id": "potassium-phosphate-dibasic", "n": "Potassium Phosphate, Dibasic", "nv": "Dipotassium Hydrogen Phosphate; Dipotassium Phosphate", "g": ["Chất đệm"], "ge": ["Buffering agent"], "cas": "7758-11-4", "f": [["Chủ yếu dùng làm chất đệm trong chế phẩm không tiêm và tiêm; ví dụ là chất đệm trong vaccine cúm nhỏ mũi cho trẻ em.", "1, tr.777"]], "fe": [["Mainly used as a buffer in non-injectable and injectable preparations; for example, as a buffer in nasal influenza vaccines for children.", "1, tr.777"]], "t": [["Phosphat tan tương kỵ trong dung dịch với alkaloid, antipyrin, chloral hydrat, pyrogallol và resorcinol; có thể tạo muối không tan với ion kim loại hóa trị hai (như calci).", "1, tr.777"]], "te": [["Soluble phosphates are incompatible in solution with alkaloids, antipyrin, chloral hydrate, pyrogallol and resorcinol; can form insoluble salts with divalent metal ions (such as calcium).", "1, tr.777"]], "d": [["Bột màu trắng rất hút ẩm hoặc tinh thể không màu.", "1, tr.777"], ["Dễ tan trong nước (~16 g/100 mL ở 20 °C); rất ít tan trong ethanol 95%.", "1, tr.777"]], "de": [["Very hygroscopic white powder or colorless crystals.", "1, tr.777"], ["Easily soluble in water (~16 g/100 mL at 20 °C); Very slightly soluble in 95% ethanol.", "1, tr.777"]], "a": "dibasic potassium phosphate kali phosphat dibasic dipotassium hydrogen phosphate 7758-11-4 E340 Dipotassium Hydrogen Phosphate Dipotassium Phosphate Dibasic Potassium Phosphate Dikalii phosphas dipotassium phosphate phosphoric acid, dipotassium salt potassium phosphate"}, {"id": "potassium-sorbate", "n": "Potassium Sorbate", "nv": "Potassium Sorbate", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "24634-61-5", "f": [["Là chất bảo quản kháng khuẩn (kháng khuẩn và kháng nấm) dùng trong dược phẩm, thực phẩm, chế phẩm dinh dưỡng đường ruột và mỹ phẩm; thường ở nồng độ 0,1–0,2% trong chế phẩm uống và dùng ngoài, nhất là loại chứa chất diện hoạt không ion; tan và bền trong nước tốt hơn acid sorbic; hoạt tính tối thiểu ở pH >6.", "1, tr.779"]], "fe": [["As an antibacterial (antibacterial and antifungal) preservative used in pharmaceuticals, foods, enteral nutrition products and cosmetics; Usually at a concentration of 0.1–0.2% in oral and topical preparations, especially those containing non-ionic surfactants; Soluble and stable in water better than sorbic acid; Minimal activity at pH >6.", "1, tr.779"]], "t": [["Mất một phần hoạt tính khi có chất diện hoạt không ion và một số chất dẻo. Xem thêm Acid sorbic.", "1, tr.779"]], "te": [["Partial loss of activity in the presence of non-ionic surfactants and some plasticizers. See also Sorbic Acid.", "1, tr.779"]], "d": [["Bột kết tinh màu trắng, mùi nhẹ đặc trưng.", "1, tr.779"]], "de": [["White crystalline powder, characteristic mild odor.", "1, tr.779"]], "a": "potassium sorbate kali sorbat 24634-61-5 E202 Potassium Sorbate 2,4-hexadienoic acid (E,E)-potassium salt kalii sorbas potassium (E,E)-hexa-2,4-dienoate potassium (E,E)-sorbate sor bic acid potassium salt"}, {"id": "povidone", "n": "Povidone", "nv": "Povidon (PVP)", "g": ["Chất tạo màng bao", "Chất tạo màng", "Chất làm tăng độ tan", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Tá dược rã (viên nén/nang)"], "ge": ["Coating agent", "Film-forming agent", "Solubilizing agent", "Suspending agent", "Tablet / capsule binder", "Tablet / capsule disintegrant"], "cas": "9003-39-8", "f": [["Dùng trong nhiều dạng thuốc, chủ yếu dạng rắn; làm tá dược dính viên nén (0,5–5%), chất mang cho thuốc (10–25%), chất phân tán/gây treo (≤5%) và trong thuốc nhỏ mắt (2–10%).", "1, tr.781"]], "fe": [["Used in many forms of medicine, mainly solid form; as an excipient to bind tablets (0.5–5%), as a carrier for drugs (10–25%), as a dispersing/suspending agent (≤5%), and in eye drops (2–10%).", "1, tr.781"]], "t": [["Tương hợp trong dung dịch với nhiều muối vô cơ, nhựa và hóa chất; tạo phức phân tử với một số chất (sulfathiazol, natri salicylat, phenobarbital, tannin) ở độ ẩm cao.", "1, tr.781"]], "te": [["Compatible in solution with many inorganic salts, resins and chemicals; Forms molecular complexes with certain substances (sulfathiazol, sodium salicylate, phenobarbital, tannin) at high humidity.", "1, tr.781"]], "d": [["Bột mịn màu trắng đến trắng kem, không mùi hoặc gần như không mùi, hút ẩm; grade K≤30 phun sấy (dạng cầu), K≥90 sấy trống (dạng phiến).", "1, tr.781"]], "de": [["White to creamy white fine powder, odorless or almost odorless, hygroscopic; grade K≤30 spray drying (spherical form), K≥90 drum drying (slab form).", "1, tr.781"]], "a": "povidone povidon pvp polyvinylpyrrolidone kollidon plasdone 9003-39-8 E1201 El 201 Kollidon Plasdone poly 11 -(2-OXO- l-pyrrolidinyl)ethylene| polyvidone povidonum Povipharm PVP k15 k25 k30 k60 k90 pvp-k30 pvp-k90 pvp-k25 pvp-k15"}, {"id": "proline", "n": "Proline", "nv": "Proline", "g": ["Chất phân tán"], "ge": ["Dispersing agent"], "cas": "147-85-3", "f": [["Dùng làm chất ổn định trong chế phẩm lỏng tiêm/truyền; hiệu quả hơn glycin trong kiểm soát tạo dimer và tập hợp, duy trì chức năng kháng thể và giảm đổi màu.", "1, tr.787"]], "fe": [["Used as a stabilizer in liquid preparations for injection/infusion; More effective than glycine in controlling dimer formation and aggregation, maintaining antibody function and reducing discoloration.", "1, tr.787"]], "t": [["Tài liệu chưa đề cập tương kỵ hóa học đặc hiệu.", "1, tr.787"]], "te": [["The document does not mention specific chemical incompatibilities.", "1, tr.787"]], "d": [["Bột kết tinh màu trắng.", "1, tr.787"], ["Tan rất tốt trong nước (1 trong 0,62 phần ở 25 °C); ít tan trong ethanol; không tan trong butanol, isopropanol.", "1, tr.787"]], "de": [["White crystalline powder.", "1, tr.787"], ["Very soluble in water (1 in 0.62 parts at 25 °C); Slightly soluble in ethanol; Insoluble in butanol, isopropanol.", "1, tr.787"]], "a": "proline prolin l-proline 147-85-3 Proline L-Proline AjiPure-, P Pro prolinum 2-pyrrolidinecarboxylic acid"}, {"id": "propionic-acid", "n": "Propionic Acid", "nv": "Propionic Acid", "g": ["Chất chống oxy hóa", "Chất bảo quản kháng khuẩn"], "ge": ["Antioxidant", "Antimicrobial preservative"], "cas": "79-09-4", "f": [["Chủ yếu dùng làm chất chống oxy hóa và bảo quản kháng khuẩn trong chế phẩm uống và dùng ngoài.", "1, tr.788"]], "fe": [["Mainly used as an antioxidant and antibacterial preservative in oral and topical preparations.", "1, tr.788"]], "t": [["Tương kỵ với kiềm, amoniac, amin và halogen; có thể bị tách khỏi dung dịch nước khi thêm calci clorid hoặc muối khác.", "1, tr.788"]], "te": [["Incompatible with alkalis, ammonia, amines and halogens; may be separated from the aqueous solution by the addition of calcium chloride or other salts.", "1, tr.788"]], "d": [["Chất lỏng dạng dầu, ăn mòn, mùi hắc khó chịu như ôi; dễ cháy.", "1, tr.788"], ["Trộn lẫn với cloroform, ethanol 95%, ether và nước.", "1, tr.788"]], "de": [["Oily, corrosive liquid with unpleasant rancid odor; flammable.", "1, tr.788"], ["Mixable with chloroform, 95% ethanol, ether and water.", "1, tr.788"]], "a": "propionic acid acid propionic propanoic acid 79-09-4 E280 Propionic Acid Carboxyethane ethanecarboxylic acid ethylformic acid metacetonic acid methylacetic acid pseudoacetic acid. Acidulant antimicrobial preservative antioxidant"}, {"id": "propyl-gallate", "n": "Propyl Gallate", "nv": "Propyl Gallate", "g": ["Chất chống oxy hóa", "Chất bảo quản kháng khuẩn"], "ge": ["Antioxidant", "Antimicrobial preservative"], "cas": "121-79-9", "f": [["Dùng làm chất chống oxy hóa; ngăn tạo peroxid trong ether (0,002%) và oxy hóa paraldehyd (0,01%); có hiệp lực với BHA/BHT; có phần hoạt tính kháng khuẩn; tăng độ ổn định của ketorolac trong bột trộn.", "1, tr.790"]], "fe": [["Used as an antioxidant; prevents peroxide formation in ether (0.002%) and paraldehyde oxidation (0.01%); has synergy with BHA/BHT; Has antibacterial activity; Increases the stability of ketorolac in mixed powders.", "1, tr.790"]], "t": [["Alkyl gallat tương kỵ với kim loại (natri, kali, sắt) tạo phức màu đậm (ngăn bằng chất tạo phức như acid citric); phản ứng với chất oxy hóa.", "1, tr.790"]], "te": [["Alkyl gallates are incompatible with metals (sodium, potassium, iron) forming dark colored complexes (prevented with complexing agents such as citric acid); react with oxidants.", "1, tr.790"]], "d": [["Bột kết tinh màu trắng, không mùi hoặc gần như không mùi, vị đắng chát (không đáng kể ở nồng độ dùng làm chất chống oxy hóa).", "1, tr.790"], ["Tan 1 trong 3 phần ethanol 95%; ít tan trong nước.", "1, tr.790"]], "de": [["White crystalline powder, odorless or almost odorless, bitter taste (negligible at concentrations used as antioxidants).", "1, tr.790"], ["Dissolves 1 in 3 parts of 95% ethanol; Slightly soluble in water.", "1, tr.790"]], "a": "propyl gallate propyl gallat 121-79-9 E310 Propyl Gallate gallic acid propyl ester H-propyl gallate Progallin P propyl 3,4,5-trihydroxybenzoate propylis gallas antimicrobial preservative"}, {"id": "propylene-carbonate", "n": "Propylene Carbonate", "nv": "Propylene Carbonate", "g": ["Dung môi"], "ge": ["Solvent"], "cas": "108-32-7", "f": [["Chủ yếu dùng làm dung môi trong chế phẩm uống và dùng ngoài; phối hợp với propylen glycol làm dung môi cho corticosteroid; dùng trong nang gelatin cứng làm chất mang lỏng ổn định, không bay hơi, giúp đồng đều hàm lượng thuốc liều thấp.", "1, tr.793"]], "fe": [["Mainly used as a solvent in oral and topical preparations; combined with propylene glycol as a solvent for corticosteroids; Used in hard gelatin capsules as a stable, non-volatile liquid carrier, helping to uniformly low dose drug content.", "1, tr.793"]], "t": [["Thủy phân nhanh khi có acid hoặc base mạnh (tạo propylen oxid và CO₂); phản ứng với amin bậc 1 và 2 tạo carbamat.", "1, tr.793"]], "te": [["Rapid hydrolysis in the presence of strong acids or bases (generating propylene oxide and CO₂); Reacts with primary and secondary amines to form carbamates.", "1, tr.793"]], "d": [["Chất lỏng linh động, trong, không màu, không mùi.", "1, tr.793"]], "de": [["Flexible, clear, colorless, odorless liquid.", "1, tr.793"]], "a": "propylene carbonate propylen carbonat 108-32-7 Propylene Carbonate Carbonic acid cyclic methylethylene carbonate cyclic propylene ester cyclic propylene carbonate 4-methyl-2-oxo-l,3-dioxolane 2oxo-4-methyl-l,3-dioxolane 1,2-propanediol cyclic carbonate propylene 1,2carbonate"}, {"id": "propylene-glycol", "n": "Propylene Glycol", "nv": "Propylene Glycol", "g": ["Chất bảo quản kháng khuẩn", "Chất giữ ẩm", "Chất hóa dẻo", "Dung môi"], "ge": ["Antimicrobial preservative", "Humectant", "Plasticizer", "Solvent"], "cas": "57-55-6, 4254-14-2, 4254-15-3", "f": [["Dùng rộng rãi làm dung môi, chất chiết, giữ ẩm và bảo quản trong nhiều chế phẩm tiêm và không tiêm; là dung môi chung tốt hơn glycerin (hòa tan corticosteroid, phenol, sulfamid, barbiturat, vitamin A/D, đa số alkaloid, nhiều thuốc tê); thường dùng làm chất hóa dẻo trong màng bao nước.", "1, tr.795"]], "fe": [["Widely used as a solvent, extractant, moisturizer and preservative in many injectable and non-injectable preparations; is a better general solvent than glycerin (dissolves corticosteroids, phenol, sulfamides, barbiturates, vitamin A/D, most alkaloids, many anesthetics); Often used as a plasticizer in water coating films.", "1, tr.795"]], "t": [["Tương kỵ với chất oxy hóa như kali permanganat.", "1, tr.795"]], "te": [["Incompatible with oxidizing agents such as potassium permanganate.", "1, tr.795"]], "d": [["Chất lỏng nhớt, trong, không màu, gần như không mùi, vị ngọt hơi hắc như glycerin.", "1, tr.795"]], "de": [["Viscous liquid, clear, colorless, almost odorless, slightly sweet taste like glycerin.", "1, tr.795"]], "a": "propylene glycol pg propylen glycol 1,2-propanediol 57-55-6 E1520 Propylene Glycol ,2Dihydroxypropane 2-hydroxypropanol methyl ethy lene glycol methyl glycol propane-1,2-diol propylenglycolum"}, {"id": "propylene-glycol-alginate", "n": "Propylene Glycol Alginate", "nv": "Propylene Glycol Alginate", "g": ["Chất nhũ hóa", "Chất ổn định bọt", "Chất gây treo", "Chất làm tăng độ nhớt"], "ge": ["Emulsifying agent", "Foam stabilizer", "Suspending agent", "Viscosity-increasing agent"], "cas": "9005-37-2", "f": [["Dùng làm chất ổn định, gây treo, tạo gel và nhũ hóa trong chế phẩm uống và dùng ngoài, thường ở nồng độ 0,3–5,0% kl/tt tùy ứng dụng và grade.", "1, tr.798"]], "fe": [["Used as a stabilizer, suspension, gelling and emulsifying agent in oral and topical preparations, usually at concentrations of 0.3–5.0% w/w depending on application and grade.", "1, tr.798"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.798"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.798"]], "d": [["Bột sợi hoặc hạt màu trắng đến vàng nhạt, gần như không mùi, không vị.", "1, tr.798"], ["Tan trong acid hữu cơ loãng và nước tạo dung dịch keo nhớt bền ở pH 3; tùy mức ester hóa còn tan trong hỗn hợp cồn–nước tới 60% ethanol.", "1, tr.798"]], "de": [["White to light yellow fibrous powder or granules, almost odorless and tasteless.", "1, tr.798"], ["Soluble in dilute organic acids and water to create a stable viscous colloid solution at pH 3; Depending on the degree of esterification, it is also soluble in alcohol–water mixtures up to 60% ethanol.", "1, tr.798"]], "a": "propylene glycol alginate propylen glycol alginat pga 9005-37-2 E405 Propylene Glycol Alginate Alginic acid, propylene glycol ester hydroxypropyl alginate Kelcoloid Kimiloid Manucol Ester PGA Profoam propane-1,2diol alginate TIC Pretested"}, {"id": "propylene-glycol-dilaurate", "n": "Propylene Glycol Dilaurate", "nv": "Propylene Glycol Dilaurate", "g"
