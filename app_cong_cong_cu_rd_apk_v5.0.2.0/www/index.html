n trong ethanol 96%.", "1, tr.506"]], "de": [["White to almost white crystals or powder; contains 70–80% anhydrous β-lactose and 20–30% anhydrous α-lactose.", "1, tr.506"], ["Water soluble (~20 g/100 mL at 25 °C with grade DT); slightly soluble in ether; Practically insoluble in 96% ethanol.", "1, tr.506"]], "a": "anhydrous lactose lactose khan duralac 63-42-3 Lactose Anhydrous Lactose Anhydrous 60M Anhydrous 120M Anhydrous DT Anhydrous DT High Velocity Anhydrous impalpable DuraLac H Lactopress Anhydrous Lactopress Anhydrous 250 Lactopress Anhydrous Crystals Lactopress Anhydrous Microfine Lactopress Anhydrous Powder Lactopress Anhydrous Fine Powder lactosum anhydricum lattosio milk sugar SuperTab 21 AN SuperTab 22AN SuperTab 24AN"}, {"id": "lactose-inhalation", "n": "Lactose, Inhalation", "nv": "Lactose dùng cho bột hít", "g": ["Chất mang bột hít"], "ge": ["Inhalation carrier"], "cas": "5989-81-1, 64044-51-5, 63-42-3", "f": [["Dùng rộng rãi làm chất mang, tá dược độn và chất hỗ trợ trơn chảy trong công thức bột hít khô; grade cỡ hạt phù hợp có thể dùng tạo các pellet mềm của bột hít.", "1, tr.510"]], "fe": [["Widely used as a carrier, filler excipient and flow aid in dry inhalation powder formulations; Suitable particle size grade can be used to create soft pellets of snuff powder.", "1, tr.510"]], "t": [["Là đường khử; phản ứng Maillard với amin bậc 1 hoặc bậc 2.", "1, tr.510"]], "te": [["Is a reducing sugar; Maillard reaction with primary or secondary amines.", "1, tr.510"]], "d": [["Tinh thể hoặc bột màu trắng đến gần trắng, không mùi, vị hơi ngọt.", "1, tr.510"]], "de": [["White to nearly white crystals or powder, odorless, slightly sweet taste.", "1, tr.510"]], "a": "inhalation lactose lactose dung cho bot hit respitose 63-42-3 InhaLac Lactohale"}, {"id": "lactose-spray-dried", "n": "Lactose, Spray-Dried", "nv": "Lactose phun sấy", "g": ["Tá dược dập thẳng", "Tá dược độn (viên nén/nang)"], "ge": ["Direct compression vehicle", "Tablet / capsule diluent"], "cas": "5989-81-1, 64044-51-5, 10039-26-6", "f": [["Dùng rộng rãi làm tá dược dính, tá dược độn-dính và chất hỗ trợ trơn chảy trong dập thẳng viên nén.", "1, tr.527"]], "fe": [["Widely used as adhesive excipient, filler-adhesive excipient and flow aid in straightening tablets.", "1, tr.527"]], "t": [["Là đường khử; phần lactose vô định hình (dạng phản ứng mạnh nhất) dễ tham gia phản ứng Maillard với amin.", "1, tr.527"]], "te": [["Is a reducing sugar; The amorphous portion of lactose (the most reactive form) easily participates in the Maillard reaction with amines.", "1, tr.527"]], "d": [["Tinh thể hoặc bột màu trắng đến gần trắng, không mùi, vị hơi ngọt; gồm 80–90% α-lactose monohydrat kết tinh (giòn) và 10–20% lactose vô định hình (biến dạng dẻo).", "1, tr.527"]], "de": [["White to nearly white crystals or powder, odorless, slightly sweet taste; consists of 80–90% crystalline (brittle) α-lactose monohydrate and 10–20% amorphous lactose (plastically deformed).", "1, tr.527"]], "a": "spray-dried lactose lactose phun say flowlac fast flo 64044-51-5 FlowLac 90 FlomLac 100 Lactopress Spray-Dried Lactopress Spray-Dried 250 Lactopress Spray-Dried 260 Foremost Lactose 315 Foremost Lactose 316 Fast Flo SuperTab 11SD"}, {"id": "lanolin", "n": "Lanolin", "nv": "Wool Fat; Purified Lanolin; Lanolin", "g": ["Chất làm mềm da", "Chất nhũ hóa", "Tá dược thuốc mỡ"], "ge": ["Emollient", "Emulsifying agent", "Ointment base"], "cas": "8006-54-0", "f": [["Dùng rộng rãi trong chế phẩm dùng ngoài làm chất nhũ hóa và làm mềm; làm tá dược kỵ nước và điều chế kem/thuốc mỡ nước trong dầu; trộn với ~2 lần khối lượng nước tạo nhũ tương bền không dễ ôi.", "1, tr.530"]], "fe": [["Widely used in topical preparations as an emulsifier and softener; making hydrophobic excipients and preparing water-in-oil cream/ointment; Mix with ~2 times the volume of water to create a durable emulsion that does not go rancid easily.", "1, tr.530"]], "t": [["Tương kỵ với chất oxy hóa mạnh; có thể chứa chất tiền oxy hóa ảnh hưởng độ ổn định một số hoạt chất.", "1, tr.530"]], "te": [["Incompatible with strong oxidizing agents; May contain pro-oxidants that affect the stability of some active ingredients.", "1, tr.530"]], "d": [["Chất sáp trơn nhờn màu vàng nhạt, mùi nhẹ đặc trưng; khi đun chảy là chất lỏng vàng trong hoặc gần trong.", "1, tr.530"], ["Dễ tan trong cloroform, ether, tetrahydrofuran và toluen; ít tan trong ethanol 95% lạnh (tan nhiều hơn khi sôi); thực tế không tan trong nước.", "1, tr.530"]], "de": [["Light yellow, greasy waxy substance with a characteristic light odor; When melted, it is a clear or nearly clear yellow liquid.", "1, tr.530"], ["Easily soluble in chloroform, ether, tetrahydrofuran and toluene; Slightly soluble in cold 95% ethanol (more soluble when boiling); practically insoluble in water.", "1, tr.530"]], "a": "lanolin mo long cuu wool fat 8006-54-0 Wool Fat Purified Lanolin Lanolin Adeps lanae adeps lanae rurificatus cera lanae Coronet E913 Lanis lanolina lanolin anhydrous Lantrol 1650 Pharmalan Protalan anhydrous purified lanolin refined wool fat"}, {"id": "lanolin-alcohols", "n": "Lanolin Alcohols", "nv": "Wool Alcohols; Lanolin Alcohols", "g": ["Chất làm mềm da", "Chất nhũ hóa", "Tá dược thuốc mỡ", "Chất làm tăng độ tan"], "ge": ["Emollient", "Emulsifying agent", "Ointment base", "Solubilizing agent"], "cas": "8027-33-6", "f": [["Dùng trong chế phẩm dùng ngoài làm nền hấp thu có tính làm mềm; điều chế kem/thuốc mỡ nước trong dầu ở nồng độ thấp tới 2% kl/kl; thêm 5% alcol lanolin làm tăng gấp ba lượng nước có thể đưa vào petrolatum; bền trên khoảng pH rộng và làm chất tăng độ nhớt.", "1, tr.533"]], "fe": [["Used in topical preparations as an absorbent base with emollient properties; preparation of water-in-oil cream/ointment at concentrations as low as 2% w/w; Adding 5% lanolin alcohol triples the amount of water that can be put into petrolatum; Stable over a wide pH range and acts as a viscosity increasing agent.", "1, tr.533"]], "t": [["Tương kỵ với hắc ín than đá (coal tar), ichthammol, phenol và resorcinol.", "1, tr.533"]], "te": [["Incompatible with coal tar, ichthammol, phenol and resorcinol.", "1, tr.533"]], "d": [["Chất rắn màu vàng nhạt đến nâu vàng, dẻo khi ấm và giòn khi lạnh, mùi nhẹ đặc trưng.", "1, tr.533"], ["Dễ tan trong cloroform, dicloromethan, ether và ether dầu hỏa nhẹ; tan 1 trong 25 phần ethanol 95% sôi; thực tế không tan trong nước.", "1, tr.533"]], "de": [["Light yellow to golden brown solid, flexible when warm and brittle when cold, with a characteristic mild odor.", "1, tr.533"], ["Easily soluble in chloroform, dichloromethane, ether and light petroleum ether; Dissolve 1 in 25 parts of boiling 95% ethanol; practically insoluble in water.", "1, tr.533"]], "a": "lanolin alcohols alcol lanolin wool alcohols 8027-33-6 Wool Alcohols Lanolin Alcohols Alcoholes adipis lanae alcoholia lanae alcolanum Argo wax lanalcolum Lanis AL Lantrol 1780 Ritawax Super Hartolan wool wax alcohols"}, {"id": "lanolin-hydrous", "n": "Lanolin, Hydrous", "nv": "Hydrous Wool Fat; Hydrous Lanolin; Wool Fat, Hydrous", "g": ["Chất làm mềm da", "Chất nhũ hóa", "Tá dược thuốc mỡ"], "ge": ["Emollient", "Emulsifying agent", "Ointment base"], "cas": "8020-84-6", "f": [["Dùng rộng rãi trong chế phẩm dùng ngoài và mỹ phẩm với các ứng dụng tương tự lanolin (chất làm mềm, nhũ hóa, nền thuốc mỡ).", "1, tr.534"]], "fe": [["Widely used in topical preparations and cosmetics with similar applications to lanolin (emollient, emulsifier, ointment base).", "1, tr.534"]], "t": [["Xem mục Lanolin.", "1, tr.534"]], "te": [["See Lanolin section.", "1, tr.534"]], "d": [["Là lanolin có ngậm nước; chất mềm màu vàng nhạt.", "1, tr.534"], ["Tan trong diethyl ether và cyclohexan (tách nước); thực tế không tan trong cloroform, ether và nước.", "1, tr.534"]], "de": [["Is hydrated lanolin; Light yellow soft substance.", "1, tr.534"], ["Soluble in diethyl ether and cyclohexane (dehydration); practically insoluble in chloroform, ether and water.", "1, tr.534"]], "a": "hydrous lanolin lanolin ngam nuoc hydrous wool fat 8020-84-6 Hydrous Wool Fat Hydrous Lanolin Wool Fat, Hydrous Adeps lanae cum aqua adeps lanae hydrosus"}, {"id": "lauric-acid", "n": "Lauric Acid", "nv": "Lauric Acid", "g": ["Chất diện hoạt anion", "Chất chống tạo bọt", "Chất nhũ hóa", "Tá dược trơn", "Chất tăng thấm"], "ge": ["Anionic surfactant", "Antifoaming agent", "Emulsifying agent", "Lubricant", "Permeation enhancer"], "cas": "143-07-7", "f": [["Được dùng làm chất tăng thấm qua da, hấp thu qua trực tràng, đưa thuốc qua niêm mạc miệng và hấp thu ở ruột; cũng dùng để ổn định nhũ tương dầu/nước.", "1, tr.535"]], "fe": [["Used as an agent to increase skin permeability, rectal absorption, drug delivery through oral mucosa and intestinal absorption; Also used to stabilize oil/water emulsions.", "1, tr.535"]], "t": [["Tương kỵ với base mạnh, chất khử và chất oxy hóa.", "1, tr.535"]], "te": [["Incompatible with strong bases, reducing agents and oxidizing agents.", "1, tr.535"]], "d": [["Bột kết tinh màu trắng, mùi nhẹ của dầu nguyệt quế.", "1, tr.535"], ["Ít tan trong nước (4,81 mg/mL ở 25 °C); rất dễ tan trong ether, ethanol 95% và methanol; tan trong aceton.", "1, tr.535"]], "de": [["White crystalline powder, slight odor of laurel oil.", "1, tr.535"], ["Slightly soluble in water (4.81 mg/mL at 25 °C); Very soluble in ether, 95% ethanol and methanol; Soluble in acetone.", "1, tr.535"]], "a": "lauric acid acid lauric dodecanoic acid 143-07-7 Lauric Acid C-1297 1-dodecanoic acid w-dodecanoic acid dodecoic acid dodecylic acid duodecylic acid Hydrofol acid 1255 Hydrofol acid 1295 Hystrene 9512 Kortacid 1299 la urostearic acid Lunac L70 Neo-fat 12 Neo-fat 12-43 Ninol AA62 Extra Prifac 2920 1-undecanecarboxylic acid Univol U314 vulvic acid Wecoline 1295"}, {"id": "lecithin", "n": "Lecithin", "nv": "Lecithin", "g": ["Chất làm mềm da", "Chất nhũ hóa", "Chất làm tăng độ tan"], "ge": ["Emollient", "Emulsifying agent", "Solubilizing agent"], "cas": "8002-43-5, 8030-76-0, 93685-90-6", "f": [["Dùng chủ yếu làm chất phân tán, nhũ hóa và ổn định; có trong thuốc tiêm bắp/tĩnh mạch, dịch nuôi dưỡng tĩnh mạch và chế phẩm dùng ngoài (nhũ tương, kem, thuốc mỡ); dùng trong nền thuốc đặt để giảm giòn; nghiên cứu làm chất tăng hấp thu cho insulin nhỏ mũi.", "1, tr.538"]], "fe": [["Mainly used as a dispersant, emulsifier and stabilizer; present in intramuscular/intravenous drugs, intravenous nutrition solutions and topical preparations (emulsions, creams, ointments); used in suppositories to reduce brittleness; Research as an absorption enhancer for nasal insulin.", "1, tr.538"]], "t": [["Tương kỵ với esterase (do bị thủy phân); tương kỵ với clor, fluor và các chất oxy hóa khác.", "1, tr.538"]], "te": [["Incompatible with esterase (due to hydrolysis); Incompatible with chlorine, fluoride and other oxidizing agents.", "1, tr.538"]], "d": [["Hình thức rất đa dạng, từ bán lỏng nhớt đến bột, tùy hàm lượng acid béo tự do; màu nâu đến vàng nhạt; nhanh bị oxy hóa khi tiếp xúc không khí.", "1, tr.538"], ["Tan trong diethyl ether, cloroform, ether dầu hỏa, dầu khoáng và acid béo; ít tan trong benzen; thực tế không tan trong dung môi phân cực lạnh và nước (hydrat hóa khi trộn với nước).", "1, tr.538"]], "de": [["The form is very diverse, from viscous semi-liquid to powder, depending on the free fatty acid content; brown to pale yellow; Oxidizes quickly when exposed to air.", "1, tr.538"], ["Soluble in diethyl ether, chloroform, petroleum ether, mineral oils and fatty acids; slightly soluble in benzene; practically insoluble in cold polar solvents and water (hydrates when mixed with water).", "1, tr.538"]], "a": "lecithin phospholipid 8002-43-5 E322 Lecithin Coatsome NC egg lecithin Epikuron Lecigran Lipoid mixed soybean phosphatides ovolecithin Phosal S3 MCT Phospholipon 100 H ProKote LSC soybean lecithin soybean phospholipids Sternfine Sternpur Topcithin vegetable lecithin Yelk in"}, {"id": "leucine", "n": "Leucine", "nv": "Leucine", "g": ["Chất chống dính", "Chất tạo hương", "Tá dược trơn bóng (viên nén/nang)"], "ge": ["Anti-adherent", "Flavoring agent", "Tablet / capsule glidant"], "cas": "61-90-5", "f": [["Dùng làm chất tạo hương; dùng thực nghiệm làm chất chống dính cải thiện phân rã cụm tiểu phân trong bột hít và làm tá dược trơn viên nén.", "1, tr.541"]], "fe": [["Used as a flavoring agent; Used experimentally as an anti-adhesive agent to improve particle cluster disintegration in inhalation powder and as an excipient to lubricate tablets.", "1, tr.541"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.541"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.541"]], "d": [["Bột kết tinh màu trắng/gần trắng hoặc mảnh óng ánh.", "1, tr.541"], ["Tan trong acid acetic, ethanol 99% và nước; thực tế không tan trong ether.", "1, tr.541"]], "de": [["White/almost white crystalline powder or iridescent flakes.", "1, tr.541"], ["Soluble in acetic acid, 99% ethanol and water; practically insoluble in ether.", "1, tr.541"]], "a": "leucine leucin l-leucine 61-90-5 Leucine L-Leucine a-Aminoisocaproic acid 1-oc-aminoisocaproic acid (S)-2-amino-4methylpentanoic acid 2-amino-4-methylpentanoic acid L-2amino-4-methylvaleric acid 2-amino-4-methylvaleric acid aamino-Ỵ-methylvaleric acid l,2-amino-4-methylvaleric acid D Lleucine L L-leucine Leu leucinum 4-methylnorvaline"}, {"id": "linoleic-acid", "n": "Linoleic Acid", "nv": "Acid linoleic", "g": ["Chất nhũ hóa", "Chất tăng thấm", "Chất làm tăng độ tan"], "ge": ["Emulsifying agent", "Permeation enhancer", "Solubilizing agent"], "cas": "60-33-3", "f": [["Dùng trong chế phẩm dùng ngoài và qua da làm chất nhũ hóa và tăng thấm; trong chế phẩm uống làm chất tăng hấp thu; trong thuốc tiêm tĩnh mạch làm chất tăng độ tan; cũng dùng trong tiểu phân nano hướng gan.", "1, tr.543"]], "fe": [["Used in topical and transdermal preparations as an emulsifier and permeability enhancer; in oral preparations as an absorption enhancer; in intravenous drugs as a solubility enhancer; Also used in liver-targeting nanoparticles.", "1, tr.543"]], "t": [["Tương kỵ với base, chất oxy hóa mạnh và chất khử.", "1, tr.543"]], "te": [["Incompatible with bases, strong oxidizing agents and reducing agents.", "1, tr.543"]], "d": [["Chất lỏng dạng dầu màu không màu đến vàng nhạt.", "1, tr.543"], ["Dễ tan trong ether; tan trong ethanol 95%; trộn lẫn với dimethylformamid, dung môi chất béo và dầu.", "1, tr.543"]], "de": [["Colorless to pale yellow oily liquid.", "1, tr.543"], ["Easily soluble in ether; soluble in 95% ethanol; Miscible with dimethylformamide, fat and oil solvents.", "1, tr.543"]], "a": "linoleic acid acid linoleic vitamin f 60-33-3 Emersol 310 Emersol 315 leinoleic acid 9-czs,12-czs-linoleic acid 9,12-linoleic acid linolic acid cis,czs-9,12-octadecadienoic acid Pamolyn Polylin No. 515 telfairic acid"}, {"id": "lysine-acetate", "n": "Lysine Acetate", "nv": "Lysine Acetate", "g": ["Chất đệm"], "ge": ["Buffering agent"], "cas": "57282-49-2", "f": [["Dùng làm chất đệm và trung hòa cho thuốc hạ sốt/giảm đau như acid acetylsalicylic và ibuprofen; được nghiên cứu làm thành phần băng dạng bọt điều trị nhiễm khuẩn âm đạo và đưa thuốc peptid.", "1, tr.545"]], "fe": [["Used as a buffering and neutralizing agent for antipyretic/analgesic drugs such as acetylsalicylic acid and ibuprofen; Researched as an ingredient in foam dressings to treat vaginal infections and deliver peptide drugs.", "1, tr.545"]], "t": [["Tài liệu chưa đề cập tương kỵ hóa học đặc hiệu (là muối amino acid tương đối trơ).", "1, tr.545"]], "te": [["The document does not mention specific chemical incompatibilities (amino acid salts are relatively inert).", "1, tr.545"]], "d": [["Bột kết tinh hoặc tinh thể không màu, màu trắng/gần trắng.", "1, tr.545"], ["Dễ tan trong nước; rất ít tan trong ethanol 96%.", "1, tr.545"]], "de": [["Colorless, white/almost white crystalline powder or crystals.", "1, tr.545"], ["Easily soluble in water; Very slightly soluble in 96% ethanol.", "1, tr.545"]], "a": "lysine acetate lysin acetat 57282-49-2 Lysine Acetate L-Lysine Acetate (25)-2,6-Diaminohexanoic acid acetate lysini acetas L-lysine acet ate L-lysine monoacetate"}, {"id": "lysine-hydrochloride", "n": "Lysine Hydrochloride", "nv": "Lysine Hydrochloride", "g": ["Chất đệm"], "ge": ["Buffering agent"], "cas": "657-27-2", "f": [["Dùng làm chất đệm trong chế phẩm dược; dùng rộng rãi làm phụ gia thực phẩm và thực phẩm bổ sung.", "1, tr.546"]], "fe": [["Used as a buffer in pharmaceutical preparations; widely used as food additives and dietary supplements.", "1, tr.546"]], "t": [["Tương kỵ với chất oxy hóa mạnh; lysin phản ứng Maillard với đường khử gây hóa nâu (nghiền/nén công thức chứa lactose làm tăng tốc phản ứng).", "1, tr.546"]], "te": [["Incompatible with strong oxidizing agents; lysine reacts Maillard with reducing sugars causing browning (crushing/compressing lactose-containing formulas speeds up the reaction).", "1, tr.546"]], "d": [["Bột kết tinh màu trắng hoặc gần trắng.", "1, tr.546"], ["Dễ tan 1 trong 11 phần nước; ít tan trong ethanol.", "1, tr.546"]], "de": [["White or almost white crystalline powder.", "1, tr.546"], ["Easily soluble in 1 part in 11 parts of water; Slightly soluble in ethanol.", "1, tr.546"]], "a": "lysine hydrochloride lysin hydroclorid l-lysine hcl 657-27-2 Lysine Hydrochloride L-Lysine Hydrochloride Darvyl (2S)-2,6-diaminohexanoic acid hydrochloride E642 Enisyl L-lysine monohydrochloride lysine monohydrochloride lysini hydrochloridum"}, {"id": "magnesium-aluminum-silicate", "n": "Magnesium Aluminum Silicate", "nv": "Aluminium Magnesium Silicate; Magnesium Aluminum Silicate", "g": ["Chất hấp phụ", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Tá dược rã (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Adsorbent", "Suspending agent", "Tablet / capsule binder", "Tablet / capsule disintegrant", "Viscosity-increasing agent"], "cas": "12511-31-8, 1327-43-1", "f": [["Dùng lâu năm trong viên nén, thuốc mỡ và kem; đường uống và dùng ngoài làm chất gây treo và ổn định (đơn độc hoặc phối hợp); độ nhớt tăng mạnh khi phối hợp với gôm xanthan (hiệp lực).", "1, tr.548"], ["Trong viên nén dùng làm tá dược dính và rã cho công thức thường và giải phóng chậm, và trong hệ tự nhũ hóa rắn.", "1, tr.548"]], "fe": [["Long used in tablets, ointments and creams; oral and topical use as a suspension and stabilizer (alone or in combination); Viscosity increases sharply when combined with xanthan gum (synergy).", "1, tr.548"], ["In tablets used as a binding and disintegrating excipient for regular and slow-release formulations, and in solid self-emulsifying systems.", "1, tr.548"]], "t": [["Do bản chất trơ nên ít tương kỵ nhưng không phù hợp dung dịch acid dưới pH 3,5; có thể hấp phụ một số thuốc gây giảm sinh khả dụng (amfetamin sulfat, tolbutamid, warfarin natri, diazepam, diclofenac natri).", "1, tr.548"]], "te": [["Due to its inert nature, it is less incompatible but is not suitable for acid solutions below pH 3.5; Can adsorb some drugs causing reduced bioavailability (amfetamine sulfate, tolbutamide, warfarin sodium, diazepam, diclofenac sodium).", "1, tr.548"]], "d": [["Hỗn hợp montmorillonit và saponit keo đã loại sạn; có nhiều loại (IA, IB, IC, IIA) khác nhau về độ nhớt và tỷ lệ nhôm/magnesi.", "1, tr.548"], ["Thực tế không tan trong alcol, nước và dung môi hữu cơ; trương nhiều lần thể tích trong nước tạo phân tán keo (thuận nghịch).", "1, tr.548"]], "de": [["Mixture of montmorillonite and de-gritty colloidal saponite; There are many grades (IA, IB, IC, IIA) that vary in viscosity and aluminum/magnesium ratio.", "1, tr.548"], ["Practically insoluble in alcohol, water and organic solvents; expands many times its volume in water to create colloidal dispersion (reversible).", "1, tr.548"]], "a": "magnesium aluminum silicate magnesi nhom silicat veegum aluminum magnesium silicate 1327-43-1 Aluminium Magnesium Silicate Magnesium Aluminum Silicate Aluminii magnesii silicas aluminosilicic acid, magnesium salt Carrisorb'y Gelsorb Magnabrite^ magnesium aluminosilicate magnesium aluminum silicate, colloi dal magnesium aluminum silicate, complex colloidal Neusilin Pharmasorb silicic acid, aluminum magnesium salt Veegum"}, {"id": "magnesium-carbonate", "n": "Magnesium Carbonate", "nv": "Magnesium Carbonate; Magnesium Carbonate, Heavy; Magnesium Carbonate, Light", "g": ["Chất hấp phụ", "Tá dược độn (viên nén/nang)"], "ge": ["Adsorbent", "Tablet / capsule diluent"], "cas": "546-93-0", "f": [["Chủ yếu dùng làm tá dược độn dập thẳng ở nồng độ tới 45% kl/kl; magnesi carbonat nặng cho viên có độ cứng cao, ít vỡ và rã tốt; dùng trong vi cầu để ổn định protein đóng gói và trung hòa acid.", "1, tr.551"]], "fe": [["Mainly used as a straight filler excipient at concentrations up to 45% w/kl; Heavy magnesium carbonate gives tablets high hardness, low breakage and good disintegration; used in microspheres to stabilize encapsulated proteins and neutralize acids.", "1, tr.551"]], "t": [["Tương kỵ với phenobarbital natri, dung dịch diazepam ở pH >5, lansoprazol và formaldehyd; acid hòa tan magnesi carbonat giải phóng CO₂; làm nước hơi kiềm.", "1, tr.551"]], "te": [["Incompatible with phenobarbital sodium, diazepam solution at pH >5, lansoprazole and formaldehyde; acid dissolves magnesium carbonate releasing CO₂; make the water slightly alkaline.", "1, tr.551"]], "d": [["Khối xốp giòn màu trắng hoặc bột xốp màu trắng; vị hơi đất, không mùi nhưng hấp phụ mạnh nên có thể hút mùi.", "1, tr.551"], ["Thực tế không tan trong nước (tan trong nước có CO₂); không tan trong ethanol 95%; tan và sủi bọt khi tiếp xúc acid loãng.", "1, tr.551"]], "de": [["White crispy spongy mass or white spongy dough; Slightly earthy taste, odorless but with strong adsorption so it can absorb odors.", "1, tr.551"], ["Practically insoluble in water (soluble in water containing CO₂); insoluble in 95% ethanol; Dissolves and foams when exposed to dilute acid.", "1, tr.551"]], "a": "magnesium carbonate magnesi carbonat 546-93-0 E504 Magnesium Carbonate Magnesium Carbonate, Heavy Carbonic acid, magnesium salt (1:1) carbonate magnesium Destab hydromagnesite magnesii subcarbonas levis Magnesium Carbonate, Light"}, {"id": "magnesium-oxide", "n": "Magnesium Oxide", "nv": "Light Magnesium Oxide; Oxide; Magnesium Oxide, Heavy; Magnesium Oxide, Light; Magnesium Oxide", "g": ["Chất chống vón", "Chất nhũ hóa", "Chất điều hòa sự chảy", "Tá dược độn (viên nén/nang)", "Chất điều chỉnh đẳng trương"], "ge": ["Anticaking agent", "Emulsifying agent", "Glidant", "Tablet / capsule diluent", "Tonicity agent"], "cas": "1309-48-4", "f": [["Dùng làm tá dược độn kiềm trong dạng rắn để điều chỉnh pH viên; thêm vào để hút nước dư giữ hạt khô; phối hợp với silica làm chất điều hòa trơn chảy phụ trợ.", "1, tr.555"]], "fe": [["Used as an alkaline filler in solid form to adjust tablet pH; added to absorb excess water to keep seeds dry; Combined with silica as an auxiliary flow conditioner.", "1, tr.555"]], "t": [["Là chất base nên phản ứng với hợp chất acid ở thể rắn tạo muối hoặc làm phân hủy thuốc kém bền kiềm; hấp phụ nhiều thuốc (kháng histamin, kháng sinh nhất là tetracyclin, salicylat, atropin sulfat, acetaminophen, chloroquin).", "1, tr.555"]], "te": [["Being a base, it reacts with acid compounds in solid form to form salts or decompose drugs with poor alkaline stability; adsorbs many drugs (antihistamines, antibiotics especially tetracycline, salicylates, atropine sulfate, acetaminophen, chloroquin).", "1, tr.555"]], "d": [["Có hai dạng: magnesi oxyd nhẹ (xốp) và nặng (đặc); bột màu trắng.", "1, tr.555"], ["Tan trong acid loãng và dung dịch muối amoni; rất ít tan trong nước tinh khiết (tăng khi có CO₂); thực tế không tan trong ethanol 95%.", "1, tr.555"]], "de": [["There are two forms: light (spongy) and heavy (dense) magnesium oxide; white powder.", "1, tr.555"], ["Soluble in dilute acid and ammonium salt solution; very slightly soluble in pure water (increases in the presence of CO₂); Practically insoluble in 95% ethanol.", "1, tr.555"]], "a": "magnesium oxide magnesi oxyd 1309-48-4 E530 Light Magnesium Oxide PhEur: Magnesium Oxide, Heavy Magnesium Oxide Calcined magnesia calcinated magnesite Descote Magcal Jylagchem 100 Maglite magnesia magnesia monoxide magnesia usta magnesii oxidum leve magnesii oxidum ponderosum Magnyox Marmag Oxymag periclase Oxide Magnesium Oxide, Heavy Magnesium Oxide, Light"}, {"id": "magnesium-silicate", "n": "Magnesium Silicate", "nv": "Magnesium Silicate", "g": ["Chất chống vón", "Chất điều hòa sự chảy", "Tá dược trơn"], "ge": ["Anticaking agent", "Glidant", "Lubricant"], "cas": "1343-88-0", "f": [["Dùng trong chế phẩm uống làm chất điều hòa trơn chảy, tá dược trơn và chất chống vón.", "1, tr.557"]], "fe": [["Used in oral preparations as a flow conditioner, lubricating excipient and anti-caking agent.", "1, tr.557"]], "t": [["Tương kỵ với chất oxy hóa mạnh; bị acid vô cơ phân hủy; có thể giảm sinh khả dụng của mebeverin, sucralfat và tetracyclin (do chelat/gắn kết); làm chậm hòa tan acid folic, erythromycin stearat, paracetamol, chloroquin phosphat; có thể bất hoạt paraben.", "1, tr.557"]], "te": [["Incompatible with strong oxidizing agents; decomposed by inorganic acids; may reduce bioavailability of mebeverin, sucralfate and tetracycline (due to chelation/binding); slows the dissolution of folic acid, erythromycin stearate, paracetamol, chloroquin phosphate; Can inactivate parabens.", "1, tr.557"]], "d": [["Bột mịn màu trắng, không mùi, không vị, không sạn.", "1, tr.557"], ["Thực tế không tan trong ethanol 95%, ether và nước.", "1, tr.557"]], "de": [["White fine powder, odorless, tasteless, gritless.", "1, tr.557"], ["Practically insoluble in 95% ethanol, ether and water.", "1, tr.557"]], "a": "magnesium silicate magnesi silicat 1343-88-0 E553a Magnesium Silicate"}, {"id": "magnesium-stearate", "n": "Magnesium Stearate", "nv": "Magnesium Stearate", "g": ["Tá dược trơn bóng (viên nén/nang)"], "ge": ["Tablet / capsule glidant"], "cas": "557-04-0", "f": [["Được dùng rộng rãi làm tá dược trơn bóng (lubricant) trong sản xuất viên nén và viên nang ở nồng độ 0,25–5,0% kl/kl, giúp giảm ma sát giữa khối bột với bề mặt cối và chày khi nén và tháo viên.", "1, tr.559"], ["Ngoài dược phẩm, còn được sử dụng trong kem chắn (barrier cream), mỹ phẩm và thực phẩm.", "1, tr.559"]], "fe": [["Widely used as a lubricant in the production of tablets and capsules at concentrations of 0.25–5.0% w/kl, helping to reduce friction between the powder mass and the surface of the mortar and pestle when compressing and removing tablets.", "1, tr.559"], ["In addition to pharmaceuticals, it is also used in barrier creams, cosmetics and foods.", "1, tr.559"]], "t": [["Tương kỵ với acid mạnh, kiềm mạnh và muối sắt; tránh phối hợp với chất oxy hóa mạnh; không sử dụng trong chế phẩm chứa aspirin, một số vitamin và đa số muối alkaloid.", "1, tr.559"]], "te": [["Incompatible with strong acids, strong alkalis and iron salts; Avoid combining with strong oxidizing agents; Do not use in preparations containing aspirin, some vitamins and most alkaloid salts.", "1, tr.559"]], "d": [["Bột màu trắng rất mịn, nhẹ, tỷ trọng khối thấp; hơi có mùi acid stearic, vị đặc trưng; sờ trơn nhờn và dễ bám da.", "1, tr.559"], ["Thực tế không tan trong ethanol, ethanol 95%, ether và nước; tan nhẹ trong benzen nóng và ethanol 95% nóng.", "1, tr.559"]], "de": [["Very fine, light white powder, low bulk density; Slightly smells of stearic acid, characteristic taste; It's slippery to the touch and easily sticks to the skin.", "1, tr.559"], ["Practically insoluble in ethanol, 95% ethanol, ether and water; Slightly soluble in hot benzene and hot 95% ethanol.", "1, tr.559"]], "a": "magnesium stearate magnesi stearat magnesium distearate 557-04-0 Magnesium Stearate Cecavon MG 51 Dibasic magnesium stearate Kemiluh EM-F magnesii stearas magnesium octadecanoate octadecanoic acid, magnesium salt stearic acid, magnesium salt Synpro 90"}, {"id": "magnesium-sulfate", "n": "Magnesium Sulfate", "nv": "Dried Magnesium Sulfate; Magnesium Sulfate", "g": ["Tá chất vaccine"], "ge": ["Vaccine adjuvant"], "cas": "7487-88-9", "f": [["Dùng trong dạng thuốc rắn uống; cũng được dùng làm tá chất trong gây mê toàn thân.", "1, tr.563"]], "fe": [["Used in solid oral dosage form; Also used as an adjuvant in general anesthesia.", "1, tr.563"]], "t": [["Tương kỵ với ethoxyethyl alcol, arsenat, phosphat, tartrat, chì, bari, stronti và calci.", "1, tr.563"]], "te": [["Incompatible with ethoxyethyl alcohol, arsenate, phosphate, tartrate, lead, barium, strontium and calcium.", "1, tr.563"]], "d": [["Tinh thể không màu hoặc bột kết tinh dạng hạt, vị mặn đắng; lên hoa trong không khí khô ấm.", "1, tr.563"], ["Tan trong nước (1 trong 0,8–1 phần); ít tan trong ethanol; tan trong glycerol.", "1, tr.563"]], "de": [["Colorless crystals or granular crystalline powder, bitter salty taste; blooms in warm, dry air.", "1, tr.563"], ["Soluble in water (1 in 0.8–1 part); Slightly soluble in ethanol; soluble in glycerol.", "1, tr.563"]], "a": "magnesium sulfate magnesi sulfat epsom salt 7487-88-9 Dried Magnesium Sulfate Magnesium Sulfate Epsom salts E518 magnesii sulphas magnesium sulphate sulphuric acid, magnesium salt"}, {"id": "magnesium-trisilicate", "n": "Magnesium Trisilicate", "nv": "Magnesium Trisilicate", "g": ["Chất điều hòa sự chảy"], "ge": ["Glidant"], "cas": "14987-04-3", "f": [["Dùng trong chế phẩm uống và thực phẩm làm chất điều hòa trơn chảy.", "1, tr.565"]], "fe": [["Used in oral and food preparations as a flow conditioner.", "1, tr.565"]], "t": [["Có thể giảm sinh khả dụng của mebeverin, proguanil, norfloxacin, sucralfat và tetracyclin (do gắn/chelat); làm chậm hòa tan acid folic, erythromycin stearat, acetaminophen, chloroquin phosphat; có thể bất hoạt paraben.", "1, tr.565"]], "te": [["May reduce bioavailability of mebeverin, proguanil, norfloxacin, sucralfate and tetracycline (due to binding/chelating); slows the dissolution of folic acid, erythromycin stearate, acetaminophen, chloroquin phosphate; Can inactivate parabens.", "1, tr.565"]], "d": [["Bột mịn màu trắng, không mùi, không vị, không sạn.", "1, tr.565"], ["Thực tế không tan trong diethyl ether, ethanol 95% và nước.", "1, tr.565"]], "de": [["White fine powder, odorless, tasteless, gritless.", "1, tr.565"], ["Practically insoluble in diethyl ether, 95% ethanol and water.", "1, tr.565"]], "a": "magnesium trisilicate magnesi trisilicat 14987-04-3 E553a Magnesium Trisilicate magnesii trisilicas magnesium mesotrisilicate"}, {"id": "maleic-acid", "n": "Maleic Acid", "nv": "Maleic Acid", "g": ["Chất acid hóa", "Chất đệm"], "ge": ["Acidifying agent", "Buffering agent"], "cas": "110-16-7", "f": [["Dùng làm chất điều chỉnh pH và chất đệm trong chế phẩm uống, dùng ngoài và tiêm cũng như thực phẩm; cũng dùng ngăn ôi hóa dầu mỡ (tỷ lệ ~1:10.000).", "1, tr.567"]], "fe": [["Used as a pH regulator and buffer in oral, topical and injectable preparations as well as foods; Also used to prevent rancidity of grease (ratio ~ 1:10,000).", "1, tr.567"]], "t": [["Phản ứng với chất oxy hóa; dung dịch nước ăn mòn thép carbon.", "1, tr.567"]], "te": [["Reacts with oxidizing agents; Aqueous solutions corrode carbon steel.", "1, tr.567"]], "d": [["Bột kết tinh (đơn tà) màu trắng, mùi chua nhẹ, vị chát.", "1, tr.567"], ["Tan 1 trong 2 phần nước; ít tan trong cloroform; tan trong diethyl ether.", "1, tr.567"]], "de": [["White (monoclinic) crystalline powder, slightly sour odor, acrid taste.", "1, tr.567"], ["Dissolve 1 in 2 parts water; Slightly soluble in chloroform; Soluble in diethyl ether.", "1, tr.567"]], "a": "maleic acid acid maleic 110-16-7 Maleic Acid Acidum maleicum czs-butenedioic acid ờs-2-butenedioic acid (Z)2-butenedioic acid c/s-ethene-l,2-dicarboxylic acid cis-\\,2-ethylenedicarboxylic acid czs-maleic acid maleinic acid toxilic acid"}, {"id": "malic-acid", "n": "Malic Acid", "nv": "Malic Acid", "g": ["Chất acid hóa", "Chất chống oxy hóa", "Chất đệm", "Chất tạo phức", "Chất tạo hương"], "ge": ["Acidifying agent", "Antioxidant", "Buffering agent", "Chelating / Complexing agent", "Flavoring agent"], "cas": "6915-15-7, 617-48-1", "f": [["Dùng làm chất acid hóa đa dụng; có vị táo nhẹ nên dùng làm chất tạo hương che vị đắng và tạo vị chua; thay acid citric trong bột sủi, nước súc miệng và viên làm sạch răng; có tính chelat và chống oxy hóa (phối hợp BHT làm chất hiệp lực ngăn oxy hóa dầu thực vật).", "1, tr.569"]], "fe": [["Used as a multi-purpose acidifier; has a mild apple flavor, so it is used as a flavoring agent to mask the bitter taste and create a sour taste; Replace citric acid in effervescent powder, mouthwash and dental cleaning tablets; Has chelating and antioxidant properties (combined with BHT as a synergistic agent to prevent vegetable oil oxidation).", "1, tr.569"]], "t": [["Phản ứng với chất oxy hóa; dung dịch nước ăn mòn nhẹ thép carbon.", "1, tr.569"]], "te": [["Reacts with oxidizing agents; Aqueous solutions are mildly corrosive to carbon steel.", "1, tr.569"]], "d": [["Bột hoặc hạt kết tinh màu trắng/gần trắng, mùi nhẹ, vị chua mạnh, hút ẩm; hàng thương mại là racemat.", "1, tr.569"], ["Tan 1 trong 1,5–2 phần nước; tan trong ethanol 95%, methanol, propylen glycol; ít tan trong aceton.", "1, tr.569"]], "de": [["White/nearly white crystalline powder or granules, mild odor, strong sour taste, hygroscopic; commercial goods are racemat.", "1, tr.569"], ["Dissolve 1 in 1.5–2 parts water; Soluble in 95% ethanol, methanol, propylene glycol; Slightly soluble in acetone.", "1, tr.569"]], "a": "malic acid acid malic 6915-15-7 E296 Malic Acid Acidum malicum apple acid 2-hydroxy-l,4-butanedioic acid hydroxybutanedioic acid l-hydroxy-l,2-ethanedicarboxylic acid hydroxysuccinic acid 2-hydroxysuccinic acid DL-malic acid"}, {"id": "maltitol", "n": "Maltitol", "nv": "Maltitol", "g": ["Chất tạo màng bao", "Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Chất tạo ngọt"], "ge": ["Coating agent", "Tablet / capsule binder", "Tablet / capsule diluent", "Sweetening agent"], "cas": "585-88-6", "f": [["Dùng rộng rãi trong dạng thuốc uống; là chất tạo ngọt độn không gây sâu răng (ngọt gần bằng sucrose), phù hợp làm tá dược độn, xát hạt ướt và bao cứng không đường.", "1, tr.571"]], "fe": [["Widely used in oral medication form; is a filler sweetener that does not cause tooth decay (almost as sweet as sucrose), suitable as a filler excipient, wet granulation and sugar-free packaging.", "1, tr.571"]], "t": [["Tài liệu chưa đề cập.", "1, tr.571"]], "te": [["Documents not mentioned.", "1, tr.571"]], "d": [["Bột kết tinh khan màu trắng, không mùi, vị ngọt; là disaccharid (glucose–sorbitol).", "1, tr.571"], ["Dễ tan trong nước.", "1, tr.571"]], "de": [["White anhydrous crystalline powder, odorless, sweet taste; is a disaccharide (glucose–sorbitol).", "1, tr.571"], ["Easily soluble in water.", "1, tr.571"]], "a": "maltitol 585-88-6 E965 Maltitol Amalty, C*PharmMaltidex', E965 hydrogenated maltose Lycasin', Malbit Maltilite Maltisorb Maltit D-maltitol maltitolum SweetPearl. OH"}, {"id": "maltitol-solution", "n": "Maltitol Solution", "nv": "Liquid Maltitol; Maltitol, Liquid; Maltitol Solution", "g": ["Chất gây treo", "Chất tạo ngọt"], "ge": ["Suspending agent", "Sweetening agent"], "cas": "9053-46-7", "f": [["Dùng trong chế phẩm uống làm chất tạo ngọt độn (đơn độc hoặc phối hợp sorbitol) và làm chất gây treo cho hỗn dịch uống thay siro sucrose; không kết tinh nên ngăn 'cap-locking' ở siro và elixir; cũng dùng làm viên ngậm.", "1, tr.574"]], "fe": [["Used in oral preparations as a sweetener (alone or in combination with sorbitol) and as a suspension for oral suspensions instead of sucrose syrup; does not crystallize, thus preventing 'cap-locking' in syrups and elixirs; Also used as lozenges.", "1, tr.574"]], "t": [["Tài liệu chưa đề cập.", "1, tr.574"]], "te": [["Documents not mentioned.", "1, tr.574"]], "d": [["Chất lỏng nhớt, trong, không màu, không mùi, vị ngọt (~75% sucrose).", "1, tr.574"]], "de": [["Viscous liquid, clear, colorless, odorless, sweet taste (~75% sucrose).", "1, tr.574"]], "a": "maltitol solution dung dich maltitol lycasin hydrogenated glucose syrup Liquid Maltitol Maltitol, Liquid Maltitol Solution E965 Pinmalt L Lyeasin PỈBC Lycasin 75/75 Lycasin 80/55 Lycasin 85/55 Maltilite Maltisorb 75/75 Maltisweet 3145 maltitol syrup maltitolum liquidum"}, {"id": "maltodextrin", "n": "Maltodextrin", "nv": "Maltodextrin", "g": ["Chất chống vón", "Vật liệu phân hủy sinh học", "Chất tạo màng bao", "Tá dược dập thẳng", "Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Chất điều chỉnh đẳng trương", "Chất làm tăng độ nhớt"], "ge": ["Anticaking agent", "Biodegradable material", "Coating agent", "Direct compression vehicle", "Tablet / capsule binder", "Tablet / capsule diluent", "Tonicity agent", "Viscosity-increasing agent"], "cas": "9050-36-6", "f": [["Dùng trong viên nén làm tá dược dính và độn cho cả dập thẳng và xát hạt ướt/tạo hạt; hầu như không ảnh hưởng xấu đến tốc độ hòa tan; có thể dùng magnesi stearat 0,5–1,0% làm chất trơn.", "1, tr.576"]], "fe": [["Used in tablets as adhesive and filler excipients for both straight stamping and wet granulation/granulation; almost no adverse effect on dissolution rate; Magnesium stearate 0.5–1.0% can be used as a lubricant.", "1, tr.576"]], "t": [["Ở điều kiện pH và nhiệt độ nhất định có thể phản ứng Maillard với amino acid gây ố vàng/nâu; tương kỵ với chất oxy hóa mạnh.", "1, tr.576"]], "te": [["Under certain pH and temperature conditions, Maillard reaction with amino acids can cause yellow/brown stains; Incompatible with strong oxidizing agents.", "1, tr.576"]], "d": [["Bột hoặc hạt màu trắng, không ngọt, không mùi; độ tan, tính hút ẩm, độ ngọt và tính nén tăng theo giá trị DE.", "1, tr.576"], ["Dễ tan trong nước; ít tan trong ethanol 95%.", "1, tr.576"]], "de": [["White powder or granules, not sweet, odorless; Solubility, hygroscopicity, sweetness and compressibility increase with DE value.", "1, tr.576"], ["Easily soluble in water; Slightly soluble in 95% ethanol.", "1, tr.576"]], "a": "maltodextrin maltrin 9050-36-6 Maltodextrin Amidex Cargill Dry MD Caloreen C*Dry A C*Dry MD C*PharmDry Clintose Globe Globe Plus Glucidex insta ''Po tato Insta*Rice*Trìn Lycatab DSH Maldex Maldex G Malta*Gran maltodextrinum Maltosweet Maltrin Maltrin QD Paselli MD Pinedex Star-Dri"}, {"id": "maltol", "n": "Maltol", "nv": "Maltol", "g": ["Chất tăng cường hương vị", "Chất tạo hương"], "ge": ["Flavor enhancer", "Flavoring agent"], "cas": "118-71-8", "f": [["Dùng làm chất tạo hương/tăng cường hương vị; trong thực phẩm dùng tới 30 ppm (nhất là với hương trái cây); ở 5–75 ppm làm tăng cảm nhận ngọt, cho phép giảm tới 15% lượng đường.", "1, tr.579"]], "fe": [["Used as a flavoring agent/flavor enhancer; in foods up to 30 ppm (especially with fruit flavors); at 5–75 ppm increases the perception of sweetness, allowing up to 15% reduction in sugar content.", "1, tr.579"]], "t": [["Dung dịch đậm đặc trong bình kim loại (kể cả một số thép không gỉ) có thể đổi màu khi bảo quản.", "1, tr.579"]], "te": [["Concentrated solutions in metal vessels (including some stainless steel) may change color during storage.", "1, tr.579"]], "d": [["Chất rắn kết tinh màu trắng, mùi và vị caramel đặc trưng; dung dịch loãng có hương dâu/dứa ngọt.", "1, tr.579"], ["Dễ tan trong cloroform; tan 1 trong 21 phần ethanol 95%; ít tan trong ether.", "1, tr.579"]], "de": [["White crystalline solid, characteristic caramel odor and taste; Diluted solution has a sweet strawberry/pineapple flavor.", "1, tr.579"], ["Easily soluble in chloroform; soluble in 1 in 21 parts of 95% ethanol; Slightly soluble in ether.", "1, tr.579"]], "a": "maltol 118-71-8 Maltol Corps praline 3-hydroxy-2-methyl-(l,4-pyran) 3-hydroxy-2rnethyl-4-pyrone larixinic acid larixix acid 2-methyl-3-hydroxy4-pyrone 2-methyl pyromeconic acid Palatone Talmorr, Veltol"}, {"id": "maltose", "n": "Maltose", "nv": "Maltose Hydrate", "g": ["Chất tạo ngọt", "Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Tá dược rã (viên nén/nang)"], "ge": ["Sweetening agent", "Tablet / capsule binder", "Tablet / capsule diluent", "Tablet / capsule disintegrant"], "cas": "69-79-4", "f": [["Disaccharid dùng làm tá dược độn, tá dược dính ướt và tá dược rã cho viên nén/nang, và chất tạo ngọt cho chế phẩm lỏng uống; trong thuốc tiêm dùng làm chất ổn định protein, chất độn và nguồn đường (nhất là cho người tiểu đường); dạng kết tinh dùng làm tá dược dập thẳng.", "1, tr.581"]], "fe": [["Disaccharides are used as filler excipients, wetting excipients and disintegrating excipients for tablets/capsules, and sweeteners for oral liquid preparations; in injectable drugs used as protein stabilizers, fillers and sugar sources (especially for diabetics); crystalline form used as excipient for straight stamping.", "1, tr.581"]], "t": [["Có thể phản ứng với chất oxy hóa; phản ứng Maillard với hợp chất chứa amin bậc 1 (như glycin) tạo sản phẩm màu nâu.", "1, tr.581"]], "te": [["May react with oxidizing agents; Maillard reaction with compounds containing primary amines (such as glycine) produces brown products.", "1, tr.581"]], "d": [["Tinh thể hoặc bột kết tinh màu trắng, không mùi, vị ngọt (~30% sucrose).", "1, tr.581"]], "de": [["White crystals or crystalline powder, odorless, sweet taste (~30% sucrose).", "1, tr.581"]], "a": "maltose 69-79-4 Maltose Hydrate Adưantose 100-, cextromaltose Finetose Finetose F 4-O-a-Dglucopyranosyl-P-D-glucose 4-(ot-D-glucosido)-D-glucose malt sugar maltobiose Maltodiose Sunmalt Sunmalt s"}, {"id": "mannitol", "n": "Mannitol", "nv": "Mannitol", "g": ["Tá dược hỗ trợ đông khô", "Chất hóa dẻo", "Chất tạo ngọt", "Tá dược độn (viên nén/nang)", "Chất điều chỉnh đẳng trương"], "ge": ["Lyophilization bulking agent", "Plasticizer", "Sweetening agent", "Tablet / capsule diluent", "Tonicity agent"], "cas": "69-65-8", "f": [["Dùng rộng rãi làm tá dược độn (10–90% kl/kl) trong viên nén; đặc biệt giá trị vì không hút ẩm nên dùng được với hoạt chất nhạy ẩm; dùng cả dập thẳng (dạng hạt/phun sấy) và xát hạt ướt (dễ sấy).", "1, tr.583"], ["Cũng dùng làm chất hỗ trợ đông khô và chất điều chỉnh đẳng trương.", "1, tr.583"]], "fe": [["Widely used as a filler excipient (10–90% w/w) in tablets; Especially valuable because it does not absorb moisture so it can be used with moisture-sensitive active ingredients; Use both straight stamping (granular/spray drying) and wet granulation (easy drying).", "1, tr.583"], ["Also used as lyophilization aid and isotonicity regulator.", "1, tr.583"]], "t": [["Dung dịch mannitol ≥20% có thể bị tách muối bởi KCl hoặc NaCl; tủa khi tiếp xúc chất dẻo; tương kỵ với natri cephapirin; tạo phức với nhôm, đồng, sắt.", "1, tr.583"]], "te": [["Mannitol solutions ≥20% can be desalted by KCl or NaCl; precipitate when in contact with plastic; Incompatible with cephapirin sodium; forms complexes with aluminum, copper, and iron.", "1, tr.583"]], "d": [["Bột kết tinh hoặc hạt trơn chảy màu trắng, không mùi, vị ngọt (~bằng glucose, bằng ½ sucrose), tạo cảm giác mát; là hexitol đồng phân với sorbitol.", "1, tr.583"], ["Tan 1 trong 5,5 phần nước; rất ít tan trong ethanol 95%; tan trong kiềm.", "1, tr.583"]], "de": [["White crystalline powder or smooth granules, odorless, sweet taste (~equal to glucose, equal to ½ sucrose), creating a cool feeling; Hexitol is isomers of sorbitol.", "1, tr.583"], ["Dissolve 1 in 5.5 parts water; very slightly soluble in 95% ethanol; soluble in alkali.", "1, tr.583"]], "a": "mannitol d-mannitol 69-65-8 E421 Mannitol D-Mannitol Cordycepic acid C*PharmMannidex- E421 manita manitol manna sugar mannit D-mannite mannite mannitolum Manno gem', Parteck', Pearlitol"}, {"id": "mannitol-sorbitol-coprocessed", "n": "Mannitol and Sorbitol, Coprocessed", "nv": "Mannitol và sorbitol (đồng chế biến)", "g": ["Tá dược dập thẳng"], "ge": ["Direct compression vehicle"], "cas": "", "f": [["Dùng trong dập thẳng viên nén tải hoạt chất cao và/hoặc hoạt chất khó nén nhờ lưu tính và tính nén tốt; ít hút ẩm hơn sorbitol chuẩn nên dùng được với thuốc nhạy ẩm; vị dễ chịu, phù hợp viên nhai.", "1, tr.588"]], "fe": [["Used in straight pressing of tablets loaded with high active ingredients and/or active ingredients that are difficult to compress thanks to good fluidity and compressibility; Less hygroscopic than standard sorbitol, so it can be used with moisture-sensitive drugs; Pleasant taste, suitable for chewing tablets.", "1, tr.588"]], "t": [["Xem mục Mannitol và Sorbitol; có thể phản ứng với acid mạnh hoặc chất oxy hóa.", "1, tr.588"]], "te": [["See Mannitol and Sorbitol; May react with strong acids or oxidizing agents.", "1, tr.588"]], "d": [["Bột mịn màu trắng đến trắng ngà, cảm giác miệng mịn; là hỗn hợp đồng chế biến mannitol và sorbitol.", "1, tr.588"], ["Tan trong nước.", "1, tr.588"]], "de": [["White to ivory white fine powder, smooth mouth feel; is a co-processed mixture of mannitol and sorbitol.", "1, tr.588"], ["Soluble in water.", "1, tr.588"]], "a": "coprocessed mannitol sorbitol compressol sm mannitol va sorbitol dong che bien Compressol S"}, {"id": "medium-chain-triglycerides", "n": "Medium-chain Triglycerides", "nv": "Triglycerides, Medium-Chain; Medium-Chain Triglycerides", "g": ["Chất nhũ hóa", "Dung môi", "Tá dược thuốc đạn/đặt", "Chất gây treo", "Tá dược độn (viên nén/nang)"], "ge": ["Emulsifying agent", "Solvent", "Suppository base", "Suspending agent", "Tablet / capsule diluent"], "cas": "73398-61-5", "f": [["Dùng trong chế phẩm uống, tiêm và dùng ngoài; đường uống làm nền cho nhũ tương, vi nhũ tương, hệ tự nhũ hóa, dung dịch hoặc hỗn dịch thuốc kém bền/kém tan trong nước; cũng làm tá dược độn nang, viên bao đường và chất trơn/chống dính.", "1, tr.590"]], "fe": [["Used in oral preparations, injections and external use; Oral route as a base for emulsions, microemulsions, self-emulsifying systems, solutions or suspensions of drugs that are unstable/poorly soluble in water; also used as an excipient for capsule fillers, sugar-coated tablets and slippery/non-sticky agents.", "1, tr.590"]], "t": [["Không được tiếp xúc với bao bì polystyren (nhanh giòn) và polyethylen tỷ trọng thấp (thấm qua nhựa tạo màng dầu); polyethylen tỷ trọng cao là bao bì phù hợp.", "1, tr.590"]], "te": [["Do not come into contact with polystyrene packaging (brittles quickly) and low density polyethylene (permeates through plastic to create an oily film); High density polyethylene is suitable packaging.", "1, tr.590"]], "d": [["Chất lỏng dạng dầu, không màu đến hơi vàng, gần như không mùi, không vị; đông đặc khoảng 0 °C.", "1, tr.590"], ["Trộn lẫn với aceton, benzen, cloroform, ethanol 95%, ether, ethyl acetat và nhiều dung môi hữu cơ.", "1, tr.590"]], "de": [["Oily liquid, colorless to slightly yellow, almost odorless, tasteless; solidifies around 0 °C.", "1, tr.590"], ["Miscible with acetone, benzene, chloroform, 95% ethanol, ether, ethyl acetate and many organic solvents.", "1, tr.590"]], "a": "medium-chain triglycerides mct miglyol triglycerid chuoi trung binh 73398-61-5 Medium-chain Triglycerides Triglycerides, Medium-Chain Bergabest caprylic/capric triglyceride Captex 300 Captex 355 Coconad Crodamol GTCC Delios glyceryl tricaprylate/caprate Kollisolv MCT Labrafac CC Labrafac Lipo Labrafac WL1349 MCT oil Miglyol 810 Miglyol 812 Myrìtol Neobee M5 Nesatol oleum neutrale oleum vegetable tenue ProKote 2855 Stelliesters MCT thin vegetable oil triglycerida saturata media Waglinol 3/ 9280 Medium-Chain Triglycerides"}, {"id": "meglumine", "n": "Meglumine", "nv": "Meglumine", "g": ["Chất đệm"], "ge": ["Buffering agent"], "cas": "6284-40-8", "f": [["Là base hữu cơ dùng làm chất điều chỉnh pH và tăng độ tan, chủ yếu để tạo muối tan của các acid hữu cơ chứa iod dùng làm thuốc cản quang X-quang.", "1, tr.593"]], "fe": [["An organic base used as a pH regulator and solubility increaser, mainly to create soluble salts of iodine-containing organic acids used as X-ray contrast agents.", "1, tr.593"]], "t": [["Tương kỵ với nhôm, đồng, acid vô cơ và chất oxy hóa; nghiên cứu DSC gợi ý tương kỵ với glipizid.", "1, tr.593"]], "te": [["Incompatible with aluminum, copper, inorganic acids and oxidizing agents; DSC studies suggest incompatibility with glipizide.", "1, tr.593"]], "d": [["Bột kết tinh màu trắng đến hơi vàng, không mùi hoặc mùi nhẹ.", "1, tr.593"], ["Tan trong nước; ít tan trong ethanol 95% (1 trong 80); thực tế không tan trong cloroform.", "1, tr.593"]], "de": [["White to slightly yellow crystalline powder, odorless or mild odor.", "1, tr.593"], ["Soluble in water; sparingly soluble in 95% ethanol (1 in 80); practically insoluble in chloroform.", "1, tr.593"]], "a": "meglumine meglumin n-methylglucamine 6284-40-8 Meglumine Meglumin meglumina megluminum 1-methylamino-l-deoxy-Dglucitol N-methylglucamine N-methyl-D-glucamine"}, {"id": "menthol", "n": "Menthol", "nv": "Racementhol; Menthol, Racemic; Menthol", "g": ["Chất tạo hương"], "ge": ["Flavoring agent"], "cas": "15356-70-4, 1490-04-6, 89-78-1", "f": [["Dùng rộng rãi làm chất tạo hương/tăng mùi; ngoài hương bạc hà, l-menthol còn tạo cảm giác mát lạnh (tương tác trực tiếp với thụ thể lạnh của cơ thể) khai thác trong nhiều chế phẩm dùng ngoài. Nồng độ tham khảo 0,001–10% tùy dạng.", "1, tr.595"]], "fe": [["Widely used as a flavoring/odor enhancer; In addition to the mint flavor, l-menthol also creates a cool feeling (direct interaction with the body's cold receptors) and is exploited in many topical preparations. Reference concentration 0.001–10% depending on form.", "1, tr.595"]], "t": [["Tương kỵ với butylchloral hydrat, camphor, chloral hydrat, crom trioxid, β-naphthol, phenol, kali permanganat, pyrogallol, resorcinol và thymol.", "1, tr.595"]], "te": [["Incompatible with butylchloral hydrate, camphor, chloral hydrate, chromium trioxide, β-naphthol, phenol, potassium permanganate, pyrogallol, resorcinol and thymol.", "1, tr.595"]], "d": [["Bột kết tinh trơn chảy hoặc tinh thể óng ánh, khối kết hợp, mùi và vị bạc hà mạnh đặc trưng; dạng tinh thể có thể thay đổi theo thời gian do thăng hoa.", "1, tr.595"], ["Rất dễ tan trong ethanol 95%, cloroform, ether, dầu béo và paraffin lỏng; rất ít tan trong glycerin; thực tế không tan trong nước.", "1, tr.595"]], "de": [["Smooth flowing crystalline powder or iridescent crystals, aggregate, characteristic strong mint smell and taste; The crystal form may change over time due to sublimation.", "1, tr.595"], ["Very soluble in 95% ethanol, chloroform, ether, fatty oils and liquid paraffin; very slightly soluble in glycerin; practically insoluble in water.", "1, tr.595"]], "a": "menthol 2216-51-5 89-78-1 Racementhol ^/-Menthol Menthol, Racemic Menthol Hexahydrothymol 2-isopropyl-5-methylcyclohexanol 4-isopropyl-l-methylcyclohexan-3-ol 3-p-menthanol p-menthan-3-ol dlmenthol mentholum racemicum menthomenthol mentoli mentolis peppermint camphor racemic menthol"}, {"id": "methionine", "n": "Methionine", "nv": "Methionine", "g": ["Chất đệm", "Chất tạo hương"], "ge": ["Buffering agent", "Flavoring agent"], "cas": "63-68-3", "f": [["Dùng trong chế phẩm uống làm chất tạo hương; trong thuốc tiêm dùng làm chất điều chỉnh pH.", "1, tr.598"]], "fe": [["Used in oral preparations as flavoring agent; In injectable drugs used as a pH regulator.", "1, tr.598"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.598"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.598"]], "d": [["Bột kết tinh hoặc tinh thể không màu, màu trắng/gần trắng.", "1, tr.598"], ["Tan trong nước, acid loãng và kiềm; không tan trong ethanol khan, benzen, aceton và ether.", "1, tr.598"]], "de": [["Colorless, white/almost white crystalline powder or crystals.", "1, tr.598"], ["Soluble in water, dilute acids and alkalis; Insoluble in anhydrous ethanol, benzene, acetone and ether.", "1, tr.598"]], "a": "methionine methionin l-methionine 63-68-3 Methionine L-Methionine a-Amino-y-methylmercaptobutyric acid (S)-2-amino-4(methylthio)butanoic acid 2-amino-4-(methylthio)butyric acid Lmethionine methioninum y-methylthio-a-aminobutyric acid"}, {"id": "methylcellulose", "n": "Methylcellulose", "nv": "Methylcellulose", "g": ["Chất tạo màng bao", "Chất nhũ hóa", "Tá dược phóng thích biến đổi", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Tá dược rã (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Coating agent", "Emulsifying agent", "Modified-release agent", "Suspending agent", "Tablet / capsule binder", "Tablet / capsule disintegrant", "Viscosity-increasing agent"], "cas": "9004-67-5", "f": [["Trong viên nén, grade độ nhớt thấp/trung bình dùng làm tá dược dính (dạng bột khô hoặc dung dịch); grade độ nhớt cao có thể làm tá dược rã và tạo dạng giải phóng kéo dài; dùng bao viên (dung dịch nước hoặc hữu cơ).", "1, tr.600"]], "fe": [["In tablets, low/medium viscosity grade used as adhesive excipient (dry powder or solution); High viscosity grades can cause excipients to disintegrate and create sustained release forms; Use tablet coating (aqueous or organic solution).", "1, tr.600"]], "t": [["Tương kỵ với aminacrin hydroclorid, chlorocresol, thủy ngân (II) clorid, phenol, resorcinol, tannic acid, bạc nitrat, cetylpyridinium clorid và các paraben; muối acid vô cơ, phenol và tannin làm đông tụ dung dịch (ngăn được bằng ethanol 95%).", "1, tr.600"]], "te": [["Incompatible with aminoacrin hydrochloride, chlorocresol, mercury (II) chloride, phenol, resorcinol, tannic acid, silver nitrate, cetylpyridinium chloride and parabens; Inorganic acid salts, phenol and tannin cause solution coagulation (prevented by 95% ethanol).", "1, tr.600"]], "d": [["Bột sợi hoặc hạt màu trắng, hút ẩm khi khô, gần như không mùi, không vị; ghi loại độ nhớt (của dung dịch 1 trong 50).", "1, tr.600"], ["Thực tế không tan trong aceton, ethanol 95%, ether, toluen và nước nóng; tan trong acid acetic băng và hỗn hợp ethanol–cloroform; trong nước lạnh trương tạo dung dịch keo.", "1, tr.600"]], "de": [["White fibrous powder or granules, hygroscopic when dry, almost odorless and tasteless; Record the viscosity type (of a 1 in 50 solution).", "1, tr.600"], ["Practically insoluble in acetone, 95% ethanol, ether, toluene and hot water; soluble in glacial acetic acid and ethanol–chloroform mixture; In cold water it swells to form a colloidal solution.", "1, tr.600"]], "a": "methylcellulose mc methocel a 9004-67-5 E461 Methylcellulose Benecel BonuCel Cellacol Culminal MC Mapolose Methocel) methylcellulosum Metolose, Rutocel A 55 RT Tylose Vis co I"}, {"id": "methylparaben", "n": "Methylparaben", "nv": "Methyl Parahydroxybenzoate; Methylparaben", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "99-76-3", "f": [["Dùng rộng rãi làm chất bảo quản kháng khuẩn trong mỹ phẩm, thực phẩm và dược phẩm, đơn độc hoặc phối hợp với paraben/chất kháng khuẩn khác; hiệu lực trên khoảng pH rộng, phổ rộng, mạnh nhất với nấm men và nấm mốc. Thường phối hợp các paraben để tăng hiệu lực.", "1, tr.604"]], "fe": [["Widely used as an antibacterial preservative in cosmetics, foods and pharmaceuticals, alone or in combination with parabens/other antibacterials; Effective over a wide pH range, broad spectrum, strongest against yeast and mold. Often combined with parabens to increase effectiveness.", "1, tr.604"]], "t": [["Hoạt tính giảm đáng kể khi có chất diện hoạt không ion (như polysorbat 80) do tạo micelle; propylen glycol 10% giúp phục hồi hoạt tính và ngăn tương tác methylparaben–polysorbat 80.", "1, tr.604"]], "te": [["Activity is significantly reduced in the presence of nonionic surfactants (such as polysorbate 80) due to micelle formation; Propylene glycol 10% helps restore activity and prevents methylparaben–polysorbate 80 interaction.", "1, tr.604"]], "d": [["Tinh thể không màu hoặc bột kết tinh màu trắng, không mùi hoặc gần như không mùi, vị hơi nóng.", "1, tr.604"]], "de": [["Colorless crystals or white crystalline powder, odorless or almost odorless, slightly hot taste.", "1, tr.604"]], "a": "methylparaben nipagin methyl parahydroxybenzoate 99-76-3 E218 Methyl Parahydroxybenzoate Methyl Hydroxybenzoate Methylparaben Aseptoform M CoSept M 4-hydroxybenzoic acid methyl ester metagin Methyl Chemosept', methylis parahydroxybenzoas methyl p-hydroxybenzoate Methyl Parasept Nipagin M Solbrol M Tegosept M"}, {"id": "methylpyrrolidone", "n": "Methylpyrrolidone", "nv": "Methylpyrrolidone", "g": ["Chất tăng thấm", "Chất làm tăng độ tan"], "ge": ["Permeation enhancer", "Solubilizing agent"], "cas": "872-50-4", "f": [["Dùng làm đồng dung môi aprotic để hòa tan hoạt chất trong chế phẩm uống, tiêm và dùng ngoài; được nghiên cứu làm chất tăng thấm dùng ngoài (FDA IID ghi potency tối đa 25,85% cho tiêm dưới da).", "1, tr.609"]], "fe": [["Used as aprotic co-solvent to dissolve active ingredients in oral, injectable and topical preparations; Researched as a topical permeation enhancer (FDA IID records maximum potency 25.85% for subcutaneous injection).", "1, tr.609"]], "t": [["Ít phản ứng, trừ khi có acid hoặc base mạnh; có thể tạo phức với kim loại, muối kiềm và một số hoạt chất (benzocain, phenol, iod).", "1, tr.609"]], "te": [["Little reaction unless strong acids or bases are present; Can form complexes with metals, alkaline salts and some active ingredients (benzocaine, phenol, iodine).", "1, tr.609"]], "d": [["Chất lỏng trong, hút ẩm, mùi amin nhẹ.", "1, tr.609"], ["Trộn lẫn với ethanol 95%, nước và đa số dung môi hữu cơ.", "1, tr.609"]], "de": [["Clear liquid, hygroscopic, slight amino odor.", "1, tr.609"], ["Miscible with 95% ethanol, water and most organic solvents.", "1, tr.609"]], "a": "methylpyrrolidone nmp n-methyl-2-pyrrolidone 872-50-4 Methylpyrrolidone N-Methylpyrrolidone Methyl-2-one pyrrolidin l-methyl-2-oxopyrrolidine l-methyl-2lpyrrolidinone l-methyl-2-pyrrolidone l-methylazacyclopentan-2one l-methylpyrrolidin-2-one 2-methyl-2-azacyclopentanone MP M-Pyrol N-methyl tetrahydropyrrolone N-methyl-1-oxote tramethyleneamine N-methyl-2-pyrrolidinone N-methyl-2-pyrrolidone N-methylpyrrolidone N-methylpyrrol s, acid chlorides and esters to form amides.", "1, tr.616"]], "d": [["Chất lỏng trong, không màu hoặc vàng nhạt, hơi nhớt, mùi amoniac nhẹ.", "1, tr.616"], ["Trộn lẫn với aceton, cloroform, ethanol 95%, glycerol, methanol và nước; tan 1 trong 72 phần benzen.", "1, tr.616"]], "de": [["Clear, colorless or pale yellow liquid, slightly viscous, mild ammonia odor.", "1, tr.616"], ["Mix with acetone, chloroform, 95% ethanol, glycerol, methanol and water; dissolves 1 in 72 parts of benzene.", "1, tr.616"]], "a": "monoethanolamine mea ethanolamine monoethanolamin 141-43-5 Ethanolamine Monoethanolamine P-Aminocthyl alcohol colamine ethylolamine p-hydroxyethylamine"}, {"id": "monosodium-glutamate", "n": "Monosodium Glutamate", "nv": "Monosodium Glutamate", "g": ["Chất đệm", "Chất tạo hương"], "ge": ["Buffering agent", "Flavoring agent"], "cas": "142-47-2", "f": [["Dùng trong chế phẩm uống làm chất đệm và tăng cường hương vị; phối hợp với đường để cải thiện độ ngon của thuốc đắng và giảm vị kim loại của chế phẩm chứa sắt; cũng dùng trong một số vaccine sống tiêm dưới da.", "1, tr.618"]], "fe": [["Used in oral preparations as a buffer and flavor enhancer; Combined with sugar to improve the taste of bitter medicine and reduce the metallic taste of iron-containing preparations; Also used in some live vaccines administered subcutaneously.", "1, tr.618"]], "t": [["Tài liệu chưa đề cập.", "1, tr.618"]], "te": [["Documents not mentioned.", "1, tr.618"]], "d": [["Tinh thể trơn chảy hoặc bột kết tinh màu trắng, gần như không mùi, vị như thịt.", "1, tr.618"], ["Tan trong nước; ít tan trong ethanol 95%.", "1, tr.618"]], "de": [["Smooth flowing crystals or white crystalline powder, almost odorless, with a meaty taste.", "1, tr.618"], ["Soluble in water; Slightly soluble in 95% ethanol.", "1, tr.618"]], "a": "monosodium glutamate msg mononatri glutamat bot ngot 142-47-2 E621 Monosodium Glutamate Aji-No-Moto Chinese seasoning glutamic acid monosodium salt glutamic acid, sodium salt MSG mono AX-14"}, {"id": "neohesperidin-dihydrochalcone", "n": "Neohesperidin Dihydrochalcone", "nv": "Neohesperidin Dihydrochalcone", "g": ["Chất tăng cường hương vị", "Chất tạo ngọt"], "ge": ["Flavor enhancer", "Sweetening agent"], "cas": "20702-77-6", "f": [["Là chất tạo ngọt mạnh tổng hợp (ngọt gấp ~1000–1500 lần sucrose, 20 lần saccharin); dùng làm chất tạo ngọt và tăng cường hương vị; mức dùng trong thực phẩm 1–5 ppm (có thể cao hơn ở kẹo cao su); hiệp lực với chất tạo ngọt mạnh khác. Hậu vị ngọt/bạc hà kéo dài.", "1, tr.625"]], "fe": [["A strong synthetic sweetener (~1000–1500 times sweeter than sucrose, 20 times sweeter than saccharin); used as a sweetener and flavor enhancer; food use level 1–5 ppm (may be higher in chewing gum); Synergistic with other strong sweeteners. Long sweet/mint aftertaste.", "1, tr.625"]], "t": [["Tài liệu chưa đề cập.", "1, tr.625"]], "te": [["Documents not mentioned.", "1, tr.625"]], "d": [["Bột màu trắng hoặc trắng vàng, vị ngọt đậm.", "1, tr.625"]], "de": [["White or yellowish white powder, strong sweet taste.", "1, tr.625"]], "a": "neohesperidin dihydrochalcone nhdc 20702-77-6 E959 Neohesperidin Dihydrochalcone neohesperidin DC neohesperidin DHC neohesperidin dihydrochalconum neohesperidine dihydrochalcone NHDC 1-propanone Sukor"}, {"id": "neotame", "n": "Neotame", "nv": "Neotame", "g": ["Chất tăng cường hương vị", "Chất tạo ngọt"], "ge": ["Flavor enhancer", "Sweetening agent"], "cas": "165450-17-9", "f": [["Chất tạo ngọt mạnh, tan trong nước, không sinh năng lượng đáng kể; liên quan cấu trúc với aspartam nhưng ngọt gấp ~30–60 lần aspartam; vị ngọt 'sạch', không có hậu vị đắng/kim loại như saccharin.", "1, tr.627"]], "fe": [["Strong sweetener, soluble in water, does not produce significant calories; Structurally related to aspartame but ~30–60 times sweeter than aspartame; 'clean' sweetness, without the bitter/metallic aftertaste of saccharin.", "1, tr.627"]], "t": [["Tài liệu chưa đề cập.", "1, tr.627"]], "te": [["Documents not mentioned.", "1, tr.627"]], "d": [["Bột màu trắng đến trắng ngà, không mùi, vị ngọt cực đậm (7000–13.000 lần sucrose tùy nền).", "1, tr.627"], ["Tan trong ethanol và ethyl acetat; ít tan trong nước (tăng theo nhiệt độ).", "1, tr.627"]], "de": [["White to ivory white powder, odorless, extremely sweet taste (7000–13,000 times sucrose depending on the base).", "1, tr.627"], ["Soluble in ethanol and ethyl acetate; Slightly soluble in water (increases with temperature).", "1, tr.627"]], "a": "neotame neotam 165450-17-9 E961 Neotame"}, {"id": "niacinamide", "n": "Niacinamide", "nv": "Nicotinamide", "g": ["Chất làm tăng độ tan", "Chất chống oxy hóa"], "ge": ["Solubilizing agent", "Antioxidant"], "cas": "98-92-0", "f": [["Dùng trong chế phẩm tiêm và dùng ngoài ở nồng độ 1,25–2,5% làm chất tăng độ tan và/hoặc chống oxy hóa; tăng độ tan cho nhiều thuốc kém tan; dùng trong keo mô (fibrinogen–thrombin) để giảm độ nhớt và dễ hoàn nguyên.", "1, tr.628"]], "fe": [["Used in injectable and topical preparations at concentrations of 1.25–2.5% as a solubility enhancer and/or antioxidant; increase the solubility of many poorly soluble drugs; used in tissue glue (fibrinogen–thrombin) to reduce viscosity and facilitate reconstitution.", "1, tr.628"]], "t": [["Tương kỵ với chất oxy hóa mạnh, acid mạnh và dung dịch kiềm.", "1, tr.628"]], "te": [["Incompatible with strong oxidizers, strong acids and alkaline solutions.", "1, tr.628"]], "d": [["Bột kết tinh màu trắng hút ẩm hoặc tinh thể không màu.", "1, tr.628"], ["Tan trong nước (1 g/mL ở 20 °C), ethanol, glycerol, DMSO, methanol và cloroform; ít tan trong ether.", "1, tr.628"]], "de": [["White hygroscopic crystalline powder or colorless crystals.", "1, tr.628"], ["Soluble in water (1 g/mL at 20 °C), ethanol, glycerol, DMSO, methanol and chloroform; Slightly soluble in ether.", "1, tr.628"]], "a": "niacinamide nicotinamide niacinamid vitamin b3 98-92-0 Nicotinamide Niacinamide w-(Aminocarbonyl)pyridine 3-carbamoylpyridine nicotinamidum nicotinic acid amide nicotylamide vitamin B3"}, {"id": "nitrogen", "n": "Nitrogen", "nv": "Nitrogen", "g": ["Chất đẩy aerosol", "Chất thay thế không khí"], "ge": ["Aerosol propellant", "Air displacement agent"], "cas": "7727-37-9", "f": [["Cùng các khí nén khác (CO₂, nitơ oxid) dùng làm khí đẩy cho aerosol dùng ngoài; không tan nên tách khỏi công thức; ưu điểm rẻ, độc tính thấp, gần như không mùi vị, áp suất ít đổi theo nhiệt độ.", "1, tr.630"]], "fe": [["Along with other compressed gases (CO₂, nitrogen oxide) used as propellant gas for aerosols for external use; insoluble so separate from formula; Advantages: cheap, low toxicity, almost tasteless, pressure changes little with temperature.", "1, tr.630"]], "t": [["Nói chung tương hợp với hầu hết vật liệu trong dược phẩm và thực phẩm.", "1, tr.630"]], "te": [["Generally compatible with most pharmaceutical and food materials.", "1, tr.630"]], "d": [["Khí không phản ứng, không cháy, không màu, không vị, không mùi (chiếm ~78% khí quyển); thường ở dạng khí nén trong bình kim loại.", "1, tr.630"], ["Thực tế không tan trong nước và đa số dung môi; tan trong nước dưới áp suất.", "1, tr.630"]], "de": [["Non-reactive, non-flammable, colorless, tasteless, odorless gas (accounting for ~78% of the atmosphere); Usually in the form of compressed gas in a metal tank.", "1, tr.630"], ["Practically insoluble in water and most solvents; Soluble in water under pressure.", "1, tr.630"]], "a": "nitrogen nito n2 7727-37-9 E941 Nitrogen Azote nitrogenium"}, {"id": "nitrous-oxide", "n": "Nitrous Oxide", "nv": "Nitrous Oxide", "g": ["Chất đẩy aerosol"], "ge": ["Aerosol propellant"], "cas": "10024-97-2", "f": [["Cùng các khí nén khác (CO₂, nitơ) dùng làm khí đẩy cho aerosol dùng ngoài; ưu điểm rẻ, độc tính thấp, gần như không mùi vị và áp suất ít đổi theo nhiệt độ.", "1, tr.631"]], "fe": [["Along with other compressed gases (CO₂, nitrogen) used as propellant for aerosols for external use; The advantage is that it is cheap, low toxicity, almost tasteless and pressure changes little with temperature.", "1, tr.631"]], "t": [["Nói chung tương hợp với hầu hết vật liệu dược phẩm, tuy có thể phản ứng như chất oxy hóa nhẹ.", "1, tr.631"]], "te": [["Generally compatible with most pharmaceutical materials, although may react as a mild oxidizing agent.", "1, tr.631"]], "d": [["Khí không cháy, không màu, không mùi, vị ngọt; thường ở dạng khí nén trong bình kim loại.", "1, tr.631"], ["Dễ tan trong cloroform, ethanol 95%, ether và dầu; tan 1 trong 1,5 thể tích nước.", "1, tr.631"]], "de": [["The gas is non-flammable, colorless, odorless, and tastes sweet; Usually in the form of compressed gas in a metal tank.", "1, tr.631"], ["Easily soluble in chloroform, 95% ethanol, ether and oil; Soluble 1 in 1.5 volume of water.", "1, tr.631"]], "a": "nitrous oxide nito oxid n2o 10024-97-2 E942 Nitrous Oxide Dinitrogenii oxidum dinitrogen monoxide laughing gas nitrogen monoxide"}, {"id": "norflurane-hfc", "n": "Norflurane (HFC)", "nv": "Norflurane", "g": ["Chất đẩy aerosol"], "ge": ["Aerosol propellant"], "cas": "811-97-2", "f": [["Là khí đẩy hydrofluorocarbon/hydrofluoroalkan (HFC/HFA); không chứa clor nên hầu như không phá hủy tầng ozon; là chất thay thế CFC trong bình xịt định liều (MDI), thay CFC-12.", "1, tr.633"]], "fe": [["As a hydrofluorocarbon/hydrofluoroalkane (HFC/HFA) propellant; Does not contain chlorine so it hardly destroys the ozone layer; is a CFC replacement in metered dose inhalers (MDIs), replacing CFC-12.", "1, tr.633"]], "t": [["Nhược điểm chính là không trộn lẫn với nước; là dung môi kém cho hầu hết thuốc trong MDI và một số chất diện hoạt; tương kỵ với kim loại kiềm, kiềm thổ và kim loại dạng bột.", "1, tr.633"]], "te": [["The main disadvantage is that it is not miscible with water; is a poor solvent for most drugs in MDI and some surfactants; Incompatible with alkali metals, alkaline earth metals and powdered metals.", "1, tr.633"]], "d": [["Khí hóa lỏng; lỏng gần như không mùi, không màu; không ăn mòn, không kích ứng, không cháy.", "1, tr.633"], ["Tan trong ethanol 95%, ether và 1 trong 1294 phần nước.", "1, tr.633"]], "de": [["Liquefied petroleum gas; Almost odorless, colorless liquid; Non-corrosive, non-irritating, non-flammable.", "1, tr.633"], ["Soluble in 95% ethanol, ether and 1 in 1294 parts of water.", "1, tr.633"]], "a": "norflurane hfa-134a hfc-134a tetrafluoroethane 811-97-2 Norflurane Dymel 134a/P fluorocarbon 134a HFC 134a Isceon 134a Klea 134a propellant 134a refrigerant 134a Solkane 134a Suva 134a"}, {"id": "octyl-gallate", "n": "Octyl Gallate", "nv": "Octyl Gallate", "g": ["Chất chống oxy hóa"], "ge": ["Antioxidant"], "cas": "1034-01-1", "f": [["Octyl gallat và các alkyl gallat dùng làm chất chống oxy hóa/bảo quản trong mỹ phẩm, nước hoa, thực phẩm và dược phẩm; trong thực phẩm dùng ở 0,001–0,1% để ngăn ôi hóa dầu mỡ, thường phối hợp với BHA/BHT và chất tạo phức (acid citric).", "1, tr.636"]], "fe": [["Octyl gallate and alkyl gallates are used as antioxidants/preservatives in cosmetics, perfumes, foods and pharmaceuticals; in foods used at 0.001–0.1% to prevent rancidity of fats and oils, often combined with BHA/BHT and complexing agents (citric acid).", "1, tr.636"]], "t": [["Alkyl gallat tương kỵ với kim loại (natri, kali, sắt) tạo phức màu đậm (ngăn được bằng chất tạo phức như acid citric); phản ứng với chất oxy hóa mạnh và base mạnh.", "1, tr.636"]], "te": [["Alkyl gallate is incompatible with metals (sodium, potassium, iron) forming dark colored complexes (can be prevented with complexing agents such as citric acid); Reacts with strong oxidizers and strong bases.", "1, tr.636"]], "d": [["Bột kết tinh màu trắng/gần trắng, không mùi hoặc gần như không mùi.", "1, tr.636"]], "de": [["White/almost white crystalline powder, odorless or almost odorless.", "1, tr.636"]], "a": "octyl gallate octyl gallat 1034-01-1 E311 Octyl Gallate Benzoic acid, 3,4,5-trihydroxy-octyl ester gallic acid, octyl ester octil gallate octylis gallas"}, {"id": "octyldodecanol", "n": "Octyldodecanol", "nv": "Octyldodecanol", "g": ["Chất làm mềm da", "Chất nhũ hóa", "Tá dược trơn", "Dung môi", "Chất làm tăng độ nhớt"], "ge": ["Emollient", "Emulsifying agent", "Lubricant", "Solvent", "Viscosity-increasing agent"], "cas": "5333-42-6", "f": [["Dùng rộng rãi làm chất nhũ hóa và tạo độ đục; chủ yếu trong chế phẩm dùng ngoài nhờ tính bôi trơn và làm mềm; dùng trong vi nhũ tương/nhũ tương nano dầu/nước làm tá dược dùng ngoài; làm dung môi (vd. cho naproxen dùng ngoài).", "1, tr.637"]], "fe": [["Widely used as an emulsifier and turbidity agent; Mainly in topical preparations due to its lubricating and softening properties; used in oil/water microemulsion/nanoemulsion as excipient for external use; as a solvent (e.g. for topical naproxen).", "1, tr.637"]], "t": [["Nói chung tương hợp với hầu hết vật liệu; tuy nhiên tương kỵ với chất oxy hóa mạnh.", "1, tr.637"]], "te": [["Generally compatible with most materials; However, it is incompatible with strong oxidizing agents.", "1, tr.637"]], "d": [["Chất lỏng dạng dầu, trong, không màu hoặc hơi vàng.", "1, tr.637"], ["Trộn lẫn với ether và ethanol 95%; thực tế không tan trong nước.", "1, tr.637"]], "de": [["Oily liquid, clear, colorless or slightly yellow.", "1, tr.637"], ["Mixable with ether and 95% ethanol; practically insoluble in water.", "1, tr.637"]], "a": "octyldodecanol 5333-42-6 Octyldodecanol Eutanol G PH:, isoarachidyl alcohol Jarcol 1-20 Jeecol ODD octildodecanol octyldodecanolum 2-octyl-l-dodecanol 2-octyldodecanol 2-octyldodecyl alcohol STELLIESTERS ODOL"}, {"id": "oleic-acid", "n": "Oleic Acid", "nv": "Oleic Acid", "g": ["Chất nhũ hóa", "Chất tăng thấm", "Chất làm tăng độ tan"], "ge": ["Emulsifying agent", "Permeation enhancer", "Solubilizing agent"], "cas": "112-80-1", "f": [["Dùng làm chất nhũ hóa trong thực phẩm và chế phẩm dùng ngoài; được nghiên cứu làm chất tăng thấm qua da, tăng sinh khả dụng thuốc kém tan trong viên nén, tá dược cho nang mềm, nhũ tương nano dùng ngoài, hệ tự nhũ hóa uống, gel bám dính và bình xịt định liều; cũng làm chất tăng độ tan.", "1, tr.639"]], "fe": [["Used as an emulsifier in foods and topical preparations; Researched as an agent to increase skin permeability, increase the bioavailability of poorly soluble drugs in tablets, excipients for soft capsules, nanoemulsions for external use, oral self-emulsifying systems, adhesion gels and metered-dose sprays; Also acts as a solubility enhancer.", "1, tr.639"]], "t": [["Tương kỵ với nhôm, calci, kim loại nặng, dung dịch iod, acid percloric và chất oxy hóa; phản ứng với kiềm tạo xà phòng.", "1, tr.639"]], "te": [["Incompatible with aluminum, calcium, heavy metals, iodine solutions, perchloric acid and oxidizing agents; Reacts with alkali to form soap.", "1, tr.639"]], "d": [["Chất lỏng dạng dầu màu vàng nhạt đến nâu nhạt, mùi và vị đặc trưng như mỡ; acid oleic tinh khiết không màu (trên 5–7 °C); chủ yếu là acid (Z)-9-octadecenoic.", "1, tr.639"], ["Trộn lẫn với benzen, cloroform, ethanol 95%, ether, hexan và dầu; thực tế không tan trong nước.", "1, tr.639"]], "de": [["Light yellow to light brown oily liquid, characteristic odor and taste like grease; Pure oleic acid is colorless (above 5–7 °C); mainly (Z)-9-octadecenoic acid.", "1, tr.639"], ["Miscible with benzene, chloroform, 95% ethanol, ether, hexane and oils; practically insoluble in water.", "1, tr.639"]], "a": "oleic acid acid oleic 112-80-1 Oleic Acid Acidum oleicum Crodolene Crossential 094 elaic acid elaidic acid Emersol extraolein Glycon Groco Hy-Phi Industrene Metaupon Neo-Fat czs-9-octadecenoic acid 9,10-octadecenoic acid oleinic acid Priolene"}, {"id": "oleyl-alcohol", "n": "Oleyl Alcohol", "nv": "Oleyl Alcohol", "g": ["Chất làm mềm da", "Chất nhũ hóa", "Chất tăng thấm", "Chất làm tăng độ tan"], "ge": ["Emollient", "Emulsifying agent", "Permeation enhancer", "Solubilizing agent"], "cas": "143-28-2", "f": [["Chủ yếu dùng làm chất làm mềm, tăng độ tan và nhũ hóa trong chế phẩm dùng ngoài; cũng dùng trong hệ dẫn thuốc qua
