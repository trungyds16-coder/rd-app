tr.417"]], "a": "glyceryl palmitostearate glyceryl palmitostearat precirol ato 5 8067-32-1 DUBCARE G50-, glycerol palmitostearate"}, {"id": "glycine", "n": "Glycine", "nv": "Glycine", "g": ["Chất đệm", "Tá dược hỗ trợ đông khô", "Tá dược rã (viên nén/nang)"], "ge": ["Buffering agent", "Lyophilization bulking agent", "Tablet / capsule disintegrant"], "cas": "56-40-6", "f": [["Thường dùng làm tá dược đồng đông khô trong chế phẩm protein nhờ tạo cấu trúc bánh (cake) chắc, xốp và đẹp; là một trong các tá dược dùng nhiều nhất cho thuốc tiêm đông khô; dùng ổn định chế phẩm globulin miễn dịch tĩnh mạch không đường.", "1, tr.419"], ["Được nghiên cứu làm chất tăng tốc độ rã trong dạng rã nhanh nhờ hòa tan nhanh trong nước.", "1, tr.419"]], "fe": [["Often used as a freeze-dried copper excipient in protein preparations thanks to creating a strong, spongy and beautiful cake structure; is one of the most used excipients for freeze-dried injections; Stable use of unsweetened intravenous immune globulin preparations.", "1, tr.419"], ["Researched as a disintegration accelerator in rapid disintegration form thanks to its quick solubility in water.", "1, tr.419"]], "t": [["Có thể phản ứng Maillard với amino acid gây ố vàng/nâu; đường khử tương tác với amin bậc hai tạo imin (nhưng không kèm đổi màu).", "1, tr.419"]], "te": [["Maillard reaction with amino acids can cause yellow/brown stains; The reducing sugar interacts with the secondary amine to form imine (but without any color change).", "1, tr.419"]], "d": [["Bột kết tinh màu trắng, không mùi, vị ngọt.", "1, tr.419"], ["Tan 1 trong 4 phần nước; rất ít tan hoặc thực tế không tan trong ethanol 95% và ether.", "1, tr.419"]], "de": [["White crystalline powder, odorless, sweet taste.", "1, tr.419"], ["Dissolve 1 in 4 parts water; Very slightly soluble or practically insoluble in 95% ethanol and ether.", "1, tr.419"]], "a": "glycine glycin aminoacetic acid 56-40-6 Glycine -Aminoacetic acid E640 G Gly glycinium glycinum glycoamin glycocoll glycoIl glycolixir Hampshire glycine padil sucre de gelatine"}, {"id": "glycofurol", "n": "Glycofurol", "nv": "Glycofurol", "g": ["Chất tăng thấm", "Dung môi"], "ge": ["Permeation enhancer", "Solvent"], "cas": "31692-85-0", "f": [["Dùng làm dung môi trong thuốc tiêm tĩnh mạch hoặc tiêm bắp ở nồng độ tới 50% tt/tt; nghiên cứu làm chất tăng thấm và dung môi cho chế phẩm dùng ngoài và nhỏ mũi; làm dung môi không độc trong hệ tự vi nhũ hóa.", "1, tr.421"]], "fe": [["Used as a solvent in intravenous or intramuscular injections at concentrations up to 50% w/w; Research as a permeability enhancer and solvent for topical and nasal preparations; as a non-toxic solvent in the self-microemulsification system.", "1, tr.421"]], "t": [["Tương kỵ với chất oxy hóa.", "1, tr.421"]], "te": [["Incompatible with oxidizing agents.", "1, tr.421"]], "d": [["Chất lỏng trong, không màu, gần như không mùi, vị đắng; gây cảm giác ấm trên lưỡi.", "1, tr.421"], ["Trộn lẫn với ethanol 95%, glycerin, PEG 400, propan-2-ol, propylen glycol và nước; không trộn lẫn với dầu arachis và ether dầu hỏa.", "1, tr.421"]], "de": [["Clear, colorless, almost odorless liquid, bitter taste; causes a warm feeling on the tongue.", "1, tr.421"], ["Mix with 95% ethanol, glycerin, PEG 400, propan-2-ol, propylene glycol and water; Do not mix with arachis oil and petroleum ether.", "1, tr.421"]], "a": "glycofurol tetraglycol tetrahydrofurfuryl alcohol polyethylene glycol ether 9004-76-6"}, {"id": "glycyrrhizin", "n": "Glycyrrhizin", "nv": "Glycyrrhizin", "g": ["Chất tạo hương", "Chất tạo ngọt", "Chất che vị"], "ge": ["Flavoring agent", "Sweetening agent", "Taste-masking agent"], "cas": "1405-86-3", "f": [["Là saponin triterpenoid tự nhiên dùng làm chất tạo ngọt và che vị trong chế phẩm uống, ngọt gấp ~50 lần sucrose; tạo gel bền dùng cho thuốc dùng ngoài; nhờ tính diện hoạt của saponin còn được nghiên cứu làm chất tăng thấm.", "1, tr.423"]], "fe": [["A natural triterpenoid saponin used as a sweetener and masker in oral preparations, ~50 times sweeter than sucrose; create durable gels for external use; Thanks to the surface activity of saponin, it is also studied as a permeability enhancer.", "1, tr.423"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.423"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.423"]], "d": [["Bột kết tinh màu trắng hút ẩm hoặc tinh thể, vị ngọt đậm.", "1, tr.423"], ["Dễ tan trong nước nóng và alcol; tan trong dimethyl sulfoxid; thực tế không tan trong ether.", "1, tr.423"]], "de": [["White hygroscopic powder or crystals, strong sweet taste.", "1, tr.423"], ["Easily soluble in hot water and alcohol; soluble in dimethyl sulfoxide; practically insoluble in ether.", "1, tr.423"]], "a": "glycyrrhizin glycyrrhizic acid 1405-86-3 GA glycyrrhizinic acid glycyrrhetinic acid glycoside. 9"}, {"id": "guar-gum", "n": "Guar Gum", "nv": "Guar Galactomannan; Guar Gum", "g": ["Vật liệu kết dính sinh học", "Tá dược phóng thích biến đổi", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Tá dược rã (viên nén/nang)", "Thành phần hệ trị liệu qua da", "Chất làm tăng độ nhớt"], "ge": ["Bioadhesive material", "Modified-release agent", "Suspending agent", "Tablet / capsule binder", "Tablet / capsule disintegrant", "Transdermal delivery component", "Viscosity-increasing agent"], "cas": "9000-30-0", "f": [["Dùng trong dạng rắn làm tá dược dính và rã; trong chế phẩm uống và dùng ngoài làm chất gây treo, làm đặc và ổn định; cũng làm chất mang giải phóng kiểm soát và dùng trong miếng dán qua da; nghiên cứu cho đưa thuốc đến đại tràng và viên cốt giải phóng kéo dài.", "1, tr.425"]], "fe": [["Used in solid form as a binding and disintegrating excipient; in oral and topical preparations as a suspending, thickening and stabilizing agent; also as a controlled release carrier and used in transdermal patches; Research on colonic drug delivery and extended-release capsules.", "1, tr.425"]], "t": [["Tương hợp với đa số keo thực vật khác (như tragacanth); tương kỵ với aceton, ethanol 95%, tannin, acid mạnh và kiềm; ion borat ngăn hydrat hóa; thêm borat vào guar đã hydrat tạo gel cấu trúc.", "1, tr.425"]], "te": [["Compatible with most other plant glues (such as tragacanth); Incompatible with acetone, 95% ethanol, tannins, strong acids and alkalis; Borate ions prevent hydration; Adding borate to hydrated guar creates a gel structure.", "1, tr.425"]], "d": [["Là galactomannan từ nội nhũ hạt Cyamopsis tetragonolobus; polysaccharid keo phân tử lượng cao.", "1, tr.425"], ["Thực tế không tan trong dung môi hữu cơ; trong nước lạnh hoặc nóng phân tán và trương gần như tức thì tạo sol nhớt thixotropic; hydrat tối ưu ở pH 7,5–9,0.", "1, tr.425"]], "de": [["Is galactomannan from Cyamopsis tetragonolobus seed endosperm; high molecular weight colloidal polysaccharide.", "1, tr.425"], ["Practically insoluble in organic solvents; In cold or hot water, it disperses and swells almost instantly to create a thixotropic viscous sol; Optimal hydration at pH 7.5–9.0.", "1, tr.425"]], "a": "guar gum gom guar guaran 9000-30-0 E412 Guar Galactomannan Cyamopsis tetranoloba gum Galactosol guar guar flour guar galactomannanum gum guar jaguar gum Meyprogat Meyprodor Meyprofin Guar Gum"}, {"id": "hectorite", "n": "Hectorite", "nv": "Hectorit", "g": ["Chất hấp phụ", "Chất nhũ hóa", "Chất làm tăng độ nhớt"], "ge": ["Adsorbent", "Emulsifying agent", "Viscosity-increasing agent"], "cas": "12173-47-6", "f": [["Dùng rộng rãi làm chất hấp phụ, nhũ hóa, ổn định, gây treo, làm đặc và kiểm soát độ nhớt; là thành phần của các đất sét tự nhiên khác nên có thể dùng trong các công thức tương tự.", "1, tr.428"]], "fe": [["Widely used as an adsorbent, emulsifier, stabilizer, suspending agent, thickener and viscosity control agent; is a component of other natural clays so it can be used in similar recipes.", "1, tr.428"]], "t": [["Tiếp xúc giữa hectorit và acid hydrofluoric có thể sinh nhiệt.", "1, tr.428"]], "te": [["Contact between hectorite and hydrofluoric acid can generate heat.", "1, tr.428"]], "d": [["Là khoáng sét (smectit); được dùng làm chất hấp phụ và điều chỉnh độ nhớt trong chế phẩm dược.", "1, tr.428"]], "de": [["It is a clay mineral (smectite); Used as an adsorbent and viscosity regulator in pharmaceutical preparations.", "1, tr.428"]], "a": "hectorite hectorit 12173-47-6 Accofloc HCX Astratone 40 Bentone CT Bentone HC CoagHloici DP I-AW EA 3300 Flnorobectorite Gbassonlite Hectabrite 200 Hectabrite AW Hectabrite DP Hectabrite LT Hector clay Hectorit Laponite Macaloid optigel SH Kbeo-VIS clay SHCaỊ. Strese & Hofmann's Hectorite Sumecton HE SWN 2739 manufacturer: American Colloid Co lot no.: 58905 NFT 288"}, {"id": "heptafluoropropane-hfc", "n": "Heptafluoropropane (HFC)", "nv": "Heptafluoropropan (HFA-227)", "g": ["Chất đẩy aerosol"], "ge": ["Aerosol propellant"], "cas": "431-89-0", "f": [["Là khí đẩy hydrofluorocarbon (HFC), không chứa clor nên không phá hủy tầng ozon và không gây nóng lên toàn cầu; là chất thay thế CFC trong bình xịt định liều (MDI).", "1, tr.431"]], "fe": [["As a hydrofluorocarbon (HFC) propellant, it does not contain chlorine so it does not destroy the ozone layer and does not cause global warming; is a CFC replacement in metered dose inhalers (MDIs).", "1, tr.431"]], "t": [["Tương kỵ với kim loại kiềm, kiềm thổ và nhôm/kẽm dạng bột.", "1, tr.431"]], "te": [["Incompatible with alkali metals, alkaline earth metals and powdered aluminum/zinc.", "1, tr.431"]], "d": [["Khí hóa lỏng; lỏng gần như không mùi, không màu; khí nồng độ cao có mùi ether nhẹ; không ăn mòn, không kích ứng.", "1, tr.431"], ["Tan 1 trong 1725 phần nước ở 20 °C.", "1, tr.431"]], "de": [["Liquefied petroleum gas; Almost odorless, colorless liquid; High concentration gas has a slight ether odor; Non-corrosive, non-irritating.", "1, tr.431"], ["Dissolves 1 in 1725 parts of water at 20 °C.", "1, tr.431"]], "a": "heptafluoropropane hfa-227 hfc-227 p-227 apaflurane 431-89-0 Apaflurane Dymel 227 ea/P', HFA227 HFC227 2-hydroperfluoropropane P-227 propellant 227 R-227 Solkane 227\\ Zephex 227 ea"}, {"id": "hexane", "n": "Hexane", "nv": "Hexan (n-hexan)", "g": ["Dung môi"], "ge": ["Solvent"], "cas": "110-54-3", "f": [["Dùng làm dung môi trong sản xuất hoạt chất (vd. chiết artemisinin từ dược liệu) và viên nén uống; nghiên cứu cho chế phẩm qua da và trong tiểu phân nano/vi cầu cho giải phóng kiểm soát.", "1, tr.433"]], "fe": [["Used as a solvent in the production of active ingredients (eg, extracting artemisinin from medicinal herbs) and oral tablets; studied for transdermal and nanoparticle/microsphere formulations for controlled release.", "1, tr.433"]], "t": [["Tương kỵ với chất oxy hóa mạnh; ăn mòn một số chất dẻo, cao su và lớp phủ.", "1, tr.433"]], "te": [["Incompatible with strong oxidizing agents; Corrosive to some plastics, rubber and coatings.", "1, tr.433"]], "d": [["Chất lỏng không màu, dễ cháy, dễ bay hơi, mùi dầu hỏa nhẹ.", "1, tr.433"], ["Không tan trong nước; trộn lẫn với aceton, alcol, cloroform và ether.", "1, tr.433"]], "de": [["Colorless liquid, flammable, volatile, mild kerosene odor.", "1, tr.433"], ["Insoluble in water; Miscible with acetone, alcohol, chloroform and ether.", "1, tr.433"]], "a": "hexane hexan n-hexane 110-54-3 fl-Caproylhydride dipropyl Gettysolve-B Â7-hexane hexyl hydride normal hexane Skellysolve B"}, {"id": "hexetidine", "n": "Hexetidine", "nv": "Hexetidine", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "", "f": [["Dùng làm chất bảo quản kháng khuẩn trong mỹ phẩm và chế phẩm không tiêm.", "1, tr.435"]], "fe": [["Used as an antibacterial preservative in cosmetics and non-injectable products.", "1, tr.435"]], "t": [["Tương kỵ với chất oxy hóa mạnh; tạo muối với acid vô cơ và hữu cơ; acid mạnh mở vòng hexahydropyrimidin giải phóng formaldehyd.", "1, tr.435"]], "te": [["Incompatible with strong oxidizing agents; create salt with inorganic and organic acids; Strong acid opens the hexahydropyrimidine ring to release formaldehyde.", "1, tr.435"]], "d": [["Chất lỏng dạng dầu không màu hoặc vàng nhạt, mùi amin đặc trưng.", "1, tr.435"], ["Tan trong aceton, benzen, cloroform, ethanol 95%, hexan, methanol, acid vô cơ và propylen glycol; rất ít tan trong nước.", "1, tr.435"]], "de": [["Colorless or light yellow oily liquid, characteristic amine odor.", "1, tr.435"], ["Soluble in acetone, benzene, chloroform, 95% ethanol, hexane, methanol, inorganic acids and propylene glycol; very little soluble in water.", "1, tr.435"]], "a": "hexetidine hexetidin 141-94-6 Hexetidine 5amino-l,3-di(P-ethylhexyl)hexahydro-5-methylpyrimidine Glypesin hexetidinum Hexigel Hexocil Hexoral Hextril Oraldene Sterisil"}, {"id": "histidine", "n": "Histidine", "nv": "Histidine", "g": ["Chất chống oxy hóa", "Chất đệm"], "ge": ["Antioxidant", "Buffering agent"], "cas": "71-00-1", "f": [["Dùng làm chất đệm cho chế phẩm kháng thể và làm chất chống oxy hóa (dọn gốc hydroxyl trong dung dịch).", "1, tr.437"]], "fe": [["Used as a buffer for antibody preparations and as an antioxidant (scavenges hydroxyl radicals in solution).", "1, tr.437"]], "t": [["Tương kỵ với chất oxy hóa.", "1, tr.437"]], "te": [["Incompatible with oxidizing agents.", "1, tr.437"]], "d": [["Bột kết tinh hoặc tinh thể không màu, màu trắng/gần trắng.", "1, tr.437"], ["Dễ tan trong acid formic; tan trong nước; rất ít tan trong alcol; không tan trong ether.", "1, tr.437"]], "de": [["Colorless, white/almost white crystalline powder or crystals.", "1, tr.437"], ["Easily soluble in formic acid; soluble in water; very slightly soluble in alcohol; insoluble in ether.", "1, tr.437"]], "a": "histidine histidin l-histidine 71-00-1 Histidine L-Histidine;-Histidine\",4 > AịiPure 2-amino-3(4-imidasyl)propionic acid (S)-a-amino-lHimidazole-4-propanoic acid L-alpha-amino-4-imidazolepropionic acid ct-amino-4(or 5)-imidazolepropionic acid L-alpha-amino-5imidazolepropionic acid glyoxaline-5-alanine H His"}, {"id": "hydrocarbons-hc", "n": "Hydrocarbons (HC)", "nv": "Butane; Isobutane; Propane", "g": ["Chất đẩy aerosol"], "ge": ["Aerosol propellant"], "cas": "106-97-8, 75-28-5, 74-98-6", "f": [["Propan, butan và isobutan dùng làm khí đẩy aerosol, đơn độc, phối hợp với nhau hoặc phối hợp với khí đẩy hydrofluoroalkan.", "1, tr.439"]], "fe": [["Propane, butane and isobutane are used as aerosol propellants, alone, in combination with each other or in combination with hydrofluoroalkane propellants.", "1, tr.439"]], "t": [["Ngoài việc không trộn lẫn với nước, các hydrocarbon này không có tương kỵ thực tế với thành phần thường dùng trong aerosol dược phẩm; trộn lẫn với chất không phân cực và một số chất bán phân cực (như ethanol).", "1, tr.439"]], "te": [["In addition to being immiscible with water, these hydrocarbons have no practical incompatibility with ingredients commonly used in pharmaceutical aerosols; miscible with nonpolar substances and some semipolar substances (such as ethanol).", "1, tr.439"]], "d": [["Khí hóa lỏng (propan, butan, isobutan); lỏng trong, không màu, không mùi hoặc mùi ether nhẹ.", "1, tr.439"]], "de": [["Liquefied petroleum gas (propane, butane, isobutane); Clear liquid, colorless, odorless or with a slight ether odor.", "1, tr.439"]], "a": "hydrocarbons hydrocarbon propellant propane butane isobutane 74-98-6 Butane Isobutane Propane (a) A-17 Aeropres 17 H-butane E943a (b) A-31 Aeropres 31 E943b 2-methylpropane (c) A-108 Aeropres 108 dimethylmethane E944 propyl hydride"}, {"id": "hydrochloric-acid", "n": "Hydrochloric Acid", "nv": "Hydrochloric Acid; Hydrochloric Acid, Concentrated", "g": ["Chất acid hóa"], "ge": ["Acidifying agent"], "cas": "7647-01-0", "f": [["Dùng rộng rãi làm chất acid hóa trong nhiều chế phẩm dược và thực phẩm; cũng dùng để pha acid hydrocloric loãng.", "1, tr.441"]], "fe": [["Widely used as an acidifying agent in many pharmaceutical and food preparations; Also used to mix dilute hydrochloric acid.", "1, tr.441"]], "t": [["Phản ứng mãnh liệt với kiềm (tỏa nhiều nhiệt); phản ứng với nhiều kim loại giải phóng hydro.", "1, tr.441"]], "te": [["Reacts violently with alkalis (exudes a lot of heat); Reacts with many metals to release hydrogen.", "1, tr.441"]], "d": [["Dung dịch nước của hydro clorid, trong, không màu, bốc khói, mùi hăng; nồng độ 35,0–39,0% kl/kl HCl (dược điển).", "1, tr.441"], ["Trộn lẫn với nước; tan trong diethyl ether, ethanol 95% và methanol.", "1, tr.441"]], "de": [["Aqueous solution of hydrogen chloride, clear, colorless, fuming, pungent odor; concentration 35.0–39.0% w/kl HCl (pharmacopoeia).", "1, tr.441"], ["Mix with water; Soluble in diethyl ether, 95% ethanol and methanol.", "1, tr.441"]], "a": "hydrochloric acid acid hydrocloric hcl muriatic acid 7647-01-0 Hydrochloric Acid Acidum hydrochloridum concentratum chlorohydric acid concen trated hydrochloric acid E507 Hydrochloric Acid, Concentrated"}, {"id": "hydrogen-peroxide", "n": "Hydrogen Peroxide", "nv": "Hydrogen Peroxide Concentrate; Hydrogen Peroxide Topical Solution", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "7722-84-1", "f": [["Là chất oxy hóa, dùng làm chất sát khuẩn; có trong chế phẩm kháng acid dạng lỏng, viên bao phim, chế phẩm kháng nấm và trị mụn không kê đơn; dùng sát khuẩn dung dịch ngâm kính áp tròng và làm chất tạo bọt trong sản phẩm răng miệng. Nồng độ thường 3%, 6%, 27% hoặc 30%.", "1, tr.442"]], "fe": [["As an oxidizing agent, used as an antiseptic; found in liquid antacids, film-coated tablets, over-the-counter antifungal and acne preparations; Used to disinfect contact lens solution and as a foaming agent in oral products. Concentrations are typically 3%, 6%, 27% or 30%.", "1, tr.442"]], "t": [["Là chất oxy hóa mạnh; phân hủy tỏa nhiệt (mạnh hơn ở nồng độ cao) khi tiếp xúc chất dễ bị oxy hóa gồm chất hữu cơ, một số kim loại, muối kim loại, kiềm, iodid, permanganat.", "1, tr.442"]], "te": [["Is a strong oxidizer; Exothermic decomposition (stronger at high concentrations) when exposed to easily oxidized substances including organic substances, some metals, metal salts, alkalis, iodide, permanganate.", "1, tr.442"]], "d": [["Chất lỏng trong, không màu.", "1, tr.442"], ["Trộn lẫn với nước; tan trong ether và ethanol; không tan trong ether dầu hỏa.", "1, tr.442"]], "de": [["Clear, colorless liquid.", "1, tr.442"], ["Mix with water; soluble in ether and ethanol; Insoluble in petroleum ether.", "1, tr.442"]], "a": "hydrogen peroxide hydrogen peroxid oxy gia h2o2 7722-84-1 Hydrogen Peroxide Solution (3 per cent) Hydrogen Peroxide Concentrate 2 Hydrogen dioxide hydrogenii peroxidum hydroperoxide perhydrol Hydrogen Peroxide Topical Solution"}, {"id": "hydrophobic-colloidal-silica", "n": "Hydrophobic Colloidal Silica", "nv": "Hydrophobic Colloidal Anhydrous Silica; Silica, Hydrophobic Colloidal; Hydrophobic Colloidal Silica", "g": ["Chất chống vón", "Chất ổn định nhũ tương", "Chất điều hòa sự chảy", "Chất gây treo", "Chất làm tăng độ nhớt"], "ge": ["Anticaking agent", "Emulsion stabilizer", "Glidant", "Suspending agent", "Viscosity-increasing agent"], "cas": "", "f": [["Có tiểu phân sơ cấp cỡ nano và diện tích bề mặt lớn, cải thiện lưu tính bột khô khi dập viên và đóng nang; grade kỵ nước hút ẩm ít hơn nên có lợi cho công thức nhạy ẩm.", "1, tr.444"], ["Cũng dùng kiểm soát độ nhớt thixotropic, làm đặc và ổn định nhũ tương, hoặc gây treo trong gel và chế phẩm bán rắn.", "1, tr.444"]], "fe": [["Has nano-sized primary particles and large surface area, improving dry powder fluidity when tableting and encapsulating; Hydrophobic grade absorbs less moisture, which is beneficial for moisture-sensitive formulas.", "1, tr.444"], ["Also used to control thixotropic viscosity, thicken and stabilize emulsions, or cause suspension in gels and semi-solid preparations.", "1, tr.444"]], "t": [["Dùng silica keo kỵ nước làm giảm độ bền của viên nén nền tinh bột.", "1, tr.444"]], "te": [["Using hydrophobic colloidal silica reduces the durability of starch-based tablets.", "1, tr.444"]], "d": [["Bột vô định hình nhẹ, mịn, màu trắng/gần trắng, không thấm nước.", "1, tr.444"], ["Thực tế không tan trong dung môi hữu cơ và acid (trừ HF); tan trong dung dịch hydroxyd kiềm nóng.", "1, tr.444"]], "de": [["Light, fine, white/almost white, water-repellent amorphous powder.", "1, tr.444"], ["Practically insoluble in organic solvents and acids (except HF); Soluble in hot alkaline hydroxide solution.", "1, tr.444"]], "a": "hydrophobic colloidal silica silica keo ky nuoc aerosil r972 68611-44-9 Hydrophobic Colloidal Anhydrous Silica Silica, Hydrophobic Colloidal Hydrophobic Colloidal Silica Aerosil R972 HDK silica dimethyl silylate silica hydrophobica colloidalis silicic acid, silylated silicon dioxide, silanated"}, {"id": "hydroxyethyl-cellulose", "n": "Hydroxyethyl Cellulose", "nv": "Hydroxyethylcellulose", "g": ["Chất tạo màng bao", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Coating agent", "Suspending agent", "Tablet / capsule binder", "Viscosity-increasing agent"], "cas": "9004-62-0", "f": [["Polymer không ion tan trong nước; chủ yếu làm chất làm đặc trong chế phẩm nhỏ mắt và dùng ngoài; cũng làm tá dược dính và tạo màng bao cho viên nén, viên nang, và trong dung dịch/hỗn dịch uống.", "1, tr.446"]], "fe": [["Water-soluble non-ionic polymer; Mainly used as a thickener in eye drops and topical preparations; also as adhesive and coating excipient for tablets, capsules, and in oral solutions/suspensions.", "1, tr.446"]], "t": [["Tương kỵ với zein; tương hợp một phần với casein, gelatin, methylcellulose, polyvinyl alcol và tinh bột; natri pentaclorophenat làm tăng độ nhớt tức thì khi thêm vào dung dịch HEC.", "1, tr.446"]], "te": [["Incompatible with zein; Partially compatible with casein, gelatin, methylcellulose, polyvinyl alcohol and starch; Sodium pentachlorophenate causes an immediate increase in viscosity when added to HEC solutions.", "1, tr.446"]], "d": [["Bột hút ẩm màu trắng/vàng trắng/xám trắng, không mùi, không vị.", "1, tr.446"], ["Là polymer không ion, tan trong cả nước nóng và lạnh tạo dung dịch trong, mượt; thực tế không tan trong aceton, ethanol 95%, ether, toluen.", "1, tr.446"]], "de": [["White/white yellow/white gray hygroscopic powder, odorless, tasteless.", "1, tr.446"], ["It is a non-ionic polymer, soluble in both hot and cold water, creating a clear, smooth solution; Practically insoluble in acetone, 95% ethanol, ether, and toluene.", "1, tr.446"]], "a": "hydroxyethyl cellulose hec natrosol 9004-62-0 Hydroxyethylcellulose Hydroxyethyl Cellulose Cellosize HEC cellulose hydroxyethyl ether cellulose 2-hydroxyethyl ether cellulose hydroxyethylate ethylhydroxy cellulose ethylose HEC HE cellulose hetastarch 2-hydroxyethyI cellulose ether hydroxyethylcellulosum hydroxyethyl ether cellulose hyetellose Natrosol oxycellulose Tylose H Tylose PH A"}, {"id": "hydroxyethyl-beta-cyclodextrin", "n": "Hydroxyethyl-β-cyclodextrin", "nv": "Hydroxyethyl-β-cyclodextrin", "g": ["Chất tạo phức", "Tá dược phóng thích biến đổi", "Chất vi nang hóa", "Chất làm tăng độ tan", "Chất điều chỉnh đẳng trương"], "ge": ["Chelating / Complexing agent", "Modified-release agent", "Microencapsulating agent", "Solubilizing agent", "Tonicity agent"], "cas": "128446-32-2", "f": [["Dùng cải thiện hòa tan, độ tan, sinh khả dụng và độ ổn định của thuốc kém tan qua tạo phức bao trong chế phẩm uống, dùng ngoài và nhỏ mắt; tan trong nước tốt hơn β-cyclodextrin không thế.", "1, tr.450"]], "fe": [["Used to improve solubility, solubility, bioavailability and stability of poorly soluble drugs through complexing in oral, topical and ophthalmic preparations; Soluble in water better than unsubstituted β-cyclodextrin.", "1, tr.450"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.450"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.450"]], "d": [["Dẫn chất hydroxyalkyl β-cyclodextrin không ion; bột kết tinh màu trắng.", "1, tr.450"], ["Tan trên 1 trong 2 phần nước ở 25 °C.", "1, tr.450"]], "de": [["Non-ionic hydroxyalkyl β-cyclodextrin derivative; white crystalline powder.", "1, tr.450"], ["Dissolve in 1 in 2 parts of water at 25 °C.", "1, tr.450"]], "a": "hydroxyethyl-beta-cyclodextrin hydroxyethyl-p-cyclodextrin he-beta-cd 128446-32-2 -HE-p-CD HE-P-CD HEBCD 2-hydroxyethyl-p-cyclodextrin (2-hydroxyethyl)-P-cyclodextrin hydroxyethyl-SS-cyclodextrin"}, {"id": "hydroxyethylmethyl-cellulose", "n": "Hydroxyethylmethyl Cellulose", "nv": "Hydroxyethylmethylcellulose; Methylhydroxyethylcellulose; Hymetellose", "g": ["Chất tạo màng bao", "Chất ổn định nhũ tương", "Tá dược phóng thích biến đổi", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Coating agent", "Emulsion stabilizer", "Modified-release agent", "Suspending agent", "Tablet / capsule binder", "Viscosity-increasing agent"], "cas": "9032-42-2", "f": [["Polymer không ion dùng trong nhiều chế phẩm: viên nén và hỗn dịch uống, nhũ tương và gel dùng ngoài; làm chất ổn định và làm đặc, chất tạo màng bao viên và chất tạo cốt cho viên giải phóng kéo dài.", "1, tr.451"]], "fe": [["Nonionic polymers are used in many preparations: tablets and oral suspensions, emulsions and gels for external use; as a stabilizer and thickener, tablet coating agent and emulsifying agent for extended-release tablets.", "1, tr.451"]], "t": [["Tương kỵ với chất oxy hóa như acid mạnh và base mạnh.", "1, tr.451"]], "te": [["Incompatible with oxidizing agents such as strong acids and strong bases.", "1, tr.451"]], "d": [["Bột hoặc hạt màu trắng/vàng trắng/xám trắng, không mùi, hút ẩm sau khi sấy.", "1, tr.451"], ["Thực tế không tan trong nước nóng (>60 °C), aceton, ethanol 95%, ether, toluen; tan trong nước lạnh tạo dung dịch keo; tan trong nước và chịu điện giải tốt hơn methylcellulose.", "1, tr.451"]], "de": [["White/white yellow/white gray powder or granules, odorless, hygroscopic after drying.", "1, tr.451"], ["Practically insoluble in hot water (>60 °C), acetone, 95% ethanol, ether, toluene; Soluble in cold water to form colloidal solution; Soluble in water and more resistant to electrolytes than methylcellulose.", "1, tr.451"]], "a": "hydroxyethylmethyl cellulose hemc 9032-42-2 Hydroxyethylmethylcellulose Methylhydroxyethylcellulose Hymetellose Cellulose, 2-hydroxyethyl methyl ester criminal MHEC HEMC hydroxyethyl methylcellulose methyl 2-hydroxyethyl cellulose methylhydroxyethylcellulosum MHEC Tylopur MH Tylopur MHB Tylose MB Tylose MH"}, {"id": "hepes", "n": "Hydroxyethylpiperazine Ethane Sulfonic Acid", "nv": "HEPES", "g": ["Chất đệm"], "ge": ["Buffering agent"], "cas": "7365-45-9", "f": [["Dùng làm chất đệm trong thuốc tiêm.", "1, tr.453"]], "fe": [["Used as a buffer in injectable drugs.", "1, tr.453"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.453"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.453"]], "d": [["Bột kết tinh màu trắng, không mùi.", "1, tr.453"], ["Tan trong nước (dung dịch bão hòa 2,25 M ở 0 °C).", "1, tr.453"]], "de": [["White, odorless crystalline powder.", "1, tr.453"], ["Soluble in water (2.25 M saturated solution at 0 °C).", "1, tr.453"]], "a": "hepes hydroxyethylpiperazine ethane sulfonic acid 7365-45-9 HEPES 4-(2-hydroxyethyl)-l-piperazineethanesulfonic acid N-(2hydroxyethyl)piperazine-N'-2-ethanesulfonic acid"}, {"id": "hydroxypropyl-betadex", "n": "Hydroxypropyl Betadex", "nv": "Hydroxypropylbetadex", "g": ["Chất tạo phức", "Tá dược phóng thích biến đổi", "Chất tăng thấm", "Chất làm tăng độ tan", "Chất điều chỉnh đẳng trương"], "ge": ["Chelating / Complexing agent", "Modified-release agent", "Permeation enhancer", "Solubilizing agent", "Tonicity agent"], "cas": "94035-02-6, 128446-35-5", "f": [["Được dùng rộng rãi làm chất tăng độ tan cho phân tử kỵ nước trong chế phẩm lỏng uống, rắn uống, tiêm, bình xịt định liều, bột hít, dùng ngoài và nhỏ mắt; cũng nghiên cứu làm chất tăng thấm (uống, qua da, mũi) và chất ổn định trong sản xuất/bảo quản.", "1, tr.454"]], "fe": [["Widely used as a solubility enhancer for hydrophobic molecules in oral liquid preparations, oral solids, injections, metered dose inhalers, inhalation powders, topical and ophthalmic applications; Also researched as a permeability enhancer (oral, transdermal, nasal) and stabilizer in production/preservation.", "1, tr.454"]], "t": [["Tương kỵ với chất oxy hóa mạnh; có thể làm giảm hoạt tính một số chất bảo quản kháng khuẩn trong dung dịch nước.", "1, tr.454"]], "te": [["Incompatible with strong oxidizing agents; May reduce the activity of some antibacterial preservatives in aqueous solutions.", "1, tr.454"]], "d": [["Bột vô định hình hoặc kết tinh màu trắng/gần trắng.", "1, tr.454"], ["Dễ tan trong nước và propylen glycol; tan trong ethanol, methanol, DMSO và dimethylformamid.", "1, tr.454"]], "de": [["White/almost white amorphous or crystalline powder.", "1, tr.454"], ["Easily soluble in water and propylene glycol; Soluble in ethanol, methanol, DMSO and dimethylformamide.", "1, tr.454"]], "a": "hydroxypropyl betadex hpbcd hydroxypropyl beta cyclodextrin kleptose cavasol 128446-35-5 Hydroxypropylbetadex Hydroxypropyl Betadex Cavasol W7 HP Pharma 2-hydroxypropyl-P-cyclodextrin 2hydroxypropyl cyclomaltoheptaose hidroksipropilbetadeksas hydoxipropylbetadex hydroksipropylbetadeksi hydroxypropylbetadeksum hydroxypropylbetadexum Kleptose HPB"}, {"id": "hydroxypropyl-cellulose", "n": "Hydroxypropyl Cellulose", "nv": "Hydroxypropylcellulose", "g": ["Chất tạo màng bao", "Chất nhũ hóa", "Chất tạo màng", "Tá dược phóng thích biến đổi", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Coating agent", "Emulsifying agent", "Film-forming agent", "Modified-release agent", "Suspending agent", "Tablet / capsule binder", "Viscosity-increasing agent"], "cas": "9004-64-2", "f": [["Dùng rộng rãi trong chế phẩm uống và dùng ngoài; đường uống chủ yếu làm tá dược dính viên nén (2–6%), chất tạo màng bao (~5%) và chất tạo cốt giải phóng kéo dài (15–35%).", "1, tr.457"]], "fe": [["Widely used in oral and topical preparations; Oral administration mainly as tablet adhesive excipient (2–6%), coating agent (~5%), and sustained release sclerosing agent (15–35%).", "1, tr.457"]], "t": [["Trong dung dịch có phần tương kỵ với dẫn chất phenol thế (methylparaben, propylparaben); polymer anion có thể tăng độ nhớt dung dịch HPC; khả năng tương hợp với muối vô cơ thay đổi tùy muối và nồng độ.", "1, tr.457"]], "te": [["In solution, it is somewhat incompatible with substituted phenol derivatives (methylparaben, propylparaben); Anionic polymer can increase HPC solution viscosity; Compatibility with inorganic salts varies depending on salt and concentration.", "1, tr.457"]], "d": [["Bột màu trắng đến trắng ngà hoặc vàng nhạt, không mùi, không vị.", "1, tr.457"], ["Dễ tan trong nước dưới 38 °C tạo dung dịch keo trong; không tan trong nước nóng (tủa dạng bông ở 40–45 °C, thuận nghịch).", "1, tr.457"]], "de": [["White to ivory white or light yellow powder, odorless, tasteless.", "1, tr.457"], ["Easily soluble in water below 38 °C to create a clear colloidal solution; insoluble in hot water (flocculant precipitate at 40–45 °C, reversible).", "1, tr.457"]], "a": "hydroxypropyl cellulose hpc klucel 9004-64-2 E463 Hydroxypropylcellulose Hydroxypropyl Cellulose AeroWhip cellulose, hydroxypropyl ether Coatcel HPC hydroxypropylcellulosum hyprolose Klucel Nisso HPC oxypropylated cellulose"}, {"id": "l-hpc", "n": "Hydroxypropyl Cellulose, Low-substituted", "nv": "Low-Substituted Hydroxypropylcellulose; Hydroxypropylcellulose, Low-Substituted", "g": ["Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Tá dược rã (viên nén/nang)"], "ge": ["Tablet / capsule binder", "Tablet / capsule diluent", "Tablet / capsule disintegrant"], "cas": "9004-64-2", "f": [["Dùng rộng rãi trong dạng rắn uống, chủ yếu làm tá dược rã và tá dược dính cho viên nén, cốm trong xát hạt ướt hoặc khô; dùng bào chế viên rã nhanh bằng dập thẳng.", "1, tr.463"], ["Cũng dùng làm tá dược dính/rã trong bồi lớp bột lên nhân cầu và tạo pellet bằng đùn/vê; grade cỡ hạt nhỏ, hàm lượng hydroxypropyl cao cho pellet tròn và hòa tan nhanh.", "1, tr.463"]], "fe": [["Widely used in oral solid form, mainly as a disintegrant and adhesive excipient for tablets and granules in wet or dry granulation; Use to prepare quickly disintegrating tablets by straight stamping.", "1, tr.463"], ["Also used as a binding/disintegrating excipient in depositing powder layers onto spheres and creating pellets by extrusion/rolling; Grade small particle size, high hydroxypropyl content for pellets that are round and dissolve quickly.", "1, tr.463"]], "t": [["Tài liệu chưa đề cập.", "1, tr.463"]], "te": [["Documents not mentioned.", "1, tr.463"]], "d": [["Bột hoặc hạt hút ẩm màu trắng đến vàng trắng, không mùi hoặc mùi nhẹ đặc trưng, không vị.", "1, tr.463"], ["Thực tế không tan trong ethanol 95% và ether; không tan nhưng trương trong nước; tan trong dung dịch NaOH (1 trong 10) tạo dung dịch nhớt.", "1, tr.463"]], "de": [["White to yellow-white hygroscopic powder or granules, odorless or with a characteristic slight odor, tasteless.", "1, tr.463"], ["Practically insoluble in 95% ethanol and ether; insoluble but swells in water; Soluble in NaOH solution (1 in 10) to create a viscous solution.", "1, tr.463"]], "a": "low-substituted hydroxypropyl cellulose l-hpc hydroxypropyl cellulose the thap 9004-64-2 Low-Substituted Hydroxypropylcellulose Low Substituted Hydroxypropylcellulose Hydroxypropylcellulose, Low-Substituted Low-Substituted Hydroxypropyl Cellulose Cellulose, 2-hydroxypropyl ether 2-hydroxypropyl ether (lowsubstituted) cellulose hydroxypropylcellulosum substitutum humile hyprolose, low-substituted L-HPC low-substituted O-(2hydroxypropylated) cellulose oxypropylated cellulose"}, {"id": "hydroxypropyl-starch", "n": "Hydroxypropyl Starch", "nv": "Starch, Hydroxypropyl; Hydroxypropyl Corn Starch; Hydroxypropyl Potato Starch", "g": ["Chất nhũ hóa", "Tá dược rã (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Emulsifying agent", "Tablet / capsule disintegrant", "Viscosity-increasing agent"], "cas": "113894-92-1", "f": [["Là tinh bột biến tính; dùng phối hợp với carrageenan để sản xuất nang mềm; hỗn hợp hypromellose với tới 70% tinh bột hydroxypropyl dùng làm vật liệu nang cứng; cũng dùng nhiều trong mỹ phẩm.", "1, tr.466"]], "fe": [["It is modified starch; Used in combination with carrageenan to produce soft capsules; hypromellose mixture with up to 70% hydroxypropyl starch used as hard capsule material; Also used widely in cosmetics.", "1, tr.466"]], "t": [["Tài liệu chưa đề cập.", "1, tr.466"]], "te": [["Documents not mentioned.", "1, tr.466"]], "d": [["Bột thô trơn chảy màu trắng đến trắng ngà.", "1, tr.466"], ["Thực tế không tan trong nước, ethanol 95% và ether.", "1, tr.466"]], "de": [["White to ivory white smooth flowing powder.", "1, tr.466"], ["Practically insoluble in water, 95% ethanol and ether.", "1, tr.466"]], "a": "hydroxypropyl starch tinh bot hydroxypropyl 9049-76-7 Starch, Hydroxypropyl Hydroxypropyl Corn Starch Amylum hydroxypropylum E1440 Hydroxypropyl Pea Starch Hydroxypropyl Potato Starch"}, {"id": "hypromellose", "n": "Hypromellose", "nv": "Hypromellose", "g": ["Vật liệu vỏ nang", "Chất tạo màng bao", "Chất phân tán", "Chất nhũ hóa", "Chất tạo màng", "Tá dược phóng thích biến đổi", "Chất làm tăng độ tan", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Capsule shell material", "Coating agent", "Dispersing agent", "Emulsifying agent", "Film-forming agent", "Modified-release agent", "Solubilizing agent", "Suspending agent", "Tablet / capsule binder", "Viscosity-increasing agent"], "cas": "9004-65-3", "f": [["Dùng rộng rãi trong chế phẩm uống, nhỏ mắt và dùng ngoài: làm tá dược dính (2–5%), chất tạo màng bao phim, chất tạo cốt (matrix) cho viên giải phóng kéo dài, chất gây treo, làm đặc và ổn định nhũ tương; cũng làm vật liệu vỏ nang.", "1, tr.468"]], "fe": [["Widely used in oral, ophthalmic and topical preparations: as adhesive excipient (2–5%), film coating agent, matrix for extended-release tablets, suspending agent, thickener and emulsion stabilizer; also make capsule material.", "1, tr.468"]], "t": [["Tương kỵ với một số chất oxy hóa; do không ion nên không tạo phức với muối kim loại hoặc chất hữu cơ ion để tạo tủa.", "1, tr.468"]], "te": [["Incompatible with some oxidizing agents; Because it is non-ionic, it does not form complexes with metal salts or ionic organic substances to form precipitates.", "1, tr.468"]], "d": [["Bột sợi hoặc hạt màu trắng/trắng kem, không mùi, không vị, hút ẩm khi khô.", "1, tr.468"], ["Tan trong nước lạnh tạo dung dịch keo nhớt; thực tế không tan trong nước nóng, cloroform, ethanol 95%, ether và toluen; tan trong hỗn hợp ethanol–dicloromethan.", "1, tr.468"]], "de": [["White/creamy white fibrous powder or granules, odorless, tasteless, hygroscopic when dry.", "1, tr.468"], ["Soluble in cold water to create a viscous colloidal solution; practically insoluble in hot water, chloroform, 95% ethanol, ether and toluene; Soluble in ethanol–dichloromethane mixture.", "1, tr.468"]], "a": "hypromellose hpmc hydroxypropyl methylcellulose methocel 9004-65-3 E464 Hypromellose Benecel hypromellose BonuCel HPMC hypromellosum Mecellose Methocel Metolose MHPC Pharmacoat Rutocel"}, {"id": "hypromellose-acetate-succinate", "n": "Hypromellose Acetate Succinate", "nv": "Hypromellose Acetate Succinate", "g": ["Chất tạo màng bao", "Chất làm tăng độ tan", "Tá dược phóng thích biến đổi", "Chất tạo màng"], "ge": ["Coating agent", "Solubilizing agent", "Modified-release agent", "Film-forming agent"], "cas": "71138-97-1", "f": [["Dùng trong chế phẩm uống làm màng bao phim và màng bao tan ở ruột cho viên nén/cốm; là chất tăng độ tan qua phân tán rắn; không tan trong dịch vị nhưng trương và tan nhanh ở phần trên ruột non; bao nước thường dùng dạng bột mịn phân tán cùng triethyl citrat.", "1, tr.472"]], "fe": [["Used in oral preparations as film coating and enteric coating for tablets/granules; is a solubility enhancer through solid dispersion; insoluble in gastric juice but swells and dissolves quickly in the upper small intestine; Water bags are often used in fine powder form dispersed with triethyl citrate.", "1, tr.472"]], "t": [["Tương kỵ với acid hoặc base mạnh, chất oxy hóa và độ ẩm cao kéo dài; có thể tương tác với một số nhóm hoạt chất.", "1, tr.472"]], "te": [["Incompatible with strong acids or bases, oxidizing agents and prolonged high humidity; May interact with some active ingredient groups.", "1, tr.472"]], "d": [["Bột hoặc hạt màu trắng đến trắng ngà, mùi nhẹ như acid acetic, gần như không vị; có nhiều phân nhóm theo pH tan (L, M, H) và cỡ hạt (F, G).", "1, tr.472"], ["Thực tế không tan trong ethanol 95%, hexan, nước không đệm; tan trong aceton hoặc hỗn hợp ethanol–dicloromethan.", "1, tr.472"]], "de": [["White to off-white powder or granules, mild odor like acetic acid, almost tasteless; There are many subgroups according to solubility pH (L, M, H) and particle size (F, G).", "1, tr.472"], ["Practically insoluble in 95% ethanol, hexane, unbuffered water; Soluble in acetone or ethanol–dichloromethane mixture.", "1, tr.472"]], "a": "hypromellose acetate succinate hpmcas aqoat hydroxypropyl methylcellulose acetate succinate Hypromellose Acetate Succinate Aqoat Aqoat AS-HF/HG Aqoat AS-LF/LG Aqoat AS-MF/MG HPMCAS"}, {"id": "hypromellose-phthalate", "n": "Hypromellose Phthalate", "nv": "Hypromellose Phthalate", "g": ["Chất tạo màng bao"], "ge": ["Coating agent"], "cas": "9050-31-1", "f": [["Dùng làm màng bao tan ở ruột cho viên nén và cốm.", "1, tr.476"]], "fe": [["Used as enteric coating for tablets and granules.", "1, tr.476"]], "t": [["Tương kỵ với chất oxy hóa mạnh; đôi khi có hiện tượng nứt màng (nhất là với viên chứa MCC và carboxymethylcellulose calci, hoặc khi dùng dung môi aceton–propan-2-ol, hoặc bao trong điều kiện nhiệt độ và độ ẩm thấp).", "1, tr.476"]], "te": [["Incompatible with strong oxidizing agents; Sometimes there is a phenomenon of film cracking (especially with tablets containing MCC and carboxymethylcellulose calcium, or when using acetone–propan-2-ol solvent, or coating in low temperature and humidity conditions).", "1, tr.476"]], "d": [["Mảnh trơn chảy hoặc bột hạt màu trắng đến hơi trắng ngà, không mùi hoặc mùi acid nhẹ, gần như không vị.", "1, tr.476"], ["Dễ tan trong hỗn hợp aceton–alcol (1:1), methanol–dicloromethan (1:1) và trong kiềm nước; thực tế không tan trong nước và alcol khan.", "1, tr.476"]], "de": [["Smooth flakes or white to slightly off-white granular powder, odorless or slightly acidic, almost tasteless.", "1, tr.476"], ["Easily soluble in mixtures of acetone–alcohol (1:1), methanol–dichloromethane (1:1) and in alkaline water; Practically insoluble in water and anhydrous alcohol.", "1, tr.476"]], "a": "hypromellose phthalate hpmcp hydroxypropyl methylcellulose phthalate 9050-31-1 Hypromellose Phthalate"}, {"id": "imidurea", "n": "Imidurea", "nv": "Imidurea", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "39236-46-9", "f": [["Là chất bảo quản kháng khuẩn phổ rộng dùng trong mỹ phẩm và chế phẩm dùng ngoài ở nồng độ 0,03–0,5% kl/kl; hiệu quả ở pH 3–9, hiệp lực khi phối hợp với paraben.", "1, tr.481"]], "fe": [["Is a broad-spectrum antibacterial preservative used in cosmetics and topical preparations at concentrations of 0.03–0.5% w/kl; Effective at pH 3–9, synergistic when combined with paraben.", "1, tr.481"]], "t": [["Tương kỵ với chất oxy hóa mạnh; tương hợp với các chất bảo quản khác (acid sorbic, hợp chất amoni bậc bốn) và với protein, chất diện hoạt không ion, lecithin.", "1, tr.481"]], "te": [["Incompatible with strong oxidizing agents; Compatible with other preservatives (sorbic acid, quaternary ammonium compounds) and with proteins, nonionic surfactants, lecithin.", "1, tr.481"]], "d": [["Bột trơn chảy màu trắng, không mùi.", "1, tr.481"], ["Tan trong nước và glycerol; không tan trong hầu hết dung môi hữu cơ.", "1, tr.481"]], "de": [["White, odorless, slippery powder.", "1, tr.481"], ["Soluble in water and glycerol; Insoluble in most organic solvents.", "1, tr.481"]], "a": "imidurea imidure imidazolidinyl urea germall 115 39236-46-9 Biopure 100 Germall 115 Tri-Stat IU Imidurea"}, {"id": "inulin", "n": "Inulin", "nv": "Inulin", "g": ["Tá dược hỗ trợ đông khô", "Chất tạo ngọt", "Tá dược độn (viên nén/nang)"], "ge": ["Lyophilization bulking agent", "Sweetening agent", "Tablet / capsule diluent"], "cas": "9005-80-5", "f": [["Dùng làm tá dược độn-dính trong viên nén; ổn định protein trị liệu, vaccine trong đông khô; tăng hòa tan thuốc ưa lipid; làm chất ổn định khi phun sấy bột hít; trong thực phẩm dùng làm chất tạo ngọt và ổn định.", "1, tr.483"]], "fe": [["Used as a filler-sticking excipient in tablets; Stabilizing therapeutic proteins and vaccines in freeze-drying; increased solubility of lipophilic drugs; as a stabilizer when spray drying inhalation powder; In foods used as a sweetener and stabilizer.", "1, tr.483"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.483"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.483"]], "d": [["Bột vô định hình màu trắng, giòn, không mùi, vị trung tính đến hơi ngọt.", "1, tr.483"], ["Tan trong nước nóng, dung dịch acid và kiềm loãng; ít tan trong nước lạnh và dung môi hữu cơ.", "1, tr.483"]], "de": [["White, brittle, odorless amorphous powder, neutral to slightly sweet taste.", "1, tr.483"], ["Soluble in hot water, dilute acid and alkaline solutions; Slightly soluble in cold water and organic solvents.", "1, tr.483"]], "a": "inulin 9005-80-5 Inulin Alant starch alantin Beneo dahlin Frutafit\\ oligofructose Orafti-, polyfructose"}, {"id": "iron-oxides", "n": "Iron Oxides", "nv": "Ferric Oxide", "g": ["Chất tạo màu"], "ge": ["Coloring agent"], "cas": "1332-37-2, 1317-61-9, 1309-37-1", "f": [["Dùng rộng rãi làm chất tạo màu và chất hấp thụ UV trong mỹ phẩm, thực phẩm và dược phẩm; là chất tạo màu vô cơ nên ngày càng quan trọng khi phẩm màu hữu cơ tổng hợp bị hạn chế; tuy nhiên bị giới hạn về dải màu và có tính mài mòn.", "1, tr.485"]], "fe": [["Widely used as colorant and UV absorber in cosmetics, food and pharmaceuticals; It is an inorganic colorant, so it is increasingly important when synthetic organic colors are limited; However, it is limited in color range and is abrasive.", "1, tr.485"]], "t": [["Có thể làm nang gelatin cứng trở nên giòn ở nhiệt độ cao khi độ ẩm dư 11–12%, hạn chế lượng dùng để tạo màu vỏ nang.", "1, tr.485"]], "te": [["Hard gelatin capsules can become brittle at high temperatures when the excess moisture is 11–12%, limiting the amount used to color the capsule shell.", "1, tr.485"]], "d": [["Gồm oxyd sắt đỏ, vàng và đen (và phối hợp cho các sắc nâu); bột màu tương ứng.", "1, tr.485"], ["Tan trong acid vô cơ; không tan trong nước.", "1, tr.485"]], "de": [["Contains red, yellow and black iron oxide (and combinations for brown shades); corresponding color powder.", "1, tr.485"], ["Soluble in inorganic acids; insoluble in water.", "1, tr.485"]], "a": "iron oxides oxyd sat iron oxide red iron oxide yellow iron oxide black E172 1332-37-2 black magnetic oxide black oxide, precipitated black rouge CI 77499 El72 ethiops iron ferric ferrous oxide ferrosoferric oxide Ferroxide 78P Ferroxide 88P iron oxide iron (II, III) oxide iron oxides (Fe3O4) magnetite Mapico Black EC pigment black 11 Sicovit B80 Sicovit B84 Sicoưit B85 anhydrous iron (III) oxide Bayferrox 105M CI 77491 diiron trioxide Ferroxide 212P Ferroxide 226P hematite iron sesquioxide jeweler's rouge pigment red 101 red ferric oxide hydrated ferric oxide iron (III) oxide monohydrate, yellow pigment yellow 42 CI 77492 ferric hydroxide ferric hydroxide oxide ferric hydrate ferric oxide hydrated Ferroxide 505P Ferroxide 510P iron hydrate iron hydroxide iron hydroxide oxide Mapico Yellow EC Sicovit Y10 yellow ochre yellow iron oxide Ferric Oxide"}, {"id": "isomalt", "n": "Isomalt", "nv": "Isomalt", "g": ["Tá dược dập thẳng", "Chất gây treo", "Chất tạo ngọt", "Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)"], "ge": ["Direct compression vehicle", "Suspending agent", "Sweetening agent", "Tablet / capsule binder", "Tablet / capsule diluent"], "cas": "64519-82-0, 534-73-6", "f": [["Tá dược không gây sâu răng dùng trong viên nén/nang, màng bao không đường, gói bột, bột pha hỗn dịch và viên sủi; dùng được trong dập thẳng, nén trục và xát hạt ướt.", "1, tr.487"], ["Trong viên nhai được ưa dùng nhờ nhiệt hòa tan âm không đáng kể, vị ngọt dịu và cảm giác miệng tốt; dùng trong viên ngậm ho, kẹo cho người tiểu đường và kẹo cao su không đường.", "1, tr.487"]], "fe": [["Non-caries-causing excipients used in tablets/capsules, sugar-free coatings, powder packets, powder for suspension and effervescent tablets; Can be used in straight stamping, axial compression and wet granulation.", "1, tr.487"], ["In chewable tablets, it is preferred due to its negligible heat of dissolution, mild sweetness and good mouth feel; used in cough lozenges, diabetic candy and sugar-free gum.", "1, tr.487"]], "t": [["Tài liệu chưa đề cập.", "1, tr.487"]], "te": [["Documents not mentioned.", "1, tr.487"]], "d": [["Đường-alcol (polyol); bột hoặc chất kết tinh/hạt màu trắng/gần trắng, vị ngọt dịu (~50–60% sucrose).", "1, tr.487"]], "de": [["Sugar-alcohol (polyol); White/near white powder or crystalline substance/granule, mildly sweet (~50–60% sucrose).", "1, tr.487"]], "a": "isomalt 64519-82-0 E953 Isomalt C*pharmlsoMaltidex galenlQ hydrogenated isomaltulose hydrogenated palatinose IsoMaltidex 16500 isomaltum Palatinit. 7"}, {"id": "isopropyl-alcohol", "n": "Isopropyl Alcohol", "nv": "Isopropyl Alcohol; Isopropanol", "g": ["Chất bảo quản kháng khuẩn", "Dung môi"], "ge": ["Antimicrobial preservative", "Solvent"], "cas": "67-63-0", "f": [["Dùng chủ yếu làm dung môi trong chế phẩm dùng ngoài; không khuyến cáo đường uống do độc tính. Cũng dùng làm dung môi cho bao phim và xát hạt viên nén (sau đó bay hơi loại bỏ).", "1, tr.491"]], "fe": [["Mainly used as a solvent in preparations for external use; Not recommended for oral administration due to toxicity. Also used as a solvent for film coating and tablet grinding (then evaporated to remove).", "1, tr.491"]], "t": [["Tương kỵ với chất oxy hóa như hydrogen peroxid và acid nitric (gây phân hủy); có thể bị tách khỏi hỗn hợp nước khi thêm NaCl, natri sulfat hoặc NaOH.", "1, tr.491"]], "te": [["Incompatible with oxidizing agents such as hydrogen peroxide and nitric acid (causes decomposition); may be separated from the water mixture by the addition of NaCl, sodium sulfate or NaOH.", "1, tr.491"]], "d": [["Chất lỏng trong, không màu, linh động, dễ bay hơi, dễ cháy, mùi cồn đặc trưng (giống hỗn hợp ethanol–aceton), vị hơi đắng.", "1, tr.491"], ["Trộn lẫn với benzen, cloroform, ethanol 95%, ether, glycerin và nước; tan trong aceton.", "1, tr.491"]], "de": [["Clear, colorless, mobile, volatile, flammable liquid, characteristic alcoholic odor (like ethanol–acetone mixture), slightly bitter taste.", "1, tr.491"], ["Mixable with benzene, chloroform, 95% ethanol, ether, glycerin and water; Soluble in acetone.", "1, tr.491"]], "a": "isopropyl alcohol ipa propan-2-ol isopropanol alcol isopropylic 67-63-0 Isopropyl Alcohol Isopropanol Alcohol isopropylicus dimethyl carbinol IPA petro hol 2-propanol sec-propyl alcohol rubbing alcohol"}, {"id": "isopropyl-isostearate", "n": "Isopropyl Isostearate", "nv": "Isopropyl isostearat", "g": ["Chất làm mềm da"], "ge": ["Emollient"], "cas": "31478-84-2", "f": [["Dùng làm chất làm mềm trong chế phẩm dùng ngoài như kem và nhũ tương; được nghiên cứu dùng trong hệ đưa thuốc dạng tiểu phân nano.", "1, tr.493"]], "fe": [["Used as an emollient in topical preparations such as creams and emulsions; Researched for use in nanoparticle drug delivery systems.", "1, tr.493"]], "t": [["Tương kỵ với chất oxy hóa mạnh; tiếp xúc lâu với chất dẻo có thể làm mềm chất dẻo.", "1, tr.493"]], "te": [["Incompatible with strong oxidizing agents; Prolonged contact with plastic can soften the plastic.", "1, tr.493"]], "d": [["Chất lỏng trong, mùi nhẹ.", "1, tr.493"], ["Tan trong aceton, ethanol 95%, ethyl acetat, isopropyl alcol và dầu khoáng; không tan trong nước, glycerol và propylen glycol.", "1, tr.493"]], "de": [["Clear liquid, mild odor.", "1, tr.493"], ["Soluble in acetone, 95% ethanol, ethyl acetate, isopropyl alcohol and mineral oil; Insoluble in water, glycerol and propylene glycol.", "1, tr.493"]], "a": "isopropyl isostearate isopropyl isostearat 31478-84-2 Crodamol IPIS DUBCARE TRIISO isostearic acid, isopropyl ester 1-methylethyl isooctadecanoate Nikkol IP1S 2-propyl isooctadecanoate Schercemol 318 Ester"}, {"id": "isopropyl-myristate", "n": "Isopropyl Myristate", "nv": "Isopropyl Myristate", "g": ["Chất làm mềm da", "Tá dược dầu", "Chất tăng thấm", "Dung môi", "Thành phần hệ trị liệu qua da"], "ge": ["Emollient", "Oleaginous vehicle", "Permeation enhancer", "Solvent", "Transdermal delivery component"], "cas": "110-27-0", "f": [["Là chất làm mềm không nhờn, hấp thu nhanh qua da; chủ yếu làm thành phần nền bán rắn và dung môi cho nhiều chất dùng ngoài (kem, lotion, xịt, hỗn dịch nhỏ tai, kem âm đạo); là chất tăng thấm cho chế phẩm qua da.", "1, tr.495"]], "fe": [["A non-greasy emollient that absorbs quickly through the skin; Mainly used as a semi-solid base and solvent for many topical agents (creams, lotions, sprays, ear drops, vaginal creams); is a permeability enhancer for products through the skin.", "1, tr.495"]], "t": [["Tiếp xúc với cao su làm giảm độ nhớt kèm trương và hòa tan một phần cao su; với nhựa (nylon, polyethylen) gây trương; tương kỵ với paraffin cứng (tạo hỗn hợp lổn nhổn) và chất oxy hóa mạnh.", "1, tr.495"]], "te": [["Contact with rubber reduces viscosity with swelling and partial dissolution of the rubber; with plastics (nylon, polyethylene) causing swelling; Incompatible with hard paraffin (creating a lumpy mixture) and strong oxidizing agents.", "1, tr.495"]], "d": [["Chất lỏng trong, không màu, gần như không mùi, độ nhớt thấp, đông đặc ở khoảng 5 °C.", "1, tr.495"], ["Tan trong aceton, cloroform, ethanol 95%, ethyl acetat, chất béo, dầu, hydrocarbon lỏng, toluen và sáp; thực tế không tan trong glycerin, glycol và nước.", "1, tr.495"]], "de": [["Clear, colorless, almost odorless liquid, low viscosity, solidifies at about 5 °C.", "1, tr.495"], ["Soluble in acetone, chloroform, 95% ethanol, ethyl acetate, fats, oils, liquid hydrocarbons, toluene and waxes; practically insoluble in glycerin, glycol and water.", "1, tr.495"]], "a": "isopropyl myristate ipm isopropyl myristat 110-27-0 Isopropyl Myristate Crodamol ỈPM Dermol IPM- Estol IPM Exceparl IPM IPM isopropyl ester of myristic acid isopropylis myristas isopropyl tetradecanoate Kessco IPM 95 Lexol IPM-NF Rita IPM Stelliesters IPM Stepan IPM Tegosoft M tetradecanoic acid, 1-methylethyl ester Waglinol 6014 Wickenol 101"}, {"id": "isopropyl-palmitate", "n": "Isopropyl Palmitate", "nv": "Isopropyl Palmitate", "g": ["Chất làm mềm da", "Tá dược dầu", "Chất tăng thấm", "Dung môi", "Thành phần hệ trị liệu qua da"], "ge": ["Emollient", "Oleaginous vehicle", "Permeation enhancer", "Solvent", "Transdermal delivery component"], "cas": "142-91-6", "f": [["Là chất làm mềm không nhờn, trải tốt; dùng trong chế phẩm dùng ngoài (kem, lotion, gel, thuốc mỡ, xịt); là chất tăng thấm cho hệ qua da; dùng trong màng thấm giải phóng kiểm soát và hệ vi nhũ tương/tiểu phân nano.", "1, tr.497"]], "fe": [["It is a non-greasy emollient that spreads well; used in topical preparations (cream, lotion, gel, ointment, spray); is a substance that increases permeability through the skin; used in controlled release permeable membranes and microemulsion/nanoparticle systems.", "1, tr.497"]], "t": [["Xem mục Isopropyl myristat.", "1, tr.497"]], "te": [["See Isopropyl myristat section.", "1, tr.497"]], "d": [["Chất lỏng nhớt, trong, không màu đến vàng nhạt, gần như không mùi, đông đặc dưới 16 °C.", "1, tr.497"]], "de": [["Viscous liquid, clear, colorless to pale yellow, almost odorless, solidifies below 16 °C.", "1, tr.497"]], "a": "isopropyl palmitate ipp isopropyl palmitat 142-91-6 Isopropyl Palmitate Crodamol IPP Dermol IPP Emerest 2316 Exceparl IPP hexadecanoic acid isopropyl ester hexadecanoic acid 1-methylethyl ester IPP isopropyl hexadecanoate isopropylis palmitas Kessco ỊPP Lexol IPP-NF Eiponate IPP palmitic acid isopropyl ester Propal Protachem ỈPP Rita ỈPP Stelliesters IPP Stepan IPP Tegosoft P Unimate 1PP Waglinol 6016 Wickenol 111"}, {"id": "kaolin", "n": "Kaolin", "nv": "Kaolin; Kaolin, Heavy", "g": ["Chất hấp phụ", "Chất gây treo", "Tá dược độn (viên nén/nang)"], "ge": ["Adsorbent", "Suspending agent", "Tablet / capsule diluent"], "cas": "1332-58-7", "f": [["Khoáng tự nhiên dùng trong chế phẩm uống và dùng ngoài; đường uống làm tá dược độn cho viên nén/nang và tá dược gây treo; dùng ngoài (đã tiệt khuẩn) làm thuốc đắp và bột rắc.", "1, tr.499"]], "fe": [["Natural minerals used in oral and topical preparations; Oral route as filler for tablets/capsules and suspension excipient; Used externally (sterilized) as a poultice and powder.", "1, tr.499"]], "t": [["Tính hấp phụ có thể ảnh hưởng hấp thu của nhiều thuốc uống: amoxicilin, ampicilin, cimetidin, digoxin, lincomycin, phenytoin và tetracyclin.", "1, tr.499"]], "te": [["Adsorption properties can affect the absorption of many oral drugs: amoxicillin, ampicillin, cimetidine, digoxin, lincomycin, phenytoin and tetracycline.", "1, tr.499"]], "d": [["Bột trơn nhờn màu trắng đến xám trắng, không sạn; vị đất/sét đặc trưng, khi ẩm sẫm màu và có mùi sét.", "1, tr.499"], ["Thực tế không tan trong ether, ethanol 95%, nước, dung môi hữu cơ, acid loãng lạnh và dung dịch hydroxyd kiềm.", "1, tr.499"]], "de": [["White to gray-white, greasy powder, no grit; Characteristic earthy/clay taste, when moist, dark and smells of clay.", "1, tr.499"], ["Practically insoluble in ether, 95% ethanol, water, organic solvents, cold dilute acids and alkaline hydroxide solutions.", "1, tr.499"]], "a": "kaolin cao lanh china clay 1332-58-7 Kaolin Heavy Kaolin Kaolin, Heavy Argilia bolus alba China clay E559 kaolinite kaolinum ponderosum Lion porcelain clay Sim 90 weisserton white bole"}, {"id": "lactic-acid", "n": "Lactic Acid", "nv": "Lactic Acid", "g": ["Chất acid hóa"], "ge": ["Acidifying agent"], "cas": "50-21-5, 10326-41-7, 598-82-3", "f": [["Dùng trong đồ uống, thực phẩm, mỹ phẩm và dược phẩm làm chất acid hóa; trong chế phẩm dùng ngoài (nhất là mỹ phẩm) dùng nhờ tác dụng làm mềm và dưỡng da. Nồng độ tham khảo: tiêm 0,012–1,16%, dùng ngoài 0,015–6,6%.", "1, tr.502"], ["Cũng dùng sản xuất polymer phân hủy sinh học và vi cầu (như poly(D-lactic acid)) cho hệ đưa thuốc.", "1, tr.502"]], "fe": [["Used in beverages, foods, cosmetics and pharmaceuticals as an acidifying agent; used in external preparations (especially cosmetics) thanks to its softening and skin-nourishing effects. Reference concentration: injection 0.012–1.16%, external use 0.015–6.6%.", "1, tr.502"], ["Also used to produce biodegradable polymers and microspheres (such as poly(D-lactic acid)) for drug delivery systems.", "1, tr.502"]], "t": [["Tương kỵ với chất oxy hóa, iodid và albumin; phản ứng mãnh liệt với acid hydrofluoric và acid nitric.", "1, tr.502"]], "te": [["Incompatible with oxidants, iodine and albumin; Reacts violently with hydrofluoric acid and nitric acid.", "1, tr.502"]], "d": [["Là hỗn hợp acid 2-hydroxypropionic, sản phẩm ngưng tụ và nước; thường ở dạng racemat.", "1, tr.502"], ["Trộn lẫn với ethanol 95%, ether và nước; thực tế không tan trong cloroform.", "1, tr.502"]], "de": [["Is a mixture of 2-hydroxypropionic acid, condensation product and water; usually in racemate form.", "1, tr.502"], ["Mixable with 95% ethanol, ether and water; practically insoluble in chloroform.", "1, tr.502"]], "a": "lactic acid acid lactic 2-hydroxypropionic acid 50-21-5 E270 Lactic Acid Acidum lacticum Eco-Lac 2-hydroxypropanoic acid a-hydroxypropionic acid DL-lactic acid L-lactic acid Lexalt L milk acid Patlac LA Purac 88 PH Purac PF 90 racemic lactic acid"}, {"id": "lactitol", "n": "Lactitol", "nv": "Lactitol Monohydrate", "g": ["Tá dược dập thẳng", "Chất tạo ngọt", "Tá dược độn (viên nén/nang)"], "ge": ["Direct compression vehicle", "Sweetening agent", "Tablet / capsule diluent"], "cas": "585-86-4, 81025-03-8", "f": [["Dùng thay sucrose (không gây sâu răng) và làm tá dược độn trong dập thẳng; dạng dập thẳng là sản phẩm xát hạt bằng nước của các tập hợp vi tinh thể.", "1, tr.504"]], "fe": [["Used to replace sucrose (does not cause tooth decay) and as a filler in straight stamping; Straight stamping is a product of water granulation of microcrystalline aggregates.", "1, tr.504"]], "t": [["Tài liệu chưa đề cập.", "1, tr.504"]], "te": [["Documents not mentioned.", "1, tr.504"]], "d": [["Tinh thể trực thoi màu trắng, không mùi, vị ngọt kèm cảm giác mát.", "1, tr.504"], ["Tan trong nước (1 trong 1,75 phần ở 20 °C); ít tan trong ethanol 95% và ether; tan trong DMSO và dimethylformamid.", "1, tr.504"]], "de": [["White orthorhombic crystals, odorless, sweet taste with a cool feeling.", "1, tr.504"], ["Soluble in water (1 in 1.75 parts at 20 °C); Slightly soluble in 95% ethanol and ether; Soluble in DMSO and dimethylformamide.", "1, tr.504"]], "a": "lactitol 585-86-4 E966 Lactitol Monohydrate Lactitol Finlac DC p-galactosido-sorbitol lactil lactite lactitolum monohydricum lactobiosit lactosit Lacty"}, {"id": "lactose-monohydrate", "n": "Lactose Monohydrate", "nv": "Lactose Monohydrate", "g": ["Chất mang bột hít", "Tá dược hỗ trợ đông khô", "Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)"], "ge": ["Inhalation carrier", "Lyophilization bulking agent", "Tablet / capsule binder", "Tablet / capsule diluent"], "cas": "5989-81-1, 10039-26-6, 64044-51-5", "f": [["Dùng rộng rãi làm tá dược độn/làm đầy trong viên nén và viên nang; dùng hạn chế hơn trong sản phẩm đông khô và sữa công thức trẻ em; cũng làm tá dược độn trong bột hít khô. Nhiều grade khác nhau về cỡ hạt, phân bố và lưu tính cho phép chọn phù hợp từng ứng dụng.", "1, tr.513"]], "fe": [["Widely used as filler/filling excipient in tablets and capsules; Use more limitedly in freeze-dried products and baby formula; Also used as a filler in dry snuff powders. Many grades vary in particle size, distribution and fluidity allowing selection to suit each application.", "1, tr.513"]], "t": [["Là đường khử; phản ứng Maillard với amin bậc 1 (ít hơn với amin bậc 2) khi ẩm cao, lưu lâu, tạo sản phẩm sẫm màu; các hoạt chất không tương thích gồm amino acid, amphetamin, lisinopril.", "1, tr.513"]], "te": [["Is a reducing sugar; Maillard reaction with primary amines (less so with secondary amines) at high humidity, long storage, creating dark products; Incompatible active ingredients include amino acids, amphetamine, lisinopril.", "1, tr.513"]], "d": [["Tinh thể hoặc bột màu trắng đến gần trắng, không mùi, vị hơi ngọt; tồn tại nhiều dạng đồng phân tùy điều kiện kết tinh (α-lactose monohydrat, β-lactose khan...).", "1, tr.513"], ["Chứa khoảng 5% nước kết tinh (thường 4,5–5,5%).", "1, tr.513"]], "de": [["White to nearly white crystals or powder, odorless, slightly sweet taste; Many isomeric forms exist depending on crystallization conditions (α-lactose monohydrate, β-lactose anhydrous...).", "1, tr.513"], ["Contains approximately 5% water of crystallization (typically 4.5–5.5%).", "1, tr.513"]], "a": "lactose monohydrate lactose monohydrat alpha-lactose monohydrate 64044-51-5 Lactose Monohydrate Lactose Hydrate Foremost, GranuLac Lactochem lactosum monohydrictim"}, {"id": "lactose-cornstarch-coprocessed", "n": "Lactose Monohydrate and Corn Starch, Coprocessed", "nv": "Lactose monohydrat và tinh bột ngô (đồng chế biến, StarLac)", "g": ["Tá dược dập thẳng", "Tá dược độn (viên nén/nang)", "Tá dược rã (viên nén/nang)"], "ge": ["Direct compression vehicle", "Tablet / capsule diluent", "Tablet / capsule disintegrant"], "cas": "", "f": [["Dùng trong viên nén để cải thiện tính nén, lưu tính và khả năng rã bằng dập thẳng; dùng cả trong công thức liều thấp–trung bình và chế phẩm vi lượng đồng căn.", "1, tr.520"]], "fe": [["Used in tablets to improve compressibility, fluidity and disintegration by straight stamping; used in both low–medium dose formulations and homeopathic preparations.", "1, tr.520"]], "t": [["Xem mục Lactose monohydrat và Tinh bột.", "1, tr.520"]], "te": [["See Lactose monohydrate and Starches.", "1, tr.520"]], "d": [["Bột trơn chảy màu trắng đến gần trắng, không mùi; gồm 82–88% lactose monohydrat và 12–18% tinh bột ngô trong hạt tích hợp (không đạt được bằng trộn đơn thuần).", "1, tr.520"]], "de": [["White to almost white, slippery powder, odorless; consists of 82–88% lactose monohydrate and 12–18% corn starch in the integrated grain (not achieved by mixing alone).", "1, tr.520"]], "a": "coprocessed lactose corn starch starlac lactose va tinh bot ngo dong che bien manufacturer: Meggle/Roquette"}, {"id": "lactose-mcc-coprocessed", "n": "Lactose Monohydrate and Microcrystalline Cellulose, Coprocessed", "nv": "Lactose monohydrat và MCC (đồng chế biến, MicroceLac)", "g": ["Tá dược độn (viên nén/nang)", "Tá dược dập thẳng"], "ge": ["Tablet / capsule diluent", "Direct compression vehicle"], "cas": "", "f": [["Dùng trong viên nén dập thẳng, làm tá dược độn nang và tá dược độn-dính trong nén trục.", "1, tr.522"]], "fe": [["Used in straight-cut tablets, as capsule-filling excipients and as filler-adhesive excipients in axial compression.", "1, tr.522"]], "t": [["Xem mục Lactose monohydrat và Cellulose vi tinh thể.", "1, tr.522"]], "te": [["See Lactose monohydrate and Microcrystalline Cellulose.", "1, tr.522"]], "d": [["Bột trơn chảy màu trắng đến gần trắng, không mùi; gồm 73–77% lactose monohydrat và 23–27% cellulose vi tinh thể trong hạt tích hợp.", "1, tr.522"], ["Tan một phần trong nước.", "1, tr.522"]], "de": [["White to almost white, slippery powder, odorless; composed of 73–77% lactose monohydrate and 23–27% microcrystalline cellulose in integrated granules.", "1, tr.522"], ["Partially soluble in water.", "1, tr.522"]], "a": "coprocessed lactose microcrystalline cellulose microcelac lactose va mcc dong che bien MicroceLac 100 avicel ph101 ph102 ph105 ph200 ph301 ph302 mcc101 mcc102"}, {"id": "lactose-povidone-coprocessed", "n": "Lactose Monohydrate and Povidone, Coprocessed", "nv": "Lactose monohydrat và povidon (đồng chế biến, Ludipress LCE)", "g": ["Tá dược độn (viên nén/nang)", "Tá dược dập thẳng"], "ge": ["Tablet / capsule diluent", "Direct compression vehicle"], "cas": "", "f": [["Dùng bào chế viên nhai, viên ngậm, viên sủi và viên giải phóng kiểm soát bằng dập thẳng; phù hợp thuốc liều thấp.", "1, tr.523"]], "fe": [["Use to prepare chewable tablets, lozenges, effervescent tablets and controlled-release tablets by straight stamping; Suitable low dose medication.", "1, tr.523"]], "t": [["Xem mục Lactose monohydrat và Povidon.", "1, tr.523"]], "te": [["See Lactose monohydrate and Povidone.", "1, tr.523"]], "d": [["Hạt trơn chảy màu trắng, không mùi, vị trung tính; chứa ~96,5% lactose monohydrat và ~3,5% povidon K30.", "1, tr.523"], ["Tan trong nước.", "1, tr.523"]], "de": [["The smooth seeds are white, odorless, and have a neutral taste; contains ~96.5% lactose monohydrate and ~3.5% povidone K30.", "1, tr.523"], ["Soluble in water.", "1, tr.523"]], "a": "coprocessed lactose povidone ludipress lce lactose va povidon dong che bien Ludipress LCE"}, {"id": "lactose-powdered-cellulose-coprocessed", "n": "Lactose Monohydrate and Powdered Cellulose, Coprocessed", "nv": "Lactose monohydrat và cellulose bột (đồng chế biến, Cellactose)", "g": ["Tá dược độn (viên nén/nang)"], "ge": ["Tablet / capsule diluent"], "cas": "", "f": [["Dùng dập thẳng viên nén để cải thiện tính nén và cảm giác miệng; cũng được nghiên cứu cho quy trình nén trục.", "1, tr.525"]], "fe": [["Use straight pressing of tablets to improve compressibility and mouth feel; was also studied for the axial c
