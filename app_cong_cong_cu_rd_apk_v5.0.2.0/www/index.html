chủ yếu là ester ethyl của acid oleic.", "1, tr.366"], ["Trộn lẫn với cloroform, ethanol 96%, ether, dầu béo, paraffin lỏng; thực tế không tan trong nước.", "1, tr.366"]], "de": [["Oily liquid, flexible, pale yellow to nearly colorless, tastes like olive oil, has a mild odor and is not rancid; mainly the ethyl ester of oleic acid.", "1, tr.366"], ["Mixable with chloroform, 96% ethanol, ether, fatty oils, liquid paraffin; practically insoluble in water.", "1, tr.366"]], "a": "ethyl oleate ethyl oleat 111-62-6 Ethyl Oleate Crodamol EO DUBCARE OE ethylis oleas ethyl czs-9-octadecenoate ethyl 9-octadecenoate Kessco EO 9-octadecenoic acid, (Z)-, ethyl ester oleic acid, ethyl ester"}, {"id": "ethyl-vanillin", "n": "Ethyl Vanillin", "nv": "Ethyl Vanillin", "g": ["Chất tạo hương"], "ge": ["Flavoring agent"], "cas": "121-32-4", "f": [["Dùng làm chất tạo hương thay vanillin; hương và mùi mạnh gấp ~3 lần vanillin nên giảm được lượng dùng, ít làm đổi màu chế phẩm; tuy nhiên vượt giới hạn nồng độ có thể tạo hậu vị hơi đắng.", "1, tr.368"]], "fe": [["Used as a flavoring agent instead of vanilla; The scent and flavor are ~3 times stronger than vanilla, so the amount used is reduced and the product's color is less likely to change; However, exceeding the concentration limit can create a slightly bitter aftertaste.", "1, tr.368"]], "t": [["Không bền khi tiếp xúc sắt/thép, tạo hợp chất màu đỏ không mùi vị; với neomycin sulfat hoặc succinylsulfathiazol tạo màu vàng; xem thêm Vanillin.", "1, tr.368"]], "te": [["Unstable when in contact with iron/steel, creating an odorless red compound; with neomycin sulfate or succinylsulfathiazole to create yellow color; See also Vanillin.", "1, tr.368"]], "d": [["Tinh thể màu trắng hoặc hơi vàng, mùi và vị vani đậm đặc trưng.", "1, tr.368"]], "de": [["White or slightly yellow crystals, characteristic strong vanilla odor and taste.", "1, tr.368"]], "a": "ethyl vanillin ethyl vanillin 121-32-4 Ethyl Vanillin Bourbonal ethavan ethovan ethylprotal ethylprotocatechuic aldehyde 4-hydroxy-3-ethoxybenzaldehyde Rhodiarome vanillal"}, {"id": "ethylcellulose", "n": "Ethylcellulose", "nv": "Ethylcellulose", "g": ["Chất tạo màng bao", "Chất vi nang hóa", "Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Chất che vị", "Chất làm tăng độ nhớt"], "ge": ["Coating agent", "Microencapsulating agent", "Tablet / capsule binder", "Tablet / capsule diluent", "Taste-masking agent", "Viscosity-increasing agent"], "cas": "9004-57-3", "f": [["Dùng rộng rãi trong chế phẩm uống và dùng ngoài; ứng dụng chính đường uống là chất bao kỵ nước cho viên nén và cốm để điều biến giải phóng, che vị khó chịu hoặc cải thiện độ ổn định.", "1, tr.370"], ["Dạng viên giải phóng biến đổi có thể tạo bằng cách dùng ethylcellulose làm chất tạo cốt (matrix); hòa trong dung môi hữu cơ có thể tạo màng đứng riêng.", "1, tr.370"]], "fe": [["Widely used in oral and topical preparations; The main oral application is as a hydrophobic coating for tablets and granules to modulate release, mask unpleasant taste, or improve stability.", "1, tr.370"], ["Modified-release tablets can be made using ethylcellulose as the matrix; Dissolved in organic solvents can form stand-alone films.", "1, tr.370"]], "t": [["Tương kỵ với sáp paraffin và sáp vi tinh thể.", "1, tr.370"]], "te": [["Incompatible with paraffin wax and microcrystalline wax.", "1, tr.370"]], "d": [["Bột trơn chảy màu trắng đến nâu vàng nhạt, không vị.", "1, tr.370"], ["Thực tế không tan trong glycerin, propylen glycol và nước; loại có ethoxyl <46,5% dễ tan trong cloroform, methyl acetat và tetrahydrofuran.", "1, tr.370"]], "de": [["White to light yellow brown, slippery powder, tasteless.", "1, tr.370"], ["Practically insoluble in glycerin, propylene glycol and water; The type with ethoxyl <46.5% is easily soluble in chloroform, methyl acetate and tetrahydrofuran.", "1, tr.370"]], "a": "ethylcellulose ec ethyl cellulose 9004-57-3 E462 Ethylcellulose Ethvlcellulose Aquacoat ECD Aquaion Ashacel BonuCel Ethocel ethylcellulosum Fetocel Surelease"}, {"id": "eg-va-grafted-copolymer", "n": "Ethylene Glycol and Vinyl Alcohol Grafted Copolymer", "nv": "Macrogol Poly(Vinyl Alcohol) Grafted Copolymer; Ethylene Glycol and Vinyl Alcohol Grafted Copolymer", "g": ["Chất tạo màng bao", "Chất tạo màng", "Tá dược dính (viên nén/nang)"], "ge": ["Coating agent", "Film-forming agent", "Tablet / capsule binder"], "cas": "", "f": [["Polymer tổng hợp dùng chủ yếu làm chất tạo màng cho màng bao viên giải phóng ngay; thân nước, tan tốt trong nước không phụ thuộc pH. Phần polyvinyl alcol cho tính tạo màng tốt, phần polyethylen glycol đóng vai trò chất hóa dẻo nội.", "1, tr.375"]], "fe": [["Synthetic polymers are mainly used as film forming agents for immediate-release tablet coatings; Hydrophilic, soluble in water regardless of pH. The polyvinyl alcohol part has good film-forming properties, and the polyethylene glycol part acts as an internal plasticizer.", "1, tr.375"]], "t": [["Tài liệu chưa đề cập.", "1, tr.375"]], "te": [["Documents not mentioned.", "1, tr.375"]], "d": [["Bột trơn chảy màu trắng đến hơi vàng; là polymer vô định hình có vùng bán kết tinh.", "1, tr.375"], ["Tan nhanh trong nước và hệ nước (acid/kiềm yếu tới 40%); độ tan trong dung môi không phân cực thấp.", "1, tr.375"]], "de": [["White to slightly yellow flowing powder; is an amorphous polymer with a semi-crystalline region.", "1, tr.375"], ["Soluble quickly in water and aqueous systems (weak acid/alkaline up to 40%); Low solubility in non-polar solvents.", "1, tr.375"]], "a": "ethylene glycol and vinyl alcohol grafted copolymer kollicoat ir peg-pva graft copolymer copolymer ghep ethylen glycol vinyl alcol Ethylene Glycol and Vinyl Alcohol Grafted Copolymer Kollicoat ỈR polyvinylalcohol-co-polyethylene glycol PVA-CO-PEG Macrogol Poly(Vinyl Alcohol) Grafted Copolymer"}, {"id": "ethylene-glycol-stearates", "n": "Ethylene Glycol Stearates", "nv": "Ethylene Glycol Monopalmitostearate; Ethylene Glycol Stearates", "g": ["Chất làm mềm da", "Chất ổn định nhũ tương"], "ge": ["Emollient", "Emulsion stabilizer"], "cas": "", "f": [["Dùng làm chất làm mềm và chất ổn định nhũ tương (thường tạo hiệu ứng ngọc/mờ đục trong chế phẩm dùng ngoài và mỹ phẩm).", "1, tr.376"]], "fe": [["Used as an emollient and emulsion stabilizer (often creating a pearly/opaque effect in topical preparations and cosmetics).", "1, tr.376"]], "t": [["Tài liệu chưa đề cập.", "1, tr.376"]], "te": [["Documents not mentioned.", "1, tr.376"]], "d": [["Hỗn hợp monoester và diester của ethylen glycol với acid stearic và palmitic (≥50% monoester); dạng sáp màu trắng/gần trắng.", "1, tr.376"], ["Tan trong aceton và ethanol 95% nóng; thực tế không tan trong nước.", "1, tr.376"]], "de": [["Monoester and diester mixture of ethylene glycol with stearic and palmitic acids (≥50% monoester); white/almost white waxy form.", "1, tr.376"], ["Soluble in hot acetone and 95% ethanol; practically insoluble in water.", "1, tr.376"]], "a": "ethylene glycol stearates ethylen glycol stearat glycol stearate 111-60-4 Ethylene Glycol Monopalmitostearate Ethylene Glycol Stearates"}, {"id": "ethylene-vinyl-acetate", "n": "Ethylene Vinyl Acetate", "nv": "Ethylen vinyl acetat (EVA)", "g": ["Thành phần hệ trị liệu qua da"], "ge": ["Transdermal delivery component"], "cas": "24937-78-8", "f": [["Copolymer EVA dùng làm màng và lớp nền trong hệ dẫn thuốc qua da nhiều lớp; là cốt và màng hiệu quả cho giải phóng kiểm soát; chủ yếu dùng làm màng/nền dán ngoài.", "1, tr.378"]], "fe": [["Copolymer EVA is used as a membrane and base layer in multi-layer transdermal drug delivery systems; are effective cores and membranes for controlled release; Mainly used as external membrane/substrate.", "1, tr.378"]], "t": [["Tương kỵ với chất oxy hóa mạnh và base.", "1, tr.378"]], "te": [["Incompatible with strong oxidizing agents and bases.", "1, tr.378"]], "d": [["Chất rắn sáp màu trắng, không mùi, dạng viên hoặc bột; màng trong mờ.", "1, tr.378"], ["Không tan trong nước.", "1, tr.378"]], "de": [["White, odorless, waxy solid, in tablet or powder form; translucent membrane.", "1, tr.378"], ["Insoluble in water.", "1, tr.378"]], "a": "ethylene vinyl acetate eva ethylen vinyl acetat 24937-78-8 CoTran ethylene/ vinyl acetate copolymer EVA EVA copolymer EVM poly(ethy 1ene-co-vinyl acetate) VA/ethylene copolymer vinyl acetate/ethylene copolymer"}, {"id": "ethylparaben", "n": "Ethylparaben", "nv": "Ethyl Parahydroxybenzoate; Ethylparaben", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "120-47-8", "f": [["Dùng rộng rãi làm chất bảo quản kháng khuẩn trong mỹ phẩm, thực phẩm và dược phẩm, đơn độc hoặc phối hợp với các paraben/chất kháng khuẩn khác; hiệu lực trên khoảng pH rộng, phổ rộng nhưng mạnh nhất với nấm men và nấm mốc. Do độ tan kém, thường dùng muối natri.", "1, tr.379"]], "fe": [["Widely used as an antibacterial preservative in cosmetics, foods and pharmaceuticals, alone or in combination with other parabens/antibacterial agents; Effective over a wide pH range, broad spectrum but strongest against yeast and mold. Due to poor solubility, sodium salt is often used.", "1, tr.379"]], "t": [["Hoạt tính giảm đáng kể khi có chất diện hoạt không ion hóa (do tạo micelle); bị hấp phụ lên silica khi có phenol ethoxyl hóa; một số pigment (oxid sắt vàng, xanh ultramarine) hấp phụ paraben.", "1, tr.379"]], "te": [["The activity is significantly reduced in the presence of non-ionic surfactants (due to micelle formation); adsorbed onto silica in the presence of ethoxylated phenol; Some pigments (yellow iron oxide, ultramarine blue) adsorb parabens.", "1, tr.379"]], "d": [["Bột kết tinh màu trắng, không mùi hoặc gần như không mùi.", "1, tr.379"]], "de": [["White crystalline powder, odorless or almost odorless.", "1, tr.379"]], "a": "ethylparaben ethyl parahydroxybenzoate 120-47-8 E214 Ethyl Hydroxybenzoate Ethyl Parahydroxybenzoate Ethylparaben Aethylum hydrobenzoicum CoSept E-, E214 ethylis parahydroxybenzoas ethyl /2-hydroxybenzoate Nipagin A Solbrol A Tegosept E Uniphen P23"}, {"id": "fructose", "n": "Fructose", "nv": "Fructose", "g": ["Chất tạo hương", "Chất tạo ngọt", "Chất che vị"], "ge": ["Flavoring agent", "Sweetening agent", "Taste-masking agent"], "cas": "57-48-7", "f": [["Dùng trong viên nén, siro và dung dịch làm chất tạo hương và tạo ngọt; ngọt hơn mannitol và sorbitol ở cùng nồng độ, cảm nhận vị ngọt nhanh hơn sucrose và dextrose.", "1, tr.383"], ["Tan trong ethanol tốt hơn dextrose và sucrose nên phù hợp làm chất tạo ngọt cho công thức gốc cồn; tan trong nước tốt hơn sucrose và dextrose, ít gây kết tinh không mong muốn.", "1, tr.383"]], "fe": [["Used in tablets, syrups and solutions as flavoring and sweetening agents; Sweeter than mannitol and sorbitol at the same concentration, sweet taste is felt faster than sucrose and dextrose.", "1, tr.383"], ["Soluble in ethanol better than dextrose and sucrose, so it is suitable as a sweetener for alcohol-based formulas; Soluble in water better than sucrose and dextrose, less likely to cause unwanted crystallization.", "1, tr.383"]], "t": [["Tương kỵ với acid hoặc kiềm mạnh (tạo màu nâu); là đường khử, dạng aldehyd phản ứng với amin, amino acid, peptid và protein; có thể làm nâu viên chứa amin.", "1, tr.383"]], "te": [["Incompatible with strong acids or alkalis (brown color); is a reducing sugar, an aldehyde form that reacts with amines, amino acids, peptides and proteins; Can brown tablets containing amines.", "1, tr.383"]], "d": [["Tinh thể không màu hoặc bột kết tinh màu trắng, không mùi, vị rất ngọt.", "1, tr.383"]], "de": [["Colorless crystals or white crystalline powder, odorless, very sweet taste.", "1, tr.383"]], "a": "fructose levulose 57-48-7 Fructose Advantose FS 95 D-arabino-2-hexulose D-arabino-hex-2-ulopyranose Fructamyl Fructofin D-(-)-fructopyranose p-D-fructose fructosum fruit sugar Fruitose Krystar laevulose nevulose"}, {"id": "fructose-pregelatinized-starch-coprocessed", "n": "Fructose and Pregelatinized Starch, Coprocessed", "nv": "and Starch, Pregelatinized", "g": ["Tá dược dập thẳng", "Chất che vị"], "ge": ["Direct compression vehicle", "Taste-masking agent"], "cas": "", "f": [["Dùng trong dập thẳng viên nén để cải thiện lưu tính và tính nén; dùng làm viên nhai; cũng dùng để che vị khó chịu của thành phần trong công thức viên.", "1, tr.386"]], "fe": [["Used in straightening tablets to improve fluidity and compressibility; used as chewable tablets; also used to mask the unpleasant taste of ingredients in tablet formulations.", "1, tr.386"]], "t": [["Có thể phản ứng với chất oxy hóa; fructose là đường khử nên phản ứng với amin, amino acid, peptid và protein.", "1, tr.386"]], "te": [["May react with oxidizing agents; Fructose is a reducing sugar so it reacts with amines, amino acids, peptides and proteins.", "1, tr.386"]], "d": [["Bột kết tinh màu trắng chứa 95% fructose và 5% tinh bột hồ hóa (hệ đồng sấy khô).", "1, tr.386"], ["Tan một phần trong nước.", "1, tr.386"]], "de": [["White crystalline powder containing 95% fructose and 5% gelatinized starch (co-dried system).", "1, tr.386"], ["Partially soluble in water.", "1, tr.386"]], "a": "coprocessed fructose pregelatinized starch advantose fs 95 fructose va tinh bot ho hoa Advantose FS 95 and Starch, Pregelatinized"}, {"id": "fumaric-acid", "n": "Fumaric Acid", "nv": "Fumaric Acid", "g": ["Chất acid hóa", "Chất chống oxy hóa", "Chất tạo phức", "Chất tạo hương", "Chất làm tăng độ tan"], "ge": ["Acidifying agent", "Antioxidant", "Chelating / Complexing agent", "Flavoring agent", "Solubilizing agent"], "cas": "110-17-8", "f": [["Chủ yếu dùng trong chế phẩm lỏng làm chất acid hóa và tạo hương, cho vị chua mạnh; có thể làm phần acid trong viên sủi (hạn chế vì độ tan trong nước rất thấp); cũng dùng làm chất tạo phức thể hiện hiệp lực với chất chống oxy hóa.", "1, tr.387"]], "fe": [["Mainly used in liquid preparations as an acidifier and flavoring agent, giving a strong sour taste; Can be used as an acid in effervescent tablets (limited because of very low solubility in water); Also used as a complexing agent showing synergy with antioxidants.", "1, tr.387"]], "t": [["Phản ứng đặc trưng của acid hữu cơ.", "1, tr.387"]], "te": [["Typical reactions of organic acids.", "1, tr.387"]], "d": [["Hạt hoặc bột kết tinh màu trắng, không mùi hoặc gần như không mùi, hầu như không hút ẩm.", "1, tr.387"]], "de": [["White crystalline granules or powder, odorless or nearly odorless, virtually hygroscopic.", "1, tr.387"]], "a": "fumaric acid acid fumaric 110-17-8 E297 Fumaric Acid Allomaleic acid allomalenic acid boletic acid butenedioic acid 1,2-ethenedicarboxylic acid lichenic acid iraws-butenedioic acid NSC-2752 imws-l,2-ethylenedicarboxylic acid tumaric acid U-1149 antioxidant"}, {"id": "galactose", "n": "Galactose", "nv": "Galactose", "g": ["Chất tạo phức", "Chất tạo ngọt"], "ge": ["Chelating / Complexing agent", "Sweetening agent"], "cas": "59-23-4", "f": [["Dùng làm chất tạo ngọt trong chế phẩm uống; gần đây dùng trong tiểu phân nano và liên hợp thuốc-polymer làm phần hướng đích tới gan.", "1, tr.390"]], "fe": [["Used as a sweetener in oral preparations; Recently used in nanoparticles and drug-polymer conjugates as the liver targeting part.", "1, tr.390"]], "t": [["Là đường khử, có thể phản ứng Maillard với amin.", "1, tr.390"]], "te": [["As a reducing sugar, Maillard reaction with amine is possible.", "1, tr.390"]], "d": [["Bột kết tinh hoặc hạt mịn màu trắng/gần trắng.", "1, tr.390"], ["Tan trong 0,5–1,7 phần nước; tan trong pyridin, alcol và ether.", "1, tr.390"]], "de": [["White/almost white crystalline powder or fine granules.", "1, tr.390"], ["Soluble in 0.5–1.7 parts water; Soluble in pyridine, alcohol and ether.", "1, tr.390"]], "a": "galactose d-galactose 59-23-4 Galactose Brain sugar cerebrose galactosum lactoglucose"}, {"id": "gelatin", "n": "Gelatin", "nv": "Gelatin", "g": ["Vật liệu vỏ nang", "Chất tạo màng bao", "Chất tạo phức", "Chất tạo màng", "Chất tạo gel", "Chất vi nang hóa", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Capsule shell material", "Coating agent", "Chelating / Complexing agent", "Film-forming agent", "Gelling agent", "Microencapsulating agent", "Suspending agent", "Tablet / capsule binder", "Viscosity-increasing agent"], "cas": "9000-70-8", "f": [["Dùng làm vật liệu vỏ nang cứng và mềm; cũng dùng làm tá dược dính và bao viên nén.", "1, tr.391"], ["Dùng vi nang hóa thuốc (dạng beadlet điều chế bằng coacervat); làm bột nhão, viên ngậm, thuốc trứng và thuốc đặt; gelatin phân tử lượng thấp giúp tăng hòa tan thuốc uống.", "1, tr.391"]], "fe": [["Used as hard and soft capsule material; Also used as adhesive excipient and tablet coating.", "1, tr.391"], ["Using microencapsulation of medicine (beadlet form prepared with coacervat); making pastes, lozenges, ointments and suppositories; Low molecular weight gelatin helps increase the solubility of oral medications.", "1, tr.391"]], "t": [["Là chất lưỡng tính, phản ứng với cả acid và base; là protein nên có thể bị thủy phân bởi hệ enzym phân giải protein; phản ứng với aldehyd và đường aldehyd, polymer anion/cation, chất điện giải, ion kim loại, chất hóa dẻo, chất bảo quản, chất oxy hóa mạnh và chất diện hoạt; bị tủa bởi alcol, cloroform.", "1, tr.391"]], "te": [["It is amphoteric, reacting with both acids and bases; It is a protein so it can be hydrolyzed by proteolytic enzymes; reacts with aldehydes and aldehyde sugars, anionic/cationic polymers, electrolytes, metal ions, plasticizers, preservatives, strong oxidants and surfactants; precipitated by alcohol and chloroform.", "1, tr.391"]], "d": [["Chất rắn giòn, thủy tinh, màu hổ phách nhạt đến vàng nhạt, gần như không mùi, không vị.", "1, tr.391"], ["Thực tế không tan trong aceton, cloroform, ethanol 95%, ether và methanol; tan trong glycerin, acid và kiềm (acid/kiềm mạnh gây tủa); trong nước gelatin trương và mềm ra.", "1, tr.391"]], "de": [["Brittle, glassy solid, pale amber to pale yellow, almost odorless and tasteless.", "1, tr.391"], ["Practically insoluble in acetone, chloroform, 95% ethanol, ether and methanol; soluble in glycerin, acids and alkalis (strong acids/alkalines cause precipitation); In water, the gelatin swells and softens.", "1, tr.391"]], "a": "gelatin gelatine 9000-70-8 E441 Gelatin By co Cryogel gelatina Instagel Kolatin Solugel inhalations injections deacetylated polysaccharide S-60 E418 high acyl gellan gum Kelcogel low acyl gellan gum"}, {"id": "gellan-gum", "n": "Gellan Gum", "nv": "Gellan Gum", "g": ["Chất tạo gel", "Tá dược phóng thích biến đổi", "Chất kết dính niêm mạc", "Chất làm tăng độ nhớt"], "ge": ["Gelling agent", "Modified-release agent", "Mucoadhesive agent", "Viscosity-increasing agent"], "cas": "71010-52-1", "f": [["Dùng làm chất tạo gel, tăng độ nhớt, kết dính niêm mạc và điều biến giải phóng (nhạy ion, tạo gel tại chỗ).", "1, tr.396"]], "fe": [["Used as a gelling agent, increasing viscosity, mucosal adhesion and release modulation (ionic sensitivity, local gelation).", "1, tr.396"]], "t": [["Bị phân hủy bởi chất oxy hóa mạnh và hỗn hợp oxy hóa–khử; dung môi hữu cơ trộn được với nước (alcol) có thể tủa gôm gellan tùy lượng thêm; bị thủy phân ở nhiệt độ cao, nhất là môi trường acid.", "1, tr.396"]], "te": [["Decomposed by strong oxidants and oxidation–reduction mixtures; Organic solvents miscible with water (alcohol) can precipitate gellan gum depending on the amount added; hydrolyzed at high temperatures, especially in acidic environments.", "1, tr.396"]], "d": [["Bột trơn chảy màu trắng đến nâu vàng; có hai dạng: acyl cao và acyl thấp.", "1, tr.396"], ["Tan trong nước khử ion nóng hoặc lạnh.", "1, tr.396"]], "de": [["White to yellow brown, slippery powder; There are two forms: high acyl and low acyl.", "1, tr.396"], ["Soluble in hot or cold deionized water.", "1, tr.396"]], "a": "gellan gum gom gellan 71010-52-1 E418 Gellan Gum"}, {"id": "gluconolactone", "n": "Gluconolactone", "nv": "Gluconolactone", "g": ["Chất acid hóa", "Chất tạo phức"], "ge": ["Acidifying agent", "Chelating / Complexing agent"], "cas": "90-80-2", "f": [["Dùng làm chất acid hóa trong chế phẩm uống và dùng ngoài; dùng làm chất tạo phức trong thuốc tiêm; được đánh giá làm tá dược dập thẳng cho viên tốt tương đương lactose khan; nghiên cứu làm chất mang trong phân tán rắn tăng hòa tan.", "1, tr.398"]], "fe": [["Used as an acidifying agent in oral and topical preparations; Used as a complexing agent in injectable drugs; Evaluated as an excipient for straightening tablets as good as anhydrous lactose; Researched as a carrier in solid dispersions to increase solubility.", "1, tr.398"]], "t": [["Tương kỵ với chất oxy hóa mạnh và base mạnh.", "1, tr.398"]], "te": [["Incompatible with strong oxidizing agents and strong bases.", "1, tr.398"]], "d": [["Bột kết tinh màu trắng, không mùi, vị ngọt; thủy phân một phần thành acid gluconic khi có nước (nhanh hơn ở nhiệt độ và pH cao).", "1, tr.398"], ["Dễ tan trong nước lạnh (59 g/100 mL); ít tan trong ethanol; không tan trong ether.", "1, tr.398"]], "de": [["White crystalline powder, odorless, sweet taste; Partially hydrolyzed to gluconic acid in the presence of water (faster at high temperature and pH).", "1, tr.398"], ["Easily soluble in cold water (59 g/100 mL); Slightly soluble in ethanol; insoluble in ether.", "1, tr.398"]], "a": "gluconolactone gluconolacton glucono delta-lactone gdl 90-80-2 E575 Gluconolactone Glucono delta lactone (GDL) Gluconic acid lactone Dgluconic acid lactone gluconic acid ỗ-lactone D-gluconic acid Slactone 1,5-gluconolactone glucono ỗ-lactone P-glucono-1,5lactone D-glucono-l,5-lactone ỗ-gluconolatone"}, {"id": "glucose-liquid", "n": "Glucose, Liquid", "nv": "Liquid Glucose; Glucose, Liquid", "g": ["Chất tạo màng bao", "Chất tạo ngọt", "Tá dược dính (viên nén/nang)"], "ge": ["Coating agent", "Sweetening agent", "Tablet / capsule binder"], "cas": "", "f": [["Dùng làm nền cho dung dịch và siro uống, và làm chất xát hạt, chất bao trong sản xuất viên nén; trong dịch đường bao viên dùng để làm chậm kết tinh sucrose. Nồng độ tham khảo: chất xát hạt 5–10%, tá dược siro uống 20–60%, bao viên 10–20%.", "1, tr.400"]], "fe": [["Used as a base for oral solutions and syrups, and as a granulating and coating agent in tablet production; in tablet-coating sugar solution used to slow down sucrose crystallization. Reference concentration: grain grinding agent 5–10%, oral syrup excipients 20–60%, tablet coating 10–20%.", "1, tr.400"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.400"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.400"]], "d": [["Là dung dịch nước của nhiều hợp chất, chủ yếu dextrose, dextrin, fructose và maltose; chất lỏng nhớt, ngọt, không mùi, màu từ không màu đến vàng rơm.", "1, tr.400"], ["Trộn lẫn với nước; trộn lẫn một phần với ethanol 90%.", "1, tr.400"]], "de": [["An aqueous solution of many compounds, mainly dextrose, dextrin, fructose and maltose; viscous, sweet, odorless liquid, color from colorless to straw yellow.", "1, tr.400"], ["Mix with water; partially mixed with 90% ethanol.", "1, tr.400"]], "a": "liquid glucose glucose long siro glucose glucose syrup 8027-56-3 Liquid Glucose Glucose, Liquid Corn syrup C*PharmSweet Flolys Glucomalt Glucoplus glucosum liquidum Glucosiveet Mylose Roclys starch syrup"}, {"id": "glycerin", "n": "Glycerin", "nv": "Glycerol; Concentrated Glycerin; Glycerin", "g": ["Chất bảo quản kháng khuẩn", "Chất làm mềm da", "Chất giữ ẩm", "Tá dược trơn", "Chất hóa dẻo", "Dung môi", "Tá dược thuốc đạn/đặt", "Chất tạo ngọt", "Chất làm tăng độ nhớt", "Chất điều chỉnh đẳng trương"], "ge": ["Antimicrobial preservative", "Emollient", "Humectant", "Lubricant", "Plasticizer", "Solvent", "Suppository base", "Sweetening agent", "Viscosity-increasing agent", "Tonicity agent"], "cas": "56-81-5", "f": [["Dùng trong rất nhiều dạng thuốc: uống, nhỏ tai, nhỏ mắt, thuốc đặt, dùng ngoài và tiêm.", "1, tr.401"], ["Trong chế phẩm dùng ngoài và mỹ phẩm chủ yếu dùng làm chất giữ ẩm và làm mềm, và làm dung môi/đồng dung môi trong kem, nhũ tương và gel; trong thuốc tiêm dùng làm dung môi/đồng dung môi; trong dung dịch uống làm dung môi, tạo ngọt và bảo quản.", "1, tr.401"]], "fe": [["Used in many forms of medicine: oral, ear drops, eye drops, suppositories, external use and injections.", "1, tr.401"], ["In topical preparations and cosmetics mainly used as a moisturizer and emollient, and as a solvent/co-solvent in creams, emulsions and gels; in injectable drugs used as solvent/co-solvent; in oral solutions as a solvent, sweetener and preservative.", "1, tr.401"]], "t": [["Có thể nổ khi trộn với chất oxy hóa mạnh như crom trioxid, kali clorat hoặc kali permanganat; trong dung dịch loãng phản ứng chậm hơn.", "1, tr.401"]], "te": [["May explode when mixed with strong oxidizers such as chromium trioxide, potassium chlorate or potassium permanganate; In dilute solution the reaction is slower.", "1, tr.401"]], "d": [["Chất lỏng nhớt, trong, không màu, không mùi, hút ẩm, vị ngọt (~0,6 lần sucrose).", "1, tr.401"]], "de": [["Viscous liquid, clear, colorless, odorless, hygroscopic, sweet taste (~0.6 times sucrose).", "1, tr.401"]], "a": "glycerin glycerol glycerin 56-81-5 E422 Glycerol Concentrated Glycerin Glycerin Croderol Emery 912 glicerol glycerine Glycerine Codex glycerolum Glycon G-100 IFP Kemstrene optim Pricerine propanetriol 1,2,3speziol G trihydroxypropane"}, {"id": "glyceryl-behenate", "n": "Glyceryl Behenate", "nv": "Glycerol Dibehenate", "g": ["Chất tạo màng bao", "Tá dược phóng thích biến đổi", "Tá dược dính (viên nén/nang)", "Tá dược trơn bóng (viên nén/nang)", "Chất che vị", "Chất làm tăng độ nhớt"], "ge": ["Coating agent", "Modified-release agent", "Tablet / capsule binder", "Tablet / capsule glidant", "Taste-masking agent", "Viscosity-increasing agent"], "cas": "30233-64-8, 94201-62-4, 18641-57-1", "f": [["Dùng làm cốt hoặc màng bao ưa lipid cho viên nén/nang giải phóng kéo dài (>10%); tá dược trơn (1,0–3,0%); chất che vị (5,0–15,0%); và chất tăng độ nhớt trong mỹ phẩm.", "1, tr.405"]], "fe": [["Used as a lipophilic base or coating for extended-release tablets/capsules (>10%); plain excipients (1.0–3.0%); flavor masking agent (5.0–15.0%); and viscosity increasing agents in cosmetics.", "1, tr.405"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.405"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.405"]], "d": [["Bột mịn màu trắng ngà/vàng trắng, khối/viên sáp cứng hoặc mảnh trơn nhờn màu trắng; mùi nhẹ, không vị.", "1, tr.405"], ["Tan trong methylen clorid; khi đun nóng tan trong cloroform và nhiều dung môi hữu cơ; thực tế không tan trong ethanol 95% lạnh, hexan, dầu khoáng và nước.", "1, tr.405"]], "de": [["Ivory white/yellowish white fine powder, hard wax blocks/pellets or white greasy flakes; mild odor, tasteless.", "1, tr.405"], ["Soluble in methylene chloride; When heated, it dissolves in chloroform and many organic solvents; Practically insoluble in cold 95% ethanol, hexane, mineral oils and water.", "1, tr.405"]], "a": "glyceryl behenate glyceryl behenat compritol 888 glyceryl dibehenate 18641-57-1 Glycerol Dibehenate Glyceryl Behenate Bebenin Compritol 888 ATO Compritol E ATO docosanoic acid, dihydroxypropyl 2,3ester docosanoin DUB BG E471 glycerol behenate glyceroli dibehenas glyceryl monobehenate glyceryl tridocosanoate 1,2,3-propanetriol docosanoate"}, {"id": "glyceryl-laurate", "n": "Glyceryl Laurate", "nv": "Glyceryl laurat", "g": ["Chất làm mềm da", "Chất nhũ hóa", "Chất ổn định nhũ tương", "Chất làm tăng độ tan", "Chất diện hoạt không ion hóa", "Chất làm tăng độ nhớt"], "ge": ["Emollient", "Emulsifying agent", "Emulsion stabilizer", "Solubilizing agent", "Nonionic surfactant", "Viscosity-increasing agent"], "cas": "142-18-7", "f": [["Dùng làm chất nhũ hóa không ion, chất ổn định, làm mềm và làm đặc trong chế phẩm dùng ngoài; có phần hoạt tính kháng khuẩn và tác dụng tăng thấm/tăng hấp thu (do tăng độ tan hoạt chất).", "1, tr.409"]], "fe": [["Used as a non-ionic emulsifier, stabilizer, softener and thickener in topical preparations; Has antibacterial activity and increases permeability/absorption (due to increased solubility of active ingredients).", "1, tr.409"]], "t": [["Tương kỵ với chất oxy hóa mạnh, acid, kiềm và sản phẩm tự bốc cháy; hoạt tính kháng khuẩn bị bất hoạt bởi chất diện hoạt không ion ethoxyl/propoxyl hóa (như polysorbat 80) và natri lauryl sarcosin.", "1, tr.409"]], "te": [["Incompatible with strong oxidizers, acids, alkalis and spontaneous combustion products; Antibacterial activity is inactivated by ethoxyl/propoxylated nonionic surfactants (such as polysorbate 80) and sodium lauryl sarcosine.", "1, tr.409"]], "d": [["Bột, hạt, viên sáp hoặc bột nhão màu trắng đến trắng ngà/kem, mùi béo nhẹ.", "1, tr.409"], ["Tan trong cloroform, methanol, ethanol, toluen và dầu khoáng; thực tế không tan trong nước nhưng phân tán được ở 60 °C.", "1, tr.409"]], "de": [["White to off-white/creamy white powder, granules, wax pellets or paste, mild fatty odor.", "1, tr.409"], ["Soluble in chloroform, methanol, ethanol, toluene and mineral oil; practically insoluble in water but dispersible at 60 °C.", "1, tr.409"]], "a": "glyceryl laurate glyceryl laurat monolaurin 142-18-7 Aldo MLD KFG Cithrol GML Colonial Monolaurin dodecanoic acid, 2,3-dihydroxypropyl ester glycerol laurate glycerol monolaurate glycerin 1-monolaurate glyceryl monolaurate GML Imwitor 312 lauricidin 1-lauroyl-rac-glycerol Lumulse GML K 1-monolaurin Ultrapure GML"}, {"id": "glyceryl-monooleate", "n": "Glyceryl Monooleate", "nv": "Glyceryl Monooleate", "g": ["Vật liệu kết dính sinh học", "Chất làm mềm da", "Chất nhũ hóa", "Chất ổn định nhũ tương", "Chất tạo gel", "Tá dược phóng thích biến đổi", "Chất diện hoạt không ion hóa"], "ge": ["Bioadhesive material", "Emollient", "Emulsifying agent", "Emulsion stabilizer", "Gelling agent", "Modified-release agent", "Nonionic surfactant"], "cas": "25496-72-4", "f": [["Là lipid phân cực trương trong nước tạo nhiều pha có tính lưu biến khác nhau; grade không nhũ hóa dùng làm chất làm mềm và nhũ hóa cho nhũ tương nước/dầu, ổn định nhũ tương dầu/nước; grade tự nhũ hóa làm chất nhũ hóa chính cho hệ dầu/nước.", "1, tr.411"], ["Tạo gel pha lập phương trật tự cao trong lượng nước dư, dùng cho giải phóng kéo dài.", "1, tr.411"]], "fe": [["It is a polar lipid that swells in water, creating many phases with different rheology; non-emulsifying grade used as an emollient and emulsifier for water/oil emulsions, stabilizes oil/water emulsions; grade is self-emulsifying as the main emulsifier for oil/water systems.", "1, tr.411"], ["Creates highly ordered cubic phase gels in excess water, for sustained release.", "1, tr.411"]], "t": [["Tài liệu chưa đề cập.", "1, tr.411"]], "te": [["Documents not mentioned.", "1, tr.411"]], "d": [["Chất lỏng dạng dầu màu hổ phách, có thể rắn một phần ở nhiệt độ phòng, mùi đặc trưng.", "1, tr.411"], ["Tan trong cloroform, ethanol 95%, ether, dầu khoáng và dầu thực vật; thực tế không tan trong nước (grade tự nhũ hóa phân tán được trong nước).", "1, tr.411"]], "de": [["Amber oily liquid, partially solid at room temperature, characteristic odor.", "1, tr.411"], ["Soluble in chloroform, 95% ethanol, ether, mineral oil and vegetable oil; practically insoluble in water (self-emulsifying grade dispersible in water).", "1, tr.411"]], "a": "glyceryl monooleate glyceryl monooleat glycerol monooleate 111-03-5 Glycerol Mono-oleate Aldo MO Atlas G-695 Capmul GMO Drewmulse GMO DUB OG DUBCARE OG glycerol-l-oleate glyceroli mono-oleas glyceryl mono-oleate glyceryl oleate HallStar GMO Imwitor 948 Kessco GMO Ligalub monolein Monomuls 90-018 mono olein a-mono-olein glycerol Peceol Glyceryl Monooleate"}, {"id": "glyceryl-monostearate", "n": "Glyceryl Monostearate", "nv": "Glycerol Monostearate 40-55; Glyceryl Monostearate", "g": ["Chất làm mềm da", "Chất nhũ hóa", "Chất ổn định nhũ tương", "Tá dược phóng thích biến đổi", "Chất làm tăng độ tan", "Dung môi", "Tá dược trơn bóng (viên nén/nang)"], "ge": ["Emollient", "Emulsifying agent", "Emulsion stabilizer", "Modified-release agent", "Solubilizing agent", "Solvent", "Tablet / capsule glidant"], "cas": "", "f": [["Dùng làm chất nhũ hóa không ion, chất ổn định, làm mềm và hóa dẻo trong thực phẩm, dược phẩm và mỹ phẩm; là dung môi chung cho hợp chất phân cực và không phân cực, tạo nhũ tương nước/dầu hoặc dầu/nước.", "1, tr.413"], ["Cũng dùng làm chất phân tán pigment/chất rắn trong dầu-mỡ; dùng trong kỹ thuật nóng chảy (hot-melt) để tạo hạt và viên nén.", "1, tr.413"]], "fe": [["Used as a non-ionic emulsifier, stabilizer, softener and plasticizer in foods, pharmaceuticals and cosmetics; It is a general solvent for polar and non-polar compounds, forming water/oil or oil/water emulsions.", "1, tr.413"], ["Also used as a pigment/solid dispersant in oils and greases; Used in hot-melt technique to create granules and tablets.", "1, tr.413"]], "t": [["Grade tự nhũ hóa của glyceryl monostearat tương kỵ với chất có tính acid.", "1, tr.413"]], "te": [["Self-emulsifying grade of glyceryl monostearate is incompatible with acidic substances.", "1, tr.413"]], "d": [["Sáp màu trắng; là hỗn hợp monoacylglycerol (chủ yếu monostearoylglycerol) cùng di- và triacylglycerol.", "1, tr.413"], ["Tan trong ethanol nóng, ether, cloroform, aceton nóng, dầu khoáng và dầu béo; thực tế không tan trong nước nhưng phân tán được nhờ ít xà phòng/chất diện hoạt.", "1, tr.413"]], "de": [["White wax; is a mixture of monoacylglycerol (mainly monostearoylglycerol) with di- and triacylglycerol.", "1, tr.413"], ["Soluble in hot ethanol, ether, chloroform, hot acetone, mineral oils and fatty oils; Practically insoluble in water but dispersible thanks to a small amount of soap/surfactant.", "1, tr.413"]], "a": "glyceryl monostearate glyceryl monostearat gms mono- and diglycerides 31566-31-1 Glycerol Monostearate 40-55 Glyceryl Monostearate Capmul GMS-50K Cutina GMS V Dermowax GMS 2,3dihydroxypropyl octadecanoate DUBCARE GMS Em
