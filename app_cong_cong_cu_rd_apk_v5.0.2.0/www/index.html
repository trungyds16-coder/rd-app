color in the presence of iron; hydrolyzed by weak alkalis and strong acids.", "1, tr.130"]], "d": [["Tinh thể không màu hoặc bột kết tinh màu trắng, không mùi hoặc gần như không mùi, không vị.", "1, tr.130"], ["Rất dễ tan trong aceton, ethanol, ether; rất ít tan trong nước.", "1, tr.130"]], "de": [["Colorless crystals or white crystalline powder, odorless or almost odorless, tasteless.", "1, tr.130"], ["Very soluble in acetone, ethanol, ether; very little soluble in water.", "1, tr.130"]], "a": "butylparaben butyl parahydroxybenzoate 94-26-8 E209 Butyl Parahydroxybenzoate Butyl Hydroxybenzoate Butylparaben Benzoic acid, 4-hydroxy-, butyl ester Butoben Butyl Chemosept', butyl p-hydroxybenzoate Butyl Para sept', butylis parahydroxybenzoas CoSept B 4-hydroxybenzoic acid butyl ester Nipagin', Lexgard B Nipabutyl Tegosept B Trisept B Uniphen P-23 Unisept B"}, {"id": "calcium-acetate", "n": "Calcium Acetate", "nv": "Calcium Acetate", "g": ["Chất bảo quản kháng khuẩn", "Chất tạo phức"], "ge": ["Antimicrobial preservative", "Chelating / Complexing agent"], "cas": "62-54-4", "f": [["Dùng làm chất bảo quản trong chế phẩm uống và dùng ngoài; trong thực phẩm dùng làm chất ổn định, chất đệm và chất tạo phức.", "1, tr.134"]], "fe": [["Used as a preservative in oral and topical preparations; In foods used as a stabilizer, buffering agent and complexing agent.", "1, tr.134"]], "t": [["Tương kỵ với chất oxy hóa mạnh và độ ẩm.", "1, tr.134"]], "te": [["Incompatible with strong oxidizers and moisture.", "1, tr.134"]], "d": [["Bột màu trắng/gần trắng, hút ẩm, không mùi hoặc gần như không mùi.", "1, tr.134"], ["Tan trong nước; ít tan trong methanol; thực tế không tan trong aceton, ethanol và benzen.", "1, tr.134"]], "de": [["White/almost white powder, hygroscopic, odorless or almost odorless.", "1, tr.134"], ["Soluble in water; Slightly soluble in methanol; Practically insoluble in acetone, ethanol and benzene.", "1, tr.134"]], "a": "calcium acetate calci acetat 62-54-4 E263 Calcium Acetate Acetate of lime acetic acid, calcium salt brown acetate calcii acetas calcium diacetate gray acetate lime acetate lime pyrolignite vinegar salts"}, {"id": "calcium-alginate", "n": "Calcium Alginate", "nv": "Calci alginat", "g": ["Chất nhũ hóa", "Tá dược phóng thích biến đổi", "Tá dược rã (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Emulsifying agent", "Modified-release agent", "Tablet / capsule disintegrant", "Viscosity-increasing agent"], "cas": "9005-35-0", "f": [["Trong dược phẩm, calci alginat và calci-natri alginat được dùng làm tá dược rã cho viên nén; khai thác tính tạo gel của calci alginat trong nhiều hệ đưa thuốc đường uống.", "1, tr.135"], ["Hạt calci alginat được dùng bào chế hệ nổi dạ dày và hệ giải phóng kéo dài/kiểm soát cho nhiều hoạt chất.", "1, tr.135"]], "fe": [["In pharmaceuticals, calcium alginate and calcium-sodium alginate are used as disintegrants for tablets; Exploiting the gel-forming properties of calcium alginate in many oral drug delivery systems.", "1, tr.135"], ["Calcium alginate granules are used to prepare gastric floss and sustained/controlled release systems for many active ingredients.", "1, tr.135"]], "t": [["Tương kỵ với kiềm và muối kiềm; propranolol hydroclorid gắn vào phân tử alginat (cạnh tranh vị trí với ion calci) làm cản trở hình thành cấu trúc gel; một số kháng khuẩn dùng ngoài có thể tương kỵ với băng calci alginat.", "1, tr.135"]], "te": [["Incompatible with alkalis and alkaline salts; propranolol hydrochloride attaches to the alginate molecule (competing for position with calcium ions), preventing the formation of a gel structure; Some topical antibacterials may be incompatible with calcium alginate dressings.", "1, tr.135"]], "d": [["Bột hoặc sợi màu trắng đến nâu vàng nhạt, không mùi hoặc gần như không mùi, không vị.", "1, tr.135"], ["Thực tế không tan trong cloroform, ethanol, ether, nước; tan trong dung dịch natri citrat, natri bicarbonat và natri clorid.", "1, tr.135"]], "de": [["White to light yellow brown powder or fiber, odorless or almost odorless, tasteless.", "1, tr.135"], ["Practically insoluble in chloroform, ethanol, ether, water; Soluble in sodium citrate, sodium bicarbonate and sodium chloride solutions.", "1, tr.135"]], "a": "calcium alginate calci alginat 9005-35-0 Alginato calcico algin alginic acid, calcium salt CA33 calc algin calcium polymannuronate Calginate-, E404"}, {"id": "calcium-carbonate", "n": "Calcium Carbonate", "nv": "Calcium Carbonate; Precipitated Calcium Carbonate", "g": ["Chất đệm", "Chất tạo độ đục", "Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)"], "ge": ["Buffering agent", "Opacifying agent", "Tablet / capsule binder", "Tablet / capsule diluent"], "cas": "471-34-1", "f": [["Chủ yếu dùng trong dạng thuốc rắn làm tá dược độn; cũng dùng làm chất đệm, chất hỗ trợ rã trong viên phân tán, chất độn trong quá trình bao đường và chất tạo độ đục trong màng bao phim.", "1, tr.138"]], "fe": [["Mainly used in solid dosage forms as filler excipients; Also used as a buffer, disintegration aid in dispersible tablets, filler in sugar coating and turbidity agent in film coating.", "1, tr.138"]], "t": [["Tương kỵ với acid và muối amoni.", "1, tr.138"]], "te": [["Incompatible with acids and ammonium salts.", "1, tr.138"]], "d": [["Bột hoặc tinh thể màu trắng, không mùi, không vị.", "1, tr.138"], ["Thực tế không tan trong ethanol 95% và nước; độ tan trong nước tăng khi có muối amoni hoặc carbon dioxid.", "1, tr.138"]], "de": [["White powder or crystals, odorless, tasteless.", "1, tr.138"], ["Practically insoluble in 95% ethanol and water; Water solubility increases in the presence of ammonium salts or carbon dioxide.", "1, tr.138"]], "a": "calcium carbonate calci carbonat 471-34-1 E170 Calcium Carbonate Precipitated Calcium Carbonate Balcarb Cal-Carb calcii Carbonas calcii Carbonas praecipitatus calcium carbonate (1:1) Calcipress Calopake carbonic acid calcium salt (1:1) creta preparada Destab El70 MagGran CC Pharma-Carb precipitated calcium carbonate precipitated carbo nate of lime precipitated chalk Sturcal Vicality Vivapress wit carb Vivapress Ca"}, {"id": "calcium-chloride", "n": "Calcium Chloride", "nv": "Calcium Chloride Dihydrate; Calcium Chloride", "g": ["Chất bảo quản kháng khuẩn", "Chất hút ẩm"], "ge": ["Antimicrobial preservative", "Desiccant / Hygroscopic agent"], "cas": "10043-52-4, 10035-04-8, 7774-34-7", "f": [["Ứng dụng chủ yếu liên quan đến tính hút nước, nên được dùng làm chất bảo quản kháng khuẩn và chất hút ẩm.", "1, tr.141"]], "fe": [["The main application is related to water absorption, so it is used as an antibacterial preservative and desiccant.", "1, tr.141"]], "t": [["Tương kỵ với carbonat, phosphat, sulfat và tartrat tan; phản ứng mãnh liệt với brom trifluorid; phản ứng với kẽm giải phóng khí hydro dễ nổ; phản ứng tỏa nhiệt với nước.", "1, tr.141"]], "te": [["Incompatible with carbonates, phosphates, sulfates and soluble tartrates; reacts violently with bromine trifluoride; reacts with zinc to release explosive hydrogen gas; exothermic reaction with water.", "1, tr.141"]], "d": [["Bột kết tinh, hạt hoặc khối tinh thể màu trắng/không màu; hút ẩm mạnh (chảy nước).", "1, tr.141"], ["Rất dễ tan trong nước và ethanol 95%; không tan trong diethyl ether.", "1, tr.141"]], "de": [["White/colorless crystalline powder, granules or crystalline masses; strongly hygroscopic (watery).", "1, tr.141"], ["Very soluble in water and 95% ethanol; insoluble in diethyl ether.", "1, tr.141"]], "a": "calcium chloride calci clorid 10043-52-4 Calcium Chloride Dihydrate Calcium Chloride Hydrate Calcium Chloride Calcii chloridum dihvdricum Calcium Chloride Hexahydrate"}, {"id": "calcium-lactate", "n": "Calcium Lactate", "nv": "Calcium Lactate; Calcium Lactate Pentahydrate", "g": ["Chất bảo quản kháng khuẩn", "Chất đệm", "Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Antimicrobial preservative", "Buffering agent", "Tablet / capsule binder", "Tablet / capsule diluent", "Viscosity-increasing agent"], "cas": "814-80-2, 41372-22-9, 5743-47-5", "f": [["Dùng làm chất tăng sinh khả dụng và chất bổ sung dinh dưỡng; grade calci lactat pentahydrat phun sấy được dùng làm tá dược độn cho viên nén dập thẳng nhờ khả năng nén tốt.", "1, tr.144"]], "fe": [["Used as bioavailability enhancer and nutritional supplement; Spray-dried grade calcium lactate pentahydrate is used as a filler excipient for linear tablets thanks to its good compressibility.", "1, tr.144"]], "t": [["Các muối calci (kể cả lactat) có thể tương kỵ vật lý với phosphat trong chế độ ăn hoặc chế phẩm, ví dụ trong hỗn hợp nuôi ăn qua ống.", "1, tr.144"]], "te": [["Calcium salts (including lactate) may be physically incompatible with phosphate in the diet or preparation, for example in tube feeding mixtures.", "1, tr.144"]], "d": [["Bột kết tinh hoặc dạng hạt màu trắng/gần trắng, hơi lên hoa (efflorescent).", "1, tr.144"], ["Tan trong nước, dễ tan trong nước sôi; rất ít tan trong ethanol 95%.", "1, tr.144"]], "de": [["White/almost white, slightly efflorescent, crystalline powder or granules.", "1, tr.144"], ["Soluble in water, easily soluble in boiling water; Very slightly soluble in 95% ethanol.", "1, tr.144"]], "a": "calcium lactate calci lactat 814-80-2 E327 Calcium Lactate Calcium Lactate Pentahydrate Calcium Lactate Hydrate Calcii lactas pentahydricus calcium bis(2-hydroxypropanoate) pentahydrate calcium dilactate calcium lactate (1:2) hydrate calcium lactate (1:2) pentahydrate 2-hydroxypropanoic acid, calcium salt lactic acid, calcium salt"}, {"id": "calcium-phosphate-dibasic-anhydrous", "n": "Calcium Phosphate, Dibasic Anhydrous", "nv": "Calcium Hydrogen Phosphate; Anhydrous Dibasic Calcium Phosphate", "g": ["Tá dược độn (viên nén/nang)"], "ge": ["Tablet / capsule diluent"], "cas": "7757-93-9", "f": [["Dùng làm tá dược độn và nguồn calci trong thực phẩm bổ sung; được ưa dùng nhờ tính chịu nén tốt và lưu tính tốt của grade thô. Cơ chế biến dạng chủ yếu là gãy giòn, giúp ít nhạy với tốc độ nén nên dễ chuyển từ quy mô phòng thí nghiệm sang sản xuất.", "1, tr.146"]], "fe": [["Used as a filler and calcium source in dietary supplements; It is preferred due to the good compression resistance and good fluidity of the raw grade. The main deformation mechanism is brittle fracture, which makes it less sensitive to compression rate, making it easier to transfer from laboratory scale to production.", "1, tr.146"]], "t": [["Không nên dùng để bào chế kháng sinh nhóm tetracyclin.", "1, tr.146"]], "te": [["Should not be used to prepare tetracycline antibiotics.", "1, tr.146"]], "d": [["Bột hoặc chất rắn kết tinh màu trắng, không mùi, không vị (tinh thể tam tà).", "1, tr.146"], ["Thực tế không tan trong ether, ethanol và nước; tan trong acid loãng.", "1, tr.146"]], "de": [["White, odorless, tasteless crystalline solid or powder (Tam Ta crystals).", "1, tr.146"], ["Practically insoluble in ether, ethanol and water; soluble in dilute acid.", "1, tr.146"]], "a": "dibasic calcium phosphate anhydrous dicalci phosphat khan a-tab fujicalin 7757-93-9 E341 Calcium Hydrogen Phosphate Anhydrous Dibasic Calcium Phosphate A-TAB calcii hydrogenophosphas anhydricus calcium monohy drogen phosphate calcium orthophosphate DI-CAFOS A dical cium orthophosphate secondary calcium phosphate"}, {"id": "calcium-phosphate-dibasic-dihydrate", "n": "Calcium Phosphate, Dibasic Dihydrate", "nv": "Calcium Hydrogen Phosphate Dihydrate; Dibasic Calcium Phosphate Hydrate", "g": ["Tá dược độn (viên nén/nang)"], "ge": ["Tablet / capsule diluent"], "cas": "7789-77-7", "f": [["Dùng rộng rãi trong viên nén làm tá dược độn và nguồn calci/phospho; được ưa dùng nhờ tính chịu nén và lưu tính tốt của grade thô (cơ chế biến dạng chủ yếu là gãy giòn).", "1, tr.149"]], "fe": [["Widely used in tablets as a filler and calcium/phosphorus source; It is preferred due to the good compression resistance and fluidity of the rough grade (the main deformation mechanism is brittle fracture).", "1, tr.149"]], "t": [["Không nên dùng để bào chế kháng sinh tetracyclin; đã ghi nhận tương kỵ với indometacin, aspirin, aspartam, ampicillin, cephalexin và erythromycin.", "1, tr.149"]], "te": [["Should not be used to prepare tetracycline antibiotics; Incompatibility with indometacin, aspirin, aspartame, ampicillin, cephalexin and erythromycin has been noted.", "1, tr.149"]], "d": [["Bột hoặc chất rắn kết tinh màu trắng, không mùi, không vị (tinh thể đơn tà).", "1, tr.149"], ["Thực tế không tan trong ethanol, ether và nước; tan trong acid loãng.", "1, tr.149"]], "de": [["White, odorless, tasteless crystalline solid or powder (monoclinal crystals).", "1, tr.149"], ["Practically insoluble in ethanol, ether and water; soluble in dilute acid.", "1, tr.149"]], "a": "dibasic calcium phosphate dihydrate dicalci phosphat dihydrat emcompress 7789-77-7 E341 Calcium Hydrogen Phosphate Dihydrate Dibasic Calcium Phosphate Hydrate Dibasic Calcium Phosphate Dihydrate Calcii hydrogenophosphas dihydricus calcium hydrogen orthopho sphate dihydrate calcium monohydrogen phosphate dihydrate DICAFOS D dicalcium orthophosphate DI-TAB Emcompress secondary calcium phosphate"}, {"id": "calcium-phosphate-tribasic", "n": "Calcium Phosphate, Tribasic", "nv": "Calcium Phosphate; Tribasic Calcium Phosphate", "g": ["Chất chống vón", "Chất đệm", "Tá dược độn (viên nén/nang)"], "ge": ["Anticaking agent", "Buffering agent", "Tablet / capsule diluent"], "cas": "12167-74-7, 7758-87-4", "f": [["Dùng rộng rãi làm tá dược độn cho viên nang và tá dược độn/dính cho viên nén trong cả dập thẳng và xát hạt ướt (cơ chế liên kết chủ yếu là biến dạng dẻo); cần phối hợp tá dược trơn và tá dược rã. Được dùng nhiều nhất trong chế phẩm vitamin và khoáng chất.", "1, tr.152"]], "fe": [["Widely used as filler excipient for capsules and filler/adhesive excipient for tablets in both straight stamping and wet granulation (main binding mechanism is plastic deformation); Need to combine smoothing excipients and disintegrants. Most commonly used in vitamin and mineral preparations.", "1, tr.152"]], "t": [["Tất cả muối calci tương kỵ với kháng sinh tetracyclin; tương kỵ với tocopheryl acetat; có thể tạo phosphat ít tan với một số hormon.", "1, tr.152"]], "te": [["All calcium salts are incompatible with tetracycline antibiotics; Incompatible with tocopheryl acetate; May form sparingly soluble phosphate with some hormones.", "1, tr.152"]], "d": [["Là hỗn hợp các calci phosphat; PhEur quy định chứa 35,0–40,0% calci.", "1, tr.152"], ["Tan trong acid vô cơ loãng; rất ít tan trong nước; thực tế không tan trong acid acetic và các alcol.", "1, tr.152"]], "de": [["Is a mixture of calcium phosphate; PhEur is prescribed to contain 35.0–40.0% calcium.", "1, tr.152"], ["Soluble in dilute inorganic acids; very slightly soluble in water; Practically insoluble in acetic acid and alcohols.", "1, tr.152"]], "a": "tribasic calcium phosphate tricalci phosphat calcium hydroxyapatite 7758-87-4 E341 Calcium Phosphate Tribasic Calcium Phosphate Calcium orthophosphate E341(iii) hydroxylapatite phosphoric acid calcium salt (2:3) precipitated calcium phosphate tertiary calcium phosphate TRI-CAFOS'y tricalcii phosphas tricalcium diorthophosphate tricalcium orthophosphate tricalcium phos phate TRI-CAL WG TRI-TAB"}, {"id": "calcium-polycarbophil", "n": "Calcium Polycarbophil", "nv": "Calcium Polycarbophil", "g": ["Chất hấp phụ", "Tá dược phóng thích biến đổi", "Tá dược dính (viên nén/nang)"], "ge": ["Adsorbent", "Modified-release agent", "Tablet / capsule binder"], "cas": "9003-97-8", "f": [["Là polymer hút nước dùng bào chế viên ngậm, viên và viên nén; khả năng hút nước phụ thuộc chiều dài mạch polymer, mức độ khâu mạch và pH môi trường; dùng làm tá dược dính và để điều biến giải phóng chất đệm trong viên ngậm nicotin.", "1, tr.154"]], "fe": [["Is a water-absorbing polymer used to prepare lozenges, tablets and tablets; Water absorption ability depends on polymer chain length, degree of crosslinking and environmental pH; used as an adhesive excipient and to modulate the release of buffering agents in nicotine lozenges.", "1, tr.154"]], "t": [["Tài liệu chưa đề cập.", "1, tr.154"]], "te": [["Documents not mentioned.", "1, tr.154"]], "d": [["Bột màu trắng đến trắng kem, mùi acetic nhẹ.", "1, tr.154"], ["Không tan trong nước, acid loãng, kiềm loãng và các dung môi hữu cơ thông thường.", "1, tr.154"]], "de": [["White to creamy white powder, mild acetic odor.", "1, tr.154"], ["Insoluble in water, dilute acids, dilute alkalis and common organic solvents.", "1, tr.154"]], "a": "calcium polycarbophil calci polycarbophil 9003-97-8 Calcium Polycarbophil Noveon CA polycarbophil calcium. Structural Formula Ca2+"}, {"id": "calcium-silicate", "n": "Calcium Silicate", "nv": "Calcium Silicate", "g": ["Chất hấp phụ", "Chất chống vón", "Chất tạo độ đục", "Tá dược độn (viên nén/nang)"], "ge": ["Adsorbent", "Anticaking agent", "Opacifying agent", "Tablet / capsule diluent"], "cas": "1344-95-2", "f": [["Dùng làm tá dược độn hỗ trợ cho chế phẩm uống; cũng dùng làm chất kháng acid. Ứng dụng chính liên quan đến tính chống vón, nên dùng trong bột rắc và nhiều sản phẩm mỹ phẩm.", "1, tr.156"]], "fe": [["Used as a filler excipient to support oral preparations; Also used as an antacid. The main application involves anti-caking properties, so it is used in sprinkles and many cosmetic products.", "1, tr.156"]], "t": [["Tài liệu chưa đề cập.", "1, tr.156"]], "te": [["Documents not mentioned.", "1, tr.156"]], "d": [["Chất kết tinh hoặc vô định hình màu trắng/trắng ngà, thường tồn tại ở các dạng hydrat khác nhau.", "1, tr.156"]], "de": [["White/off-white crystalline or amorphous substance, often existing in various hydrate forms.", "1, tr.156"]], "a": "calcium silicate calci silicat 1344-95-2 E552 Calcium Silicate Calcium hydrosilicate calcium metasilicate calcium monosilicate calcium polysilicate Micro-Cel okenite silicic acid, calcium salt tobermorite"}, {"id": "calcium-stearate", "n": "Calcium Stearate", "nv": "Calcium Stearate", "g": ["Tá dược trơn bóng (viên nén/nang)"], "ge": ["Tablet / capsule glidant"], "cas": "1592-23-0", "f": [["Chủ yếu dùng làm tá dược trơn trong sản xuất viên nén và viên nang ở nồng độ tới 1,0% kl/kl; có tính chống dính và bôi trơn tốt nhưng khả năng điều hòa trơn chảy kém. Cũng dùng làm chất nhũ hóa, ổn định và gây treo.", "1, tr.157"]], "fe": [["Mainly used as a plain excipient in the production of tablets and capsules at concentrations up to 1.0% w/kl; Has good anti-sticking and lubricating properties but poor flow regulation ability. Also used as an emulsifier, stabilizer and suspending agent.", "1, tr.157"]], "t": [["Tương kỵ với chất oxy hóa mạnh, acid vô cơ, kiềm, acid hữu cơ và amin phân tử lượng thấp.", "1, tr.157"]], "te": [["Incompatible with strong oxidizers, inorganic acids, alkalis, organic acids and low molecular weight amines.", "1, tr.157"]], "d": [["Bột xốp mịn màu trắng đến trắng vàng, mùi nhẹ đặc trưng; trơn nhờn, không sạn.", "1, tr.157"], ["Thực tế không tan trong ethanol 95%, ether, cloroform, aceton và nước; ít tan trong alcol nóng và dầu nóng.", "1, tr.157"]], "de": [["White to yellowish white fine porous powder, characteristic mild odor; Smooth, not gritty.", "1, tr.157"], ["Practically insoluble in 95% ethanol, ether, chloroform, acetone and water; Slightly soluble in hot alcohol and hot oil.", "1, tr.157"]], "a": "calcium stearate calci stearat 1592-23-0 E470 Calcium Stearate H Calcii stearas calcium distearate calcium octadecanoate Ceasit PC Kemistah EC-F octadecanoic acid, calcium salt stearic acid, calcium salt Synpro. 3 Ca2+"}, {"id": "calcium-sulfate", "n": "Calcium Sulfate", "nv": "Calcium Sulphate Dihydrate; Calcium Sulfate", "g": ["Chất hút ẩm", "Tá dược độn (viên nén/nang)"], "ge": ["Desiccant / Hygroscopic agent", "Tablet / capsule diluent"], "cas": "7778-18-9, 10101-41-4", "f": [["Dạng dihydrat dùng trong viên nén và viên nang; dạng hạt có tính chịu nén tốt và khả năng rã vừa phải. Dạng khan hút ẩm nên dùng làm chất hút ẩm, nhưng không khuyến cáo cho viên nén/nang/bột uống vì hút nước làm viên cứng và không rã.", "1, tr.160"]], "fe": [["Dihydrate form used in tablets and capsules; The granular form has good compressive properties and moderate disintegration ability. The anhydrous form should be used as a desiccant, but is not recommended for tablets/capsules/oral powder because it absorbs water, making the tablets hard and not disintegrating.", "1, tr.160"]], "t": [["Khi có ẩm, muối calci có thể tương kỵ với amin, amino acid, peptid và protein (tạo phức); cản trở sinh khả dụng của tetracyclin; dự kiến tương kỵ với indometacin, aspirin, aspartam, ampicillin, cephalexin và erythromycin.", "1, tr.160"]], "te": [["In the presence of moisture, calcium salts can be incompatible with amines, amino acids, peptides and proteins (forming complexes); interferes with the bioavailability of tetracycline; Expected incompatibility with indometacin, aspirin, aspartame, ampicillin, cephalexin and erythromycin.", "1, tr.160"]], "d": [["Calci sulfat và dạng dihydrat đều là bột hoặc hạt mịn màu trắng/trắng ngà, không mùi, không vị.", "1, tr.160"], ["Xem độ tan: thực tế không tan trong ethanol 95%; ít tan trong nước (1 trong 375).", "1, tr.160"]], "de": [["Calcium sulfate and dihydrate are both white/ivory white powder or fine granules, odorless and tasteless.", "1, tr.160"], ["See solubility: practically insoluble in 95% ethanol; Slightly soluble in water (1 in 375).", "1, tr.160"]], "a": "calcium sulfate calci sulfat gypsum 7778-18-9 E516 Calcium Sulphate Dihydrate Calcium Sulfate Dihydrate Calcium sulfate anhydrous anhydrite anhydrous gypsum anhy drous sulfate of lime Destab Drierite karstenite muriacite calcii sulfas dihydricus CalTah Compactrol light spar mineral white native calcium sulfate precipitated calcium sulfate satinite satin spar selenite terra alba USG Terra Alba Calcium Sulfate"}, {"id": "canola-oil", "n": "Canola Oil", "nv": "Refined Rapeseed Oil; Rapeseed Oil, Refined; Canola Oil", "g": ["Chất làm mềm da", "Tá dược trơn", "Tá dược dầu"], "ge": ["Emollient", "Lubricant", "Oleaginous vehicle"], "cas": "120962-03-0", "f": [["Là dầu hạt cải tinh chế (hàm lượng acid erucic thấp); trong dược phẩm chủ yếu dùng trong chế phẩm dùng ngoài như xà phòng mềm và thuốc xoa.", "1, tr.163"]], "fe": [["Is refined rapeseed oil (low erucic acid content); In pharmaceuticals, it is mainly used in external preparations such as soft soaps and lotions.", "1, tr.163"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.163"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.163"]], "d": [["Chất lỏng dạng dầu, trong, màu vàng nhạt, vị nhạt.", "1, tr.163"], ["Tan trong cloroform và ether; thực tế không tan trong ethanol 95%; trộn lẫn với dầu béo.", "1, tr.163"]], "de": [["Oily liquid, clear, light yellow, bland taste.", "1, tr.163"], ["Soluble in chloroform and ether; practically insoluble in 95% ethanol; mixed with fatty oil.", "1, tr.163"]], "a": "canola oil dau canola rapeseed oil 8002-13-9 Refined Rapeseed Oil Rapeseed Oil, Refined Canola Oil Canbra oil Colzao CT huile de colza Lipex 108 Lipex 204 Lipovol CAN low erucic acid colza oil low erucic acid rapeseed oil rapae oleum raffinatum tower rapeseed oil"}, {"id": "carbomer", "n": "Carbomer", "nv": "Carbomers", "g": ["Vật liệu kết dính sinh học", "Chất nhũ hóa", "Chất ổn định nhũ tương", "Tá dược phóng thích biến đổi", "Chất gây treo", "Chất làm tăng độ nhớt"], "ge": ["Bioadhesive material", "Emulsifying agent", "Emulsion stabilizer", "Modified-release agent", "Suspending agent", "Viscosity-increasing agent"], "cas": "9003-01-4, 9007-16-3, 9007-17-4", "f": [["Dùng trong chế phẩm lỏng/bán rắn làm chất điều chỉnh lưu biến và chất nhũ hóa cho nhũ tương dầu/nước dùng ngoài (kem, gel, lotion, thuốc mỡ) cho các đường mắt, trực tràng, dùng ngoài và âm đạo.", "1, tr.165"], ["Trong viên nén dùng làm tá dược kiểm soát giải phóng, đơn độc hoặc phối hợp polymer khác (như hypromellose); khác polymer mạch thẳng, độ nhớt cao hơn không làm giải phóng chậm hơn.", "1, tr.165"]], "fe": [["Used in liquid/semi-solid preparations as a rheology modifier and emulsifier for topical oil/water emulsions (creams, gels, lotions, ointments) for ocular, rectal, topical and vaginal applications.", "1, tr.165"], ["In tablets used as a controlled-release excipient, alone or in combination with another polymer (such as hypromellose); Unlike linear polymers, higher viscosity does not result in slower release.", "1, tr.165"]], "t": [["Bị đổi màu bởi resorcinol; tương kỵ với phenol, polymer cation, acid mạnh và nồng độ chất điện giải cao; vết sắt và kim loại chuyển tiếp xúc tác phân hủy phân tán carbomer; một số hoạt chất chứa amin tạo phức với carbomer.", "1, tr.165"]], "te": [["Discolored by resorcinol; Incompatible with phenol, cationic polymers, strong acids and high electrolyte concentrations; trace iron and transition metal catalytic decomposition of carbomer dispersion; Some active ingredients contain amines complexed with carbomers.", "1, tr.165"]], "d": [["Bột xốp màu trắng, có tính acid, hút ẩm, mùi nhẹ đặc trưng (có grade dạng hạt).", "1, tr.165"], ["Trương nở trong nước và glycerin, và (sau khi trung hòa) trong ethanol 95%; không hòa tan mà chỉ trương mạnh do là vi gel khâu mạch ba chiều.", "1, tr.165"]], "de": [["White porous powder, acidic, hygroscopic, characteristic mild odor (granular grade).", "1, tr.165"], ["Swells in water and glycerin, and (after neutralization) in 95% ethanol; does not dissolve but only swells strongly because it is a three-dimensional cross-linking microgel.", "1, tr.165"]], "a": "carbomer carbopol carbomer acrylic acid polymer 9007-20-9 Carbomers Carbomer Acrypol Acritamer, acrylic acid polymer carbomera Carbopol, carboxy polymethylene carboxyvinyl polymer Pemulen, poly acrylic acid Tego Carbomer"}, {"id": "carbon-dioxide", "n": "Carbon Dioxide", "nv": "Carbon Dioxide", "g": ["Chất đẩy aerosol", "Chất thay thế không khí", "Dung môi"], "ge": ["Aerosol propellant", "Air displacement agent", "Solvent"], "cas": "124-38-9", "f": [["Cùng các khí nén khác (nitơ, nitơ oxid) dùng làm khí đẩy cho aerosol dùng ngoài; ưu điểm là rẻ, độc tính thấp, gần như không mùi vị và áp suất ít thay đổi theo nhiệt độ.", "1, tr.170"]], "fe": [["Along with other compressed gases (nitrogen, nitrous oxide) used as propellant for aerosols for external use; The advantage is that it is cheap, low toxicity, almost tasteless and pressure changes little with temperature.", "1, tr.170"]], "t": [["Nói chung tương hợp với hầu hết vật liệu, nhưng có thể phản ứng mãnh liệt với một số oxid kim loại hoặc kim loại khử (nhôm, magnesi, titan, zirconi); hỗn hợp với natri và kali có thể nổ khi va đập.", "1, tr.170"]], "te": [["Generally compatible with most materials, but may react violently with some metal oxides or reduced metals (aluminum, magnesium, titanium, zirconium); Mixtures with sodium and potassium can explode on impact.", "1, tr.170"]], "d": [["Khí không màu, không mùi, không cháy, vị acid nhẹ; dạng rắn (đá khô) là khối/viên màu trắng.", "1, tr.170"], ["Tan khoảng 1 thể tích trong 1 thể tích nước ở điều kiện thường.", "1, tr.170"]], "de": [["The gas is colorless, odorless, non-flammable, and has a mild acid taste; Solid form (dry ice) is a white block/pellet.", "1, tr.170"], ["Soluble about 1 volume in 1 volume of water under normal conditions.", "1, tr.170"]], "a": "carbon dioxide carbon dioxid co2 124-38-9 E290 Carbon Dioxide Carbonei dioxidum carbonic acid gas carbonic anhydride"}, {"id": "carboxymethylcellulose-calcium", "n": "Carboxymethylcellulose Calcium", "nv": "Carmellose Calcium; Carboxymethylcellulose Calcium", "g": ["Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Tá dược rã (viên nén/nang)", "Chất gây treo", "Chất làm tăng độ nhớt"], "ge": ["Tablet / capsule binder", "Tablet / capsule diluent", "Tablet / capsule disintegrant", "Suspending agent", "Viscosity-increasing agent"], "cas": "9050-04-8", "f": [["Chủ yếu dùng trong viên nén làm tá dược dính, độn và rã; tuy không tan trong nước nhưng là tá dược rã hiệu quả do trương nhiều lần thể tích khi gặp nước. Nồng độ tới 15% kl/kl; trên mức này độ cứng viên giảm.", "1, tr.172"], ["Cũng dùng làm chất gây treo và tăng độ nhớt tương tự carboxymethylcellulose natri.", "1, tr.172"]], "fe": [["Mainly used in tablets as adhesive, bulking and disintegrating excipients; Although insoluble in water, it is an effective disintegrant because it expands many times its volume when exposed to water. Concentration up to 15% kl/kl; Above this level, pellet hardness decreases.", "1, tr.172"], ["Also used as a suspension and viscosity increasing agent similar to carboxymethylcellulose sodium.", "1, tr.172"]], "t": [["Xem mục Carboxymethylcellulose natri.", "1, tr.172"]], "te": [["See Carboxymethylcellulose sodium.", "1, tr.172"]], "d": [["Bột màu trắng đến trắng vàng, hút ẩm.", "1, tr.172"], ["Thực tế không tan trong aceton, cloroform, ethanol 95%, toluen và ether; không tan trong nước nhưng trương tạo hỗn dịch.", "1, tr.172"]], "de": [["White to yellowish white powder, hygroscopic.", "1, tr.172"], ["Practically insoluble in acetone, chloroform, 95% ethanol, toluene and ether; insoluble in water but swells to form a suspension.", "1, tr.172"]], "a": "carboxymethylcellulose calcium cmc calcium carmellose calcium 9050-04-8 Carmellose Calcium Carboxymethylcellulose Calcium Calcium carboxymethylcellulose calcium cellulose glycolate carmellosum calcium CMC calcium ECG 505 Nymcel zsc"}, {"id": "carboxymethylcellulose-sodium", "n": "Carboxymethylcellulose Sodium", "nv": "Carmellose Sodium; Carboxymethylcellulose Sodium", "g": ["Chất hấp phụ", "Chất nhũ hóa", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Tá dược rã (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Adsorbent", "Emulsifying agent", "Suspending agent", "Tablet / capsule binder", "Tablet / capsule disintegrant", "Viscosity-increasing agent"], "cas": "9004-32-4", "f": [["Dùng rộng rãi trong chế phẩm uống và dùng ngoài, chủ yếu nhờ khả năng tăng độ nhớt; dung dịch nhớt dùng để gây treo bột cho chế phẩm uống, dùng ngoài và tiêm.", "1, tr.174"], ["Cũng dùng làm tá dược dính và rã cho viên nén, và ổn định nhũ tương.", "1, tr.174"]], "fe": [["Widely used in oral and topical preparations, mainly due to its ability to increase viscosity; viscous solution used to suspend powder for oral, topical and injectable preparations.", "1, tr.174"], ["Also used as a binding and disintegrating excipient for tablets, and to stabilize emulsions.", "1, tr.174"]], "t": [["Tương kỵ với dung dịch acid mạnh và muối tan của sắt và một số kim loại (nhôm, thủy ngân, kẽm); tương kỵ với gôm xanthan; tủa ở pH <2 và khi trộn với ethanol 95%; tạo coacervat phức với gelatin và pectin; tạo phức với collagen và tủa một số protein tích điện dương.", "1, tr.174"]], "te": [["Incompatible with strong acid solutions and soluble salts of iron and some metals (aluminum, mercury, zinc); Incompatible with xanthan gum; precipitates at pH <2 and when mixed with 95% ethanol; create complex coacervat with gelatin and pectin; forms complexes with collagen and precipitates some positively charged proteins.", "1, tr.174"]], "d": [["Bột hạt màu trắng đến gần trắng, không mùi, không vị; hút ẩm sau khi sấy.", "1, tr.174"], ["Thực tế không tan trong aceton, ethanol 95%, ether và toluen; dễ phân tán trong nước ở mọi nhiệt độ tạo dung dịch keo trong.", "1, tr.174"]], "de": [["White to nearly white granular powder, odorless, tasteless; Dehumidify after drying.", "1, tr.174"], ["Practically insoluble in acetone, 95% ethanol, ether and toluene; Easily dispersible in water at all temperatures to create a clear colloidal solution.", "1, tr.174"]], "a": "carboxymethylcellulose sodium cmc sodium carmellose sodium natri cmc 9004-32-4 E466 Carmellose Sodium Carboxymethylcellulose Sodium Akucell Aqưaỉon CMC Blanose Carbose D carmellosum natricum cellulose gum CMC sodium Dynacel Finnfix KiccolateNymcel ZSB SCMC sodium carboxymethylcellulose sodium cellulose glycolate Sunrose-, Tylose CB Tylose MGA Walocel C Walocel CRT Xylo-Mucine"}, {"id": "cmc-mcc-coprocessed", "n": "Carboxymethylcellulose Sodium, Coprocessed", "nv": "Dispersible Cellulose; Microcrystalline Cellulose and Carmellose Sodium; Microcrystalline Cellulose and Carboxymethylcellulose; Sodium", "g": ["Chất phân tán", "Chất ổn định nhũ tương", "Chất gây treo", "Chất làm tăng độ nhớt"], "ge": ["Dispersing agent", "Emulsion stabilizer", "Suspending agent", "Viscosity-increasing agent"], "cas": "", "f": [["Dùng tạo gel thixotropic làm tá dược gây treo cho chế phẩm dược và mỹ phẩm; phần CMC natri hỗ trợ phân tán và làm keo bảo vệ. Dưới 1% chất rắn tạo phân tán lỏng, trên 1,2% tạo gel thixotropic.", "1, tr.199"]], "fe": [["Used to create thixotropic gel as a suspension excipient for pharmaceutical and cosmetic preparations; The sodium CMC part aids in dispersion and protective gelling. Below 1% solids create a liquid dispersion, above 1.2% create a thixotropic gel.", "1, tr.199"]], "t": [["Tương kỵ với chất oxy hóa mạnh; do bản chất anion nên keo tụ khi thêm lượng nhỏ chất điện giải, polymer cation hoặc chất diện hoạt.", "1, tr.199"]], "te": [["Incompatible with strong oxidizing agents; Due to its anionic nature, it flocculates when small amounts of electrolytes, cationic polymers or surfactants are added.", "1, tr.199"]], "d": [["Bột hút ẩm màu trắng/trắng ngà, không mùi, không vị; thành phần (tính theo khô) 82–89% MCC và 11–18% CMC natri độ nhớt trung bình; là hydrocolloid anion phân tán được trong nước.", "1, tr.199"], ["Thực tế không tan trong acid loãng và dung môi hữu cơ; tan một phần trong kiềm loãng và nước (phần CMC natri).", "1, tr.199"]], "de": [["White/ivory white hygroscopic powder, odorless, tasteless; composition (dry basis) 82–89% MCC and 11–18% CMC sodium medium viscosity; is an anionic hydrocolloid that is dispersible in water.", "1, tr.199"], ["Practically insoluble in dilute acids and organic solvents; Partially soluble in dilute alkali and water (sodium CMC part).", "1, tr.199"]], "a": "coprocessed microcrystalline cellulose carboxymethylcellulose sodium avicel rc-591 colloidal avicel mcc cmc coprocessed Dispersible Cellulose Microcrystalline Cellulose and Carmellose Sodium Microcrystalline Cellulose and Carboxymethylcellulose Avicel CL-611 Avicel RC-591 Avicel RC/CL cellulosum microcristallinum et carmellosum natricum colloidal cellulose Vivapur MCG 591 PCG Vivapur MCG 611 PCG Sodium"}, {"id": "carrageenan", "n": "Carrageenan", "nv": "Carrageenan", "g": ["Vật liệu vỏ nang", "Chất ổn định nhũ tương", "Chất tạo gel", "Chất vi nang hóa", "Tá dược phóng thích biến đổi", "Chất gây treo", "Chất làm tăng độ nhớt"], "ge": ["Capsule shell material", "Emulsion stabilizer", "Gelling agent", "Microencapsulating agent", "Modified-release agent", "Suspending agent", "Viscosity-increasing agent"], "cas": "9000-07-1, 9062-07-1, 11114-20-8", "f": [["Dùng trong nhiều dạng thuốc không tiêm: hỗn dịch, nhũ tương, gel, kem, lotion, thuốc nhỏ mắt, thuốc đặt, viên nén và viên nang.", "1, tr.178"], ["Trong hỗn dịch thường dùng phân đoạn ι- và λ-carrageenan: λ-carrageenan ≤0,7% kl/tt để tạo độ nhớt; ι-carrageenan ~0,4% kl/tt (kèm ion calci để tạo mạng gel).", "1, tr.178"]], "fe": [["Used in many non-injectable dosage forms: suspensions, emulsions, gels, creams, lotions, eye drops, suppositories, tablets and capsules.", "1, tr.178"], ["In suspensions, ι- and λ-carrageenan fractions are often used: λ-carrageenan ≤0.7% w/w to create viscosity; ι-carrageenan ~0.4% w/w (with calcium ions to create gel network).", "1, tr.178"]], "t": [["Tạo phức với chất cation; có thể tương tác với đại phân tử tích điện khác (như protein) gây tăng độ nhớt, tạo gel, ổn định hoặc tủa.", "1, tr.178"]], "te": [["Form complexes with cationic substances; can interact with other charged macromolecules (such as proteins) causing increased viscosity, gelation, stabilization or precipitation.", "1, tr.178"]], "d": [["Bột thô đến mịn màu vàng nhạt/nâu đến trắng, không mùi, vị nhầy.", "1, tr.178"]], "de": [["Coarse to fine powder, light yellow/brown to white, odorless, slimy taste.", "1, tr.178"]], "a": "carrageenan carragenan 9000-07-1 E407 Carrageenan Carrageenanum chondrus extract Gelcarin Genu Grindsted Hygurn TP-1 Irish moss extract Marine Colloids Satidgel U s eaSpen PF Vis carin"}, {"id": "castor-oil", "n": "Castor Oil", "nv": "Castor Oil; Virgin Castor Oil; Castor Oil, Virgin", "g": ["Chất làm mềm da", "Tá dược dầu", "Dung môi"], "ge": ["Emollient", "Oleaginous vehicle", "Solvent"], "cas": "8001-79-4", "f": [["Dùng phổ biến nhất trong kem và thuốc mỡ dùng ngoài ở nồng độ 5–12,5%; cũng dùng trong viên nén, viên nang uống, nhũ tương nhỏ mắt và làm dung môi trong thuốc tiêm bắp.", "1, tr.183"]], "fe": [["Most commonly used in topical creams and ointments at concentrations of 5–12.5%; also used in tablets, oral capsules, ophthalmic emulsions and as a solvent in intramuscular injections.", "1, tr.183"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.183"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.183"]], "d": [["Dầu nhớt, trong, gần như không màu hoặc vàng nhạt; mùi nhẹ, vị ban đầu nhạt sau hơi hắc.", "1, tr.183"], ["Trộn lẫn với cloroform, ether, ethanol, acid acetic băng, methanol; dễ tan trong ethanol 95%; thực tế không tan trong nước.", "1, tr.183"]], "de": [["Viscous oil, clear, almost colorless or light yellow; Smell is light, taste is initially light then slightly pungent.", "1, tr.183"], ["Miscible with chloroform, ether, ethanol, glacial acetic acid, methanol; Easily soluble in 95% ethanol; practically insoluble in water.", "1, tr.183"]], "a": "castor oil dau thau dau 8001-79-4 Castor Oil Virgin Castor Oil Castor Oil, Virgin Crystal EmCon CO Lipovol CO oleum ricini ricini oleum virginale ricinoleum ricinus communis ricinus oil tangantangan. 2"}, {"id": "castor-oil-hydrogenated", "n": "Castor Oil, Hydrogenated", "nv": "Hydrogenated Castor Oil; Castor Oil, Hydrogenated", "g": ["Chất tạo màng bao", "Tá dược phóng thích biến đổi", "Tá dược trơn"], "ge": ["Coating agent", "Modified-release agent", "Lubricant"], "cas": "8001-78-3", "f": [["Dùng trong chế phẩm uống và dùng ngoài. Nồng độ tham khảo: tá dược bao (giải phóng chậm) 5,0–20,0%, cốt giải phóng chậm 5,0–10,0%, bôi trơn cối 0,1–2,0%; trong chế phẩm dùng ngoài giúp tạo độ cứng cho kem và nhũ tương.", "1, tr.185"]], "fe": [["Used in oral and external preparations. Reference concentrations: coating excipient (slow release) 5.0–20.0%, slow release core 5.0–10.0%, mortar lubricant 0.1–2.0%; in topical preparations to help give firmness to creams and emulsions.", "1, tr.185"]], "t": [["Tương hợp với hầu hết sáp thực vật và động vật tự nhiên.", "1, tr.185"]], "te": [["Compatible with most natural vegetable and animal waxes.", "1, tr.185"]], "d": [["Bột hoặc mảnh mịn màu gần trắng hoặc vàng nhạt; là sáp cứng, điểm chảy cao (chủ yếu là triglycerid của acid 12-hydroxystearic).", "1, tr.185"], ["Thực tế không tan trong nước; tan trong aceton, cloroform và methylen clorid.", "1, tr.185"]], "de": [["Nearly white or light yellow fine powder or flakes; is a hard wax, high melting point (mainly triglyceride of 12-hydroxystearic acid).", "1, tr.185"], ["Practically insoluble in water; Soluble in acetone, chloroform and methylene chloride.", "1, tr.185"]], "a": "hydrogenated castor oil dau thau dau hydrogen hoa castorwax 8001-78-3 Hydrogenated Castor Oil Castor Oil, Hydrogenated Castorwax Croduret Cutina HR Fancol 12-hydroxyoctadeca noic acid, 1,2,3-propanetriyl ester Kolliwax HCO 1,2,3-propanetriol tri(12-hydroxystearate) ricini oleum hydrogenatum trihydroxys tearin"}, {"id": "cellaburate", "n": "Cellaburate", "nv": "Cellulose Acetate Butyrate; Cellaburate", "g": ["Chất tạo màng bao", "Chất tạo màng", "Chất tạo màng bán thấm", "Tá dược phóng thích biến đổi", "Tá dược độn (viên nén/nang)"], "ge": ["Coating agent", "Film-forming agent", "Semipermeable membrane former", "Modified-release agent", "Tablet / capsule diluent"], "cas": "9004-36-8", "f": [["Dùng trong hệ giải phóng biến đổi đường uống; là lựa chọn thay cellulose acetat làm lớp màng bán thấm trong thiết bị bơm thẩm thấu; cũng dùng trong dạng rắn giải phóng kiểm soát chống 'dose dumping' do rượu.", "1, tr.187"]], "fe": [["Used in oral modified-release system; is an option to replace cellulose acetate as a semi-permeable membrane in osmosis pump equipment; also used in solid release form to control 'dose dumping' due to alcohol.", "1, tr.187"]], "t": [["Tương kỵ với chất oxy hóa; trộn ester cellulose trong hydrocarbon không phân cực (toluen, xylen) có thể tích tĩnh điện gây cháy nổ (nên duy trì khí trơ khi thao tác).", "1, tr.187"]], "te": [["Incompatible with oxidizing agents; Mixing cellulose ester in non-polar hydrocarbons (toluene, xylene) can build up static electricity and cause fire and explosion (inert gas should be maintained when handling).", "1, tr.187"]], "d": [["Bột hoặc hạt màu trắng đến trắng ngà, hơi hút ẩm.", "1, tr.187"], ["Thực tế không tan trong nước và ethanol 95%; tan trong aceton, acid formic và hỗn hợp methanol–dicloromethan.", "1, tr.187"]], "de": [["White to off-white powder or granules, slightly hygroscopic.", "1, tr.187"], ["Practically insoluble in water and 95% ethanol; Soluble in acetone, formic acid and methanol–dichloromethane mixture.", "1, tr.187"]], "a": "cellaburate cellulose acetate butyrate cab 9004-36-8 Cellulose Acetate Butyrate Cellaburate Acetylbutyrylcellulose cellaburatum cellulose acetate butanoate cellulose butyrate acetate cellulosi acetas butyras"}, {"id": "cellulose-acetate", "n": "Cellulose Acetate", "nv": "Cellulose Acetate", "g": ["Chất tạo màng bao", "Tá dược phóng thích biến đổi", "Tá dược độn (viên nén/nang)", "Thành phần hệ trị liệu qua da"], "ge": ["Coating agent", "Modified-release agent", "Tablet / capsule diluent", "Transdermal delivery component"], "cas": "9004-35-7, 9035-69-2, 9012-09-3", "f": [["Dùng rộng rãi trong giải phóng kéo dài và che vị; làm màng bán thấm bao viên, đặc biệt viên bơm thẩm thấu và que cấy, cho phép giải phóng kiểm soát.", "1, tr.188"]], "fe": [["Widely used in sustained release and flavor masking; make semi-permeable membranes to cover tablets, especially osmotic pump tablets and implants, allowing controlled release.", "1, tr.188"]], "t": [["Tương kỵ với chất có tính acid hoặc kiềm mạnh; tương hợp với các chất hóa dẻo diethyl phthalat, polyethylen glycol, triacetin và triethyl citrat.", "1, tr.188"]], "te": [["Incompatible with strongly acidic or alkaline substances; Compatible with the plasticizers diethyl phthalate, polyethylene glycol, triacetin and triethyl citrate.", "1, tr.188"]], "d": [["Bột, viên hoặc mảnh màu trắng đến trắng ngà, trơn chảy, hút ẩm; không vị, không mùi hoặc mùi nhẹ của acid acetic.", "1, tr.188"], ["Độ tan phụ thuộc mạnh mức độ acetyl hóa; thực tế không tan trong nước.", "1, tr.188"]], "de": [["White to off-white powder, tablets or flakes, smooth, hygroscopic; Tasteless, odorless or with a slight odor of acetic acid.", "1, tr.188"], ["Solubility strongly depends on the degree of acetylation; practically insoluble in water.", "1, tr.188"]], "a": "cellulose acetate cellulose acetat 9004-35-7 Cellulose Acetate Acetic acid, cellulose ester acetose acetyl cellulose cellulose diace tate cellulose triacetate cellulosi acetas monoacetylcellulose"}, {"id": "cellulose-acetate-phthalate", "n": "Cellulose Acetate Phthalate", "nv": "Cellacefate; Cellulose Acetate Phthalate", "g": ["Chất tạo màng bao", "Chất vi nang hóa", "Tá dược dính (viên nén/nang)"], "ge": ["Coating agent", "Microencapsulating agent", "Tablet / capsule binder"], "cas": "9004-38-0", "f": [["Dùng làm màng bao tan ở ruột, chất vi nang hóa hoặc tá dược dính cốt cho viên nén và viên nang; màng chịu được dịch vị acid mạnh nhưng tan ở môi trường ruột acid nhẹ/trung tính. Nồng độ thường 0,5–9,0% khối lượng nhân; thêm chất hóa dẻo cải thiện độ kháng nước.", "1, tr.191"]], "fe": [["Used as enteric coating, microencapsulation or adhesive excipient for tablets and capsules; The membrane can withstand strong acidic gastric juice but dissolve in mild/neutral acidic intestinal environment. Concentrations are typically 0.5–9.0% of kernel mass; Adding plasticizers improves water resistance.", "1, tr.191"]], "t": [["Tương kỵ với ferrous sulfat, ferric clorid, bạc nitrat, natri citrat, nhôm sulfat, calci clorid, thủy ngân (II) clorid, bari nitrat, chì acetat base và chất oxy hóa mạnh (kiềm/acid mạnh).", "1, tr.191"]], "te": [["Incompatible with ferrous sulfate, ferric chloride, silver nitrate, sodium citrate, aluminum sulfate, calcium chloride, mercury(II) chloride, barium nitrate, lead acetate base and strong oxidizers (strong alkalis/acids).", "1, tr.191"]], "d": [["Bột, hạt hoặc mảnh màu trắng đến trắng ngà, trơn chảy, hút ẩm; không vị, không mùi hoặc mùi nhẹ acid acetic.", "1, tr.191"], ["Thực tế không tan trong nước, các alcol và hydrocarbon; tan trong một số ceton, ester và dung dịch đệm nước ở pH nhất định.", "1, tr.191"]], "de": [["White to off-white powder, granules or flakes, smooth, hygroscopic; Tasteless, odorless or mild odor of acetic acid.", "1, tr.191"], ["Practically insoluble in water, alcohols and hydrocarbons; Soluble in some ketones, esters and aqueous buffer solutions at certain pH.", "1, tr.191"]], "a": "cellulose acetate phthalate cap cellacefate cellulose acetat phthalat 9004-38-0 Cellacefate Cellulose Acetate Phthalate Acetyl phthalyl cellulose Aquacoat CPD-, CAP cellu lose acetate benzene-l,2-dicarboxylate cellulose acetate hydrogen 1,2-benzenedicarboxylate cellulose acetate hydrogen phthalate cellulose acetate monophthalate cellulose acetophthalate cellulose acetylphthalate cellulosi acetas phthalas. 2"}, {"id": "cellulose-microcrystalline", "n": "Cellulose, Microcrystalline", "nv": "Microcrystalline Cellulose; Cellulose, Microcrystalline", "g": ["Chất hấp phụ", "Tá dược dập thẳng", "Chất gây treo", "Tá dược độn (viên nén/nang)"], "ge": ["Adsorbent", "Direct compression vehicle", "Suspending agent", "Tablet / capsule diluent"], "cas": "9004-34-6", "f": [["Dùng rộng rãi làm tá dược dính/độn cho viên nén và viên nang đường uống, áp dụng được cho cả xát hạt khô, xát hạt ướt và dập thẳng.", "1, tr.194"], ["Ngoài ra còn giúp giảm ma sát khi tháo viên và hỗ trợ rã; một số grade hình cầu dùng để bồi lớp dược chất (drug layering); có grade phối hợp hệ nano cho giải phóng biến đổi.", "1, tr.194"]], "fe": [["Widely used as a binding/filling excipient for oral tablets and capsules, applicable for both dry granulation, wet granulation and straight stamping.", "1, tr.194"], ["It also helps reduce friction when removing tablets and aids in disintegration; Some spherical grades are used for drug layering; Has a nano-system combination grade for modified release.", "1, tr.194"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.194"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.194"]], "d": [["Cellulose tinh khiết, khử trùng hợp một phần; bột màu trắng, không mùi, không vị, gồm các hạt xốp.", "1, tr.194"], ["Ít tan trong dung dịch NaOH 5%; thực tế không tan trong nước, acid loãng và đa số dung môi hữu cơ.", "1, tr.194"]], "de": [["Pure, partially depolymerized cellulose; White powder, odorless, tasteless, composed of porous particles.", "1, tr.194"], ["Slightly soluble in 5% NaOH solution; Practically insoluble in water, dilute acids and most organic solvents.", "1, tr.194"]], "a": "microcrystalline cellulose cellulose vi tinh the mcc avicel ph-101 ph-102 9004-34-6 E460 Microcrystalline Cellulose Cellulose, Microcrystalline Avicel PH Cellets Celex cellulose gel cellulosum microcristallinum Celpbere Ceolus KG crystalline cellulose Cyclocel Emcocel Fibrocel Grinsted MCC MCC Sanaq Microcel Pbarmacel Tabulose Vivapur avicel ph101 ph102 ph105 ph200 ph301 ph302 mcc101 mcc102"}, {"id": "cellulose-powdered", "n": "Cellulose, Powdered", "nv": "Powdered Cellulose; Cellulose, Powdered", "g": ["Chất hấp phụ", "Chất điều hòa sự chảy", "Chất gây treo", "Tá dược độn (viên nén/nang)", "Tá dược rã (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Adsorbent", "Glidant", "Suspending agent", "Tablet / capsule diluent", "Tablet / capsule disintegrant", "Viscosity-increasing agent"], "cas": "9004-34-6", "f": [["Dùng làm tá dược độn cho viên nén và độn cho nang cứng, tăng kích thước dạng thuốc khi hàm lượng hoạt chất nhỏ; tính nén chấp nhận được nhưng lưu tính đa số grade kém. Trong nang gelatin mềm có thể dùng để giảm tốc độ lắng của hỗn dịch dầu.", "1, tr.201"]], "fe": [["Used as a filler for tablets and hard capsules, increasing the size of the drug form when the active ingredient content is small; Compression is acceptable but retention of most grades is poor. In soft gelatin capsules, it can be used to reduce the sedimentation rate of the oil suspension.", "1, tr.201"]], "t": [["Tương kỵ với chất oxy hóa mạnh, brom pentafluorid, natri nitrit và fluor.", "1, tr.201"]], "te": [["Incompatible with strong oxidizers, bromine pentafluoride, sodium nitrite and fluoride.", "1, tr.201"]], "d": [["Bột màu trắng/gần trắng, không mùi, không vị, cỡ hạt đa dạng từ bột mịn trơn chảy đến vật liệu thô, xốp, kém chảy.", "1, tr.201"], ["Thực tế không tan trong nước, acid loãng và đa số dung môi hữu cơ nhưng phân tán được trong hầu hết chất lỏng; không trương trong nước.", "1, tr.201"]], "de": [["White/nearly white powder, odorless, tasteless, particle size varies from smooth, flowable powder to rough, porous, poorly flowing material.", "1, tr.201"], ["Practically insoluble in water, dilute acids and most organic solvents but dispersible in most liquids; Does not swell in water.", "1, tr.201"]], "a": "powdered cellulose cellulose bot 9004-34-6 Powdered Cellulose Cellulose, Powdered Alpha-cellulose Arbocel cellulosi pulvis E460 Elcema JustFiber KC Flock Sanacel Sanacel Pharma Sancel-W Sanacel Wheat"}, {"id": "cellulose-silicified-mcc", "n": "Cellulose, Silicified Microcrystalline", "nv": "Silicified Microcrystalline Cellulose", "g": ["Tá dược độn (viên nén/nang)"], "ge": ["Tablet / capsule diluent"], "cas": "", "f": [["Dùng làm tá dược độn cho viên nang và viên nén; có tính chịu nén cải thiện trong cả xát hạt ướt và dập thẳng so với MCC thường; được phát triển để khắc phục mất khả năng nén của MCC sau xát hạt ướt; có lợi cho công thức nang chứa bột.", "1, tr.204"]], "fe": [["Used as filler excipient for capsules and tablets; has improved compressive properties in both wet granulation and straight stamping compared to regular MCC; Developed to overcome the loss of compressibility of MCC after wet granulation; beneficial for capsule formulas containing powder.", "1, tr.204"]], "t": [["Xem mục Cellulose vi tinh thể và Silic dioxid keo.", "1, tr.204"]], "te": [["See Microcrystalline Cellulose and Colloidal Silicon Dioxide.", "1, tr.204"]], "d": [["Hỗn hợp đồng chế biến hiệp lực của cellulose vi tinh thể và silic dioxid keo (chứa 2% kl/kl silic dioxid keo).", "1, tr.204"], ["Thực tế không tan trong nước, acid loãng và đa số dung môi hữu cơ.", "1, tr.204"]], "de": [["Synergistic co-processed mixture of microcrystalline cellulose and colloidal silicon dioxide (containing 2% w/w colloidal silicon dioxide).", "1, tr.204"], ["Practically insoluble in water, dilute acids and most organic solvents.", "1, tr.204"]], "a": "silicified microcrystalline cellulose smcc prosolv cellulose vi tinh the silic hoa Silicified Microcrystalline Cellulose"}, {"id": "ceratonia", "n": "Ceratonia", "nv": "Gôm hạt bồ kết tây (ceratonia/carob)", "g": ["Chất tạo màng bao", "Chất nhũ hóa", "Chất tạo gel", "Tá dược phóng thích biến đổi", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Tá dược rã (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Coating agent", "Emulsifying agent", "Gelling agent", "Modified-release agent", "Suspending agent", "Tablet / capsule binder", "Tablet / capsule disintegrant", "Viscosity-increasing agent"], "cas": "9000-40-2", "f": [["Dùng làm chất tạo gel, gây treo, nhũ hóa, tăng độ nhớt và tá dược dính/rã; phối hợp hiệp lực với gôm xanthan trong hệ giải phóng kiểm soát.", "1, tr.206"]], "fe": [["Used as a gelling agent, suspending agent, emulsifier, viscosity increaser and adhesive/dissolving agent; synergistic combination with xanthan gum in a controlled release system.", "1, tr.206"]], "t": [["Làm tăng độ nhớt dung dịch gôm xanthan (tương tác hiệp lực dùng trong hệ giải phóng kiểm soát).", "1, tr.206"]], "te": [["Increases the viscosity of xanthan gum solutions (synergistic interaction used in controlled release systems).", "1, tr.206"]], "d": [["Bột màu vàng-lục hoặc trắng tùy phương pháp tách; khô thì không mùi, không vị, khi đun trong nước có vị đậu.", "1, tr.206"], ["Độ tan rất thấp trong đa số dung môi hữu cơ; cần đun trên 85 °C để tan hoàn toàn trong nước; phân tán trong nước nóng (>70 °C).", "1, tr.206"]], "de": [["Yellow-green or white powder depending on separation method; When dried, it is odorless and tasteless, but when boiled in water, it has a bean flavor.", "1, tr.206"], ["Very low solubility in most organic solvents; Needs to be heated above 85 °C to completely dissolve in water; Disperse in hot water (>70 °C).", "1, tr.206"]], "a": "ceratonia carob gum locust bean gum ceratonia 9000-40-2 E410 Algaroba carob bean gum carob flour carob seed gum caruba carubin ceratonia gum Ceratonia siliqua-, Ceratonia siliqua gum Cheshire gum gomme de caroube Meyprofleur^ St. John's bread"}, {"id": "ceresin", "n": "Ceresin", "nv": "Sáp ceresin", "g": ["Chất tạo màng bao", "Chất ổn định nhũ tương", "Chất tạo gel", "Chất tạo độ đục", "Chất làm tăng độ đặc", "Chất làm tăng độ nhớt"], "ge": ["Coating agent", "Emulsion stabilizer", "Gelling agent", "Opacifying agent", "Stiffening agent", "Viscosity-increasing agent"], "cas": "8001-75-0", "f": [["Dùng làm chất làm cứng trong kem và thuốc mỡ, và làm chất ổn định nhũ tương, tạo độ đục, tăng độ nhớt, tạo gel và làm đặc trong kem bảo vệ, dùng ngoài và âm đạo; hoạt động như chất điều chỉnh lưu biến ở nồng độ thấp (2–3%). Thường dùng thay ozokerit, sáp ong và paraffin.", "1, tr.208"]], "fe": [["Used as a hardening agent in creams and ointments, and as an emulsion stabilizer, turbidity, viscosity enhancer, gelling and thickening agent in protective creams, for external and vaginal use; acts as a rheology modifier at low concentrations (2–3%). Often used instead of ozokerit, beeswax and paraffin.", "1, tr.208"]], "t": [["Tương kỵ với chất oxy hóa mạnh; tương hợp với hầu hết sáp động/thực vật/khoáng cũng như dầu khoáng và petrolatum.", "1, tr.208"]], "te": [["Incompatible with strong oxidizing agents; Compatible with most animal/vegetable/mineral waxes as well as mineral oils and petrolatum.", "1, tr.208"]], "d": [["Hỗn hợp sáp hydrocarbon phân tử lượng cao màu trắng đến vàng (tinh chế từ ozokerit); dạng bánh hoặc viên sáp vô định hình, giòn, không mùi, không vị.", "1, tr.208"], ["Tan trong benzen, cloroform, dầu nóng, ether dầu hỏa, ethanol tuyệt đối (30 phần) và đa số dung môi hữu cơ; không tan trong nước.", "1, tr.208"]], "de": [["White to yellow high molecular weight hydrocarbon wax mixture (purified from ozokerite); Amorphous cake or wax pellets, brittle, odorless, tasteless.", "1, tr.208"], ["Soluble in benzene, chloroform, heating oil, petroleum ether, absolute ethanol (30 parts) and most organic solvents; insoluble in water.", "1, tr.208"]], "a": "ceresin sap ceresin ceresin wax 8001-75-0 Cera microcrystallina cera mineralis alba ceresin refined ceresine ceresine wax ceresine wax white cerin cerosin Cirashine CS earth wax GS-Cerestn Koster Keunen Ceresine microcrystalline wax mineral wax purified ozokerite Ross Ceresine Wax white ceresin wax opacifier"}, {"id": "cetostearyl-alcohol", "n": "Cetostearyl Alcohol", "nv": "Cetostearyl Alcohol", "g": ["Chất làm mềm da", "Chất nhũ hóa", "Chất làm tăng độ nhớt"], "ge": ["Emollient", "Emulsifying agent", "Viscosity-increasing agent"], "cas": "67762-27-0, 8005-44-5", "f": [["Dùng trong chế phẩm dùng ngoài để tăng độ nhớt và làm chất nhũ hóa cho cả nhũ tương nước/dầu và dầu/nước; ổn định nhũ tương và làm đồng nhũ hóa, giảm lượng chất diện hoạt cần dùng.", "1, tr.211"]], "fe": [["Used in topical preparations to increase viscosity and as an emulsifier for both water/oil and oil/water emulsions; Stabilizes emulsions and co-emulsifies, reducing the amount of surfactant needed.", "1, tr.211"]], "t": [["Tương kỵ với chất oxy hóa mạnh và muối kim loại.", "1, tr.211"]], "te": [["Incompatible with strong oxidizers and metal salts.", "1, tr.211"]], "d": [["Khối, mảnh, viên hoặc hạt trơn nhờn màu trắng hoặc kem; mùi ngọt nhẹ đặc trưng; khi đun chảy thành lỏng trong, không màu/vàng nhạt.", "1, tr.211"], ["Tan trong ethanol 95%, ether và dầu; thực tế không tan trong nước.", "1, tr.211"]], "de": [["White or cream greasy chunks, flakes, pellets or granules; characteristic mild sweet smell; When melted, it becomes a clear, colorless/light yellow liquid.", "1, tr.211"], ["Soluble in 95% ethanol, ether and oil; practically insoluble in water.", "1, tr.211"]], "a": "cetostearyl alcohol alcol cetostearyl cetearyl alcohol 8005-44-5 Cetostearyl Alcohol Alcohol cetylicus et stearylicus cetyl stearyl alcohol Crodacol CS90 DUB sc 20D Kolliwax CSA Lanette O Tego Alkanol 6855"}, {"id": "cetrimide", "n": "Cetrimide", "nv": "Cetrimide", "g": ["Chất bảo quản kháng khuẩn", "Chất diện hoạt cation"], "ge": ["Antimicrobial preservative", "Cationic surfactant"], "cas": "8044-71-1, 1119-97-7, 505-86-2", "f": [["Hợp chất amoni bậc bốn dùng làm chất bảo quản kháng khuẩn và chất diện hoạt cation; trong thuốc nhỏ mắt dùng ở nồng độ 0,005% kl/tt.", "1, tr.213"], ["Cũng dùng làm chất tẩy rửa/sát khuẩn kính áp tròng cứng (không dùng cho kính mềm); là thành phần của sáp nhũ hóa cetrimid trong kem dầu/nước.", "1, tr.213"]], "fe": [["Quaternary ammonium compounds used as antibacterial preservatives and cationic surfactants; in eye drops used at a concentration of 0.005% w/w.", "1, tr.213"], ["Also used as a cleaner/disinfectant for hard contact lenses (not for soft lenses); is a component of cetrimid emulsifying wax in oil/water creams.", "1, tr.213"]], "t": [["Tương kỵ với xà phòng, chất diện hoạt anion, chất diện hoạt không ion hóa nồng độ cao, bentonit, iod, phenylmercuric nitrat, hydroxyd kiềm và phẩm màu acid; dung dịch nước phản ứng với kim loại.", "1, tr.213"]], "te": [["Incompatible with soap, anionic surfactants, high concentrations of non-ionic surfactants, bentonite, iodine, phenylmercuric nitrate, alkaline hydroxide and acid dyes; Aqueous solutions react with metals.", "1, tr.213"]], "d": [["Bột trơn chảy màu trắng đến trắng kem; mùi nhẹ đặc trưng, vị đắng như xà phòng.", "1, tr.213"], ["Dễ tan trong cloroform, ethanol 95% và nước; thực tế không tan trong ether; dung dịch 2% tạo bọt mạnh khi lắc.", "1, tr.213"]], "de": [["White to creamy white flowing powder; characteristic mild odor, bitter soap-like taste.", "1, tr.213"], ["Easily soluble in chloroform, 95% ethanol and water; practically insoluble in ether; 2% solution creates strong foam when shaken.", "1, tr.213"]], "a": "cetrimide cetrimid cetrimonium 8044-71-1 Cetrimide Cetavlon', Cetraol cetrimidum Lissolamine V Micol Morpan CHSA Morphans Quammonium Sucticide"}, {"id": "cetrimonium-bromide", "n": "Cetrimonium Bromide", "nv": "Cetrimonium Bromide", "g": ["Chất bảo quản kháng khuẩn", "Chất diện hoạt cation"], "ge": ["Antimicrobial preservative", "Cationic surfactant"], "cas": "57-09-0", "f": [["Hợp chất amoni bậc bốn cation dùng làm chất bảo quản kháng khuẩn và chất diện hoạt cation trong chế phẩm dùng ngoài; cũng dùng trong thuốc đặt và trong vi nhũ tương/tiểu phân nano cho giải phóng kiểm soát.", "1, tr.216"]], "fe": [["Cationic quaternary ammonium compounds used as antibacterial preservatives and cationic surfactants in topical preparations; also used in suppositories and in microemulsions/nanoparticles for controlled release.", "1, tr.216"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.216"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.216"]], "d": [["Bột hoặc tinh thể màu trắng, mùi nhẹ đặc trưng.", "1, tr.216"], ["Dễ tan trong ethanol 95%; tan 1 trong 10 phần nước; ít tan trong aceton; thực tế không tan trong ether và benzen.", "1, tr.216"]], "de": [["White powder or crystals, characteristic mild odor.", "1, tr.216"], ["Easily soluble in 95% ethanol; Dissolve 1 in 10 parts of water; Slightly soluble in acetone; Practically insoluble in ether and benzene.", "1, tr.216"]], "a": "cetrimonium bromide ctab cetyltrimethylammonium bromide 57-09-0 Cetrimonium Bromide Acetoquat CTAB Bromat CETAB Cetavlon cetrimide BP 1953 Cetylamine CTAB hexadecyl trimethylammonium bromide HTAB Lissolamine Micol Quamonium N,N,N-trimethyl-l-hexadecanaminium bromide (1:1) N,N,N-trimethylhexadecylammonium bromide palmityltrimethylammonium bromide RonaCare"}, {"id": "cetyl-alcohol", "n": "Cetyl Alcohol", "nv": "Cetyl Alcohol; Cetanol", "g": ["Chất tạo màng bao", "Chất làm mềm da", "Chất nhũ hóa", "Chất làm tăng độ đặc"], "ge": ["Coating agent", "Emollient", "Emulsifying agent", "Stiffening agent"], "cas": "36653-82-4", "f": [["Dùng trong thuốc đặt, dạng rắn giải phóng biến đổi, nhũ tương, lotion, kem và thuốc mỡ.", "1, tr.219"], ["Trong thuốc đặt dùng để nâng điểm chảy của nền; trong dạng giải phóng biến đổi tạo màng bao thấm được; trong lotion/kem/thuốc mỡ dùng nhờ tính làm mềm, hút nước và nhũ hóa, cải thiện độ ổn định và độ đặc.", "1, tr.219"]], "fe": [["Used in suppositories, modified-release solids, emulsions, lotions, creams and ointments.", "1, tr.219"], ["In suppositories used to raise the melting point of the matrix; in a modified release form that creates a permeable envelope; used in lotions/creams/ointments due to its softening, absorbent and emulsifying properties, improving stability and consistency.", "1, tr.219"]], "t": [["Tương kỵ với chất oxy hóa mạnh; làm hạ điểm chảy của ibuprofen gây hiện tượng dính khi bao phim tinh thể ibuprofen.", "1, tr.219"]], "te": [["Incompatible with strong oxidizing agents; Lowers the melting point of ibuprofen, causing stickiness when coating ibuprofen crystals.", "1, tr.219"]], "d": [["Mảnh, hạt, khối hoặc thỏi sáp màu trắng; mùi nhẹ đặc trưng, vị nhạt.", "1, tr.219"], ["Dễ tan trong ethanol 95% và ether (tăng theo nhiệt độ); thực tế không tan trong nước; trộn lẫn khi nóng chảy với chất béo, paraffin và isopropyl myristat.", "1, tr.219"]], "de": [["Flakes, granules, blocks or bars of white wax; characteristic mild odor, bland taste.", "1, tr.219"], ["Easily soluble in 95% ethanol and ether (increases with temperature); practically insoluble in water; Mixes when molten with fats, paraffin and isopropyl myristate.", "1, tr.219"]], "a": "cetyl alcohol alcol cetylic ancol cetylic cetanol 36653-82-4 Cetyl Alcohol Cetanol Alcohol cetylicus Apo/ Cachalot-, Cetanol Crodacol C70 Crodacol C90 Crodacol C95 ethal ethol HallStar CO-1695 1hexadecanol M-hexadecyl alcohol Hyfatol 16-95 Hyfatol 16-98 Kessco CA Lanette 16 Lipocol C Nacol 16-95 palmityl alcohol Rita CA speziol Cl 6 Pharma Tego Alkanol 16 Vegarol 1695 Vegarol 1698"}, {"id": "cetyl-palmitate", "n": "Cetyl Palmitate", "nv": "Cetyl Palmitate", "g": ["Chất làm mềm da", "Chất nhũ hóa", "Chất ổn định nhũ tương", "Chất làm tăng độ đặc", "Chất làm tăng độ nhớt"], "ge": ["Emollient", "Emulsifying agent", "Emulsion stabilizer", "Stiffening agent", "Viscosity-increasing agent"], "cas": "540-10-3", "f": [["Dùng làm chất làm mềm cho chế phẩm dùng ngoài; làm chất ổn định nhũ tương trong dầu gội, và chất nhũ hóa, tăng độ nhớt trong lotion và kem; tạo kết cấu và độ đặc cho sản phẩm chăm sóc cá nhân.", "1, tr.221"]], "fe": [["Used as an emollient for topical preparations; as an emulsion stabilizer in shampoos, and an emulsifier and viscosity increaser in lotions and creams; Creates texture and consistency for personal care products.", "1, tr.221"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.221"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.221"]], "d": [["Là hỗn hợp ester của alcol C14–C18 với acid béo (chủ yếu acid palmitic).", "1, tr.221"], ["Tan trong ethanol khan sôi và methylen clorid; ít tan trong ether dầu hỏa nhẹ; thực tế không tan trong ethanol khan và nước.", "1, tr.221"]], "de": [["Is a mixture of esters of C14–C18 alcohols with fatty acids (mainly palmitic acid).", "1, tr.221"], ["Soluble in boiling anhydrous ethanol and methylene chloride; Slightly soluble in light petroleum ether; Practically insoluble in anhydrous ethanol and water.", "1, tr.221"]], "a": "cetyl palmitate cetyl palmitat 540-10-3 Cetyl Palmitate Cetaceum cetyl esters wax cetylis palmitas Crodamol CP DUBCARE PC Dynacerin CP Estol 3694 Hallstar 653 hexadecanoic acid hexadecyl ester hexadecyl palmitate N-hexadecyl palmitate Kessco CP Palmil C palmitic acid N-hexadecyl ester palmityl palmitate Pelemol CP Sabowax CP spermaceti (synthetic) Stepan 653"}, {"id": "cetylpyridinium-chloride", "n": "Cetylpyridinium Chloride", "nv": "Cetylpyridinium Chloride", "g": ["Chất bảo quản kháng khuẩn", "Chất diện hoạt cation", "Chất tăng thấm", "Chất làm tăng độ tan"], "ge": ["Antimicrobial preservative", "Cationic surfactant", "Permeation enhancer", "Solubilizing agent"], "cas": "123-03-5, 6004-24-6", "f": [["Chất diện hoạt cation (amoni bậc bốn) dùng làm chất bảo quản kháng khuẩn; dùng trong chế phẩm uống và hít ở mức 0,04–1,5 mg; cũng dùng trong chế phẩm dẫn thuốc qua da (tăng thấm meloxicam, doxorubicin).", "1, tr.223"]], "fe": [["Cationic surfactants (quaternary ammonium) used as antibacterial preservatives; used in oral and inhalation preparations at 0.04–1.5 mg; Also used in drug delivery preparations through the skin (increased absorption of meloxicam, doxorubicin).", "1, tr.223"]], "t": [["Tương kỵ với chất oxy hóa mạnh, base và methylcellulose; hỗn dịch magnesi stearat làm giảm mạnh hoạt tính (do bị hấp phụ lên magnesi stearat); ion CPC tương tác với gelatin làm giảm sinh khả dụng.", "1, tr.223"]], "te": [["Incompatible with strong oxidizers, bases and methylcellulose; Magnesium stearate suspension strongly reduces activity (due to adsorption on magnesium stearate); CPC ions interact with gelatin to reduce bioavailability.", "1, tr.223"]], "d": [["Bột màu trắng, mùi đặc trưng, hơi trơn như xà phòng khi sờ.", "1, tr.223"], ["Dễ tan trong nước; rất dễ tan trong cloroform; rất ít tan trong ether.", "1, tr.223"]], "de": [["White powder, characteristic odor, slightly slippery like soap to the touch.", "1, tr.223"], ["Easily soluble in water; very soluble in chloroform; Very slightly soluble in ether.", "1, tr.223"]], "a": "cetylpyridinium chloride cpc cetylpyridinium clorid 123-03-5 Cetylpyridinium Chloride C16-alkylpyridinium chloride Cepacol Cepacol Chloride Cetamiun cetylpridinii chloridum cetyl pyridium chloride Dobendan hexadecylpyridinium chloride 1-hexadecylpyridinium chloride Medilave Pristacin Pyrisept"}, {"id": "chitosan", "n": "Chitosan", "nv": "Chitosan Hydrochloride; Chitosan", "g": ["Chất kết dính niêm mạc", "Tá dược phóng thích biến đổi", "Chất tạo màng", "Tá dược dính (viên nén/nang)"], "ge": ["Mucoadhesive agent", "Modified-release agent", "Film-forming agent", "Tablet / capsule binder"], "cas": "9012-76-4", "f": [["Đang được nghiên cứu rộng cho nhiều hệ đưa thuốc: giải phóng kiểm soát, dạng bám dính niêm mạc, dạng giải phóng nhanh, cải thiện đưa peptid, hệ giải phóng ở đại tràng và đưa gen; đã chế thành gel, màng, hạt, vi cầu.", "1, tr.225"]], "fe": [["Being extensively researched for many drug delivery systems: controlled release, mucosal adhesion, rapid release, improved peptide delivery, colonic release and gene delivery; processed into gels, membranes, particles, and microspheres.", "1, tr.225"]], "t": [["Tương kỵ với chất oxy hóa mạnh (tính chất còn phụ thuộc dạng muối, phân tử lượng, mức độ khử acetyl và pH).", "1, tr.225"]], "te": [["Incompatible with strong oxidizing agents (properties also depend on salt form, molecular weight, degree of deacetylation and pH).", "1, tr.225"]], "d": [["Bột hoặc mảnh màu trắng/trắng kem, không mùi; khi tủa thường tạo sợi trông như bông; là polysaccharid (copolymer glucosamin và N-acetylglucosamin) từ khử acetyl chitin.", "1, tr.225"]], "de": [["White/creamy white powder or flakes, odorless; When precipitated, it often creates fibers that look like cotton; is a polysaccharide (copolymer glucosamine and N-acetylglucosamine) from deacetylated chitin.", "1, tr.225"]], "a": "chitosan 9012-76-4 Chitosan Hydrochloride Chitosan NHR 2-Amino-2-deoxy-( 1,4)-p-D-glucopyranan Chitopharm chitosani hydrochloridum deacetylated chitin deacetylchitin p-l,4-poly-Dglucosamine poly-D-glucosamine poly-( 1,4-p-D-glucopyranosamine) Protasan bioadhesive mater ial"}, {"id": "chlorhexidine", "n": "Chlorhexidine", "nv": "Chlorhexidine Gluconate Solution; Chlorhexidine Hydrochloride; Chlorhexidine Acetate", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "55-56-1", "f": [["Muối chlorhexidin dùng rộng rãi nhờ tính kháng khuẩn; tuy chủ yếu là chất sát khuẩn nhưng cũng dùng làm chất bảo quản, chủ yếu để bảo quản thuốc nhỏ mắt ở nồng độ 0,01% kl/tt (thường dùng muối acetat hoặc gluconat).", "1, tr.228"], ["Dung dịch 0,002–0,006% kl/tt chlorhexidin gluconat dùng để sát khuẩn kính áp tròng thân nước.", "1, tr.228"]], "fe": [["Chlorhexidine salt is widely used thanks to its antibacterial properties; Although it is mainly an antiseptic, it is also used as a preservative, mainly to preserve eye drops at a concentration of 0.01% w/w (usually using acetate or gluconate salt).", "1, tr.228"], ["0.002–0.006% w/w chlorhexidine gluconate solution is used to disinfect aqueous contact lenses.", "1, tr.228"]], "t": [["Là cation trong dung dịch nên tương kỵ với xà phòng và chất anion; tương hợp với đa số chất diện hoạt cation và không ion hóa, nhưng nồng độ chất diện hoạt cao làm giảm mạnh hoạt tính (do gắn micelle); tủa muối ít tan khi có acid vô cơ ở nồng độ trên 0,05%.", "1, tr.228"]], "te": [["Being a cation in solution, it is incompatible with soaps and anionic substances; Compatible with most cationic and non-ionic surfactants, but high surfactant concentrations strongly reduce activity (due to micelle binding); Slightly soluble salts precipitate when inorganic acids are present at concentrations above 0.05%.", "1, tr.228"]], "d": [["Bột kết tinh màu trắng, không mùi, vị đắng; các muối acetat và hydroclorid là bột vi tinh thể màu trắng/gần trắng; dung dịch gluconat gần như không màu hoặc vàng nhạt, pH 5,5–7,0 (pha loãng 5%).", "1, tr.228"]], "de": [["White crystalline powder, odorless, bitter taste; Acetate and hydrochloride salts are white/almost white microcrystalline powders; Gluconate solution is almost colorless or pale yellow, pH 5.5–7.0 (5% dilution).", "1, tr.228"]], "a": "chlorhexidine chlorhexidin chlorhexidine gluconate chlorhexidine acetate 55-56-1 Chlorhexidine Gluconate Solution Chlorhexidine Diacetate Chlorhexidine Acetate 1,0di(4'-chlorophenyldiguanido) hexane Hibitane. chlorhexidini acetas chlorhexidini diacetas chlorhexidine diacetate Hibitane diacetate. Chlorhexidine digluconate chlorhexidini digluconatis chlorhexidini digluconatis solutio chlorhexidine dihydrochloride chlorhexidini hydrochloridum Chlorhexidine Hydrochloride Chlorhexidine Digluconate Solution Chlorhexidine Dihydrochloride"}, {"id": "chlorobutanol", "n": "Chlorobutanol", "nv": "Chlorobutanol; Chlorobutanol, Anhydrous", "g": ["Chất bảo quản kháng khuẩn", "Chất hóa dẻo"], "ge": ["Antimicrobial preservative", "Plasticizer"], "cas": "57-15-8, 6001-64-5", "f": [["Chủ yếu dùng trong dạng thuốc nhỏ mắt hoặc tiêm làm chất bảo quản kháng khuẩn ở nồng độ tới 0,5% kl/tt; thường dùng làm chất kháng khuẩn cho dung dịch epinephrin, cao thùy sau tuyến yên và chế phẩm nhỏ mắt.", "1, tr.233"], ["Đặc biệt hữu ích trong chế phẩm không nước; cũng dùng làm chất hóa dẻo cho ester và ether cellulose.", "1, tr.233"]], "fe": [["Mainly used in eye drops or injections as an antibacterial preservative at concentrations up to 0.5% w/w; Often used as an antibacterial agent for epinephrine solutions, posterior pituitary extracts and eye drops.", "1, tr.233"], ["Especially useful in waterless preparations; Also used as plasticizer for cellulose esters and ethers.", "1, tr.233"]], "t": [["Do bị hấp phụ, tương kỵ với lọ nhựa, nút cao su, bentonit, magnesi trisilicat, polyethylen và polyhydroxyethylmethacrylat (kính áp tròng mềm); carboxymethylcellulose và polysorbat 80 làm giảm hoạt tính do hấp phụ/tạo phức.", "1, tr.233"]], "te": [["Due to adsorption, it is incompatible with plastic vials, rubber stoppers, bentonite, magnesium trisilicate, polyethylene and polyhydroxyethylmethacrylate (soft contact lenses); Carboxymethylcellulose and polysorbate 80 reduce activity due to adsorption/complex formation.", "1, tr.233"]], "d": [["Tinh thể dễ bay hơi, không màu hoặc trắng, mùi long não mốc.", "1, tr.233"]], "de": [["Volatile crystals, colorless or white, musty camphor odor.", "1, tr.233"]], "a": "chlorobutanol clorobutanol chlorbutol 57-15-8 Chlorobutanol Chlorobutanol, Anhydrous Acetone chloroform anhydrous chlorbutol chlorbutanol chlorobutanolum anhydricum Chloretone Coliquifilm-, methaform Sedaform trichloro-íerí-butanol p,p,p-trichloro-ieributyl alcohol trichloro-i-butyl alcohol"}, {"id": "chlorocresol", "n": "Chlorocresol", "nv": "Chlorocresol", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "59-50-7", "f": [["Dùng làm chất bảo quản kháng khuẩn ở nồng độ tới 0,2% trong nhiều chế phẩm, trừ đường uống hoặc tiếp xúc niêm mạc; có hiệu lực với vi khuẩn, bào tử, nấm mốc và nấm men; mạnh nhất trong môi trường acid.", "1, tr.235"]], "fe": [["Used as an antibacterial preservative at concentrations up to 0.2% in many preparations, except for oral administration or mucosal contact; effective against bacteria, spores, mold and yeast; Strongest in acidic environments.", "1, tr.235"]], "t": [["Phân hủy khi tiếp xúc kiềm mạnh (tỏa nhiệt và khói dễ nổ); tương kỵ với chất oxy hóa, đồng và dung dịch calci clorid, codein phosphat, diamorphin hydroclorid, quinin hydroclorid; ăn mòn kim loại, tạo phức với ion kim loại chuyển tiếp, đổi màu với muối sắt.", "1, tr.235"]], "te": [["Decomposes when exposed to strong alkalis (emitting heat and explosive fumes); Incompatible with oxidizing agents, copper and calcium chloride solutions, codeine phosphate, diamorphine hydrochloride, quinine hydrochloride; corrodes metals, forms complexes with transition metal ions, changes color with iron salts.", "1, tr.235"]], "d": [["Tinh thể hoặc bột kết tinh không màu/gần không màu, mùi phenol đặc trưng.", "1, tr.235"], ["Tan 1 trong 0,4 phần ethanol; tan trong aceton, cloroform, ether, dầu, glycerin; ít tan trong nước (1 trong 260).", "1, tr.235"]], "de": [["Colorless/near colorless crystals or crystalline powder, characteristic phenolic odor.", "1, tr.235"], ["Soluble 1 in 0.4 parts ethanol; Soluble in acetone, chloroform, ether, oil, glycerin; Slightly soluble in water (1 in 260).", "1, tr.235"]], "a": "chlorocresol clorocresol 4-chloro-3-methylphenol 59-50-7 Chlorocresol Aptal Baktol 4-chloro-m-cresol p-chloro-m-cresol chlorocresolum l-chloro-4-hydroxy-2-methylbenzene 2-chloro-5-hydroxytoluene 6-chloro-3-hydroxytoluene 3methyl-4-chlorophenol Nipacide PC parachlorometacresol"}, {"id": "chlorodifluoroethane-hcfc", "n": "Chlorodifluoroethane (HCFC)", "nv": "Chlorodifluoroethan (HCFC)", "g": ["Chất đẩy aerosol"], "ge": ["Aerosol propellant"], "cas": "75-68-3", "f": [["Là khí đẩy hydrochlorofluorocarbon (HCFC) trước đây dùng trong chế phẩm aerosol dùng ngoài; hiện không còn được phép dùng trong dược phẩm do tác hại môi trường.", "1, tr.238"]], "fe": [["A hydrochlorofluorocarbon (HCFC) propellant formerly used in topical aerosol preparations; It is no longer allowed to be used in pharmaceuticals due to environmental damage.", "1, tr.238"]], "t": [["Tương kỵ với kim loại kiềm, kiềm thổ, kim loại dạng bột, clor; phản ứng mạnh với chất oxy hóa; tương hợp với thành phần thông thường trong aerosol dược phẩm.", "1, tr.238"]], "te": [["Incompatible with alkali metals, alkaline earths, powdered metals, chlorine; reacts strongly with oxidizing agents; Compatible with common ingredients in pharmaceutical aerosols.", "1, tr.238"]], "d": [["Khí hóa lỏng, ở nhiệt độ phòng tồn tại dạng lỏng dưới áp suất hơi riêng hoặc dạng khí ở áp suất khí quyển; lỏng không màu, mùi ether nhẹ; không ăn mòn, không kích ứng.", "1, tr.238"], ["Tan 1 trong 715 phần nước ở 20 °C.", "1, tr.238"]], "de": [["Liquefied gas, which at room temperature exists as a liquid under specific vapor pressure or as a gas at atmospheric pressure; Colorless liquid, slight ether odor; Non-corrosive, non-irritating.", "1, tr.238"], ["Dissolves 1 in 715 parts of water at 20 °C.", "1, tr.238"]], "a": "chlorodifluoroethane hcfc hcfc-142b 75-68-3 ,1-Difluoro-l-chloroethane Dymel 142b Genetron 142b HCFC 142b propellant 142b R-142b refrigerant 142b Solkane 142b"}, {"id": "chlorofluorocarbons-cfc", "n": "Chlorofluorocarbons (CFC)", "nv": "Dichlorodifluoromethane; Dichlorotetrafluoroethane; Trichloromonofluoromethane", "g": ["Chất đẩy aerosol"], "ge": ["Aerosol propellant"], "cas": "75-71-8, 76-14-2, 75-69-4", "f": [["Là các khí đẩy CFC từng dùng trong dược phẩm; hiện không còn dùng trong bình xịt định liều (MDI), trừ một số ít MDI hiện hữu; dichlorodifluoromethan dùng đơn độc hoặc phối hợp với các CFC khác.", "1, tr.240"]], "fe": [["These are CFC propellant gases used in pharmaceuticals; no longer used in metered-dose inhalers (MDIs), except for a few existing MDIs; dichlorodifluoromethane used alone or in combination with other CFCs.", "1, tr.240"]], "t": [["Trên 5% nước trong dung dịch chứa trichloromonofluoromethan có thể thủy phân propellant tạo vết acid hydrocloric gây kích ứng da/ăn mòn bình kim loại; trichloromonofluoromethan phản ứng với nhôm (có ethanol) gây ăn mòn và sinh khí hydro.", "1, tr.240"]], "te": [["More than 5% water in a solution containing trichloromonofluoromethane can hydrolyze propellant to create hydrochloric acid stains that cause skin irritation/corrosion to metal vessels; Trichloromonofluoromethane reacts with aluminum (with ethanol) to cause corrosion and produce hydrogen gas.", "1, tr.240"]], "d": [["Gồm dichlorodifluoromethan, dichlorotetrafluoroethan và trichloromonofluoromethan; là khí hóa lỏng, lỏng gần như không mùi và không màu; không ăn mòn, không kích ứng.", "1, tr.240"]], "de": [["Includes dichlorodifluoromethane, dichlorotetrafluoroethan and trichloromonofluoromethane; is a liquefied, liquid gas that is nearly odorless and colorless; Non-corrosive, non-irritating.", "1, tr.240"]], "a": "chlorofluorocarbons cfc dichlorodifluoromethane dichlorotetrafluoroethane trichloromonofluoromethane 75-71-8 Dichlorodifluoromethane Dichlorotetrafluoroethane Trichloromonofluoromethane Arcton Dymel Freon Frigen Genetron Halon Isceon"}, {"id": "chloroxylenol", "n": "Chloroxylenol", "nv": "Chloroxylenol", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "88-04-0", "f": [["Dùng ở nồng độ thấp (thường 0,1–0,8%) làm chất bảo quản kháng khuẩn trong chế phẩm dùng ngoài như kem và thuốc mỡ; cũng dùng trong mỹ phẩm.", "1, tr.243"]], "fe": [["Used in low concentrations (usually 0.1–0.8%) as an antibacterial preservative in topical preparations such as creams and ointments; Also used in cosmetics.", "1, tr.243"]], "t": [["Tương kỵ với chất diện hoạt không ion hóa và methylcellulose.", "1, tr.243"]], "te": [["Incompatible with non-ionic surfactants and methylcellulose.", "1, tr.243"]], "d": [["Tinh thể hoặc bột kết tinh màu trắng/kem, mùi phenol đặc trưng; bay hơi theo hơi nước.", "1, tr.243"], ["Dễ tan trong ethanol 95%; tan trong ether, terpen và dầu; rất ít tan trong nước; tan trong dung dịch hydroxyd kiềm.", "1, tr.243"]], "de": [["White/cream crystals or crystalline powder, characteristic phenolic odor; evaporates with water vapor.", "1, tr.243"],
