75M ; 1.25M] (L2 = 25.0).\n• Howe two-sided Tolerance Interval & Minitab-style capability report.", "action": "Open USP <905> Uniformity Tool"}}, {"id": "ichq2_gagerr_topic", "tool": "ichq2_gagerr", "keys": ["ich q2", "q2 r2", "tuyen tinh", "linearity", "lod", "loq", "recovery", "do dung", "lack of fit", "gage r&r", "gage rr", "msa", "ndc"], "vi": {"title": "Thẩm định Phương pháp ICH Q2(R2) & Gage R&R (MSA)", "desc": "Đánh giá độ tuyến tính HPLC/UV, độ đúng (% Recovery) theo ICH Q2(R2) và phân tích hệ thống đo Gage R&R Crossed ANOVA.", "formula": "LOD = 3.3σ / S  |  LOQ = 10σ / S  |  ndc = floor(1.41 × SD_Part / SD_GRR)", "criteria": "• Tuyến tính: R², %Y-intercept tại 100%, kiểm định Lack-of-Fit và biểu đồ phần dư.\n• Gage R&R (AIAG/Minitab): %Study Var / %Tolerance < 10% (Đạt), 10–30% (Có điều kiện), > 30% (Không đạt); ndc ≥ 5.", "action": "Mở Công cụ Thẩm định ICH Q2 & Gage R&R"}, "en": {"title": "ICH Q2(R2) Validation & Gage R&R (MSA)", "desc": "HPLC/UV linearity, Lack-of-Fit, LOD/LOQ, % Recovery accuracy and Crossed ANOVA Gage R&R.", "formula": "LOD = 3.3σ / S  |  LOQ = 10σ / S  |  ndc = floor(1.41 × SD_Part / SD_GRR)", "criteria": "• Linearity: R², %Y-intercept at nominal 100%, Lack-of-Fit & residuals.\n• Gage R&R (AIAG/Minitab): <10% Pass, 10–30% Marginal, >30% Fail; ndc ≥ 5.", "action": "Open ICH Q2 & Gage R&R Tool"}}, {"id": "ichq9_fmea_pareto_topic", "tool": "ichq9_fmea_pareto", "keys": ["ich q9", "fmea", "rpn", "pareto", "rui ro", "risk", "80/20", "sai loi", "s x o x d"], "vi": {"title": "Đánh giá Rủi ro ICH Q9 (FMEA) & Biểu đồ Pareto", "desc": "Ma trận chấm điểm rủi ro CMA/CPP theo ICH Q9 và biểu đồ Pareto 80/20 xác định lỗi bào chế trọng yếu.", "formula": "RPN = Severity (S) × Occurrence (O) × Detection (D)", "criteria": "• Mức rủi ro RPN: Thấp (< 40), Trung bình (40–99), Cao (≥ 100 — cần biện pháp giảm thiểu).\n• Biểu đồ Pareto: Tự động sắp xếp giảm dần kèm đường % tích lũy và mốc 80% chuẩn Minitab.", "action": "Mở Công cụ Rủi ro ICH Q9 & Pareto"}, "en": {"title": "ICH Q9 Quality Risk (FMEA) & Pareto Chart", "desc": "CMA/CPP FMEA risk scoring matrix per ICH Q9 and Minitab-style 80/20 defect Pareto chart.", "formula": "RPN = Severity (S) × Occurrence (O) × Detection (D)", "criteria": "• RPN Risk Tiers: Low (<40), Medium (40–99), High (≥100).\n• Pareto Chart: Descending defect bars with cumulative % curve and 80% cutoff line.", "action": "Open ICH Q9 FMEA & Pareto Tool"}}];

function cleanStr(s) {
  if (!s) return '';
  return s.toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd')
    .replace(/([a-z])(\d+)/g, '$1 $2')
    .replace(/(\d+)([a-z])/g, '$1 $2')
    .replace(/\bmagie\b/g, 'magnesium magnesi')
    .replace(/\bcanxi\b/g, 'calcium calci')
    .replace(/\bkem\b/g, 'zinc kem')
    .replace(/\bsat\b/g, 'iron sat')
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function searchRDContent(query, lang) {
  const qClean = cleanStr(query);
  if (!qClean) return [];
  const tokens = qClean.split(' ').filter(t => t.length > 1);
  const results = [];

  // 1. R&D Topics (f2, ICH Q1E, Scale-up, Cpk, QbD, AI)
  for (const t of KB_TOPICS) {
    let score = 0;
    const allKeys = t.keys.map(cleanStr);
    for (const k of allKeys) {
      if (qClean === k) score += 220;
      else if (qClean.includes(k) || k.includes(qClean)) score += 130;
      else {
        for (const tok of tokens) {
          if (k.split(' ').includes(tok)) score += 40;
          else if (k.includes(tok)) score += 20;
        }
      }
    }
    const tTitle = cleanStr(t[lang]?.title || t.vi.title);
    if (tTitle.includes(qClean)) score += 80;
    if (score > 35) results.push({ type: 'topic', item: t, score });
  }

  // 2. Nutrients (RDA & UL)
  const isNutrientQuery = tokens.some(tok => ['rda', 'ul', 'vitamin', 'khoang', 'chat', 'vi', 'lieu', 'nhu', 'cau', 'zinc', 'kem', 'canxi', 'calcium', 'sat', 'iron', 'fe'].includes(tok));
  for (const nut of KB_NUTRIENTS) {
    let score = 0;
    const n = cleanStr(nut.n), nv = cleanStr(nut.nv), a = cleanStr(nut.aliases || '');
    if (qClean === n || qClean === nv || qClean === nut.id || (a && a.includes(qClean))) score += 220;
    else if (n.includes(qClean) || nv.includes(qClean) || (a && a.includes(qClean))) score += 150;
    else {
      let hit = 0;
      for (const tok of tokens) {
        if (tok === 'rda' || tok === 'ul') continue;
        if (n.split(' ').includes(tok) || nv.split(' ').includes(tok) || (a && a.split(' ').includes(tok))) {
          hit++; score += 75;
        } else if (n.includes(tok) || nv.includes(tok) || (a && a.includes(tok))) {
          score += 35;
        }
      }
      if (hit > 0 && isNutrientQuery) score += 60;
    }
    if (score > 35) results.push({ type: 'nutrient', item: nut, score });
  }

  // 3. Excipients (404 monographs)
  for (const ex of KB_EXCIPIENTS) {
    let score = 0;
    const n = cleanStr(ex.n), nv = cleanStr(ex.nv), a = cleanStr(ex.a), cas = cleanStr(ex.cas);
    const f = cleanStr(ex.f + ' ' + ex.fe), t = cleanStr(ex.t + ' ' + ex.te);
    if (qClean === n || qClean === nv || (cas && qClean === cas)) score += 220;
    else if (a && a.includes(qClean)) score += 160;
    else if (n.includes(qClean) || nv.includes(qClean)) score += 120;
    else {
      let matchedTokens = 0;
      for (const tok of tokens) {
        if (a && a.split(' ').includes(tok)) { matchedTokens++; score += 45; }
        else if (n.split(' ').includes(tok) || nv.split(' ').includes(tok)) { matchedTokens++; score += 40; }
        else if (a && a.includes(tok)) score += 25;
        else if (f.includes(tok)) score += 15;
      }
      if (matchedTokens === tokens.length && tokens.length > 1) score += 60;
    }
    if (score > 35) results.push({ type: 'excipient', item: ex, score });
  }

  // 4. Tools Navigation
  for (const tool of TOOLS) {
    let score = 0;
    const vi = cleanStr(tool.vi[0]);
    const en = cleanStr(tool.en[0]);
    if (vi === qClean || en === qClean) score += 150;
    else if (vi.includes(qClean) || en.includes(qClean)) score += 90;
    else {
      for (const tok of tokens) {
        if (vi.includes(tok) || en.includes(tok)) score += 25;
      }
    }
    if (score > 35) results.push({ type: 'tool', item: tool, score });
  }

  results.sort((a, b) => b.score - a.score);
  return results.slice(0, 3);
}

    card.innerHTML = `
      <span class="kb-badge">${lang==='vi'?'VI CHẤT DINH DƯỠNG':'MICRONUTRIENT RDA/UL'}</span>
      <div class="kb-title">${lang==='vi'?nut.nv:nut.n}</div>
      <div class="kb-sub"><i>${nut.n}</i> • Đơn vị: <b>${nut.u}</b></div>
      <div class="kb-row"><b>RDA Nam (19-50 tuổi):</b> ${nut.rda_m} ${nut.u}</div>
      <div class="kb-row"><b>RDA Nữ (19-50 tuổi):</b> ${nut.rda_f} ${nut.u}</div>
      <div class="kb-warn"><b>Giới hạn an toàn tối đa (UL):</b> ${nut.ul} ${nut.u}</div>
      <button type="button" class="kb-btn" onclick="$('cb').hidden=true;location.hash='#/tool/tracuurdaul'">
        ➔ ${lang==='vi'?'Tra cứu chi tiết liều theo độ tuổi':'Check age-specific recommendations'}
      </button>
    `;
  } else if (res.type === 'tool') {
    const tool = res.item;
    card.innerHTML = `
      <span class="kb-badge">${lang==='vi'?'CÔNG CỤ HỆ THỐNG':'SYSTEM TOOL'}</span>
      <div class="kb-title">${tool[lang][0]}</div>
      <div class="kb-row">${tool[lang][1]}</div>
      <button type="button" class="kb-btn" onclick="$('cb').hidden=true;location.hash='#/tool/${tool.id}'">
        ➔ ${lang==='vi'?'Mở '+tool[lang][0]:'Open '+tool[lang][0]}
      </button>
    `;
  }
  return card;
}

let cbInit = false;
const cbAdd = (r, txt) => {
  const l = $('cbLog'), m = document.createElement('div');
  m.className = 'cm ' + r;
  m.textContent = txt;
  l.appendChild(m);
  l.scrollTop = l.scrollHeight;
  return m;
};

const cbAddResult = (results, query) => {
  const l = $('cbLog'), m = document.createElement('div');
  m.className = 'cm b';
  if (!results || !results.length) {
    m.innerHTML = `<div>${CB[L].none}</div><div style="font-size:11px;color:var(--mut);margin-top:4px;">${L==='vi'?'Thử từ khóa: Avicel, f2 hòa tan, ICH Q1E, Kẽm, Dwell time, Cpk...':'Try keywords: Avicel, Dissolution f2, ICH Q1E, Zinc, Dwell time, Cpk...'}</div>`;
  } else {
    m.innerHTML = `<div style="font-weight:600;margin-bottom:4px;color:var(--fg);">${L==='vi'?'Đã tìm thấy '+results.length+' kết quả liên quan:':'Found '+results.length+' matching results:'}</div>`;
    results.forEach(res => {
      m.appendChild(renderResultCard(res, L));
    });
  }
  l.appendChild(m);
  l.scrollTop = l.scrollHeight;

  // Update dynamic chips based on results
  if (results && results.length) {
    const top = results[0];
    if (top.type === 'excipient') {
      updateChips(['Avicel PH102', 'Magie stearat', 'PVP K30', 'Độ tan tá dược', 'Tính f2']);
    } else if (top.type === 'topic') {
      updateChips(['Tính f2 hòa tan', 'Hạn dùng ICH Q1E', 'Dwell time dập viên', 'Cpk Sixpack', 'QbD & DOE']);
    } else if (top.type === 'nutrient') {
      updateChips(['RDA Kẽm', 'RDA Canxi', 'Vitamin D3', 'Sắt cho bà bầu', 'Tra cứu UL']);
    }
  }
};

function updateChips(chipList) {
  $('cbChips').innerHTML = '';
  chipList.forEach(x => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = x;
    b.onclick = () => {
      $('cbI').value = x;
      $('cbF').dispatchEvent(new Event('submit'));
    };
    $('cbChips').appendChild(b);
  });
}

let cbSuppressClick = false;
$('cbBtn').onclick = (e) => {
  if (cbSuppressClick) { cbSuppressClick = false; e.preventDefault(); return; }
  $('cb').hidden = !$('cb').hidden;
  if (!$('cb').hidden && !cbInit) {
    cbInit = true;
    cbAdd('b', L==='vi'?'Xin chào! Tôi là Trợ lý RD. Bạn có thể hỏi tôi về 404 tá dược, tiêu chuẩn f2, hạn dùng ICH Q1E, vi chất RDA/UL, ANOVA, USP <905>, ICH Q2/Gage R&R hoặc FMEA/Pareto.':'Hello! I am your RD Assistant. Ask me about 404 excipient monographs, f2 dissolution, ICH Q1E stability, micronutrients RDA/UL, ANOVA, USP <905>, ICH Q2/Gage R&R, or FMEA/Pareto.');
  }
  if (!$('cb').hidden) $('cbI').focus();
};
$('cbX').onclick = () => { $('cb').hidden = true; };

$('cbF').onsubmit = e => {
  e.preventDefault();
  const v = $('cbI').value.trim();
  if (!v) return;
  $('cbI').value = '';
  cbAdd('u', v);
  setTimeout(() => {
    const res = searchRDContent(v, L);
    cbAddResult(res, v);
  }, 150);
};

function cbLang() {
  const c = CB[L];
  $('cbT').textContent = c.t;
  $('cbI').placeholder = c.ph;
  $('cbS').textContent = c.send;
  $('cbBtn').title = c.t;
  updateChips(c.chips);
}

// Smooth GPU-accelerated draggable chatbot button (translate3d + rAF)
(function() {
  const btn = $('cbBtn');
  let dragging = false, moved = false, positioned = false;
  let sx = 0, sy = 0, bx = 0, by = 0, curX = 0, curY = 0, targetX = 0, targetY = 0, rafId = 0;
  const clamp = (x, y) => {
    const w = btn.offsetWidth || 44, h = btn.offsetHeight || 44;
    return [
      Math.max(8, Math.min(window.innerWidth - w - 8, x)),
      Math.max(8, Math.min(window.innerHeight - h - 8, y))
    ];
  };
  const applyPos = (x, y) => {
    curX = x; curY = y;
    btn.style.transform = `translate3d(${x}px, ${y}px, 0)`;
  };
  const schedule = () => {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = 0;
      applyPos(targetX, targetY);
    });
  };
  btn.addEventListener('pointerdown', e => {
    if (e.button && e.button !== 0) return;
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY;
    const r = btn.getBoundingClientRect();
    bx = r.left; by = r.top;
    try { btn.setPointerCapture(e.pointerId); } catch (_) {}
  });
  btn.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.hypot(dx, dy) > 5) {
      moved = true;
      if (!positioned) {
        positioned = true;
        btn.style.left = '0px'; btn.style.top = '0px';
        btn.style.right = 'auto'; btn.style.bottom = 'auto';
      }
      btn.classList.add('dragging');
    }
    if (moved) {
      const [nx, ny] = clamp(bx + dx, by + dy);
      targetX = nx; targetY = ny;
      schedule();
    }
  });
  const finishDrag = e => {
    if (!dragging) return;
    dragging = false;
    btn.classList.remove('dragging');
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; applyPos(targetX, targetY); }
    if (moved) {
      cbSuppressClick = true;
      setTimeout(() => { cbSuppressClick = false; }, 120);
    }
    try { btn.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  btn.addEventListener('pointerup', finishDrag);
  btn.addEventListener('pointercancel', finishDrag);
  window.addEventListener('resize', () => {
    if (!positioned) return;
    const [nx, ny] = clamp(curX, curY);
    applyPos(nx, ny);
  });
})();

// Khởi động với xác thực Supabase bắt buộc & duy trì Theme + Ngôn ngữ ngay tại màn hình đăng nhập
applyTheme(currentTheme);
applyLang();
if(sb){
  sb.auth.onAuthStateChange((ev,sess)=>{
    if(ev==='PASSWORD_RECOVERY'){
      mode='rs';
      showLoginOnly();
      return;
    }
    if(sess&&sess.user&&mode!=='rs')enter(sess.user);
    else if(ev==='SIGNED_OUT')showLoginOnly();
  });
  sb.auth.getSession().then(({data,error})=>{
    if(!error&&data&&data.session&&data.session.user&&mode!=='rs')enter(data.session.user);
    else showLoginOnly();
  }).catch(()=>showLoginOnly());
}else{
  showLoginOnly();
  $('lmsg').className='msg e';
  $('lmsg').textContent=L==='vi'?'Không tải được dịch vụ đăng nhập. Vui lòng kiểm tra kết nối Internet.':'Unable to load authentication service. Check Internet connection.';
}
