 powder; Round or polyhedral seeds.", "1, tr.928"], ["Very slightly soluble in chloroform and 95% ethanol; practically insoluble in water.", "1, tr.928"]], "a": "sterilizable maize starch tinh bot ngo tiet khuan absorbable dusting powder Absorbable Dusting Powder Biosorb double-dressed, white maize starch Fluidamid R444 Keoflo ADP Meritena modified starch dusting powder PureDent starch-derivative dusting powder sterilizable corn starch"}, {"id": "stearic-acid", "n": "Stearic Acid", "nv": "Stearic Acid", "g": ["Chất nhũ hóa", "Chất làm tăng độ tan", "Tá dược trơn bóng (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Emulsifying agent", "Solubilizing agent", "Tablet / capsule glidant", "Viscosity-increasing agent"], "cas": "57-11-4", "f": [["Chủ yếu dùng làm tá dược trơn viên nén/nang (1–3%); cũng làm tá dược dính hoặc phối hợp shellac làm màng bao; trong chế phẩm dùng ngoài làm chất nhũ hóa và tăng độ tan (nồng độ 1–20% trong thuốc mỡ/kem); khi trung hòa một phần bằng kiềm/triethanolamin tạo nền kem.", "1, tr.930"]], "fe": [["Mainly used as an excipient for smooth tablets/capsules (1–3%); also used as an adhesive excipient or combined with shellac to make a coating; in topical preparations as an emulsifier and solubility enhancer (concentration 1–20% in ointments/creams); When partially neutralized with alkali/triethanolamine, a cream base is formed.", "1, tr.930"]], "t": [["Tương kỵ với đa số hydroxyd kim loại, và có thể với base, chất khử và chất oxy hóa; nền thuốc mỡ chứa acid stearic có thể bị khô/lổn nhổn khi phối hợp với muối kẽm hoặc calci.", "1, tr.930"]], "te": [["Incompatible with most metal hydroxides, and possibly with bases, reducing agents and oxidizing agents; Ointment bases containing stearic acid may become dry/lumpy when combined with zinc or calcium salts.", "1, tr.930"]], "d": [["Chất rắn kết tinh cứng, hơi bóng, màu trắng hoặc hơi vàng, hoặc bột màu trắng/vàng trắng; mùi và vị nhẹ như mỡ.", "1, tr.930"], ["Tan trong cloroform, ethanol 95%, ether; thực tế không tan trong nước.", "1, tr.930"]], "de": [["Hard, slightly shiny, white or yellowish crystalline solid, or white/white yellow powder; The smell and taste are light like grease.", "1, tr.930"], ["Soluble in chloroform, 95% ethanol, ether; practically insoluble in water.", "1, tr.930"]], "a": "stearic acid acid stearic octadecanoic acid 57-11-4 Stearic Acid Acidum stearicum cetylacetic acid Crodacìd Cristal G Cristal 5 Dermofat 4919 Dervacid DUBCARE STEA E570 Edenor Eniersol Extra AS Extra P Extra S Extra ST 1-heptadecane carboxylic acid Hystrene Industrene Kortacid 1895 Pearl Steric Pristerene speziol L2SM GF Stellipress Micro stearophanic acid Tegostearic TriStar"}, {"id": "stearyl-alcohol", "n": "Stearyl Alcohol", "nv": "Stearyl Alcohol", "g": ["Chất làm mềm da", "Chất nhũ hóa", "Chất làm tăng độ đặc", "Chất làm tăng độ nhớt"], "ge": ["Emollient", "Emulsifying agent", "Stiffening agent", "Viscosity-increasing agent"], "cas": "112-92-5", "f": [["Dùng trong kem và thuốc mỡ dùng ngoài/âm đạo làm chất làm cứng (tăng độ nhớt nhũ tương → tăng độ ổn định); có tính làm mềm và nhũ hóa yếu, tăng khả năng giữ nước của thuốc mỡ (như petrolatum); dùng trong nang và viên giải phóng biến đổi, thuốc đặt; là chất tăng thấm qua da.", "1, tr.934"]], "fe": [["Used in topical/vaginal creams and ointments as a hardening agent (increases emulsion viscosity → increases stability); has weak emollient and emulsifying properties, increasing the water-holding capacity of ointments (such as petrolatum); used in modified-release capsules and tablets, suppositories; is a substance that increases skin permeability.", "1, tr.934"]], "t": [["Tương kỵ với chất oxy hóa mạnh và acid mạnh.", "1, tr.934"]], "te": [["Incompatible with strong oxidizers and strong acids.", "1, tr.934"]], "d": [["Mảnh, viên hoặc hạt sáp cứng màu trắng, mùi nhẹ đặc trưng, vị nhạt.", "1, tr.934"], ["Tan trong cloroform, ethanol 95%, ether, hexan, propylen glycol, dầu thực vật; thực tế không tan trong nước.", "1, tr.934"]], "de": [["White pieces, pellets or hard wax granules, characteristic mild odor, bland taste.", "1, tr.934"], ["Soluble in chloroform, 95% ethanol, ether, hexane, propylene glycol, vegetable oil; practically insoluble in water.", "1, tr.934"]], "a": "stearyl alcohol alcol stearylic octadecanol 112-92-5 Stearyl Alcohol Alcohol stearylicus Alfol 18 Cachalot Crodacol S95 decyl octyl alcohol 1-hydroxyoctadecane Hyfatol 18-95 Hyfatol 18-98 Kolliivax SA Lanette IS Lipocol S Nacol 18-94 Nacol 18-98 Nacol 18-99 I-octadecanol rt-octadecanol octadecyl alcohol Rita SA speziol CIS Pharma stearic alcohol Stearol Stenol Tego Alkanol 18 Vegarol 1 S9S Vegarol 1895"}, {"id": "sucralose", "n": "Sucralose", "nv": "Sucralose", "g": ["Chất tạo ngọt"], "ge": ["Sweetening agent"], "cas": "56038-13-2", "f": [["Dùng làm chất tạo ngọt trong chế phẩm dược, đơn độc hoặc phối hợp với chất tạo hương để che vị đắng của thuốc uống và xịt mũi; độ ngọt ~300–1000 lần sucrose, không hậu vị; nồng độ trong thực phẩm 0,03–0,24%.", "1, tr.936"]], "fe": [["Used as a sweetener in pharmaceutical preparations, alone or in combination with flavoring agents to mask the bitter taste of oral medications and nasal sprays; sweetness ~300–1000 times that of sucrose, no aftertaste; concentration in food 0.03–0.24%.", "1, tr.936"]], "t": [["Tài liệu chưa đề cập.", "1, tr.936"]], "te": [["Documents not mentioned.", "1, tr.936"]], "d": [["Bột kết tinh trơn chảy màu trắng đến trắng ngà.", "1, tr.936"], ["Dễ tan trong ethanol 95%, methanol và nước; ít tan trong ethyl acetat.", "1, tr.936"]], "de": [["White to ivory white smooth flowing crystalline powder.", "1, tr.936"], ["Easily soluble in 95% ethanol, methanol and water; Slightly soluble in ethyl acetate.", "1, tr.936"]], "a": "sucralose 56038-13-2 E955 Sucralose Cukrent) E955 Nevella splenda sucralosa sucralosum SucraPlus Sucre X TGS T,4',6'-trichlorogalactosucrose 4,T,6/-trichloro4,1',6'-trideoxy-gđ/đốío-sucrose Unisweet"}, {"id": "sucrose", "n": "Sucrose" side Compressuc PS refined sugar saccharosum saccharum sucrosum"}, {"id": "sucrose-octaacetate", "n": "Sucrose Octaacetate", "nv": "Sucrose Octaacetate", "g": ["Chất làm biến tính cồn", "Chất tạo hương"], "ge": ["Alcohol denaturant", "Flavoring agent"], "cas": "126-14-7", "f": [["Dùng trong chế phẩm uống làm chất biến tính cồn và chất tạo vị đắng.", "1, tr.942"]], "fe": [["Used in oral preparations as an alcohol denaturant and bittering agent.", "1, tr.942"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.942"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.942"]], "d": [["Bột màu trắng (dẫn chất acetyl hóa của sucrose).", "1, tr.942"], ["Rất dễ tan trong methanol và cloroform; tan trong ethanol 95% và ether; rất ít tan trong nước.", "1, tr.942"]], "de": [["White powder (acetylated derivative of sucrose).", "1, tr.942"], ["Very soluble in methanol and chloroform; Soluble in 95% ethanol and ether; very little soluble in water.", "1, tr.942"]], "a": "sucrose octaacetate sucrose octaacetat 126-14-7 Sucrose Octaacetate"}, {"id": "sucrose-palmitate", "n": "Sucrose Palmitate", "nv": "Sucrose Monopalmitate", "g": ["Chất phân tán", "Chất nhũ hóa", "Chất diện hoạt không ion hóa", "Chất làm tăng độ tan"], "ge": ["Dispersing agent", "Emulsifying agent", "Nonionic surfactant", "Solubilizing agent"], "cas": "26446-38-8", "f": [["Dùng ổn định nhũ tương làm chất diện hoạt/đồng diện hoạt; làm chất tăng độ tan (cải thiện độ tan felodipin); làm chất tăng hấp thu đường uống qua niêm mạc ruột và tăng thấm qua da; tạo gel nhớt đàn hồi phụ thuộc nhiệt độ.", "1, tr.944"]], "fe": [["Used to stabilize emulsions as surfactant/cosurfactant; as a solubility enhancer (improves felodipine solubility); as an agent that increases oral absorption through the intestinal mucosa and increases skin permeability; create temperature-dependent viscoelastic gel.", "1, tr.944"]], "t": [["Tài liệu chưa đề cập.", "1, tr.944"]], "te": [["Documents not mentioned.", "1, tr.944"]], "d": [["Bột ghtly soluble in water; Soluble in tetrahydrofuran.", "1, tr.946"]], "a": "sucrose stearate sucrose stearat 25168-73-4 Sucrose Stearate Crodesta F E473 sacchari stearas saccharose stearate Sisterna SP STELLIESTERS SE SS sucrose monostearate sucrose monostearic acid ester sucrose octadecanoate sucrose stearate ester"}, {"id": "sugar-spheres", "n": "Sugar Spheres", "nv": "Sugar Spheres", "g": ["Tá dược độn (viên nén/nang)"], "ge": ["Tablet / capsule diluent"], "cas": "", "f": [["Chủ yếu dùng làm nhân trơ trong viên nang và viên nén, nhất là dạng giải phóng kéo dài đa tiểu phân; là nền để bồi thuốc, sau đó bao lớp polymer điều biến giải phóng; giải phóng thuốc kéo dài qua khuếch tán hoặc ăn mòn màng.", "1, tr.953"]], "fe": [["Mainly used as an inert nucleus in capsules and tablets, especially multiparticulate extended-release forms; is the base for drug loading, then covered with a release modulating polymer layer; sustained drug release via membrane diffusion or corrosion.", "1, tr.953"]], "t": [["Xem mục Tinh bột và Sucrose.", "1, tr.953"]], "te": [["See Starch and Sucrose section.", "1, tr.953"]], "d": [["Hạt gần cầu, chứa 62,5–91,5% sucrose (còn lại chủ yếu là tinh bột).", "1, tr.953"], ["Độ tan trong nước tùy tỷ lệ sucrose/tinh bột (phần sucrose dễ tan, tinh bột thực tế không tan trong nước lạnh).", "1, tr.953"]], "de": [["Seeds are near globular, containing 62.5–91.5% sucrose (the remainder is mainly starch).", "1, tr.953"], ["Solubility in water depends on the sucrose/starch ratio (the sucrose part is easily soluble, the starch is practically insoluble in cold water).", "1, tr.953"]], "a": "sugar spheres hat cau duong nonpareil non-pareil seeds Sugar Spheres Non-pareil Nu-Core Nu-Pareil PG sacchari sphaerae sugar seeds Suglets"}, {"id": "sugar-compressible", "n": "Sugar, Compressible", "nv": "Compressible Sugar", "g": ["Chất tạo ngọt", "Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)"], "ge": ["Sweetening agent", "Tablet / capsule binder", "Tablet / at).", "1, tr.951"]], "te": [["Incompatible with dilute acids (hydrolyzes sucrose) and alkaline earth hydroxide (generates sucrate).", "1, tr.951"]], "d": [["Bột mịn màu trắng, vị ngọt, không mùi (sucrose nghiền mịn thường kèm ít tinh bột chống vón).", "1, tr.951"]], "de": [["White fine powder, sweet taste, odorless (finely ground sucrose often contains a little anti-caking starch).", "1, tr.951"]], "a": "confectioner's sugar duong bot icing sugar powdered sugar Confectioner’s Sugar Icing sugar"}, {"id": "sulfur-dioxide", "n": "Sulfur Dioxide", "nv": "Sulfur Dioxide", "g": ["Chất chống oxy hóa", "Chất bảo quản kháng khuẩn"], "ge": ["Antioxidant", "Antimicrobial preservative"], "cas": "7446-09-5", "f": [["Dùng làm chất chống oxy hóa trong dược phẩm; tạo acid sulfurơ khi tiếp xúc nước.", "1, tr.954"]], "fe": [["Used as an antioxidant in pharmaceuticals; Creates sulfurous acid when in contact with water.", "1, tr.954"]], "t": [["Phản ứng mãnh liệt với kiềm mạnh và chất oxy hóa; khí ẩm ăn mòn đa số kim loại; tương kỵ với clorat, fluor, kim loại dạng bột, oxid kim loại, NaOH; tương kỵ với thiamin và gelatin. Xem thêm Natri metabisulfit.", "1, tr.954"]], "te": [["Reacts violently with strong alkalis and oxidizing agents; Moist gas corrodes most metals; Incompatible with chlorates, fluoride, powdered metals, metal oxides, NaOH; Incompatible with thiamine and gelatin. See also Sodium metabisulfite.", "1, tr.954"]], "d": [["Khí hoặc lỏng không màu ở nhiệt độ/áp suất phòng, mùi hắc gây ngạt; không cháy, là chất khử mạnh.", "1, tr.954"]], "de": [["Colorless gas or liquid at room temperature/pressure, pungent odor causing asphyxiation; Non-flammable, strong reducing agent.", "1, tr.954"]], "a": "sulfur dioxide luu huynh dioxid so2 7446-09-5 E220 Sulfur Dioxide"}, {"id": "sulfuric-acid", "n": "Sulfuric Acid", "nv": "Sulphuric Acid", "g": ["Chất acid hóa"], "ge": ["Acidifying agent"], "cas": "7664-93-9", "f": [["Dùng làm chất acid hóa trong nhiều chế phẩm dược và thực phẩm; cũng dùng pha acid sulfuric loãng; đã dùng trong chế phẩm tiêm, uống, dùng ngoài và nhỏ mắt.", "1, tr.956"]], "fe": [["Used as an acidifying agent in many pharmaceutical and food preparations; Also use dilute sulfuric acid; Used in injection, oral, topical and ophthalmic preparations.", "1, tr.956"]], "t": [["Tránh gần nước, đa số kim loại, chất hữu cơ, chất khử mạnh, base mạnh, carbonat, sulfid, cyanid, chất oxy hóa mạnh; là chất oxy hóa mạnh, có thể bốc cháy/nổ khi tiếp xúc nhiều chất; phản ứng mãnh liệt tỏa nhiệt lớn.", "1, tr.956"]], "te": [["Avoid near water, most metals, organic substances, strong reducing agents, strong bases, carbonates, sulfides, cyanides, strong oxidizing agents; is a strong oxidizer, can burn/explode when exposed to many substances; Violent reaction releases great heat.", "1, tr.956"]], "d": [["Chất lỏng dạng dầu, trong, không màu, không mùi; rất ăn mòn và háo nước; chứa 95–98% H₂SO₄.", "1, tr.956"], ["Trộn lẫn với ethanol và nước.", "1, tr.956"]], "de": [["Oily liquid, clear, colorless, odorless; very corrosive and hydrophilic; contains 95–98% H₂SO₄.", "1, tr.956"], ["Mix with ethanol and water.", "1, tr.956"]], "a": "sulfuric acid acid sulfuric 7664-93-9 Sulphuric Acid Sulfuric Acid Acidum sulfuricum E513 hydrogen sulfate oil of vitriol"}, {"id": "sunflower-oil", "n": "Sunflower Oil", "nv": "Refined Sunflower Oil; Sunflower Oil, Refined; Sunflower Oil", "g": ["Chất làm mềm da", "Dung môi", "Tá dược độn (viên nén/nang)"], "ge": ["Emollient", "Solvent", "Tablet / capsule diluent"], "cas": "8001-21-6", "f": [["Dùng làm chất mang/tá dược cho chế phẩm uống và dùng ngoài; nghiên cứu tạo organogel để ngăn dầu rỉ ra khỏi vi tiểu phân, cải thiện hiệu suất bẫy thuốc; độ bền oxy hóa cao nên phù hợp làm kem chống nắng.", "1, tr.958"]], "fe": [["Used as a carrier/excipient for oral and topical preparations; Research on creating organogel to prevent oil from leaking out of the microparticles, improving drug trapping efficiency; High oxidation stability so suitable as sunscreen.", "1, tr.958"]], "t": [["Tương kỵ với chất oxy hóa mạnh; độ bền oxy hóa giảm khi có oxid sắt và kẽm oxid.", "1, tr.958"]], "te": [["Incompatible with strong oxidizing agents; Oxidation stability is reduced in the presence of iron oxide and zinc oxide.", "1, tr.958"]], "d": [["Chất lỏng trong, màu vàng nhạt, vị nhẹ dễ chịu.", "1, tr.958"], ["Trộn lẫn với benzen, cloroform, carbon tetraclorid, ether và ether dầu hỏa; thực tế không tan trong ethanol 96% và nước.", "1, tr.958"]], "de": [["Clear liquid, light yellow color, mild and pleasant taste.", "1, tr.958"], ["Miscible with benzene, chloroform, carbon tetrachloride, ether and petroleum ether; Practically insoluble in 96% ethanol and water.", "1, tr.958"]], "a": "sunflower oil dau huong duong 8001-21-6 Refined Sunflower Oil Sunflower Oil, Refined Sunflower Oil Helianthi annul oleum raffinatum Helianthus annuus oil huile de tournesol oleum helianthi sunflower seed oil"}, {"id": "suppository-bases-hard-fat", "n": "Suppository Bases, Hard Fat", "nv": "Hard Fat", "g": ["Tá dược thuốc đạn/đặt"], "ge": ["Suppository base"], "cas": "", "f": [["Ứng dụng chính là làm tá dược cho thuốc đặt trực tràng và âm đạo (tác dụng tại chỗ hoặc hấp thu toàn thân); việc chọn nền cần dựa trên tính chất lý hóa và hoạt độ nhiệt động của hoạt chất.", "1, tr.959"]], "fe": [["The main application is as an excipient for rectal and vaginal suppositories (local effect or systemic absorption); The choice of base should be based on the physicochemical properties and thermodynamic activity of the active ingredient.", "1, tr.959"]], "t": [["Tương kỵ ít được báo cáo; phản ứng hóa học giữa nền và thuốc hiếm gặp, nguy cơ liên quan chỉ số hydroxyl của nền; giảm nguy cơ thủy phân aspirin bằng nền có chỉ số hydroxyl thấp (<5) và hạn chế nước.", "1, tr.959"]], "te": [["Incompatibility is rarely reported; Chemical reactions between matrix and drug are rare, the risk is related to the hydroxyl index of the matrix; Reduce the risk of aspirin hydrolysis by using a low hydroxyl number matrix (<5) and water restriction.", "1, tr.959"]], "d": [["Khối sáp giòn màu trắng/gần trắng, gần như không mùi; đun đến 50 °C tan thành chất lỏng không màu hoặc hơi vàng; chủ yếu là hỗn hợp triglycerid (glycerid bán tổng hợp).", "1, tr.959"], ["Dễ tan trong carbon tetraclorid, cloroform, ether, toluen; ít tan trong ethanol nóng; thực tế không tan trong nước.", "1, tr.959"]], "de": [["White/nearly white, almost odorless, brittle wax mass; heating to 50 °C dissolves into colorless or slightly yellow liquid; mainly a mixture of triglycerides (semi-synthetic glycerides).", "1, tr.959"], ["Easily soluble in carbon tetrachloride, chloroform, ether, toluene; Slightly soluble in hot ethanol; practically insoluble in water.", "1, tr.959"]], "a": "hard fat suppository bases nen thuoc dat chat beo cung witepsol suppocire massa estarinum hard fat Hard Fat Adeps neutralis adeps solidus Akosoft Cremao CS-34 Cremao CS-36 DUB PP Gelucire 43/01 hydrogenated vegetable glycer ides Massa Estarinum Massupol Novata semisynthetic glycer ides Suppocire Wecobee"}, {"id": "tagatose", "n": "Tagatose", "nv": "Tagatose", "g": ["Chất tạo ngọt"], "ge": ["Sweetening agent"], "cas": "87-81-0", "f": [["Dùng làm chất tạo ngọt trong đồ uống, thực phẩm và dược phẩm; dung dịch 10% ngọt bằng ~92% dung dịch sucrose 10%, năng lượng ~38% sucrose; cũng làm chất tạo ngọt độn, giữ ẩm, tạo kết cấu và ổn định; dùng trong thực phẩm ăn kiêng chỉ số đường huyết thấp.", "1, tr.964"]], "fe": [["Used as a sweetener in beverages, foods and pharmaceuticals; 10% solution is ~92% as sweet as 10% sucrose solution, energy ~38% sucrose; also as a filling, moisturizing, texturizing and stabilizing sweetener; Used in low glycemic index diet foods.", "1, tr.964"]], "t": [["Là đường khử, có thể phản ứng Maillard với hợp chất amin bậc 1 tạo sản phẩm màu nâu/vàng.", "1, tr.964"]], "te": [["As a reducing sugar, Maillard reaction can occur with primary amine compounds to produce brown/yellow products.", "1, tr.964"]], "d": [["Chất rắn kết tinh khan màu trắng; là ketohexose, đồng phân của D-fructose (đảo tại C-4).", "1, tr.964"], ["Rất dễ tan trong nước (1 trong 0,7 phần); ít tan trong ethanol.", "1, tr.964"]], "de": [["White anhydrous crystalline solid; is ketohexose, isomer of D-fructose (inverted at C-4).", "1, tr.964"], ["Very soluble in water (1 in 0.7 parts); Slightly soluble in ethanol.", "1, tr.964"]], "a": "tagatose d-tagatose 87-81-0 Tagatose D-/yxo-Hexulose (3S,4S,5R )-2-(hydroxymethyl)oxane-2,3,4,5tetrol Naturlose D-tagatose tagatosum"}, {"id": "talc", "n": "Talc", "nv": "Talc; Purified Talc", "g": ["Chất chống vón", "Chất điều hòa sự chảy", "Tá dược độn (viên nén/nang)", "Tá dược trơn bóng (viên nén/nang)"], "ge": ["Anticaking agent", "Glidant", "Tablet / capsule diluent", "Tablet / capsule glidant"], "cas": "14807-96-6", "f": [["Từng dùng rộng rãi trong dạng rắn uống làm tá dược trơn, điều hòa trơn chảy và độn (nay ít dùng hơn); hiện dùng nhiều làm chất làm chậm hòa tan trong phát triển sản phẩm giải phóng kiểm soát.", "1, tr.965"]], "fe": [["Once widely used in oral solid form as a lubricating excipient, smoothing conditioner and filler (now less commonly used); Currently widely used as a dissolution retarder in controlled release product development.", "1, tr.965"]], "t": [["Tương kỵ với hợp chất amoni bậc bốn.", "1, tr.965"]], "te": [["Incompatible with quaternary ammonium compounds.", "1, tr.965"]], "d": [["Bột kết tinh rất mịn màu trắng đến xám trắng, không mùi, trơn nhờn, mềm, không sạn; bám da tốt.", "1, tr.965"]], "de": [["Very fine crystalline powder, white to gray-white, odorless, greasy, soft, not gritty; adheres well to skin.", "1, tr.965"]], "a": "talc bot talc talcum 14807-96-6 E553b Talc Purified Talc Altaic hydrous magnesium calcium silicate hydrous magnesium silicate Imperial Luzenac Pharma magnesium hydro gen metasilicate Magsil Osmanthus Magsil Diamond Magsil Star powdered talc purified French chalk Purtalc soapstone steatite Superiore"}, {"id": "tartaric-acid", "n": "Tartaric Acid", "nv": "Tartaric Acid", "g": ["Chất acid hóa", "Chất tạo phức", "Chất hiệp lực chống oxy hóa"], "ge": ["Acidifying agent", "Chelating / Complexing agent", "Antioxidant synergist"], "cas": "87-69-4", "f": [["Dùng làm chất acid hóa trong đồ uống, kẹo, thực phẩm và dược phẩm; phối hợp với bicarbonat làm phần acid trong cốm/bột/viên sủi; cũng làm chất tạo phức và hiệp lực chống oxy hóa; tạo muối/cocrystal với hoạt chất để cải thiện độ tan.", "1, tr.968"]], "fe": [["Used as an acidifying agent in beverages, candy, foods and pharmaceuticals; Combined with bicarbonate as acid in granules/powder/effervescent tablets; also acts as a complexing agent and synergistic antioxidant; Create salt/cocrystal with active ingredient to improve solubility.", "1, tr.968"]], "t": [["Tương kỵ với bạc; phản ứvới carbonat và bicarbonat kim loại (khai thác trong chế phẩm sủi).", "1, tr.968"]], "te": [["Incompatible with silver; Reacts with metal carbonates and bicarbonates (exploited in effervescent preparations).", "1, tr.968"]], "d": [["Tinh thể đơn tà không màu hoặc bột kết tinh màu trắng/gần trắng, không mùi, vị chua gắt.", "1, tr.968"]], "de": [["Colorless monoclinic crystals or white/near white crystalline powder, odorless, sharp sour taste.", "1, tr.968"]], "a": "tartaric acid acid tartaric 87-69-4 E334 Tartaric Acid Acidum tartaricum dextrotartaric acid L-(+)-2,3-dihydroxybutanedioic acid (2R,3R)-2,3-dihydroxybutane-l,4-dioic acid 1,2dihydroxyethane-1,2-dicarboxyIic acid 2,3-dihydroxysuccinic acid ó/-7,p-dihydroxysuccinic acid oral solutions, syrups and tablets sublingual tablets topical films and patches fumaric acid"}, {"id": "tetrasodium-edetate", "n": "Tetrasodium Edetate", "nv": "Tetranatri edetat (EDTA tetranatri)", "g": ["Chất bảo quản kháng khuẩn", "Chất tạo phức"], "ge": ["Antimicrobial preservative", "Chelating / Complexing agent"], "cas": "64-02-8", "f": [["Dùng làm chất tạo phức trong chế phẩm dược, mỹ phẩm và thực phẩm; phản ứng với đa số ion kim loại hóa trị 2 và 3 tạo chelat tan; làm chất hiệp lực chống oxy hóa.", "1, tr.971"]], "fe": [["Used as a complexing agent in pharmaceutical preparations, cosmetics and foods; Reacts with most divalent and trivalent metal ions to form soluble chelates; as a synergistic antioxidant.", "1, tr.971"]], "t": [["Tương kỵ với chất oxy hóa mạnh và base mạnh. Xem thêm Acid edetic và Dinatri edetat.", "1, tr.971"]], "te": [["Incompatible with strong oxidizing agents and strong bases. See also Edetic acid and Disodium edetate.", "1, tr.971"]], "d": [["Bột kết tinh màu trắng.", "1, tr.971"], ["Dễ tan trong nước (1 trong 1).", "1, tr.971"]], "de": [["White crystalline powder.", "1, tr.971"], ["Easily soluble in water (1 in 1).", "1, tr.971"]], "a": "tetrasodium edetate tetranatri edetat edta tetrasodium 64-02-8 Calsol Complexone Distol 8 edetate sodium edetic acid tetra sodium salt EDTA tetrasodium Endrate tetrasodium ethyienebis(iminodiacetic acid) tetrasodium salt ethylenediaminetetraa cetic acid tetrasodium salt (ethylenedinitrilo)tetraacetic acid tetrasodium salt Nervanaid B Nullapon Sequestrene NA4 sodium edetate Syntes 12a tetracemate tetrasodium tetracemin tetrasodium ethylenebis(iminodiacetate) tetrasodium ethylenedia minetetraacetate Trilon B Versene 100"}, {"id": "thaumatin", "n": "Thaumatin", "nv": "Thaumatin", "g": ["Chất tăng cường hương vị", "Chất tạo ngọt"], "ge": ["Flavor enhancer", "Sweetening agent"], "cas": "53850-34-3", "f": [["Là chất tạo ngọt mạnh tự nhiên (ngọt gấp ~2000–3000 lần sucrose); dùng làm chất tạo ngọt và tăng cường hương vị.", "1, tr.972"]], "fe": [["A strong natural sweetener (~2000–3000 times sweeter than sucrose); Used as a sweetener and flavor enhancer.", "1, tr.972"]], "t": [["Tài liệu chưa đề cập.", "1, tr.972"]], "te": [["Documents not mentioned.", "1, tr.972"]], "d": [["Bột màu nâu nhạt, hút ẩm, không mùi, vị ngọt đậm; là hỗn hợp năm protein thaumatin (chủ yếu I và II).", "1, tr.972"], ["Tan trong nước, ethanol 95%, glycerin và propylen glycol; thực tế không tan trong aceton.", "1, tr.972"]], "de": [["Light brown powder, hygroscopic, odorless, strong sweet taste; is a mixture of five thaumatin proteins (mainly I and II).", "1, tr.972"], ["Soluble in water, 95% ethanol, glycerin and propylene glycol; Practically insoluble in acetone.", "1, tr.972"]], "a": "thaumatin talin 53850-34-3 E957 katemfe Talin taumatin taumatina thalin thaumatine thaumatins"}, {"id": "thimerosal", "n": "Thimerosal", "nv": "Thiomersal", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "", "f": [["Dùng làm chất bảo quản kháng khuẩn trong chế phẩm sinh học và dược phẩm từ thập niên 1930. Nồng độ tham khảo: tiêm bắp/tĩnh mạch/dưới da 0,01%; dung dịch nhỏ mắt 0,001–0,15%; nhỏ tai 0,001–0,01%; dùng ngoài 0,01%.", "1, tr.974"]], "fe": [["Used as an antibacterial preservative in biological products and pharmaceuticals since the 1930s. Reference concentration: intramuscular/intravenous/subcutaneous injection 0.01%; ophthalmic solution 0.001–0.15%; ear drops 0.001–0.01%; external use 0.01%.", "1, tr.974"]], "t": [["Tương kỵ với nhôm và kim loại khác, chất oxy hóa mạnh (peroxid, permanganat, acid nitric), acid/base mạnh, lecithin, hợp chất phenylmercuric, hợp chất amoni bậc bốn, thioglycolat và protein; natri metabisulfit, EDTA/edetat làm giảm hiệu lực; bị bao bì nhựa (polyethylen) hấp phụ.", "1, tr.974"]], "te": [["Incompatible with aluminum and other metals, strong oxidizers (peroxide, permanganate, nitric acid), strong acids/bases, lecithin, phenylmercuric compounds, quaternary ammonium compounds, thioglycolates and proteins; sodium metabisulfite, EDTA/edetate reduces potency; adsorbed by plastic packaging (polyethylene).", "1, tr.974"]], "d": [["Bột kết tinh màu kem nhạt, mùi và vị kim loại nhẹ đặc trưng.", "1, tr.974"]], "de": [["Pale cream-colored crystalline powder, characteristic mild metallic odor and taste.", "1, tr.974"]], "a": "thimerosal thiomersal 54-64-8 Thiomersal Thimerosal Benzoic acid 2-mercapto-, mercury complex [(o-carboxyphenyl)thio]ethylmercury sodium salt elcide ethyl (2-mercaptobenzoato-S)-mercury, sodium salt ethyl (sodium omercaptobenzoato)mercury mercurothiolate merzonin sodium sodium ethylmercurithiosalicylate thiomersalate thiomersalum"}, {"id": "thymol", "n": "Thymol", "nv": "Thymol", "g": ["Chất chống oxy hóa", "Chất tạo hương", "Chất tăng thấm"], "ge": ["Antioxidant", "Flavoring agent", "Permeation enhancer"], "cas": "89-83-8", "f": [["Là chất sát khuẩn phenol (kháng khuẩn và kháng nấm); không phù hợp làm chất bảo quản do độ tan trong nước thấp; dùng làm chất tăng thấm qua da và làm chất chống oxy hóa thực thụ ở nồng độ ~0,01%.", "1, tr.977"]], "fe": [["Is a phenol antiseptic (antibacterial and antifungal); Not suitable as a preservative due to low water solubility; Used as a skin permeation enhancer and a true antioxidant at a concentration of ~0.01%.", "1, tr.977"]], "t": [["Tương kỵ với iod, kiềm và chất oxy hóa; hóa lỏng hoặc tạo khối mềm khi nghiền với acetanilid, antipyrin, camphor, chloral hydrat, menthol, phenol, quinin sulfat; hoạt tính giảm khi có protein.", "1, tr.977"]], "te": [["Incompatible with iodine, alkalis and oxidizing agents; liquefies or forms a soft mass when ground with acetanilide, antipyrine, camphor, chloral hydrate, menthol, phenol, quinine sulfate; Activity decreases in the presence of protein.", "1, tr.977"]], "d": [["Tinh thể không màu (thường lớn, trong mờ) hoặc bột kết tinh màu trắng, mùi thảo mộc (thơm như cỏ xạ hương), vị hăng gắt.", "1, tr.977"], ["Tan 1 trong 1 phần ethanol 95%, cloroform; 1 trong 1000 phần nước; rất dễ tan trong tinh dầu, dầu béo.", "1, tr.977"]], "de": [["Colorless crystals (usually large, translucent) or white crystalline powder, herbaceous odor (fragrant like thyme), strong pungent taste.", "1, tr.977"], ["Soluble in 1 part 95% ethanol, chloroform; 1 in 1000 parts water; Very soluble in essential oils and fatty oils.", "1, tr.977"]], "a": "thymol 89-83-8 Thymol Acido trimico 3-p-cymenol p-cymen-3-ol Flavinol 3-hydroxy-pcymene 3-hydroxy-l-methyl-4-isopropylbenzene Intrasol isopro pyl cresol isopropyl-m-cresol 6-isopropyl-m-cresol isopropyl metacresol 2-isopropyl-5-methylphenol l-methyl-3-hydroxy-4isopropylbenzene 5-methyl-2-isopropylphenol 5-methyl-2-(lmethylethyl) phenol Medophyll thyme camphor thymic acid m-thymol thymolum timol"}, {"id": "titanium-dioxide", "n": "Titanium Dioxide", "nv": "Titanium Dioxide", "g": ["Chất tạo màng bao", "Chất tạo độ đục", "Chất tạo màu"], "ge": ["Coating agent", "Opacifying agent", "Coloring agent"], "cas": "13463-67-7", "f": [["Dùng rộng rãi làm pigment trắng trong chế phẩm dùng ngoài và uống; nhờ chiết suất cao có tính tán xạ ánh sáng nên dùng làm pigment trắng và tạo độ đục; dải bước sóng tán xạ thay đổi theo cỡ hạt (cỡ ~230 nm tán xạ ánh sáng thấy được, ~60 nm tán xạ UV).", "1, tr.980"]], "fe": [["Widely used as white pigment in topical and oral preparations; Thanks to its high refractive index and light scattering properties, it is used as a white pigment and creates turbidity; The scattering wavelength range varies with particle size (~230 nm scatters visible light, ~60 nm scatters UV).", "1, tr.980"]], "t": [["Do hiệu ứng quang xúc tác, có thể tương tác với một số hoạt chất (vd. famotidin); làm suy giảm cơ tính và tăng thấm hơi nước của màng polyvinyl alcol; gây quang oxy hóa lipid chưa no.", "1, tr.980"]], "te": [["Due to the photocatalytic effect, interaction with some active substances (e.g. famotidine) is possible; reduces mechanical properties and increases water vapor permeability of polyvinyl alcohol films; causes photooxidation of unsaturated lipids.", "1, tr.980"]], "d": [["Bột vô định hình màu trắng, không mùi, không vị, không hút ẩm; cỡ hạt trung bình <1 µm nhưng thường ở dạng tập hợp ~100 µm; có nhiều dạng tinh thể (rutil, anatas).", "1, tr.980"], ["Thực tế không tan trong acid loãng, dung môi hữu cơ và nước; tan trong acid hydrofluoric và acid sulfuric đậm đặc nóng.", "1, tr.980"]], "de": [["White amorphous powder, odorless, tasteless, non-hygroscopic; Average particle size <1 µm but often in aggregates ~100 µm; There are many crystalline forms (rutile, anatas).", "1, tr.980"], ["Practically insoluble in dilute acids, organic solvents and water; Soluble in hydrofluoric acid and hot concentrated sulfuric acid.", "1, tr.980"]], "a": "titanium dioxide titan dioxid tio2 13463-67-7 E171 Titanium Dioxide Titanium Oxide Anatase titanium dioxide brookite titanium dioxide El 71 Hombitan AFDC Hombitan FF-Pharma Kronos 1171 pigment white 6 Pretiox AV-01-FG rutile titanium dioxide Tioxide TiPttre titanic anhydride titanii dioxidum Tronox"}, {"id": "tragacanth", "n": "Tragacanth", "nv": "Tragacanth", "g": ["Chất nhũ hóa", "Chất gây treo", "Chất làm tăng độ nhớt"], "ge": ["Emulsifying agent", "Suspending agent", "Viscosity-increasing agent"], "cas": "9000-65-1", "f": [["Dùng làm chất nhũ hóa và gây treo trong nhiều chế phẩm; dùng trong kem, gel, nhũ tương ở nồng độ khác nhau tùy ứng dụng và grade; cũng làm tá dược độn và (ít hơn) tá dược dính, polymer giải phóng kéo dài trong viên nén.", "1, tr.983"]], "fe": [["Used as an emulsifier and suspending agent in many preparations; Used in creams, gels, emulsions at different concentrations depending on application and grade; also as filler excipients and (to a lesser extent) as adhesive excipients, sustained-release polymers in tablets.", "1, tr.983"]], "t": [["Ở pH 7 làm giảm đáng kể hiệu lực của benzalkonium clorid, chlorobutanol và methylparaben (ít hơn với phenol và phenylmercuric acetat); acid vô cơ/hữu cơ mạnh làm giảm độ nhớt phân tán.", "1, tr.983"]], "te": [["At pH 7 there is a significant reduction in the potency of benzalkonium chloride, chlorobutanol and methylparaben (less so with phenol and phenylmercuric acetate); Strong inorganic/organic acids reduce dispersion viscosity.", "1, tr.983"]], "d": [["Mảnh dẹt cong hoặc mảnh thẳng/xoắn, hoặc dạng bột; màu trắng đến vàng nhạt, trong mờ, không mùi, vị nhầy nhạt.", "1, tr.983"], ["Thực tế không tan trong nước, ethanol 95% và dung môi hữu cơ; tuy không tan nhưng trương nhanh trong 10 lần khối lượng nước nóng/lạnh tạo sol keo nhớt hoặc bán gel.", "1, tr.983"]], "de": [["Curved flat piece or straight/twisted piece, or powder form; white to light yellow, translucent, odorless, pale mucus taste.", "1, tr.983"], ["Practically insoluble in water, 95% ethanol and organic solvents; Although it does not dissolve, it swells quickly in 10 times the volume of hot/cold water to create a viscous colloid or semi-gel.", "1, tr.983"]], "a": "tragacanth gom tragacanth gum tragacanth 9000-65-1 E413 Tragacanth £413 goat's horn gum benjamin gum dragon persian tragacanth trag tragant"}, {"id": "trehalose", "n": "Trehalose", "nv": "Trehalose Hydrate; Trehalose", "g": ["Chất tạo phức", "Chất tăng cường hương vị", "Chất giữ ẩm", "Tá dược hỗ trợ đông khô", "Chất tạo ngọt", "Tá dược độn (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Chelating / Complexing agent", "Flavor enhancer", "Humectant", "Lyophilization bulking agent", "Sweetening agent", "Tablet / capsule diluent", "Viscosity-increasing agent"], "cas": "99-20-7, 6138-23-4", "f": [["Dùng bảo vệ protein trị liệu khi đông khô (nhất là dạng tiêm); làm tá dược cho viên chẩn đoán; ổn định liposom khi đông–rã và đông khô; ổn định tế bào máu, mỹ phẩm và kháng thể đơn dòng; dùng trong chế phẩm dùng ngoài.", "1, tr.985"]], "fe": [["Used to protect therapeutic proteins when lyophilized (especially for injection); as an excipient for diagnostic tablets; liposomal stability upon freeze–thaw and lyophilization; stabilize blood cells, cosmetics and monoclonal antibodies; used in preparations for external use.", "1, tr.985"]], "t": [["Tương kỵ với chất oxy hóa mạnh, nhất là khi có nhiệt.", "1, tr.985"]], "te": [["Incompatible with strong oxidizing agents, especially in the presence of heat.", "1, tr.985"]], "d": [["Tinh thể màu trắng/gần trắng, gần như không mùi, vị ngọt (~45% sucrose).", "1, tr.985"], ["Tan trong nước; rất ít tan trong ethanol 95%; thực tế không tan trong ether.", "1, tr.985"]], "de": [["White/nearly white crystals, almost odorless, sweet taste (~45% sucrose).", "1, tr.985"], ["Soluble in water; very slightly soluble in 95% ethanol; practically insoluble in ether.", "1, tr.985"]], "a": "trehalose 99-20-7 E number none Trehalose Hydrate Trehalose Dihydrate Trehalose a-D-Glucopyranosyl-a-D-glucopyranoside (a-D-glucosido)-a-D-glucoside mycose natural trehalose a,a-trehalose Treha-, trehalose hydrate trehalose dihydrate"}, {"id": "triacetin", "n": "Triacetin", "nv": "Triacetin", "g": ["Chất giữ ẩm", "Chất hóa dẻo", "Dung môi"], "ge": ["Humectant", "Plasticizer", "Solvent"], "cas": "102-76-1", "f": [["Chủ yếu dùng làm chất hóa dẻo thân nước trong màng bao polymer (nước và dung môi) cho viên nang, viên nén, hạt và cốm; nồng độ thường 10–35% kl/kl; nghiên cứu dùng trong vi cầu cho hệ giải phóng kiểm soát.", "1, tr.987"]], "fe": [["Mainly used as a hydrophilic plasticizer in polymer coatings (water and solvent) for capsules, tablets, granules and granules; Concentration is usually 10–35% w/kl; Research on use in microspheres for controlled release system.", "1, tr.987"]], "t": [["Tương kỵ với kim loại và có thể phản ứng với chất oxy hóa; có thể phá hủy vải rayon.", "1, tr.987"]], "te": [["Incompatible with metals and may react with oxidizing agents; can destroy rayon fabric.", "1, tr.987"]], "d": [["Chất lỏng nhớt, không màu, mùi béo nhẹ.", "1, tr.987"], ["Tan trong ethanol 95%, ether, aceton; ít tan trong nước.", "1, tr.987"]], "de": [["Viscous liquid, colorless, mild fatty odor.", "1, tr.987"], ["Soluble in 95% ethanol, ether, acetone; Slightly soluble in water.", "1, tr.987"]], "a": "triacetin glyceryl triacetate 102-76-1 E1518 Triacetin Captex 500 glycerol triacetate Kollisolv GTA speziol GTA triacetinum triacetyl glycerine"}, {"id": "tributyl-citrate", "n": "Tributyl Citrate", "nv": "Tributyl Citrate" ral microemulsions; as an excipient for topical creams, lotions and cosmetics; is a permeability enhancer and softener.", "1, tr.991"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.991"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.991"]], "d": [["Chất lỏng trong, không màu đến vàng nhạt, không mùi.", "1, tr.991"], ["Trộn lẫn với đa số dung môi hữu cơ gồm ethanol 95%; không tan trong nước.", "1, tr.991"]], "de": [["Clear liquid, colorless to pale yellow, odorless.", "1, tr.991"], ["Miscible with most organic solvents including 95% ethanol; insoluble in water.", "1, tr.991"]], "a": "tricaprylin glyceryl trioctanoate captex 8000 miglyol 808 538-23-8 Caprylic acid, 1,2,3-propanetriyl ester caprylic acid triglyceride Captex 8000 glycerin tricaprylate glycerol tricaprylate glycerol trioctanoate glyceryl tricaprylate Hest TC MCT Miglyol 808 77-octanoic acid glycerol triester octanoic acid, 1,2,3-propanetriyl ester Rofetan GTC tricaprilin tricapryloglycerol tricaprylylglycerin trioctanoin trioctonolglycerol Trivent OC-G"}, {"id": "triethanolamine", "n": "Triethanolamine", "nv": "Trolamine; Triethanolamine", "g": ["Chất kiềm hóa", "Chất nhũ hóa"], "ge": ["Alkalizing agent", "Emulsifying agent"], "cas": "102-71-6", "f": [["Dùng rộng rãi trong chế phẩm dùng ngoài, chủ yếu để tạo nhũ tương; khi trộn tỷ lệ đẳng phân tử với acid béo (như acid stearic hoặc oleic) tạo xà phòng anion làm chất nhũ hóa dầu/nước; cũng dùng điều chỉnh pH.", "1, tr.994"]], "fe": [["Widely used in topical preparations, mainly to create emulsions; When mixed in equimolar ratio with fatty acids (such as stearic or oleic acid), anionic soap is created as an oil/water emulsifier; Also used to adjust pH.", "1, tr.994"]], "t": [["Là amin bậc ba có nhóm hydroxy; phản ứvới acid vô cơ tạo muối/ester; với acid béo cao tạo muối kiểu xà phòng; phản ứvới đồng tạo phức; đổi màu và tủa khi có muối kim loại nặng.", "1, tr.994"]], "te": [["A tertiary amine with a hydroxy group; reacts with inorganic acids to form salts/esters; with high fatty acids to create soapy salt; reacts with co-complexing; changes color and precipitates in the presence of heavy metal salts.", "1, tr.994"]], "d": [["Chất lỏng nhớt, trong, không màu đến vàng nhạt, mùi amoniac nhẹ; là hỗn hợp base (chủ yếu 2,2',2''-nitrilotriethanol, kèm diethanolamin và ít monoethanolamin).", "1, tr.994"], ["Tan trong nước, aceton, methanol; ít tan trong benzen, ether.", "1, tr.994"]], "de": [["Viscous liquid, clear, colorless to pale yellow, slight ammonia odor; is a base mixture (mainly 2,2',2''-nitrilotriethanol, with diethanolamine and a little monoethanolamine).", "1, tr.994"], ["Soluble in water, acetone, methanol; Slightly soluble in benzene and ether.", "1, tr.994"]], "a": "triethanolamine tea triethanolamin trolamine 102-71-6 Trolamine Triethanolamine TEA Tealan triethylolamine trihydroxytriethylamine tris(hydroxyethyl)amine trolaminum"}, {"id": "triethyl-citrate", "n": "Triethyl Citrate", "nv": "Triethyl Citrate", "g": ["Chất hóa dẻo", "Dung môi"], "ge": ["Plasticizer", "Solvent"], "cas": "", "f": [["Dùng làm chất hóa dẻo cho polymer trong màng bao, nhất là phân tán polymer nước cho giải phóng kéo dài và bao tan ở ruột; do tan trong nước nên với dạng giải phóng kéo dài, thuốc giải phóng nhanh hơn so với chất hóa dẻo không tan; dùng cho màng polymethacrylat ở nồng độ 10–20% khối lượng polymer.", "1, tr.996"]], "fe": [["Used as a plasticizer for polymers in coatings, especially aqueous polymer dispersions for sustained release and enteric coating; Because it is soluble in water, with sustained release, the drug releases faster than insoluble plasticizers; used for pyromethacrylate membranes at a concentration of 10–20% of polymer mass.", "1, tr.996"]], "t": [["Tương kỵ với kiềm mạnh và chất oxy hóa.", "1, tr.996"]], "te": [["Incompatible with strong alkalis and oxidizing agents.", "1, tr.996"]], "d": [["Chất lỏng dạng dầu, nhớt, trong, gần như không màu, không mùi, vị đắng, hút ẩm.", "1, tr.996"] ệm", "Chất nhũ hóa"], "ge": ["Alkalizing agent", "Buffering agent", "Emulsifying agent"], "cas": "77-86-1", "f": [["Dùng rộng rãi làm chất đệm trong chế phẩm tiêm, uống, dùng ngoài và nhỏ mắt; dùng tạo muối tan của NSAID (ketorolac, ibuprofen) sau đó đưa vào tá dược polymer giải phóng liên tục; cũng làm chất nhũ hóa cho kem/lotion mỹ phẩm và nhũ tương dầu khoáng/sáp paraffin.", "1, tr.1002"]], "fe": [["Widely used as a buffer in injectable, oral, topical and ophthalmic preparations; Use to create soluble salts of NSAIDs (ketorolac, ibuprofen) and then add continuous release polymer excipients; Also as an emulsifier for cosmetic creams/lotions and mineral oil/paraffin wax emulsions.", "1, tr.1002"]], "t": [["Tương kỵ với chất oxy hóa mạnh, base, đồng, đồng thau và nhôm.", "1, tr.1002"]], "te": [["Incompatible with strong oxidizers, bases, copper, brass and aluminum.", "1, tr.1002"]], "d": [["Bột kết tinh màu trắng.", "1, tr.1002"], ["Tan trong nước, ethanol 90%, methanol; ít tan trong aceton; không tan trong cloroform.", "1, tr.1002"]], "de": [["White crystalline powder.", "1, tr.1002"], ["Soluble in water, 90% ethanol, methanol; Slightly soluble in acetone; insoluble in chloroform.", "1, tr.1002"]], "a": "tromethamine tromethamin tris tris buffer trometamol 77-86-1 Trometamol Tromethamine Aminotrimethylolmethane Pehanorm-, Talatrol TRIS trisamine TRIS buffer tris(hydroxymethyl)aminomethane tris(hydroxymethyl)methanamine tris(hydroxymethyl)methylamine 1,1,1“ tris(hydroxymethyl)methylamine Trizma-, trometamolum. 3 Structural Formula"}, {"id": "vanillin", "n": "Vanillin", "nv": "Vanillin", "g": ["Chất tạo hương", "Chất che vị"], "ge": ["Flavoring agent", "Taste-masking agent"], "cas": "121-33-5", "f": [["Dùng trong viên nén, dung dịch (0,01–0,02% kl/tt), siro và bột để che vị và mùi khó chịu (như viên caffein, polythiazid); dùng trong màng bao che vị/mùi viên vitamin; được nghiên cứu làm chất ổn định quang cho một số thuốc tiêm.", "1, tr.1005"]], "fe": [["Used in tablets, solutions (0.01–0.02% w/w), syrup and powder to mask unpleasant tastes and odors (such as caffeine tablets, polythiazid); used in coatings to cover the taste/odor of vitamin tablets; Researched as a photostabilizer for some injectable drugs.", "1, tr.1005"]], "t": [["Tương kỵ với aceton (tạo hợp chất màu đậm); với chất oxy hóa và khử mạnh; tạo hợp chất khó tan trong ethanol với glycerin; phản ứng mãnh liệt với brom, acid percloric, kali t-butoxid.", "1, tr.1005"]], "te": [["Incompatible with acetone (creates dark colored compounds); with strong oxidizing and reducing agents; create compounds that are insoluble in ethanol with glycerin; Reacts violently with bromine, perchloric acid, potassium t-butoxide.", "1, tr.1005"]], "d": [["Kim kết tinh màu trắng/kem hoặc bột, mùi vani đặc trưng, vị ngọt.", "1, tr.1005"], ["Tan 1 trong 100 phần nước; tan trong ethanol 95%, ether, cloroform, glycerin; tan trong dung dịch hydroxyd kiềm.", "1, tr.1005"]], "de": [["White/creamy crystalline needles or powder, characteristic vanilla odor, sweet taste.", "1, tr.1005"], ["Dissolves 1 part in 100 parts water; Soluble in 95% ethanol, ether, chloroform, glycerin; Soluble in alkaline hydroxide solution.", "1, tr.1005"]], "a": "vanillin 121-33-5 Vanillin Hydroxy-w-anisaldehyde p-hydroxy-m-methoxybenzaldehyde methylprotocatechuic alde hyde protocatechualdehyde, methyl- Rhovanil-, vanillic aldehyde p-vanillin vanillinum"}, {"id": "vegetable-oil-hydrogenated", "n": "Vegetable Oil, Hydrogenated", "nv": "Hydrogenated Vegetable Oil; Hydrogenated Oil", "g": ["Tá dược phóng thích biến đổi", "Tá dược dính (viên nén/nang)", "Tá dược trơn bóng (viên nén/nang)"], "ge": ["Modified-release agent", "Tablet / capsule binder", "Tablet / capsule glidant"], "cas": "68334-00-9, 8016-70-4", "f": [["Dầu thực vật hydrogen hóa type I dùng làm tá dược trơn viên nén/nang ở nồng độ 1–6% (thường phối hợp talc, silica hoặc silicat để chống dính chày); làm tá dược dính phụ; làm cốt lipid cho dạng giải phóng kiểm soát và hỗ trợ bao.", "1, tr.1007"]], "fe": [["Type I hydrogenated vegetable oil used as an excipient to lubricate tablets/capsules at a concentration of 1–6% (usually combined with talc, silica or silicate to prevent stickiness); as adjuvant for adhesion; Lipid core for controlled release and capsule support.", "1, tr.1007"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.1007"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.1007"]], "d": [["Hỗn hợp triglycerid của acid béo; dạng bột mịn, mảnh hoặc viên (type I); màu tùy quy trình sản xuất.", "1, tr.1007"], ["Tan trong cloroform, ether dầu hỏa và propan-2-ol nóng; thực tế không tan trong nước.", "1, tr.1007"]], "de": [["Triglyceride mixture of fatty acids; fine powder, flakes or pellets (type I); Color depends on production process.", "1, tr.1007"], ["Soluble in chloroform, petroleum ether and hot propan-2-ol; practically insoluble in water.", "1, tr.1007"]], "a": "hydrogenated vegetable oil dau thuc vat hydrogen hoa lubritab sterotex 68334-28-1 Hydrogenated Vegetable Oil Hydrogenated Oil"}, {"id": "vitamin-e-peg-succinate", "n": "Vitamin E Polyethylene Glycol Succinate", "nv": "Vitamin E Polyethylene Glycol Succinate", "g": ["Chất chống oxy hóa", "Chất nhũ hóa", "Chất diện hoạt không ion hóa", "Tá dược thuốc mỡ", "Chất làm tăng độ tan", "Chất gây treo", "Tá dược dính (viên nén/nang)"], "ge": ["Antioxidant", "Emulsifying agent", "Nonionic surfactant", "Ointment base", "Solubilizing agent", "Suspending agent", "Tablet / capsule binder"], "cas": "30999-06-5", "f": [["Là dẫn chất vitamin E (tocopherol) ester hóa; chủ yếu dùng làm chất tăng độ tan hoặc nhũ hóa nhờ tính diện hoạt; là dẫn chất thân nước (khác tocopherol) dùng trong nang, viên nén, đùn nóng chảy, vi nhũ tương, chế phẩm dùng ngoài và tiêm; đặc biệt làm tá dược cho hệ đưa thuốc gốc lipid.", "1, tr.1010"]], "fe": [["Is an esterified vitamin E (tocopherol) derivative; Mainly used as a solubility enhancer or emulsifier thanks to its surfactant properties; is a hydrophilic derivative (other than tocopherol) used in capsules, tablets, hot melt extrusion, microemulsion, topical preparations and injections; especially as an excipient for lipid-based drug delivery systems.", "1, tr.1010"]], "t": [["Tương kỵ với acid mạnh và kiềm mạnh.", "1, tr.1010"]], "te": [["Incompatible with strong acids and strong alkalis.", "1, tr.1010"]], "d": [["Chất rắn sáp màu trắng đến nâu nhạt, gần như không vị; là hỗn hợp gồm PEG 1000 mono/diester và tocopherol tự do.", "1, tr.1010"], ["Trộn lẫn với nước ở mọi tỷ lệ.", "1, tr.1010"]], "de": [["White to light brown waxy solid, almost tasteless; is a mixture of PEG 1000 mono/diester and free tocopherol.", "1, tr.1010"], ["Mix with water in all proportions.", "1, tr.1010"]], "a": "vitamin e polyethylene glycol succinate tpgs tocophersolan d-alpha tocopheryl peg 1000 succinate 9002-96-4 Vitamin E Polyethylene Glycol Succinate speziol TPGS Pharma tocofersolan tocopherol polyethylene glycol succinate D-a-tocopheryl polyethylene glycol 1000 succinate TPGS vitamin E TPGS VEGS"}, {"id": "water", "n": "Water", "nv": "Purified Water", "g": ["Dung môi"], "ge": ["Solvent"], "cas": "7732-18-5", "f": [["Dùng rộng rãi làm nguyên liệu, thành phần và dung môi trong sản xuất, bào chế dược phẩm, hoạt chất và thuốc thử; có nhiều grade riêng (nước uống được, nước tinh khiết, nước cất pha tiêm, nước vô khuẩn pha tiêm...) dùng tới nồng độ 100%.", "1, tr.1012"]], "fe": [["Widely used as raw materials, ingredients and solvents in the production and preparation of pharmaceuticals, active ingredients and reagents; There are many separate grades (potable water, purified water, distilled water for injection, sterile water for injection...) used up to 100% concentration.", "1, tr.1012"]], "t": [["Có thể phản ứvới thuốc và tá dược dễ thủy phân; phản ứng mãnh liệt với kim loại kiềm và nhanh với oxid kiềm thổ (calci oxid, magnesi oxid); phản ứvới muối khan tạo dạng hydrat.", "1, tr.1012"]], "te": [["May react with easily hydrolyzed drugs and excipients; Reacts violently with alkali metals and rapidly with alkaline earth oxides (calcium oxide, magnesium oxide); Reacts with anhydrous salt to form hydrate.", "1, tr.1012"]], "d": [["Chất lỏng trong, không màu, không mùi, không vị.", "1, tr.1012"], ["Trộn lẫn với đa số dung môi phân cực.", "1, tr.1012"]], "de": [["Clear liquid, colorless, odorless, tasteless.", "1, tr.1012"], ["Miscible with most polar solvents.", "1, tr.1012"]], "a": "water nuoc purified water water for injection wfi nuoc tinh khiet 7732-18-5 Purified Water Water, Purified Aqua aqua purificata hydrogen oxide"}, {"id": "wax-anionic-emulsifying", "n": "Wax, Anionic Emulsifying", "nv": "Emulsifying Wax", "g": ["Chất nhũ hóa", "Chất làm tăng độ đặc"], "ge": ["Emulsifying agent", "Stiffening agent"], "cas": "8014-38-8", "f": [["Dùng trong mỹ phẩm và chế phẩm dùng ngoài chủ yếu làm chất nhũ hóa; thêm vào nền chất béo/paraffin để tạo nhũ tương dầu/nước không nhờn; ~2% cho nhũ tương rót được, tới 10% cho nhũ tương cứng hơn (như kem nước BP).", "1, tr.1016"]], "fe": [["Used in cosmetics and topical preparations mainly as an emulsifier; added to a fat/paraffin base to create a non-greasy oil/water emulsion; ~2% for pourable emulsions, up to 10% for firmer emulsions (like BP liquid cream).", "1, tr.1016"]], "t": [["Tương kỵ như alkyl sulfat natri: với hợp chất cation (amoni bậc bốn, acriflavin, ephedrin hydroclorid, kháng histamin), muối kim loại đa hóa trị (nhôm, kẽm, thiếc, chì) và thioglycolat; không dùng dụng cụ sắt khi đun.", "1, tr.1016"]], "te": [["Incompatible as sodium alkyl sulfate: with cationic compounds (quaternary ammonium, acriflavin, ephedrine hydrochloride, antihistamines), polyvalent metal salts (aluminum, zinc, tin, lead) and thioglycolates; Do not use iron utensils when cooking.", "1, tr.1016"]], "d": [["Chất rắn sáp hoặc mảnh màu gần trắng đến vàng nhạt, hóa dẻo khi ấm trước khi chảy; mùi nhẹ đặc trưng, vị nhạt.", "1, tr.1016"], ["Tan trong cloroform, ether; khi ấm tan trong dầu béo và dầu khoáng.", "1, tr.1016"]], "de": [["Almost white to pale yellow waxy solid or flakes, plasticizing when warm before flowing; characteristic mild odor, bland taste.", "1, tr.1016"], ["Soluble in chloroform, ether; When warm, it dissolves in fatty oils and mineral oils.", "1, tr.1016"]], "a": "anionic emulsifying wax sap nhu hoa anion emulsifying wax bp Emulsifying Wax Cetostearyl Alcohol (Type A), Emulsifying Collone HV Crodex A Cyclonette Wax, Kerawax-, Lanette SX Lanette w"}, {"id": "wax-carnauba", "n": "Wax, Carnauba", "nv": "Carnauba Wax", "g": ["Chất tạo màng bao"], "ge": ["Coating agent"], "cas": "8015-86-9", "f": [["Là sáp cứng nhất và có điểm chảy cao nhất trong các sáp dùng trong dược; chủ yếu dùng dạng nhũ tương nước 10% để đánh bóng viên bao đường (cho độ bóng tốt không cần chà); cũng dùng dạng bột đánh bóng và làm cốt/chất bao (10–50%) trong dạng giải phóng kiểm soát.", "1, tr.1018"]], "fe": [["It is the hardest wax and has the highest melting point among waxes used in medicine; Mainly use 10% water emulsion to polish sugar coated tablets (for good shine without rubbing); also used as a polishing powder and as a base/coating agent (10–50%) in a controlled release formulation.", "1, tr.1018"]], "t": [["Tài liệu chưa đề cập.", "1, tr.1018"]], "te": [["Documents not mentioned.", "1, tr.1018"]], "d": [["Bột, mảnh hoặc khối sáp cứng, giòn màu nâu nhạt đến vàng nhạt; mùi nhẹ đặc trưng, gần như không vị; không ôi.", "1, tr.1018"]], "de": [["Light brown to light yellow hard, brittle waxy powder, flakes or mass; characteristic mild odor, almost tasteless; no oh.", "1, tr.1018"]], "a": "carnauba wax sap carnauba 8015-86-9 E903 Carnauba Wax Brazil wax caranda wax cera carnauba"}, {"id": "wax-cetyl-esters", "n": "Wax, Cetyl Esters", "nv": "Cetyl Esters Wax", "g": ["Chất làm mềm da", "Chất làm tăng độ đặc"], "ge": ["Emollient", "Stiffening agent"], "cas": "977067-67-6", "f": [["Dùng làm chất làm cứng và làm mềm trong kem và thuốc mỡ, thay cho spermaceti (dầu cá nhà táng) tự nhiên; kỵ nước; được đề xuất làm thành phần cốt gelatin nhỏ mắt giải phóng kiểm soát.", "1, tr.1020"]], "fe": [["Used as a hardening and softening agent in creams and ointments, in place of natural spermaceti (sperm whale oil); hydrophobic; proposed as a controlled-release gelatin ophthalmic base ingredient.", "1, tr.1020"]], "t": [["Tương kỵ với acid hoặc base mạnh.", "1, tr.1020"]], "te": [["Incompatible with strong acids or bases.", "1, tr.1020"]], "d": [["Mảnh màu trắng đến trắng ngà, hơi trong mờ, cấu trúc kết tinh, ánh ngọc; mùi thơm nhẹ, vị nhạt.", "1, tr.1020"]], "de": [["The piece is white to ivory white, slightly translucent, crystalline structure, pearly luster; Light aroma, light taste.", "1, tr.1020"]], "a": "cetyl esters wax sap cetyl ester synthetic spermaceti 8002-23-1 Cetyl Esters Wax Cera cetyla Crodamol SS Cutina CP Liponate SPS Protachem MST Ritaceti Ritachol SS spermaceti wax replacement Starfol Wax CG Synaceti 116"}, {"id": "wax-microcrystalline", "n": "Wax, Microcrystalline", "nv": "Microcrystalline Wax", "g": ["Chất tạo màng bao", "Tá dược phóng thích biến đổi", "Chất làm tăng độ đặc"], "ge": ["Coating agent", "Modified-release agent", "Stiffening agent"], "cas": "63231-60-7", "f": [["Chủ yếu dùng làm chất làm cứng trong kem và thuốc mỡ dùng ngoài; điều chỉnh cấu trúc tinh thể của sáp khác (nhất là paraffin) để tránh biến đổi tinh thể theo thời gian; giảm hiện tượng rỉ dầu; cũng dùng trong dạng uống giải phóng kiểm soát.", "1, tr.1022"]], "fe": [["Mainly used as a hardening agent in topical creams and ointments; Adjust the crystal structure of other waxes (especially paraffin) to avoid crystal changes over time; Reduce oil leakage; also used in controlled-release oral formulations.", "1, tr.1022"]], "t": [["Tài liệu chưa đề cập.", "1, tr.1022"]], "te": [["Documents not mentioned.", "1, tr.1022"]], "d": [["Khối hoặc mảnh sáp, không mùi, không vị, chứa các tinh thể nhỏ hình dạng không đều; màu trắng đến vàng (grade dược thường trắng/vàng).", "1, tr.1022"], ["Tan trong benzen, cloroform và ether; ít tan trong ethanol; thực tế không tan trong nước.", "1, tr.1022"]], "de": [["Wax blocks or pieces, odorless, tasteless, containing small irregularly shaped crystals; white to yellow (pharmaceutical grade is usually white/yellow).", "1, tr.1022"], ["Soluble in benzene, chloroform and ether; Slightly soluble in ethanol; practically insoluble in water.", "1, tr.1022"]], "a": "microcrystalline wax sap vi tinh the 8002-74-2 E905 Microcrystalline Wax Amorphous wax E907 petroleum ceresin petroleum wax (micro crystalline)"}, {"id": "wax-nonionic-emulsifying", "n": "Wax, Nonionic Emulsifying", "nv": "Cetomacrogol Emulsifying Wax; Emulsifying Wax", "g": ["Chất nhũ hóa", "Chất làm tăng độ tan", "Chất làm tăng độ đặc"], "ge": ["Emulsifying agent", "Solubilizing agent", "Stiffening agent"], "cas": "", "f": [["Dùng làm chất nhũ hóa tạo nhũ tương dầu/nước bền với nồng độ chất điện giải vừa phải và trên khoảng pH rộng; nồng độ thay đổi độ đặc sản phẩm (tới ~5% cho sản phẩm rót được, thường ~15% trong kem, tới 25% như kem chlorhexidin BP); đặc biệt phù hợp với muối kim loại đa hóa trị và thuốc chứa nitơ.", "1, tr.1023"]], "fe": [["Used as an emulsifier to create stable oil/water emulsions with moderate electrolyte concentrations and over a wide pH range; concentration changes product consistency (up to ~5% for pourable products, usually ~15% in cream, up to 25% like chlorhexidine BP cream); Particularly suitable for multivalent metal salts and nitrogen-containing drugs.", "1, tr.1023"]], "t": [["Tương kỵ với tannin, phenol và chất phenol, resorcinol, benzocain; có thể giảm hiệu lực kháng khuẩn của hợp chất amoni bậc bốn.", "1, tr.1023"]], "te": [["Incompatible with tannins, phenol and phenol, resorcinol, benzocaine; may reduce the antibacterial effect of quaternary ammonium compounds.", "1, tr.1023"]], "d": [["Chất rắn sáp hoặc mảnh màu trắng/trắng ngà, chảy khi đun thành lỏng trong gần không màu; mùi nhẹ của alcol cetostearyl.", "1, tr.1023"], ["Thực tế không tan trong nước (tạo nhũ tương); tan vừa trong ethanol 96%; tan một phần trong ether.", "1, tr.1023"]], "de": [["White/off-white waxy solid or flakes, melts when heated to a clear, nearly colorless liquid; Slight odor of cetostearyl alcohol.", "1, tr.1023"], ["Practically insoluble in water (forms emulsions); moderately soluble in 96% ethanol; Partially soluble in ether.", "1, tr.1023"]], "a": "nonionic emulsifying wax sap nhu hoa khong ion cetomacrogol emulsifying wax Cetomacrogol Emulsifying Wax Emulsifying Wax Collone Nỉ Crodex N Emulgade 1000NI Kerawax Lipoivax P Masurf Emulsifying Wax Permulgin D Polawax Ritachol 2000 T-Wax"}, {"id": "wax-white", "n": "Wax, White", "nv": "White Beeswax; Beeswax, White; White Wax", "g": ["Chất tạo màng bao", "Chất ổn định nhũ tương", "Tá dược phóng thích biến đổi", "Chất làm tăng độ đặc"], "ge": ["Coating agent", "Emulsion stabilizer", "Modified-release agent", "Stiffening agent"], "cas": "8012-89-3", "f": [["Dùng tương tự sáp ong vàng: tăng độ đặc cho kem và thuốc mỡ, và ổn định nhũ tương nước trong dầu.", "1, tr.1025"]], "fe": [["Used similarly to yellow beeswax: increases the consistency of creams and ointments, and stabilizes water-in-oil emulsions.", "1, tr.1025"]], "t": [["Tương kỵ với chất oxy hóa.", "1, tr.1025"]], "te": [["Incompatible with oxidizing agents.", "1, tr.1025"]], "d": [["Phiến hoặc hạt mịn màu trắng/hơi vàng, hơi trong mờ, không vị; mùi giống sáp ong vàng nhưng nhẹ hơn; là dạng tẩy màu của sáp ong vàng.", "1, tr.1025"], ["Tan trong cloroform, ether, dầu béo, tinh dầu; ít tan trong ethanol 95%; thực tế không tan trong nước.", "1, tr.1025"]], "de": [["White/yellowish, slightly translucent, tasteless flakes or fine granules; smells like yellow beeswax but lighter; is a bleached form of yellow beeswax.", "1, tr.1025"], ["Soluble in chloroform, ether, fatty oils, essential oils; Slightly soluble in 95% ethanol; practically insoluble in water.", "1, tr.1025"]], "a": "white wax sap ong trang white beeswax cera alba 8012-89-3 E901 White Beeswax Beeswax, White White Wax Bleached wax"}, {"id": "wax-yellow", "n": "Wax, Yellow", "nv": "Yellow Beeswax; Beeswax, Yellow; Yellow Wax", "g": ["Chất tạo màng bao", "Chất ổn định nhũ tương", "Tá dược phóng thích biến đổi", "Chất làm tăng độ đặc"], "ge": ["Coating agent", "Emulsion stabilizer", "Modified-release agent", "Stiffening agent"], "cas": "8012-89-3", "f": [["Chủ yếu dùng trong chế phẩm dùng ngoài ở nồng độ 5–20% làm chất làm cứng cho thuốc mỡ và kem; dùng trong nhũ tương (giúp đưa nước vào nhũ tương nước trong dầu); một số chế phẩm uống dùng để đánh bóng viên bao đường và trong dạng giải phóng kéo dài.", "1, tr.1027"]], "fe": [["Mainly used in topical preparations at concentrations of 5–20% as a hardening agent for ointments and creams; used in emulsions (helps introduce water into water-in-oil emulsions); some oral preparations for polishing sugar-coated tablets and in extended-release formulations.", "1, tr.1027"]], "t": [["Tương kỵ với chất oxy hóa.", "1, tr.1027"]], "te": [["Incompatible with oxidizing agents.", "1, tr.1027"]], "d": [["Mảnh hoặc tấm màu vàng đến nâu nhạt, mặt vỡ mịn không kết tinh, mùi nhẹ đặc trưng; mềm dẻo khi ấm; thu từ nấu chảy tổ ong Apis mellifera.", "1, tr.1027"], ["Tan trong cloroform, ether, dầu béo, tinh dầu; ít tan trong ethanol 95%; thực tế không tan trong nước.", "1, tr.1027"]], "de": [["Yellow to light brown pieces or plates, smooth broken surface without crystallization, characteristic mild odor; pliable when warm; Obtained from smelting Apis mellifera honeycomb.", "1, tr.1027"], ["Soluble in chloroform, ether, fatty oils, essential oils; Slightly soluble in 95% ethanol; practically insoluble in water.", "1, tr.1027"]], "a": "yellow wax sap ong vang yellow beeswax cera flava 8012-89-3 E901 Yellow Beeswax Beeswax, Yellow Apifik cera flava refined wax Yellow Wax"}, {"id": "xanthan-gum", "n": "Xanthan Gum", "nv": "Xanthan Gum", "g": ["Vật liệu kết dính sinh học", "Chất nhũ hóa", "Chất tạo gel", "Tá dược phóng thích biến đổi", "Chất gây treo", "Chất làm tăng độ nhớt"], "ge": ["Bioadhesive material", "Emulsifying agent", "Gelling agent", "Modified-release agent", "Suspending agent", "Viscosity-increasing agent"], "cas": "11138-66-2", "f": [["Dùng rộng rãi trong chế phẩm uống và dùng ngoài làm chất gây treo, làm đặc và nhũ hóa; dùng làm chất gây treo cho hỗn dịch thường, khô và giải phóng kéo dài; làm cốt viên giải phóng kéo dài; phối hợp hiệp lực với galactomannan (guar, locust bean) làm tăng độ nhớt hoặc tạo gel.", "1, tr.1029"]], "fe": [["Widely used in oral and topical preparations as a suspending, thickening and emulsifying agent; used as a suspension for regular, dry, and sustained-release suspensions; as extended-release pellets; Combined synergistically with galactomannan (guar, locust bean) to increase viscosity or create gel.", "1, tr.1029"]], "t": [["Là chất anion, thường không tương hợp với chất diện hoạt, polymer hoặc chất bảo quản cation (gây tủa); chất diện hoạt anion/lưỡng tính >15% gây tủa; ion kim loại đa hóa trị (calci) gây tạo gel/tủa ở pH kiềm cao (ngăn bằng glucoheptonat); borat (<300 ppm) ảnh hưởng.", "1, tr.1029"]], "te": [["An anionic substance, often incompatible with surfactants, polymers or cationic preservatives (causing precipitation); Anionic/amphiphilic surfactants >15% cause precipitation; Multivalent metal ion (calcium) causes gelation/precipitation at high alkaline pH (prevented with glucoheptonate); borate (<300 ppm) effects.", "1, tr.1029"]], "d": [["Bột mịn trơn chảy màu kem hoặc trắng, không mùi.", "1, tr.1029"], ["Tan trong nước tạo dung dịch rất nhớt; thực tế không tan trong dung môi hữu cơ.", "1, tr.1029"]], "de": [["Creamy or white, smooth, flowable powder, odorless.", "1, tr.1029"], ["Soluble in water, creating a very viscous solution; Practically insoluble in organic solvents.", "1, tr.1029"]], "a": "xanthan gum gom xanthan 11138-66-2 E415 Xanthan Gum Corn sugar gum Grindsted Keldent Keltrol polysaccharide B-1459 Rhodicare S Rhodigel'1 Rhodopol Satiaxane U Vanzan NF xanthani gummi"}, {"id": "xylitol", "n": "Xylitol", "nv": "Xylitol", "g": ["Chất tạo màng bao", "Chất làm mềm da", "Chất tăng cường hương vị", "Chất giữ ẩm", "Chất tạo ngọt", "Tá dược độn (viên nén/nang)", "Chất che vị"], "ge": ["Coating agent", "Emollient", "Flavor enhancer", "Humectant", "Sweetening agent", "Tablet / capsule diluent", "Taste-masking agent"], "cas": "87-99-0", "f": [["Dùng làm chất tạo ngọt không gây sâu răng trong viên nén, siro và màng bao; thay sucrose trong thực phẩm và kẹo thuốc; dùng nhiều trong kẹo cao su, nước súc miệng và kem đánh răng (giảm mảng bám và sâu răng do không lên men thành acid và ức chế Streptococcus mutans); độ ngọt bằng sucrose.", "1, tr.1033"]], "fe": [["Used as a non-cavity sweetener in tablets, syrup and coatings; replace sucrose in food and medicinal candy; Used widely in chewing gum, mouthwash and toothpaste (reduces plaque and tooth decay due to not fermenting into acid and inhibiting Streptococcus mutans); sweetness equal to sucrose.", "1, tr.1033"]], "t": [["Tương kỵ với chất oxy hóa.", "1, tr.1033"]], "te": [["Incompatible with oxidizing agents.", "1, tr.1033"]], "d": [["Chất rắn dạng hạt màu trắng, tinh thể đều (~0,4–0,6 mm); không mùi, vị ngọt tạo cảm giác mát; cũng có dạng bột và dạng dập thẳng.", "1, tr.1033"], ["Tan trong nước; không quang hoạt.", "1, tr.1033"]], "de": [["White, uniformly crystalline granular solid (~0.4–0.6 mm); Odorless, sweet taste creates a cool feeling; Also available in powder and straight form.", "1, tr.1033"], ["Soluble in water; not photoactive.", "1, tr.1033"]], "a": "xylitol 87-99-0 E967 Xylitol K/zmY meso-xylitol xilitol Xylifin-, Xylisorb xylit Xylitab xylite Xylitolo"}, {"id": "zein", "n": "Zein", "nv": "Zein", "g": ["Chất tạo màng bao", "Tá dược phóng thích biến đổi", "Tá dược dính (viên nén/nang)"], "ge": ["Coating agent", "Modified-release agent", "Tablet / capsule binder"], "cas": "9010-66-6", "f": [["Dùng làm tá dược dính khi xát hạt ướt hoặc chất bao viên, chủ yếu thay cho shellac; chủ yếu làm chất bao tan ở ruột hoặc trong dạng viên uống giải phóng kéo dài; cũng dùng làm chất bao trong thực phẩm.", "1, tr.1037"]], "fe": [["Used as a sticky excipient in wet granulation or tablet coating, mainly in place of shellac; Mainly as an enteric coating or in extended-release oral tablet form; Also used as a coating in foods.", "1, tr.1037"]], "t": [["Tương kỵ với chất oxy hóa.", "1, tr.1037"]], "te": [["Incompatible with oxidizing agents.", "1, tr.1037"]], "d": [["Là prolamin từ ngô (Zea mays); bột vô định hình dạng hạt hoặc mảnh mịn màu vàng rơm đến vàng nhạt, mùi đặc trưng, vị nhạt; không chứa lysin và tryptophan.", "1, tr.1037"], ["Thực tế không tan trong aceton, ethanol và nước; tan trong dung dịch cồn nước, aceton nước (60–80%) và glycol; tan trong dung dịch kiềm pH ≥11,5.", "1, tr.1037"]], "de": [["Is prolamin from corn (Zea mays); Amorphous powder, fine granules or flakes, straw yellow to light yellow, characteristic odor, bland taste; Does not contain lysine and tryptophan.", "1, tr.1037"], ["Practically insoluble in acetone, ethanol and water; Soluble in aqueous alcohol, aqueous acetone (60–80%) and glycol solutions; Soluble in alkaline solution pH ≥11.5.", "1, tr.1037"]], "a": "zein 9010-66-6 Zein"}, {"id": "zinc-acetate", "n": "Zinc Acetate", "nv": "Zinc Acetate; Zinc Acetate Dihydrate", "g": ["Chất làm mềm da", "Chất ổn định nhũ tương", "Chất tạo gel", "Chất tạo độ đục"], "ge": ["Emollient", "Emulsion stabilizer", "Gelling agent", "Opacifying agent"], "cas": "5970-45-6, 557-34-6", "f": [["Dùng làm tá dược trong nhiều chế phẩm gồm gel, lotion, dung dịch dùng ngoài và thuốc tiêm dưới da.", "1, tr.1038"]], "fe": [["Used as an excipient in many preparations including gels, lotions, topical solutions and subcutaneous injections.", "1, tr.1038"]], "t": [["Tương kỵ với chất oxy hóa, muối kẽm khác, kiềm và carbonat, oxalat, phosphat và sulfid.", "1, tr.1038"]], "te": [["Incompatible with oxidizing agents, other zinc salts, alkalis and carbonates, oxalates, phosphates and sulfides.", "1, tr.1038"]], "d": [["Phiến kết tinh óng ánh màu trắng, mùi acetic nhẹ, vị chát.", "1, tr.1038"], ["Tan 1 trong 2,3 phần nước; tan 1 trong 30 phần ethanol 95%.", "1, tr.1038"]], "de": [["White iridescent crystalline slab, mild acetic odor, acrid taste.", "1, tr.1038"], ["Dissolve 1 in 2.3 parts water; Dissolves 1 in 30 parts of 95% ethanol.", "1, tr.1038"]], "a": "zinc acetate kem acetat 557-34-6 Zinc Acetate Zinc Acetate Dihydrate Acetic acid, zinc salt dicarbomethoxy zinc Galzin-, Wilzin-, zinc acetas dihydricus zinc (II) acetate zinc diacetate opacifier. 6"}, {"id": "zinc-oxide", "n": "Zinc Oxide", "nv": "Zinc Oxide", "g": ["Chất bảo quản kháng khuẩn", "Chất tạo màng bao", "Chất tạo độ đục"], "ge": ["Antimicrobial preservative", "Coating agent", "Opacifying agent"], "cas": "1314-13-2", "f": [["Dùng rộng rãi trong kem, thuốc mỡ và lotion; phổ biến nhất trong sản phẩm cho trẻ em và lotion calamin (phối hợp ít oxid sắt). Hấp thụ hoàn toàn tia UV <366 nm nên dùng nhiều làm chất chống nắng chắn UVA và UVB. Nồng độ tham khảo: kem bán rắn 5–30%.", "1, tr.1040"]], "fe": [["Widely used in creams, ointments and lotions; Most common in children's products and calamine lotion (low iron oxide combination). Completely absorbs UV rays <366 nm, so it is widely used as a sunscreen to block UVA and UVB. Reference concentration: semi-solid cream 5–30%.", "1, tr.1040"]], "t": [["Phản ứng mãnh liệt với magnesi hoặc dầu lanh.", "1, tr.1040"]], "te": [["Violent reaction to magnesium or linseed oil.", "1, tr.1040"]], "d": [["Bột mềm màu trắng hoặc trắng vàng, không mùi; dạng tập hợp lỏng của tiểu phân sơ cấp vô định hình dưới micron.", "1, tr.1040"], ["Thực tế không tan trong nước; tan trong acid loãng (acetic), amoniac và dung dịch hydroxyd kiềm.", "1, tr.1040"]], "de": [["Soft white or yellowish white powder, odo const KB_TOPICS = [{"id": "f2_formula", "tool": "dissolutionf2calculatorfull", "keys": ["f2", "he so f2", "tinh f2", "do hoa tan", "do tuong dong", "dissolution", "similarity factor", "formula f2", "cong thuc f2"], "vi": {"title": "Hệ số tương đồng hòa tan f2", "desc": "Hệ số đo lường mức độ tương đồng giữa hai đường cong hòa tan (Sản phẩm Thử nghiệm T và Đối chiếu R) theo FDA, EMA và WHO.", "formula": "f2 = 50 × log10 [ 100 / √(1 + (1/n) Σ(Rt - Tt)²) ]", "criteria": "• Tiêu chuẩn chấp thuận: 50 ≤ f2 ≤ 100 (tương đương độ lệch trung bình giữa hai đường cong ≤ 10%).\n• Điều kiện CV%: Điểm thời gian đầu ≤ 20%, các điểm sau ≤ 10%.\n• Điểm hòa tan > 85%: Chỉ được lấy tối đa 1 điểm > 85% cho cả 2 sản phẩm.", "action": "Mở Công cụ Tính f2 & Bootstrap"}, "en": {"title": "Dissolution Similarity Factor (f2)", "desc": "Logarithmic reciprocal square root transformation of the sum squared error of difference between Test and Reference dissolution profiles.", "formula": "f2 = 50 × log10 [ 100 / √(1 + (1/n) Σ(Rt - Tt)²) ]", "criteria": "• Acceptance criteria: 50 ≤ f2 ≤ 100 (average difference ≤ 10%).\n• CV% requirements: ≤ 20% at early timepoint, ≤ 10% at other timepoints.\n• Profile cutoff: Only one timepoint > 85% dissolution allowed for both profiles.", "action": "Open Dissolution f2 Calculator"}}, {"id": "f2_bootstrap", "tool": "dissolutionf2calculatorfull", "keys": ["bootstrap", "bootstrap ci", "khoang tin cay 90", "bca", "resampling", "cv qua 10", "bien thien lon"], "vi": {"title": "Khoảng tin cậy 90% Bootstrap (f2)", "desc": "Phương pháp lấy mẫu lại phi tham số (Non-parametric resampling) được FDA khuyến nghị áp dụng khi hệ số biến thiên CV% vượt quá 10-20%.", "criteria": "• Số lần lấy mẫu lại (Resampling): 1.000 – 5.000 lần.\n• Tiêu chuẩn đánh giá: Giới hạn dưới của khoảng tin cậy 90% (Lower 90% Confidence Limit - BCa / Percentile) phải ≥ 50.0.\n• Khi giới hạn dưới ≥ 50, hai sản phẩm được kết luận là tương đồng hòa tan.", "action": "Mở Công cụ Tính f2 & Bootstrap"}, "en": {"title": "90% Bootstrap Confidence Interval for f2", "desc": "Non-parametric resampling approach recommended by FDA when dissolution data exhibits large variability (CV% > 10–20%).", "criteria": "• Resampling iterations: 1,000 – 5,000 bootstraps.\n• Acceptance rule: Lower bound of the 90% confidence interval (BCa or Percentile method) must be ≥ 50.0.\n• Confirms profile similarity despite high within-batch variation.", "action": "Open Dissolution f2 Calculator"}}, {"id": "ich_q1e_poolability", "tool": "stabilityanalysistoolprediction", "keys": ["ich q1e", "gop lo", "poolability", "kiem dinh gop lo", "p 0.25", "p-value 0.25", "common slope", "separate slope", "do on dinh", "han dung"], "vi": {"title": "Quy trình kiểm định gộp lô theo ICH Q1E", "desc": "Hướng dẫn của ICH về việc phân tích dữ liệu độ ổn định từ 3 lô sản xuất để thiết lập hạn dùng chung cho sản phẩm thuốc.", "criteria": "• Bước 1 - Kiểm định độ dốc (Slopes) tại α = 0.25: Nếu p > 0.25, các lô có tốc độ phân hủy tương đương (song song).\n• Bước 2 - Kiểm định giao điểm (Intercepts) tại α = 0.25: Nếu p > 0.25, các lô có cùng mức khởi đầu → Được phép gộp chung thành một đường hồi quy duy nhất.\n• Nếu p ≤ 0.25 ở giao điểm: Dùng mô hình đường thẳng song song.\n• Nếu p ≤ 0.25 ở độ dốc: Phải phân tích riêng từng lô, hạn dùng lấy theo lô có kết quả ngắn nhất.", "action": "Mở Công cụ Dự đoán Hạn dùng ICH Q1E"}, "en": {"title": "ICH Q1E Batch Poolability Testing", "desc": "ICH Q1E statistical guideline for pooling stability data across registration batches to establish a common shelf life.", "criteria": "• Step 1 - Slopes equality test at α = 0.25: If p > 0.25, degradation rates are statistically equivalent.\n• Step 2 - Intercepts equality test at α = 0.25: If p > 0.25, batches share identical initial levels → Full pooling valid (Common Slope & Intercept).\n• If intercept p ≤ 0.25: Common slope, separate intercepts model.\n• If slope p ≤ 0.25: Separate regressions for each batch; shelf life governed by the shortest batch.", "action": "Open ICH Q1E Stability Tool"}}, {"id": "ich_q1e_shelflife", "tool": "stabilityanalysistoolprediction", "keys": ["xac dinh han dung", "uoc tinh han dung", "shelf life", "95 confidence", "lower 95", "du doan han dung", "gioi han tieu chuan"], "vi": {"title": "Cách xác định Hạn dùng thuốc theo ICH Q1E", "desc": "Hạn dùng được xác định là thời điểm mà đường giới hạn tin cậy 95% một phía (Lower 95% Confidence Limit) của đường hồi quy cắt giới hạn tiêu chuẩn chất lượng thấp nhất (Specification Limit).", "criteria": "• Ví dụ: Tiêu chuẩn hàm lượng hoạt chất ≥ 90.0% nhãn. Khi đường giới hạn dưới 95% chạm mốc 90.0% tại tháng 28.4 thì hạn dùng công bố tối đa là 28 tháng.\n• Với chỉ tiêu tạp chất tăng dần theo thời gian, điểm cắt là giới hạn tin cậy trên 95% (Upper 95% Limit) cắt tiêu chuẩn tối đa.", "action": "Mở Công cụ Dự đoán Hạn dùng ICH Q1E"}, "en": {"title": "ICH Q1E Shelf Life Estimation", "desc": "Shelf life is determined by the intersection of the one-sided 95% confidence limit curve with the lower or upper acceptance specification limit.", "criteria": "• For active assay (decreasing attribute): Intersection of lower 95% confidence limit with specification lower bound (e.g. 90.0%).\n• For degradation products (increasing attribute): Intersection of upper 95% confidence limit with specification threshold.\n• Extrapolation beyond real-time data is strictly governed by ICH Q1E decision trees.", "action": "Open ICH Q1E Stability Tool"}}, {"id": "scaleup_dwell_time", "tool": "scaleup", "keys": ["dwell time", "thoi gian duy tri luc nen", "scale up", "dap vien", "mo rong quy mo", "van toc chay", "punch velocity", "dinh chay", "dut chom", "capping"], "vi": {"title": "Thời gian duy trì lực nén (Dwell Time) & Scale-up", "desc": "Dwell time là khoảng thời gian mà đầu chày duy trì lực nén tối đa trên trục lăn (khi mặt phẳng đầu chày tiếp xúc với trục lăn).", "formula": "t_dwell = W_flat / v_pitch (với v_pitch = π × D_pitch × N / 60)", "criteria": "• Ý nghĩa: Dwell time ngắn (khi tăng tốc độ dập viên) làm khối bột chưa kịp biến dạng dẻo, gây hiện tượng nứt viên (capping), bở viên hoặc dính chày (sticking).\n• Quy tắc Scale-up: Khi chuyển từ máy R&D sang máy sản xuất thương mại, cần giữ nguyên hoặc tối ưu Dwell time và vận tốc tiếp tuyến đầu chày.", "action": "Mở Công cụ Scale-up Dập viên"}, "en": {"title": "Compression Dwell Time & Tablet Scale-Up", "desc": "Dwell time is the duration when the flat area of the punch head is in full contact with the compression roller at peak pressure.", "formula": "t_dwell = W_flat / v_pitch (where v_pitch = π × D_pitch × N / 60)", "criteria": "• Pharmaceutical impact: Insufficient dwell time under high rotational speed reduces plastic deformation, causing capping, lamination, low hardness, or punch face sticking.\n• Scale-up principle: Match punch tip velocity and dwell time windows between laboratory and production rotary tablet presses.", "action": "Open Tablet Press Scale-up Tool"}}, {"id": "qc_cpk_sixpack", "tool": "hsdk", "keys": ["cpk", "cp", "pp", "ppk", "sixpack", "nang luc qua trinh", "process capability", "i-mr", "do lech chuan", "kiem soat lo", "kiem dinh chuan"], "vi": {"title": "Chỉ số Năng lực Quá trình Cpk & Sixpack QC", "desc": "Đo lường khả năng của quy trình sản xuất dược phẩm trong việc tạo ra sản phẩm nằm trong giới hạn đặc tính kỹ thuật (USL/LSL).", "formula": "Cpk = min[ (USL - μ)/(3σ), (μ - LSL)/(3σ) ]", "criteria": "• Cpk < 1.0: Quá trình không đạt năng lực, nguy cơ cao phát sinh phế phẩm.\n• 1.0 ≤ Cpk < 1.33: Quá trình tạm chấp nhận, cần cải tiến và theo dõi.\n• 1.33 ≤ Cpk < 1.67: Quá trình đạt chuẩn chất lượng công nghiệp tốt (4-Sigma).\n• Cpk ≥ 1.67: Quá trình hoàn hảo chuẩn Six Sigma (tỷ lệ lỗi < 3.4 ppm).\n• Biểu đồ I-MR: Kiểm tra tính ổn định thống kê của các giá trị riêng lẻ (I) và độ dao động tức thời (MR).", "action": "Mở Công cụ HSĐK & Sixpack Cpk"}, "en": {"title": "Process Capability (Cpk) & Sixpack Analysis", "desc": "Evaluates whether a pharmaceutical batch process is statistically capable of consistently meeting upper and lower specification limits.", "formula": "Cpk = min[ (USL - μ)/(3σ), (μ - LSL)/(3σ) ]", "criteria": "• Cpk < 1.0: Process incapable; significant out-of-specification risk.\n• 1.0 ≤ Cpk < 1.33: Marginally capable; requires tight surveillance.\n• 1.33 ≤ Cpk < 1.67: Highly capable industrial standard (4-Sigma benchmark).\n• Cpk ≥ 1.67: World-class Six Sigma quality (less than 3.4 defects per million opportunities).\n• I-MR charts: Detect shifts in batch mean and moving range variability over time.", "action": "Open Batch QC & Sixpack Cpk Tool"}}, {"id": "qbd_methodology", "tool": "qbdstudyworkspace", "keys": ["qbd", "qtpp", "cqa", "cpp", "cma", "design space", "mien thiet ke", "doe", "box behnken", "central composite", "be mat dap ung"], "vi": {"title": "Không gian Nghiên cứu QbD & Thiết kế Thực nghiệm DOE", "desc": "Phương pháp luận Phát triển thuốc theo chất lượng định sẵn (Quality by Design - ICH Q8/Q9/Q10) và tối ưu hóa đa biến.", "criteria": "• QTPP: Hồ sơ chất lượng sản phẩm mục tiêu (dạng bào chế, sinh khả dụng, độ hòa tan).\n• CQA: Thuộc tính chất lượng then chốt của viên (độ rã, độ cứng, độ đồng đều hàm lượng, tạp chất).\n• CPP: Thông số quy trình trọng yếu (nhiệt độ sấy tầng sôi, lực nén, tốc độ bao).\n• Miền thiết kế (Design Space): Vùng kết hợp an toàn của các CPP và CMA đảm bảo mọi mẻ sản xuất đều đạt CQA.", "action": "Mở Không gian Nghiên cứu QbD"}, "en": {"title": "QbD Framework & DOE Optimization", "desc": "ICH Q8/Q9/Q10 Quality by Design methodology: systematic pharmaceutical development based on predefined objectives and risk management.", "criteria": "• QTPP: Quality Target Product Profile outlining dosage, strength, and delivery specifications.\n• CQA: Critical Quality Attributes affecting patient safety or efficacy (dissolution, assay, impurities).\n• CPP: Critical Process Parameters that impact CQAs.\n• Design Space: Multidimensional combination of material attributes and process parameters demonstrated to ensure product quality.", "action": "Open QbD Study Workspace"}}, {"id": "ai_regulatory_assistant", "tool": "trolyaiduocphamhoanchinhv5", "keys": ["tro ly ai", "ai duoc pham", "soan thao", "tong quan tai lieu", "bao cao shtt", "tham dinh quy trinh", "ho so dang ky", "actd", "ctd module 3"], "vi": {"title": "Trợ lý AI Soạn thảo Tài liệu & Hồ sơ Kỹ thuật", "desc": "Hệ thống hỗ trợ tự động hóa soạn thảo hồ sơ R&D Dược phẩm theo cấu trúc chuẩn ACTD và ICH CTD Module 3.", "criteria": "• Báo cáo tra cứu Sở hữu trí tuệ (SHTT & Patent FTO): Phân tích tình trạng bằng độc quyền sáng chế, đơn đang nộp, rủi ro xâm phạm quyền.\n• Tổng quan tài liệu hoạt chất: Độc tính, dược động học, độ tan BCS, tương kỵ.\n• Đề cương & Báo cáo thẩm định quy trình sản xuất: Tiêu chí lấy mẫu, giới hạn cảnh báo, phân tích biến số trọng yếu.\n• Biểu mẫu chuẩn hóa: Tự động điền và xuất dữ liệu hồ sơ thuốc.", "action": "Mở Trợ lý AI Tạo tài liệu"}, "en": {"title": "AI Pharmaceutical Document Assistant", "desc": "Automated technical authoring assistant for regulatory dossiers compliant with ACTD and ICH CTD Module 3 specifications.", "criteria": "• Intellectual Property & FTO Patent Reports: Freedom-to-operate landscape, claims mapping, and patent expiry timelines.\n• Active Ingredient Literature Review: BCS classification, solubility profiles, polymorphism, safety monographs.\n• Process Validation Protocols & Reports: Critical sampling protocols, alert limits, and CPV tracking.\n• Standardized regulatory reporting and documentation templates.", "action": "Open AI Document Assistant"}}, {"id": "formulation_anova_topic", "tool": "formulation_anova", "keys": ["anova", "t-test", "t test", "tukey", "dunnett", "shapiro", "levene", "kruskal", "mann whitney", "wilcoxon", "so sanh cong thuc", "rld"], "vi": {"title": "So sánh Công thức (t-Test & One-Way ANOVA)", "desc": "Phân tích thống kê so sánh 2 hoặc nhiều công thức bào chế kèm kiểm định giả định và hậu nghiệm chuẩn Mini
