["Easily soluble in 95% ethanol; soluble in ether, terpenes and oils; very slightly soluble in water; Soluble in alkaline hydroxide solution.", "1, tr.243"]], "a": "chloroxylenol cloroxylenol pcmx 88-04-0 Chloroxylenol -Chloro-3,5-dimethylphenol 2-chloro-5-hydroxy-l,3-dimethylbenzene 4-chloro-l-hydroxy-3,5-dimethylbenzene 2-chloro-5hydroxy-m-xylene 2-chloro-m-xylenol 3,5-dimethyl-4-chlorophenol Nipacide PX parachlorometaxylenol p-chloro-m-xylenol PCMX"}, {"id": "cholesterol", "n": "Cholesterol", "nv": "Cholesterol", "g": ["Chất làm mềm da", "Chất nhũ hóa"], "ge": ["Emollient", "Emulsifying agent"], "cas": "57-88-5", "f": [["Dùng trong chế phẩm dùng ngoài ở nồng độ 0,3–5,0% kl/kl làm chất nhũ hóa; tạo khả năng hút nước cho thuốc mỡ và có tính làm mềm; dùng làm chất ổn định nhũ tương lipid tiêm, liposom và niosom.", "1, tr.245"]], "fe": [["Used in topical preparations at concentrations of 0.3–5.0% w/kl as an emulsifier; creates the ability to absorb water for the ointment and has emollient properties; Used as a stabilizer for injectable lipid emulsions, liposomes and niosomes.", "1, tr.245"]], "t": [["Bị tủa bởi digitonin.", "1, tr.245"]], "te": [["Precipitated by digitonin.", "1, tr.245"]], "d": [["Phiến óng ánh, kim, bột hoặc hạt màu trắng hoặc vàng nhạt, gần như không mùi; ngả vàng/nâu khi tiếp xúc lâu với ánh sáng và không khí.", "1, tr.245"]], "de": [["Iridescent flakes, needles, white or light yellow powder or granules, almost odorless; turns yellow/brown upon prolonged exposure to light and air.", "1, tr.245"]], "a": "cholesterol 57-88-5 Cholesterol Cholest-5-ene-3p-ol Cholesterin cholesterolum 3|3-hydroxy-5cholestene"}, {"id": "cholestyramine-resin", "n": "Cholestyramine Resin", "nv": "Colestyramine; Cholestyramine Resin", "g": ["Chất tạo phức", "Tá dược phóng thích biến đổi", "Chất làm tăng độ tan", "Chất che vị"], "ge": ["Chelating / Complexing agent", "Modified-release agent", "Solubilizing agent", "Taste-masking agent"], "cas": "11041-12-6", "f": [["Là nhựa trao đổi anion, tạo phức ('resinat') với phân tử thuốc để điều biến giải phóng, cải thiện độ tan và che vị; ion clorid trao đổi với thuốc anion, thuốc được giải phóng khi trao đổi tiếp với anion ở đường tiêu hóa. Mức nạp thuốc điển hình 5–50% dung lượng trao đổi.", "1, tr.248"]], "fe": [["It is an anion exchange resin that forms complexes ('resinate') with drug molecules to modulate release, improve solubility and mask taste; Chloride ions exchange with anionic drugs, the drugs are released upon further exchange with anions in the digestive tract. Typical drug loading levels are 5–50% of exchange capacity.", "1, tr.248"]], "t": [["Tương kỵ với chất oxy hóa (gây phân hủy nhựa trao đổi ion); chất oxy hóa mạnh và acid nitric có thể gây phản ứng nổ.", "1, tr.248"]], "te": [["Incompatible with oxidants (causes decomposition of ion exchange resins); Strong oxidizers and nitric acid can cause explosive reactions.", "1, tr.248"]], "d": [["Bột mịn màu trắng/gần trắng, hút ẩm; không mùi hoặc mùi amin nhẹ.", "1, tr.248"], ["Không tan trong nước, alcol, benzen, cloroform và ether.", "1, tr.248"]], "de": [["White/almost white fine powder, hygroscopic; Odorless or mild amine odor.", "1, tr.248"], ["Insoluble in water, alcohol, benzene, chloroform and ether.", "1, tr.248"]], "a": "cholestyramine resin nhua cholestyramin colestyramine 11041-12-6 Colestyramine Cholestyramine Resin Cholestyramine colestyraminum DUO LITE API 43 Purolite A430MR"}, {"id": "citric-acid-monohydrate", "n": "Citric Acid Monohydrate", "nv": "Citric Acid Monohydrate", "g": ["Chất acid hóa", "Chất đệm", "Chất tạo phức", "Chất hiệp lực chống oxy hóa", "Chất tạo hương"], "ge": ["Acidifying agent", "Buffering agent", "Chelating / Complexing agent", "Antioxidant synergist", "Flavoring agent"], "cas": "", "f": [["Dùng rộng rãi chủ yếu để điều chỉnh pH dung dịch; dạng monohydrat dùng để điều chế cốm sủi (dạng khan dùng cho viên sủi).", "1, tr.250"], ["Cũng dùng làm chất tạo phức và hiệp lực chống oxy hóa; trong thực phẩm làm chất tăng cường hương vị nhờ vị chua.", "1, tr.250"]], "fe": [["Widely used mainly to adjust solution pH; monohydrate form used to prepare effervescent granules (anhydrous form used for effervescent tablets).", "1, tr.250"], ["Also used as a complexing agent and synergistic antioxidant; in foods as a flavor enhancer due to its sour taste.", "1, tr.250"]], "t": [["Tương kỵ với kali tartrat, carbonat và bicarbonat kiềm/kiềm thổ, acetat và sulfid; với chất oxy hóa, base, chất khử và nitrat; có thể nổ khi kết hợp với nitrat kim loại; khi bảo quản, sucrose có thể kết tinh từ siro khi có acid citric.", "1, tr.250"]], "te": [["Incompatible with potassium tartrate, alkaline/alkaline earth carbonates and bicarbonates, acetates and sulfides; with oxidants, bases, reducing agents and nitrates; May explode when combined with metal nitrates; During storage, sucrose can crystallize from syrup in the presence of citric acid.", "1, tr.250"]], "d": [["Tinh thể không màu/trong mờ hoặc bột kết tinh màu trắng, lên hoa; không mùi, vị chua mạnh (tinh thể trực thoi).", "1, tr.250"], ["Tan 1 trong 1,5 phần ethanol 95% và 1 trong dưới 1 phần nước; ít tan trong ether.", "1, tr.250"]], "de": [["Colorless/translucent crystals or white, crystalline powder; Odorless, strong sour taste (orthorhombic crystals).", "1, tr.250"], ["Soluble 1 in 1.5 parts 95% ethanol and 1 in less than 1 part water; Slightly soluble in ether.", "1, tr.250"]], "a": "citric acid monohydrate acid citric monohydrat citric acid 5949-29-1 E330 Citric Acid Monohydrate Citric Acid Hydrate Acidurn citricum monohydricum 2-hydroxypropane-l,2,3tricarboxylic acid monohydrate"}, {"id": "coconut-oil", "n": "Coconut Oil", "nv": "Coconut Oil; Coconut Oil, Refined", "g": ["Chất làm mềm da", "Tá dược thuốc mỡ"], "ge": ["Emollient", "Ointment base"], "cas": "8001-31-8", "f": [["Truyền thống dùng trong thuốc mỡ tạo nền dễ hấp thu, đặc biệt chế phẩm bôi da đầu (rắn khi cầm nhưng hóa lỏng khi bôi lên da); cũng dùng trong nhũ tương, vi nhũ tương, dung dịch nhỏ mũi, chế phẩm trực tràng.", "1, tr.253"]], "fe": [["Traditionally used in ointments to create an easily absorbed base, especially scalp preparations (solid when handled but liquefies when applied to the skin); Also used in emulsions, microemulsions, nasal solutions, and rectal preparations.", "1, tr.253"]], "t": [["Phản ứng với chất oxy hóa, acid và kiềm; polyethylen thấm dầu dừa dễ dàng; dầu bị hút vào piston cao su của bơm tiêm nhựa gây khó đẩy.", "1, tr.253"]], "te": [["Reacts with oxidants, acids and alkalis; polyethylene absorbs coconut oil easily; Oil is sucked into the rubber piston of the plastic syringe, making it difficult to push.", "1, tr.253"]], "d": [["Khối hoặc dầu trong màu trắng đến vàng nhạt, mùi dừa nhẹ, vị nhẹ; trạng thái tùy nhiệt độ (lỏng ở 28–30 °C, rắn/nửa rắn ở nhiệt độ thấp hơn).", "1, tr.253"], ["Thực tế không tan trong nước; dễ tan trong dicloromethan và ether dầu hỏa nhẹ; tan trong ether, cloroform.", "1, tr.253"]], "de": [["White to light yellow clear mass or oil, mild coconut odor, mild taste; temperature-dependent state (liquid at 28–30 °C, solid/semi-solid at lower temperatures).", "1, tr.253"], ["Practically insoluble in water; Easily soluble in dichloromethane and light petroleum ether; Soluble in ether, chloroform.", "1, tr.253"]], "a": "coconut oil dau dua 8001-31-8 Coconut Oil Coconut Oil, Refined Aceite de coco cocois oleum raffinatum coconut butter coconut palm oil copra oil oleum cocois Pureco 76 ointment base"}, {"id": "colloidal-silicon-dioxide", "n": "Colloidal Silicon Dioxide", "nv": "Colloidal Anhydrous Silica; Light Anhydrous Silicic Acid; Silica, Colloidal Anhydrous; Colloidal Silicon Dioxide", "g": ["Chất hấp phụ", "Chất chống vón", "Chất ổn định nhũ tương", "Chất điều hòa sự chảy", "Chất gây treo", "Tá dược rã (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Adsorbent", "Anticaking agent", "Emulsion stabilizer", "Glidant", "Suspending agent", "Tablet / capsule disintegrant", "Viscosity-increasing agent"], "cas": "7631-86-9", "f": [["Dùng rộng rãi nhờ cỡ hạt nhỏ và diện tích bề mặt lớn, cải thiện lưu tính của bột khô trong dập viên và đóng nang (chất điều hòa trơn chảy).", "1, tr.255"], ["Cũng dùng để ổn định nhũ tương và làm chất làm đặc/gây treo thixotropic trong gel, vi nhũ tương và chế phẩm bán rắn; với thành phần có chiết suất tương đồng có thể tạo gel trong suốt.", "1, tr.255"]], "fe": [["Widely used thanks to small particle size and large surface area, improving the fluidity of dry powders in tableting and capsule filling (flow conditioner).", "1, tr.255"], ["Also used to stabilize emulsions and as a thixotropic thickener/suspension agent in gels, microemulsions and semi-solid preparations; With ingredients with similar refractive index, it can create transparent gel.", "1, tr.255"]], "t": [["Tương kỵ với chế phẩm diethylstilbestrol.", "1, tr.255"]], "te": [["Incompatible with diethylstilbestrol preparations.", "1, tr.255"]], "d": [["Silica khói (fumed) siêu mịn, cỡ hạt ~15 nm; bột vô định hình nhẹ, xốp, màu trắng ánh xanh, không mùi, không vị.", "1, tr.255"], ["Thực tế không tan trong dung môi hữu cơ, nước và acid (trừ HF); tan trong dung dịch hydroxyd kiềm nóng; tạo phân tán keo với nước.", "1, tr.255"]], "de": [["Fumed silica is super fine, particle size ~15 nm; Light, spongy, bluish-white amorphous powder, odorless, tasteless.", "1, tr.255"], ["Practically insoluble in organic solvents, water and acids (except HF); soluble in hot alkaline hydroxide solution; create colloidal dispersion with water.", "1, tr.255"]], "a": "colloidal silicon dioxide silic dioxid keo colloidal anhydrous silica fumed silica aerosil cab-o-sil 7631-86-9 E551 Colloidal Anhydrous Silica Light Anhydrous Silicic Acid Silica, Colloidal Anhydrous Colloidal Silicon Dioxide Aerosil Aeroperl Cab-O-Sil colloidal silica fumed silicon dioxide hochdisperses silicum dioxid SAS silica colloidalis anhydrica silica sol silicic anhydride silicon dioxide colloidal silicon dioxide fumed synthetic amorphous silica HDK"}, {"id": "colophony", "n": "Colophony", "nv": "Colophony; Rosin", "g": ["Chất tạo màng bao", "Chất nhũ hóa", "Chất tạo màng", "Chất vi nang hóa", "Tá dược phóng thích biến đổi", "Tá dược dính (viên nén/nang)"], "ge": ["Coating agent", "Emulsifying agent", "Film-forming agent", "Microencapsulating agent", "Modified-release agent", "Tablet / capsule binder"], "cas": "8050-09-7", "f": [["Dùng làm tá dược dính và tá dược bao cho viên nang và viên nén đường uống; cũng dùng để điều chế vi nang cho giải phóng kiểm soát (aspirin, diltiazem).", "1, tr.259"]], "fe": [["Used as adhesive and coating excipients for oral capsules and tablets; also used to prepare microcapsules for controlled release (aspirin, diltiazem).", "1, tr.259"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.259"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.259"]], "d": [["Mảnh giòn, trong mờ, màu vàng nhạt đến hổ phách sẫm, hình dạng không đều; mùi và vị nhựa thông nhẹ.", "1, tr.259"], ["Không tan trong nước; tan trong ethanol 96%, benzen, ether, methanol, acid acetic băng, cloroform, dầu.", "1, tr.259"]], "de": [["Flakes are brittle, translucent, pale yellow to dark amber, irregular in shape; mild pine resin smell and taste.", "1, tr.259"], ["Insoluble in water; Soluble in 96% ethanol, benzene, ether, methanol, glacial acetic acid, chloroform, oil.", "1, tr.259"]], "a": "colophony colophony rosin tung huong 8050-09-7 Colophony Rosin Abietic anhydride colofonia coloph colophane colophonium disproportionated rosin gum rosin pine rosin resin terebinthinae wood rosin"}, {"id": "coloring-agents", "n": "Coloring Agents", "nv": "Chất tạo màu (nhóm)", "g": ["Chất tạo màu", "Chất tạo độ đục"], "ge": ["Coloring agent", "Opacifying agent"], "cas": "", "f": [["Dùng chủ yếu để tạo hình thức đặc trưng cho dạng thuốc: nhân hoặc màng bao viên nén; vỏ nang cứng/mềm hoặc hạt bao; chế phẩm lỏng uống; kem và thuốc mỡ dùng ngoài.", "1, tr.262"], ["Màu còn giúp nhận diện sản phẩm trong sản xuất, phân phối và giúp người bệnh nhận biết thuốc.", "1, tr.262"]], "fe": [["Mainly used to create a specific shape for the drug form: tablet core or coating; hard/soft capsules or capsules; oral liquid preparations; creams and ointments for external use.", "1, tr.262"], ["Color also helps identify products in production and distribution and helps patients recognize drugs.", "1, tr.262"]], "t": [["Xem tương kỵ của từng chất tạo màu cụ thể ở phần chất liên quan của chuyên luận.", "1, tr.262"]], "te": [["See incompatibility of each specific colorant in the relevant substances section of the monograph.", "1, tr.262"]], "d": [["Hình thức vật lý rất đa dạng tùy từng chất; các chất tạo màu cụ thể được liệt kê ở phần chất liên quan của chuyên luận (một số có chuyên luận riêng như Iron Oxides, Titanium Dioxide, Beta caroten).", "1, tr.262"]], "de": [["The physical form is very diverse depending on the substance; Specific colorants are listed in the relevant substances section of the monograph (some have their own monographs such as Iron Oxides, Titanium Dioxide, Beta carotene).", "1, tr.262"]], "a": "coloring agents chat tao mau colorant phẩm màu dyes lakes"}, {"id": "copovidone", "n": "Copovidone", "nv": "Copovidone", "g": ["Chất tạo màng", "Tá dược phóng thích biến đổi", "Tá dược dính (viên nén/nang)"], "ge": ["Film-forming agent", "Modified-release agent", "Tablet / capsule binder"], "cas": "25086-89-9", "f": [["Dùng làm tá dược dính viên nén (cả dập thẳng và xát hạt ướt, nồng độ 2,0–5,0%), chất tạo màng (0,5–5,0% trong dung dịch bao) và một phần cốt trong công thức giải phóng kiểm soát; cho độ bám, đàn hồi, độ cứng tốt và có thể làm màng chắn ẩm.", "1, tr.270"]], "fe": [["Used as tablet adhesive excipient (both straight stamping and wet granulation, concentration 2.0–5.0%), film forming agent (0.5–5.0% in coating solution) and a base in controlled release formulations; Provides good adhesion, elasticity, hardness and can act as a moisture barrier.", "1, tr.270"]], "t": [["Tương hợp với đa số thành phần hữu cơ và vô cơ; khi tiếp xúc độ ẩm cao có thể tạo phức phân tử với một số chất (xem Crospovidon và Povidon).", "1, tr.270"]], "te": [["Compatible with most organic and inorganic ingredients; When exposed to high humidity, molecular complexes can form with certain substances (see Crospovidon and Povidone).", "1, tr.270"]], "d": [["Bột vô định hình màu trắng đến trắng vàng, thường phun sấy, cỡ hạt tương đối mịn; mùi và vị nhẹ.", "1, tr.270"], ["Tan trên 10% trong nước, ethanol 95%, methanol, cloroform, dicloromethan, PEG 400, propylen glycol...", "1, tr.270"]], "de": [["White to yellowish white amorphous powder, usually spray dried, relatively fine particle size; mild odor and taste.", "1, tr.270"], ["Soluble more than 10% in water, 95% ethanol, methanol, chloroform, dichloromethane, PEG 400, propylene glycol...", "1, tr.270"]], "a": "copovidone copovidon copovidone vinylpyrrolidone-vinyl acetate copolymer kollidon va64 25086-89-9 Copovidone copolyvidone copovidonum Kollidon VA 64\\ Luviskol VA Plasdone S-630 poly(l-vinylpyrrolidone-co-vinyl acetate) polyvinylpyrrolidone-vinyl acetate copolymer PVP/VA PVP/VA copolymer"}, {"id": "corn-oil", "n": "Corn Oil", "nv": "Corn Oil; Refined Maize Oil; Maize Oil, Refined", "g": ["Tá dược dầu", "Dung môi"], "ge": ["Oleaginous vehicle", "Solvent"], "cas": "8001-30-7", "f": [["Dùng chủ yếu làm dung môi cho thuốc tiêm bắp hoặc tá dược cho chế phẩm dùng ngoài; nhũ tương chứa tới 67% dầu ngô dùng làm thực phẩm bổ sung đường uống; cũng dùng trong viên nén/nang uống.", "1, tr.272"]], "fe": [["Mainly used as a solvent for intramuscular injections or excipient for topical preparations; emulsions containing up to 67% corn oil used as oral supplements; Also used in oral tablets/capsules.", "1, tr.272"]], "t": [["Quá trình quang oxy hóa dầu ngô bị nhạy hóa bởi mẫu titan oxid và kẽm oxid bao.", "1, tr.272"]], "te": [["Photooxidation of corn oil was sensitized by coated titanium oxide and zinc oxide samples.", "1, tr.272"]], "d": [["Chất lỏng dạng dầu, trong, màu vàng nhạt, mùi nhẹ đặc trưng, vị hơi bùi ngọt.", "1, tr.272"], ["Trộn lẫn với benzen, cloroform, dicloromethan, ether, hexan; thực tế không tan trong ethanol 95% và nước.", "1, tr.272"]], "de": [["Oily liquid, clear, light yellow, characteristic light odor, slightly sweet taste.", "1, tr.272"], ["Miscible with benzene, chloroform, dichloromethane, ether, hexane; Practically insoluble in 95% ethanol and water.", "1, tr.272"]], "a": "corn oil dau ngo maize oil 8001-30-7 Corn Oil Refined Maize Oil Maize Oil, Refined Maize oil Majsao CT maydis oleum raffinatum"}, {"id": "corn-starch-pregelatinized-coprocessed", "n": "Corn Starch and Pregelatinized Starch, Coprocessed", "nv": "Tinh bột ngô và tinh bột hồ hóa (đồng chế biến)", "g": ["Tá dược dập thẳng", "Tá dược độn (viên nén/nang)", "Tá dược rã (viên nén/nang)"], "ge": ["Direct compression vehicle", "Tablet / capsule diluent", "Tablet / capsule disintegrant"], "cas": "", "f": [["Dùng trong viên nang và viên nén để cải thiện lưu tính, tăng khả năng rã và cải thiện độ cứng; khả năng nén và rã tốt nhất khi phối hợp với tá dược thông dụng (lactose, MCC hoặc dicalci phosphat).", "1, tr.274"]], "fe": [["Used in capsules and tablets to improve fluidity, increase disintegration and improve hardness; The best compression and disintegration ability when combined with common excipients (lactose, MCC or dicalcium phosphate).", "1, tr.274"]], "t": [["Xem mục Tinh bột và Tinh bột hồ hóa.", "1, tr.274"]], "te": [["See Starch and Gelatinized Starch.", "1, tr.274"]], "d": [["Bột trơn chảy màu trắng; là hỗn hợp đồng chế biến chủ yếu tinh bột ngô cùng tinh bột hồ hóa.", "1, tr.274"], ["Không tan trong nước.", "1, tr.274"]], "de": [["White, slippery powder; is a co-processed mixture of mainly corn starch and gelatinized starch.", "1, tr.274"], ["Insoluble in water.", "1, tr.274"]], "a": "coprocessed corn starch pregelatinized starch starcap 1500 tinh bot ngo ho hoa dong che bien"}, {"id": "corn-syrup-solids", "n": "Corn Syrup Solids", "nv": "Glucose Liquid Spray-Dried; Corn Syrup Solids", "g": ["Chất tạo màng bao", "Chất giữ ẩm", "Chất gây treo", "Chất tạo ngọt", "Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Chất điều chỉnh đẳng trương", "Chất làm tăng độ nhớt"], "ge": ["Coating agent", "Humectant", "Suspending agent", "Sweetening agent", "Tablet / capsule binder", "Tablet / capsule diluent", "Tonicity agent", "Viscosity-increasing agent"], "cas": "", "f": [["Dùng làm chất tạo ngọt, tăng độ nhớt, tá dược dính và trơn; có thể làm chất mang cho hoạt chất hàm lượng thấp để cải thiện đồng đều hàm lượng trong công thức dập thẳng; giúp kiểm soát độ ẩm.", "1, tr.275"]], "fe": [["Used as a sweetener, viscosity increaser, sticky and slippery excipient; can be used as a carrier for low-content active ingredients to improve content uniformity in straight stamping formulas; Helps control humidity.", "1, tr.275"]], "t": [["Ở pH rất thấp hoặc rất cao có thể tạo sản phẩm phân hủy màu nâu/vàng ảnh hưởng vị; có thể phản ứng Maillard với hợp chất amin (như amino acid).", "1, tr.275"]], "te": [["At very low or very high pH, it can create brown/yellow decomposition products that affect taste; Maillard reaction is possible with amine compounds (such as amino acids).", "1, tr.275"]], "d": [["Bột hoặc hạt màu nhạt, vị từ nhạt đến hơi ngọt (độ ngọt tăng theo giá trị DE), không mùi.", "1, tr.275"], ["Dễ tan trong nước; ít tan trong ethanol 95%; độ tan tăng và độ nhớt giảm khi DE tăng.", "1, tr.275"]], "de": [["Light-colored powder or granules, taste from light to slightly sweet (sweetness increases with DE value), odorless.", "1, tr.275"], ["Easily soluble in water; Slightly soluble in 95% ethanol; Solubility increases and viscosity decreases as DE increases.", "1, tr.275"]], "a": "corn syrup solids bot siro ngo glucose syrup solids dried glucose syrup Glucose Liquid Spray-Dried Corn Syrup Solids Dehydrated hydrolyzed starch syrup glucosum liquidum dispersione desiccatum resistant maltodextrin.3*"}, {"id": "cottonseed-oil", "n": "Cottonseed Oil", "nv": "Cottonseed Oil", "g": ["Tá dược dầu", "Dung môi"], "ge": ["Oleaginous vehicle", "Solvent"], "cas": "8001-29-4", "f": [["Dùng chủ yếu làm dung môi cho thuốc tiêm bắp; từng dùng trong nhũ tương tiêm tĩnh mạch làm nguồn chất béo trong nuôi dưỡng ngoài đường tiêu hóa (nay được thay bằng nhũ tương dầu đậu nành); cũng dùng làm tá dược làm mềm và tá dược dính cho một số viên nén.", "1, tr.277"]], "fe": [["Mainly used as a solvent for intramuscular injections; used to be used in intravenous emulsions as a fat source in parenteral nutrition (now replaced by soybean oil emulsions); Also used as an emollient and adhesive excipient for some tablets.", "1, tr.277"]], "t": [["Tài liệu chưa đề cập.", "1, tr.277"]], "te": [["Documents not mentioned.", "1, tr.277"]], "d": [["Chất lỏng dạng dầu, trong, màu vàng nhạt đến vàng óng; gần như không mùi, vị nhẹ, hơi bùi; có thể tách hạt mỡ rắn ở nhiệt độ thấp.", "1, tr.277"], ["Ít tan trong ethanol 95%; trộn lẫn với carbon disulfid, cloroform, ether, hexan và ether dầu hỏa.", "1, tr.277"]], "de": [["Oily liquid, clear, light yellow to golden yellow; Almost odorless, mild, slightly nutty taste; Can separate solid fat particles at low temperature.", "1, tr.277"], ["Slightly soluble in 95% ethanol; Miscible with carbon disulfide, chloroform, ether, hexane and petroleum ether.", "1, tr.277"]], "a": "cottonseed oil dau hat bong 8001-29-4 Cottonseed Oil Cotton oil solvent"}, {"id": "cresol", "n": "Cresol", "nv": "Cresol", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "1319-77-3", "f": [["Dùng ở nồng độ 0,15–0,3% làm chất bảo quản kháng khuẩn trong thuốc tiêm bắp, tiêm trong da và tiêm dưới da; không phù hợp cho chế phẩm đông khô.", "1, tr.279"]], "fe": [["Used at concentrations of 0.15–0.3% as an antibacterial preservative in intramuscular, intradermal, and subcutaneous injections; Not suitable for freeze-dried preparations.", "1, tr.279"]], "t": [["Tương kỵ với chlorpromazin; hoạt tính kháng khuẩn giảm khi có chất diện hoạt không ion hóa.", "1, tr.279"]], "te": [["Incompatible with chlorpromazine; Antibacterial activity is reduced in the presence of non-ionic surfactants.", "1, tr.279"]], "d": [["Hỗn hợp các đồng phân cresol (chủ yếu m-cresol) và phenol khác từ hắc ín than đá hoặc dầu mỏ; chất lỏng không màu, vàng đến nâu vàng nhạt hoặc hồng, mùi giống phenol nhưng nồng hơn.", "1, tr.279"]], "de": [["Mixtures of cresol isomers (mainly m-cresol) and other phenols from coal tar or petroleum; Colorless liquid, yellow to light yellow brown or pink, odor similar to phenol but stronger.", "1, tr.279"]], "a": "cresol cresol m-cresol 1319-77-3 Cresol Cresylic acid cresylol hydroxytoluene tricresol. m-Cresol"}, {"id": "croscarmellose-sodium", "n": "Croscarmellose Sodium", "nv": "Croscarmellose Sodium", "g": ["Tá dược rã (viên nén/nang)"], "ge": ["Tablet / capsule disintegrant"], "cas": "74811-65-7", "f": [["Dùng làm tá dược rã cho viên nang, viên nén và cốm đường uống; cơ chế dựa trên khả năng hút nước và trương nở mạnh tạo lực làm rã viên.", "1, tr.282"], ["Trong viên nén dùng được cho cả dập thẳng và xát hạt ướt; khi xát hạt ướt nên phân bố vào cả pha trong và pha ngoài (rã nội và rã ngoại). Nồng độ tới 5% kl/kl; thường 2% khi dập thẳng và 3% khi xát hạt ướt.", "1, tr.282"]], "fe": [["Used as a disintegrant for capsules, tablets and oral granules; The mechanism is based on the ability to absorb water and swell strongly, creating force to disintegrate tablets.", "1, tr.282"], ["In tablets, it can be used for both straight crushing and wet granulation; When wet granules are rubbed, they should be distributed into both the internal and external phases (internal and external disintegration). Concentration up to 5% kl/kl; Usually 2% when straight stamping and 3% when wet granulating.", "1, tr.282"]], "t": [["Hiệu quả rã giảm nhẹ khi công thức chứa tá dược hút ẩm (như sorbitol) hoặc tá dược kiềm; tương kỵ với acid mạnh và muối tan của sắt, nhôm, thủy ngân, kẽm.", "1, tr.282"]], "te": [["The disintegration effect is slightly reduced when the formulation contains hygroscopic excipients (such as sorbitol) or alkaline excipients; Incompatible with strong acids and soluble salts of iron, aluminum, mercury, and zinc.", "1, tr.282"]], "d": [["Bột màu trắng hoặc xám trắng, không mùi.", "1, tr.282"], ["Không tan trong nước nhưng trương nở nhanh gấp 4–8 lần thể tích ban đầu khi tiếp xúc nước; thực tế không tan trong aceton, ethanol và toluen.", "1, tr.282"]], "de": [["White or gray-white powder, odorless.", "1, tr.282"], ["Insoluble in water but expands rapidly to 4–8 times its original volume when exposed to water; Practically insoluble in acetone, ethanol and toluene.", "1, tr.282"]], "a": "croscarmellose sodium natri croscarmellose ac-di-sol crosslinked cmc 74811-65-7 E468 Croscarmellose Sodium Ac-Di-Sol carmellosum natricum conexum crosslinked carbox ymethylcellulose sodium Explocel Kiccolate modified cellulose gum Nymcel ZSX Pharmacel XL Primellose Solutab Vivasol"}, {"id": "crospovidone", "n": "Crospovidone", "nv": "Crospovidone", "g": ["Tá dược rã (viên nén/nang)"], "ge": ["Tablet / capsule disintegrant"], "cas": "9003-39-8", "f": [["Là tá dược rã không tan trong nước dùng ở nồng độ 2–5% trong viên nén dập thẳng, xát hạt ướt và khô; thể hiện hoạt tính mao dẫn cao và khả năng hydrat hóa mạnh, ít tạo gel; cỡ hạt ảnh hưởng mạnh đến khả năng rã.", "1, tr.285"]], "fe": [["As a water-insoluble disintegrating excipient at a concentration of 2–5% in straight, wet and dry granulated tablets; exhibits high capillary activity and strong hydration ability, with little gel formation; Particle size strongly affects disintegration ability.", "1, tr.285"]], "t": [["Tương hợp với đa số thành phần hữu cơ và vô cơ; khi tiếp xúc độ ẩm cao có thể tạo phức phân tử với một số chất (xem Povidon).", "1, tr.285"]], "te": [["Compatible with most organic and inorganic ingredients; When exposed to high humidity, molecular complexes can form with some substances (see Povidon).", "1, tr.285"]], "d": [["Bột mịn trơn chảy màu trắng đến trắng kem, gần như không vị, không mùi, hút ẩm.", "1, tr.285"], ["Thực tế không tan trong nước và các dung môi thông thường; trương và hydrat hóa nhanh.", "1, tr.285"]], "de": [["White to creamy white, smooth, flowing powder, almost tasteless, odorless, hygroscopic.", "1, tr.285"], ["Practically insoluble in water and common solvents; swelling and rapid hydration.", "1, tr.285"]], "a": "crospovidone crospovidon crosslinked povidone kollidon cl polyplasdone 25249-54-1 E1202 Crospovidone Crospopharm crospovidonum El 202 Kollidon CL Kollidon CL-M Polyplasdone XL Polyplasdone XL-10 polyvinylpolypyrrolidone PVPP l-vinyl-2-pyrrolidinone homopolymer"}, {"id": "cyclodextrins", "n": "Cyclodextrins", "nv": "Alfadex; Betadex; Gamma Cyclodextrin", "g": ["Chất tạo phức", "Chất làm tăng độ tan"], "ge": ["Chelating / Complexing agent", "Solubilizing agent"], "cas": "10016-20-3, 7585-39-9, 17465-86-0", "f": [["Phân tử dạng phễu có khoang trung tâm kỵ nước và bề mặt ngoài thân nước; tạo phức bao (inclusion complex) với nhiều phân tử thuốc, chủ yếu để cải thiện độ tan, tốc độ hòa tan và sinh khả dụng của thuốc kém tan.", "1, tr.288"]], "fe": [["Funnel-shaped molecules have a hydrophobic central cavity and a hydrophilic outer surface; create inclusion complexes with many drug molecules, mainly to improve the solubility, dissolution rate and bioavailability of poorly soluble drugs.", "1, tr.288"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.288"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.288"]], "d": [["Oligosaccharid vòng, kết tinh, không hút ẩm, từ tinh bột; ba dạng tự nhiên phổ biến α-, β-, γ-cyclodextrin (6, 7, 8 đơn vị glucose) khác nhau về kích thước vòng và độ tan.", "1, tr.288"], ["Độ tan trong nước: α-cyclodextrin 1 trong 7 phần; β-cyclodextrin 1 trong 50 phần; thực tế không tan trong aceton, ethanol 95%, methylen clorid.", "1, tr.288"]], "de": [["Cyclic oligosaccharides, crystalline, non-hygroscopic, from starch; three common natural forms α-, β-, γ-cyclodextrin (6, 7, 8 glucose units) differ in ring size and solubility.", "1, tr.288"], ["Water solubility: α-cyclodextrin 1 in 7 parts; β-cyclodextrin 1 in 50 parts; Practically insoluble in acetone, 95% ethanol, methylene chloride.", "1, tr.288"]], "a": "cyclodextrins cyclodextrin alpha cyclodextrin beta cyclodextrin gamma cyclodextrin betadex 7585-39-9 Alfadex 6 Cyclodextrin Cavitron cyclic oligosaccharide cycloamylose cycloglucan alpha-cycloamylose alpha-cyclodextrin alpha-dextrin W6 Pharma-, cyclohexaamylose cyclomaltohexose. fi-Cyclodextrin beta-cycloamylose beta-dextrin betadexum Cavamax W7 Pharma, cycloheptaamylose cycloheptaglucan cyclomaltoheptose E459 cyclomaltooctaose Betadex Gamma Cyclodextrin"}, {"id": "cyclomethicone", "n": "Cyclomethicone", "nv": "Cyclomethicone", "g": ["Chất làm mềm da", "Chất giữ ẩm", "Chất làm tăng độ nhớt"], "ge": ["Emollient", "Humectant", "Viscosity-increasing agent"], "cas": "69430-24-6", "f": [["Chủ yếu dùng trong chế phẩm dùng ngoài như kem nước/dầu; dùng trong mỹ phẩm ở nồng độ 0,1–50%. Tính bay hơi cao và tính dung môi nhẹ khiến khi bôi lên da cho cảm giác 'khô'.", "1, tr.293"]], "fe": [["Mainly used in topical preparations such as liquid/oil creams; used in cosmetics at concentrations of 0.1–50%. High volatility and mild solvent properties make it feel 'dry' when applied to the skin.", "1, tr.293"]], "t": [["Tài liệu chưa đề cập.", "1, tr.293"]], "te": [["Documents not mentioned.", "1, tr.293"]], "d": [["Chất lỏng dễ bay hơi, trong, không màu, không vị.", "1, tr.293"], ["Tan trong ethanol 95%, isopropyl myristat/palmitat, dầu khoáng và petrolatum ở 80 °C; thực tế không tan trong glycerin, propylen glycol và nước.", "1, tr.293"]], "de": [["Volatile liquid, clear, colorless, tasteless.", "1, tr.293"], ["Soluble in 95% ethanol, isopropyl myristate/palmitate, mineral oil and petrolatum at 80 °C; Practically insoluble in glycerin, propylene glycol and water.", "1, tr.293"]], "a": "cyclomethicone cyclomethicon cyclic dimethyl siloxane 69430-24-6 Cyclomethicone Dimethylcyclopolysiloxane Dow Corning 245 Fluid Dow Corning 246 Fluid Dow Corning 345 Fluid"}, {"id": "d-mannose", "n": "D-Mannose", "nv": "D-mannose", "g": ["Chất chống oxy hóa", "Chất tạo ngọt"], "ge": ["Antioxidant", "Sweetening agent"], "cas": "3458-28-4", "f": [["Dùng làm chất tạo ngọt trong chế phẩm uống; grade dập thẳng dùng làm chất chống oxy hóa trong thực phẩm bổ sung.", "1, tr.589"]], "fe": [["Used as a sweetener in oral preparations; straight grade used as an antioxidant in dietary supplements.", "1, tr.589"]], "t": [["Tài liệu chưa đề cập.", "1, tr.589"]], "te": [["Documents not mentioned.", "1, tr.589"]], "d": [["Bột kết tinh không màu hoặc trắng, vị ngọt kèm hậu vị đắng.", "1, tr.589"]], "de": [["Colorless or white crystalline powder, sweet taste with a bitter aftertaste.", "1, tr.589"]], "a": "d-mannose mannose 3458-28-4 Carubinose dextra mannose D-mannopyranose"}, {"id": "decyl-oleate", "n": "Decyl Oleate", "nv": "Decyl Oleate", "g": ["Chất làm mềm da", "Tá dược dầu"], "ge": ["Emollient", "Oleaginous vehicle"], "cas": "3687-46-5", "f": [["Dùng làm chất làm mềm trong kem và lotion dược phẩm cho da và sản phẩm chăm sóc cá nhân; cũng dùng làm chất tăng thấm qua da và tá dược cho vi nhũ tương, chất mang lipid cấu trúc nano.", "1, tr.295"]], "fe": [["Used as an emollient in pharmaceutical skin creams and lotions and personal care products; also used as a skin permeation enhancer and excipient for microemulsions, nanostructured lipid carriers.", "1, tr.295"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.295"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.295"]], "d": [["Hỗn hợp ester decyl của acid béo, chủ yếu acid oleic; chất lỏng trong, không màu hoặc vàng nhạt.", "1, tr.295"], ["Thực tế không tan trong nước; trộn lẫn với ethanol 96%, methylen clorid và ether dầu hỏa nhẹ.", "1, tr.295"]], "de": [["Mixed decyl esters of fatty acids, mainly oleic acid; Clear, colorless or pale yellow liquid.", "1, tr.295"], ["Practically insoluble in water; Mixed with 96% ethanol, methylene chloride and light petroleum ether.", "1, tr.295"]], "a": "decyl oleate decyl oleat 3687-46-5 Decyl Oleate Ceraphyl 140 decyl 9-octadecenoate decyl octadec-9-enote decylis oleas decyloleat DUBCARE OD Kollicream DO oleic acid, decyl ester Tegosoft DO. 2"}, {"id": "denatonium-benzoate", "n": "Denatonium Benzoate", "nv": "Denatonium Benzoate", "g": ["Chất làm biến tính cồn", "Chất tạo hương"], "ge": ["Alcohol denaturant", "Flavoring agent"], "cas": "3734-33-6, 86398-53-0", "f": [["Là một trong những chất đắng nhất được biết (phát hiện ở nồng độ ~10 ppb); thêm vào một số sản phẩm để răn đe nuốt nhầm, thường ở mức 5–500 ppm; cũng dùng thay brucin/quassin làm chất biến tính ethanol.", "1, tr.296"]], "fe": [["One of the most bitter substances known (detected at concentrations of ~10 ppb); added to some products to deter accidental ingestion, typically at levels of 5–500 ppm; Also used instead of brucine/quassin as ethanol denaturant.", "1, tr.296"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.296"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.296"]], "d": [["Bột hoặc hạt kết tinh màu trắng, không mùi, vị cực đắng.", "1, tr.296"]], "de": [["White crystalline powder or granules, odorless, extremely bitter taste.", "1, tr.296"]], "a": "denatonium benzoate denatonium benzoat bitrex 3734-33-6 Denatonium Benzoate Bitrex Bitterguard denatonii benzoas lignocaine benzyl benzoate"}, {"id": "dextran", "n": "Dextran", "nv": "Dextran 1; Dextran 40; Dextran 70", "g": ["Tá dược hỗ trợ đông khô"], "ge": ["Lyophilization bulking agent"], "cas": "9004-54-0", "f": [["Dùng làm chất độn đông khô và chất bảo vệ đông khô trong chế phẩm protein đông khô; được đánh giá làm tá dược dính cho viên giải phóng ngay và tá dược viên giải phóng kiểm soát; cũng dùng làm chất bám dính niêm mạc kéo dài thời gian lưu ở khoang mũi.", "1, tr.298"]], "fe": [["Used as a freeze-dried filler and freeze-dried protectant in freeze-dried protein preparations; evaluated as a binding excipient for immediate-release tablets and controlled-release excipients; Also used as a mucoadhesive agent to prolong residence time in the nasal cavity.", "1, tr.298"]], "t": [["Tài liệu chưa đề cập.", "1, tr.298"]], "te": [["Documents not mentioned.", "1, tr.298"]], "d": [["Bột vô định hình màu trắng/gần trắng, hút ẩm.", "1, tr.298"], ["Dễ tan trong nước (>50% kl/tt); tan trong formamid, ethylen glycol, glycerol; không tan trong methanol, ethanol, aceton.", "1, tr.298"]], "de": [["White/almost white, amorphous powder, hygroscopic.", "1, tr.298"], ["Easily soluble in water (>50% w/w); soluble in formamide, ethylene glycol, glycerol; Insoluble in methanol, ethanol, acetone.", "1, tr.298"]], "a": "dextran 9004-54-0 Dextran 1 for Injection Dextran 40 Dextran 1 Glucose polymer dextrans Dextran 70"}, {"id": "dextrates", "n": "Dextrates", "nv": "Dextrates", "g": ["Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)"], "ge": ["Tablet / capsule binder", "Tablet / capsule diluent"], "cas": "39404-33-6", "f": [["Là tá dược độn dập thẳng dùng cho viên nhai, không nhai, viên tan, viên phân tán và viên sủi; trơn chảy tốt nên không cần chất điều hòa trơn chảy; nên bôi trơn bằng magnesi stearat 0,5–1,0%; có thể làm tá dược dính khi thêm nước.", "1, tr.302"]], "fe": [["As a linear filler excipient used for chewable, non-chewable, dissolving tablets, dispersible tablets and effervescent tablets; Good flow so no need for flow conditioner; should be lubricated with magnesium stearate 0.5–1.0%; May cause excipients to stick when water is added.", "1, tr.302"]], "t": [["Ở nhiệt độ và độ ẩm cao có thể phản ứng Maillard với chất chứa amin bậc 1; tương kỵ với chất oxy hóa.", "1, tr.302"]], "te": [["At high temperatures and humidity, Maillard reactions can occur with substances containing primary amines; Incompatible with oxidizing agents.", "1, tr.302"]], "d": [["Hỗn hợp saccharid tinh khiết từ thủy phân enzym có kiểm soát tinh bột; dạng cầu xốp phun-kết tinh, trơn chảy, màu trắng, không mùi, vị ngọt (bằng ~½ sucrose); chứa dextrose cùng 3–5% maltose và polysaccharid cao hơn.", "1, tr.302"], ["Tan 1 trong 1 phần nước; không tan trong ethanol 95%, propan-2-ol.", "1, tr.302"]], "de": [["Pure saccharide mixture from controlled enzymatic hydrolysis of starch; spray-crystallized, smooth, white, odorless, sweet taste (equal to ~½ sucrose); contains dextrose with 3–5% maltose and higher polysaccharides.", "1, tr.302"], ["Dissolve 1 part in 1 part water; Insoluble in 95% ethanol, propan-2-ol.", "1, tr.302"]], "a": "dextrates dextrat emdex Dextrates Candex dextratos Emdex"}, {"id": "dextrin", "n": "Dextrin", "nv": "Dextrin", "g": ["Chất vi nang hóa", "Chất làm tăng độ đặc", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Microencapsulating agent", "Stiffening agent", "Suspending agent", "Tablet / capsule binder", "Tablet / capsule diluent", "Viscosity-increasing agent"], "cas": "9004-53-9", "f": [["Dùng làm chất kết dính và làm cứng cho băng phẫu thuật; tá dược độn viên nén/nang; tá dược dính khi xát hạt; thành phần bao đường (chất hóa dẻo và kết dính); chất làm đặc cho hỗn dịch.", "1, tr.304"]], "fe": [["Used as an adhesive and stiffener for surgical tape; excipients for filling tablets/capsules; Excipients stick when grinding seeds; sugar coating ingredients (plasticizers and binders); thickener for suspensions.", "1, tr.304"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.304"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.304"]], "d": [["Tinh bột ngô/khoai tây/sắn thủy phân một phần; bột màu trắng, vàng nhạt hoặc nâu, mùi nhẹ đặc trưng.", "1, tr.304"], ["Thực tế không tan trong cloroform, ethanol 95%, ether; tan chậm trong nước lạnh; rất dễ tan trong nước sôi tạo dung dịch nhầy.", "1, tr.304"]], "de": [["Partially hydrolyzed corn/potato/cassava starch; White, light yellow or brown powder, characteristic mild odor.", "1, tr.304"], ["Practically insoluble in chloroform, 95% ethanol, ether; dissolves slowly in cold water; Very soluble in boiling water to form a mucus solution.", "1, tr.304"]], "a": "dextrin 9004-53-9 Dextrin Avedex British gum Caloreen canary dextrin C*Pharm Crystal Gum dextrinum dextrinum album p-limit dextrin Primogran W starch gum yellow dextrin white dextrin"}, {"id": "dextrose", "n": "Dextrose", "nv": "Glucose Monohydrate; Dextrose", "g": ["Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Chất điều chỉnh đẳng trương", "Chất tạo ngọt"], "ge": ["Tablet / capsule binder", "Tablet / capsule diluent", "Tonicity agent", "Sweetening agent"], "cas": "5996-10-1", "f": [["Dùng rộng rãi trong dung dịch để điều chỉnh đẳng trương và làm chất tạo ngọt; làm tá dược độn/dính khi xát hạt ướt và dập thẳng, chủ yếu trong viên nhai. So với lactose, viên từ dextrose monohydrat cần bôi trơn nhiều hơn, ít vỡ vụn hơn nhưng có xu hướng cứng lại.", "1, tr.307"]], "fe": [["Widely used in solutions to adjust isotonicity and as a sweetener; as a filler/gluing excipient when wet granules are rubbed and crushed, mainly in chewable tablets. Compared to lactose, tablets from dextrose monohydrate require more lubrication, crumble less but tend to harden.", "1, tr.307"]], "t": [["Dung dịch dextrose tương kỵ với nhiều thuốc (cyanocobalamin, kanamycin sulfat, novobiocin natri, warfarin natri); là đường khử, phản ứng Maillard với amin, amid, amino acid, peptid, protein; đổi màu nâu và phân hủy với kiềm mạnh.", "1, tr.307"]], "te": [["Dextrose solution is incompatible with many drugs (cyanocobalamin, kanamycin sulfate, novobiocin sodium, warfarin sodium); is a reducing sugar, Maillard reaction with amines, amides, amino acids, peptides, proteins; discolors brown and decomposes with strong alkalis.", "1, tr.307"]], "d": [["Tinh thể không màu hoặc bột kết tinh/hạt màu trắng, không mùi, vị ngọt.", "1, tr.307"]], "de": [["Colorless crystals or white crystalline powder/granules, odorless, sweet taste.", "1, tr.307"]], "a": "dextrose dextrose monohydrate glucose monohydrate d-glucose 5996-10-1 Glucose Monohydrate Dextrose Blood sugar Caridex Cerelose 2001 C*PharmDex Dextrofin D(+)-glucose monohydrate glucosum monohydricum grape sugar Lycadex PF Meritose starch sugar"}, {"id": "dextrose-anhydrous", "n": "Dextrose Anhydrous", "nv": "Glucose; Dextrose", "g": ["Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Chất điều chỉnh đẳng trương", "Chất tạo ngọt"], "ge": ["Tablet / capsule binder", "Tablet / capsule diluent", "Tonicity agent", "Sweetening agent"], "cas": "5996-10-1", "f": [["Dùng làm tá dược dính và độn trong dập thẳng và xát hạt ướt; dùng trong dung dịch điều chỉnh đẳng trương và làm chất tạo ngọt (độ ngọt ~70% sucrose). Hàm ẩm ảnh hưởng đến tính nén.", "1, tr.310"]], "fe": [["Used as adhesive and filler excipient in straight stamping and wet granulation; used in isotonic solutions and as a sweetener (sweetness ~70% sucrose). Moisture content affects compressibility.", "1, tr.310"]], "t": [["Tương kỵ với chất oxy hóa mạnh; là đường khử nên phản ứng Maillard với thuốc chứa amin bậc 1 và bậc 2.", "1, tr.310"]], "te": [["Incompatible with strong oxidizing agents; is a reducing sugar, so the Maillard reaction with drugs containing primary and secondary amines.", "1, tr.310"]], "d": [["Tinh thể không màu hoặc bột kết tinh/hạt màu trắng, không mùi, vị ngọt.", "1, tr.310"]], "de": [["Colorless crystals or white crystalline powder/granules, odorless, sweet taste.", "1, tr.310"]], "a": "dextrose anhydrous dextrose khan anhydrous glucose 50-99-7 Glucose G1 ucose Dextrose Anhydrous dextrose Cerelose 2401 corn sugar dextrosol dextrosum anhydricum D-glucose"}, {"id": "dibutyl-phthalate", "n": "Dibutyl Phthalate", "nv": "Dibutyl Phthalate", "g": ["Chất hóa dẻo", "Dung môi"], "ge": ["Plasticizer", "Solvent"], "cas": "84-74-2", "f": [["Dùng làm chất hóa dẻo trong màng bao phim; được đánh giá làm chất tạo lỗ trong hệ đưa thuốc mới và chất hóa dẻo cho que cấy mắt, hệ dẫn thuốc qua da; cũng dùng nhiều làm dung môi trong mỹ phẩm.", "1, tr.312"]], "fe": [["Used as a plasticizer in film coating; evaluated as a pore-forming agent in new drug delivery systems and a plasticizer for eye implants and transdermal drug delivery systems; Also widely used as a solvent in cosmetics.", "1, tr.312"]], "t": [["Phản ứng mãnh liệt với clor; phản ứng với chất oxy hóa, acid, base và nitrat.", "1, tr.312"]], "te": [["Violent reaction with chlorine; Reacts with oxidants, acids, bases and nitrates.", "1, tr.312"]], "d": [["Chất lỏng dạng dầu, nhớt, không màu hoặc vàng rất nhạt, không mùi.", "1, tr.312"], ["Rất dễ tan trong aceton, benzen, ethanol 95% và ether; tan 1 trong 2500 phần nước.", "1, tr.312"]], "de": [["Oily, viscous, colorless or very pale yellow liquid, odorless.", "1, tr.312"], ["Very soluble in acetone, benzene, 95% ethanol and ether; Dissolves 1 in 2500 parts of water.", "1, tr.312"]], "a": "dibutyl phthalate dibutyl phthalat dbp 84-74-2 Dibutyl Phthalate Araldite S02 benzenedicarboxylic acid, dibutyl ester benzene-odicarboxylic acid di-w-butyl ester butyl phthalate Celluflex DBP DBP dibutyl 1,2-benzenedicarboxylate dibutyl benzene 1,2dicarboxylate dibutyl ester of 1,2-benzenedicarboxylic acid dibutylis phthalas dibutyl-o-phthalate di-w-butyl phthalate East man DBP Elaol Ergoplast FDB Genoplast B Hatcol DBP Hexap last M/B Kodaflex DBP Monocizer DBP Palatinol C phthalic acid dibutyl ester Polycizer DBP PX 104 RC Plasticizer DBP Staflex DBP Unimoll DB Vestimol C Witcizer 300"}, {"id": "dibutyl-sebacate", "n": "Dibutyl Sebacate", "nv": "Dibutyl Sebacate", "g": ["Chất hóa dẻo"], "ge": ["Plasticizer"], "cas": "109-43-3", "f": [["Dùng trong chế phẩm uống làm chất hóa dẻo cho màng bao viên nén, hạt và cốm ở nồng độ 10–30% khối lượng polymer; cũng dùng làm chất hóa dẻo trong viên giải phóng kiểm soát và vi nang, và trong lớp dính của miếng dán qua da/niêm mạc miệng.", "1, tr.314"]], "fe": [["Used in oral preparations as a plasticizer for coatings of tablets, granules and granules at a concentration of 10–30% of polymer mass; also used as a plasticizer in controlled-release tablets and microcapsules, and in the adhesive layer of transdermal/oral mucosa patches.", "1, tr.314"]], "t": [["Tương kỵ với chất oxy hóa mạnh và kiềm mạnh.", "1, tr.314"]], "te": [["Incompatible with strong oxidizers and strong alkalis.", "1, tr.314"]], "d": [["Chất lỏng dạng dầu, trong, không màu, mùi butyl nhẹ.", "1, tr.314"], ["Tan trong ethanol 95%, ether, isopropanol, dầu khoáng và toluen; thực tế không tan trong nước.", "1, tr.314"]], "de": [["Oily liquid, clear, colorless, mild butyl odor.", "1, tr.314"], ["Soluble in 95% ethanol, ether, isopropanol, mineral oil and toluene; practically insoluble in water.", "1, tr.314"]], "a": "dibutyl sebacate dibutyl sebacat dbs 109-43-3 Dibutyl Sebacate Bis(w-butyl)sebacate butyl sebacate DBS decanedioic acid, dibutyl ester dibutyl decanedioate dibutyl 1,8-octanedicarboxylate Kodaflex DBS Morflex DBS Proviplast 1944 sebacic acid dibutyl ester"}, {"id": "diethanolamine", "n": "Diethanolamine", "nv": "Diethanolamin (DEA)", "g": ["Chất kiềm hóa", "Chất nhũ hóa"], "ge": ["Alkalizing agent", "Emulsifying agent"], "cas": "111-42-2", "f": [["Dùng trong chế phẩm dùng ngoài và tiêm làm chất kiềm hóa (điều chỉnh pH) và nhũ hóa; dùng tới 1,5% kl/tt trong dịch truyền tĩnh mạch.", "1, tr.316"]], "fe": [["Used in topical and injectable preparations as an alkalizing (pH adjusting) and emulsifying agent; Use up to 1.5% w/w in intravenous fluids.", "1, tr.316"]], "t": [["Là amin bậc hai có nhóm hydroxy nên phản ứng đặc trưng của amin và alcol; phản ứng với acid, anhydrid acid, clorid acid và ester tạo amid; với propylen carbonat hoặc carbonat vòng tạo carbonat tương ứng; phản ứng với đồng.", "1, tr.316"]], "te": [["It is a secondary amine with a hydroxy group, so the reaction is typical of an amine and an alcohol; reacts with acids, acid anhydrides, acid chlorides and esters to form amides; with propylene carbonate or carbonate-forming cyclic carbonate, respectively; reacts with copper.", "1, tr.316"]], "d": [["Là amin bậc hai chứa hai nhóm hydroxy (dẫn chất ethanolamin).", "1, tr.316"], ["Hút ẩm, nhạy với ánh sáng và oxy nên cần bảo quản trong bao bì kín, tránh ánh sáng, nơi khô mát.", "1, tr.316"]], "de": [["A secondary amine containing two hydroxy groups (ethanolamine derivative).", "1, tr.316"], ["Hygroscopic, sensitive to light and oxygen, so it needs to be stored in sealed packaging, away from light, in a cool, dry place.", "1, tr.316"]], "a": "diethanolamine dea diethanolamin 2,2'-iminodiethanol 111-42-2"}, {"id": "diethyl-phthalate", "n": "Diethyl Phthalate", "nv": "Diethyl Phthalate", "g": ["Chất hóa dẻo", "Dung môi"], "ge": ["Plasticizer", "Solvent"], "cas": "84-66-2", "f": [["Dùng làm chất hóa dẻo cho màng bao viên nén, hạt và cốm ở nồng độ 10–30% khối lượng polymer.", "1, tr.318"]], "fe": [["Used as a plasticizer for coating tablets, granules and granules at a concentration of 10–30% of polymer mass.", "1, tr.318"]], "t": [["Tương kỵ với chất oxy hóa mạnh, acid và permanganat.", "1, tr.318"]], "te": [["Incompatible with strong oxidizers, acids and permanganates.", "1, tr.318"]], "d": [["Chất lỏng dạng dầu, trong, không màu; gần như không mùi hoặc mùi thơm rất nhẹ, vị đắng khó chịu.", "1, tr.318"], ["Trộn lẫn với ethanol 95%, ether và nhiều dung môi hữu cơ; thực tế không tan trong nước.", "1, tr.318"]], "de": [["Clear, colorless, oily liquid; Almost odorless or very light aroma, unpleasant bitter taste.", "1, tr.318"], ["Miscible with 95% ethanol, ether and many organic solvents; practically insoluble in water.", "1, tr.318"]], "a": "diethyl phthalate diethyl phthalat dep 84-66-2 Diethyl Phthalate DEP diethyl benzene-l,2-dicarboxylate diethylis phthalas East man DEP ethyl benzene-l,2-dicarboxylate ethyl phthalate Kodaflex DEP Neantine Palatinol A phthalic acid diethyl ester"}, {"id": "diethyl-sebacate", "n": "Diethyl Sebacate", "nv": "Diethyl Sebacate", "g": ["Chất làm mềm da", "Chất tăng thấm"], "ge": ["Emollient", "Permeation enhancer"], "cas": "110-40-7", "f": [["Dùng làm chất làm mềm trong kem, nhũ tương và dung dịch dùng ngoài; giúp tăng thấm qua da của nhiều thuốc chống viêm, kháng nấm và gây tê tại chỗ ở nồng độ tới 24%; cũng dùng làm chất tạo hương trong thực phẩm.", "1, tr.320"]], "fe": [["Used as an emollient in creams, emulsions and topical solutions; Helps increase skin permeability of many anti-inflammatory, antifungal and local anesthetic drugs at concentrations up to 24%; Also used as a flavoring agent in foods.", "1, tr.320"]], "t": [["Tương kỵ với chất oxy hóa và kiềm.", "1, tr.320"]], "te": [["Incompatible with oxidizing agents and alkalis.", "1, tr.320"]], "d": [["Chất lỏng không màu hoặc vàng nhạt, mùi trái cây đặc trưng.", "1, tr.320"]], "de": [["Colorless or light yellow liquid, characteristic fruity odor.", "1, tr.320"]], "a": "diethyl sebacate diethyl sebacat 110-40-7 Diethyl Sebacate Bisoflex DES decanedioic acid, diethyl ester DES diethyl 1,10decanedioate diethyl 1,8-octanedicarboxylate ethyl sebacate DES-SP sebacic acid, diethyl ester Stelliesters DES"}, {"id": "diethylene-glycol-monoethyl-ether", "n": "Diethylene Glycol Monoethyl Ether", "nv": "Diethylene Glycol Monoethyl Ether", "g": ["Chất làm tăng độ tan", "Dung môi"], "ge": ["Solubilizing agent", "Solvent"], "cas": "111-90-0", "f": [["Là chất tăng độ tan có tính tương hợp hóa học rộng, dùng trong chế phẩm uống, dùng ngoài và tiêm; làm đồng dung môi trong hệ uống để tăng độ tan (mức dùng giới hạn 10%); cũng giúp tăng thấm qua da trong kem, lotion, vi nhũ tương và gel nước.", "1, tr.321"]], "fe": [["It is a solubility enhancer with wide chemical compatibility, used in oral, topical and injection preparations; as a co-solvent in the oral system to increase solubility (use limit 10%); also helps increase skin permeability in creams, lotions, microemulsions and water gels.", "1, tr.321"]], "t": [["Tài liệu chưa đề cập.", "1, tr.321"]], "te": [["Documents not mentioned.", "1, tr.321"]], "d": [["Chất lỏng trong, không màu, hút ẩm, mùi nhẹ.", "1, tr.321"], ["Tan trong nước; trộn lẫn với aceton, benzen, cloroform, ethanol 95%, ether và pyridin; không tan trong dầu khoáng.", "1, tr.321"]], "de": [["Clear, colorless liquid, hygroscopic, mild odor.", "1, tr.321"], ["Soluble in water; Mixable with acetone, benzene, chloroform, 95% ethanol, ether and pyridine; Insoluble in mineral oil.", "1, tr.321"]], "a": "diethylene glycol monoethyl ether transcutol carbitol 2-(2-ethoxyethoxy)ethanol 111-90-0 Diethylene Glycol Monoethyl Ether Carbitol DEGEE DGME diethylenglycoli aether monoethilicus 3,6-dioxa-l-octanol ethoxydiglycol ethyl carbitol ethyl digol ethyl dioxitol I-hydroxy-3,6-dioxaoctane Transcutol HP Transcutol p"}, {"id": "difluoroethane-hfc", "n": "Difluoroethane (HFC)", "nv": "Difluoroethan (HFC)", "g": ["Chất đẩy aerosol"], "ge": ["Aerosol propellant"], "cas": "75-37-6", "f": [["Là khí đẩy hydrofluorocarbon (HFC) có thể dùng trong chế phẩm dùng ngoài; không chứa clor nên không phá hủy tầng ozon; tuy nhiên ứng dụng trong aerosol dược phẩm còn hạn chế.", "1, tr.323"]], "fe": [["Is a hydrofluorocarbon (HFC) propellant that can be used in topical preparations; Does not contain chlorine so does not destroy the ozone layer; However, application in pharmaceutical aerosols is limited.", "1, tr.323"]], "t": [["Tương kỵ với kim loại kiềm, kiềm thổ, kim loại dạng bột và chất oxy hóa; tương hợp với thành phần thông thường trong aerosol dược phẩm.", "1, tr.323"]], "te": [["Incompatible with alkali metals, alkaline earth metals, powdered metals and oxidizing agents; Compatible with common ingredients in pharmaceutical aerosols.", "1, tr.323"]], "d": [["Khí hóa lỏng; lỏng không màu, mùi ngọt nhẹ; không ăn mòn, không kích ứng.", "1, tr.323"], ["Tan 1 trong 357 phần nước ở 25 °C.", "1, tr.323"]], "de": [["Liquefied petroleum gas; Colorless liquid, mild sweet odor; Non-corrosive, non-irritating.", "1, tr.323"], ["Dissolves 1 in 357 parts of water at 25 °C.", "1, tr.323"]], "a": "difluoroethane hfc hfc-152a 75-37-6 Dymel 152a ethylene fluoride Freon 152aGenetron 152a halocarbon 152a HFC 152a propellant 152a R-152a refrigerant 152a"}, {"id": "dimethicone", "n": "Dimethicone", "nv": "Dimeticone", "g": ["Chất chống tạo bọt", "Chất làm mềm da", "Chất chống thấm nước"], "ge": ["Antifoaming agent", "Emollient", "Water-repelling agent"], "cas": "9006-65-9", "f": [["Dùng rộng rãi trong mỹ phẩm và dược phẩm. Trong nhũ tương dầu/nước dùng ngoài, thêm vào pha dầu làm chất chống tạo bọt.", "1, tr.325"], ["Kỵ nước nên dùng nhiều trong chế phẩm tạo màng chắn dùng ngoài. Nồng độ tham khảo: kem/lotion/thuốc mỡ 10,0–30,0%; nhũ tương dầu/nước 0,5–5,0%.", "1, tr.325"]], "fe": [["Widely used in cosmetics and pharmaceuticals. In topical oil/water emulsions, add the oil phase as an antifoaming agent.", "1, tr.325"], ["Being hydrophobic, it is widely used in preparations to create barrier films for external use. Reference concentration: cream/lotion/ointment 10.0–30.0%; 0.5–5.0% oil/water emulsion.", "1, tr.325"]], "t": [["Tài liệu chưa đề cập.", "1, tr.325"]], "te": [["Documents not mentioned.", "1, tr.325"]], "d": [["Chất lỏng trong, không màu, có nhiều độ nhớt khác nhau.", "1, tr.325"], ["Trộn lẫn với ethyl acetat, methyl ethyl ceton, dầu khoáng, ether, cloroform và toluen; rất ít tan trong ethanol 95%; thực tế không tan trong glycerin, propylen glycol và nước.", "1, tr.325"]], "de": [["Clear, colorless liquid with various viscosities.", "1, tr.325"], ["Miscible with ethyl acetate, methyl ethyl ketone, mineral oil, ether, chloroform and toluene; very slightly soluble in 95% ethanol; Practically insoluble in glycerin, propylene glycol and water.", "1, tr.325"]], "a": "dimethicone dimethicon dimeticone polydimethylsiloxane pdms 9006-65-9 Dimeticone Dimethicone ABIL dimethylpolysiloxane dimethylsilicone fluid dimethylsilox ane dimeticonum Dow Corning Q7-9120 E900 methyl poly siloxane PDMS poly(dimethylsiloxane) Sentry Dimethicone Xiameter"}, {"id": "dimethyl-ether", "n": "Dimethyl Ether", "nv": "Dimethyl ether", "g": ["Chất đẩy aerosol", "Dung môi"], "ge": ["Aerosol propellant", "Solvent"], "cas": "115-10-6", "f": [["Dùng làm khí đẩy cho aerosol dùng ngoài (vd. tẩy mụn cóc), thường phối hợp với hydrocarbon và propellant khác vì áp suất hơi cao; là dung môi tốt với đặc tính tan cao trong nước.", "1, tr.327"]], "fe": [["Used as a propellant for topical aerosols (e.g., wart removal), often combined with other hydrocarbons and propellant because of its high vapor pressure; is a good solvent with high solubility in water.", "1, tr.327"]], "t": [["Tương kỵ với chất oxy hóa mạnh và acid mạnh; là dung môi mạnh, có thể ảnh hưởng vật liệu gioăng trong bao bì aerosol.", "1, tr.327"]], "te": [["Incompatible with strong oxidizers and strong acids; is a strong solvent that can affect gasket materials in aerosol packaging.", "1, tr.327"]], "d": [["Khí hóa lỏng; lỏng gần như không mùi, không màu; khí nồng độ cao có mùi ether nhẹ.", "1, tr.327"], ["Tan trong aceton, cloroform, ethanol 95%, ether và 1 trong 3 phần nước (tính tan trong nước cao đặc biệt).", "1, tr.327"]], "de": [["Liquefied petroleum gas; Almost odorless, colorless liquid; High concentration gas has a slight ether odor.", "1, tr.327"], ["Soluble in acetone, chloroform, 95% ethanol, ether and 1 in 3 parts of water (exceptionally high water solubility).", "1, tr.327"]], "a": "dimethyl ether dme methoxymethane 115-10-6 Demeon D dimethyl oxide DME Dymel Â methyl ether oxybismethane wood ether"}, {"id": "dimethyl-phthalate", "n": "Dimethyl Phthalate", "nv": "Dimethyl phthalat", "g": ["Chất hóa dẻo", "Dung môi"], "ge": ["Plasticizer", "Solvent"], "cas": "131-11-3", "f": [["Dùng làm dung môi và chất hóa dẻo cho màng bao phim (hypromellose, cellulose acetat và hỗn hợp cellulose acetat butyrat).", "1, tr.329"]], "fe": [["Used as a solvent and plasticizer for film coatings (hypromellose, cellulose acetate and cellulose acetate butyrate mixture).", "1, tr.329"]], "t": [["Tương kỵ với acid hoặc base mạnh, nitrat và chất oxy hóa mạnh; như các phthalat khác, cần tránh tiếp xúc chất dẻo.", "1, tr.329"]], "te": [["Incompatible with strong acids or bases, nitrates and strong oxidizers; Like other phthalates, contact with plastics should be avoided.", "1, tr.329"]], "d": [["Chất lỏng dạng dầu, nhớt, không màu hoặc màu rất nhạt, không mùi.", "1, tr.329"], ["Trộn lẫn với benzen, cloroform, ethanol 95%, ether; tan 1 trong 250 phần nước.", "1, tr.329"]], "de": [["Oily, viscous, colorless or very light colored liquid, odorless.", "1, tr.329"], ["Miscible with benzene, chloroform, 95% ethanol, ether; Dissolve 1 in 250 parts water.", "1, tr.329"]], "a": "dimethyl phthalate dimethyl phthalat dmp 131-11-3 Avolin-, 1,2-benzenedicarboxylate, dimethyl ester benzenedicar boxylic acid dimethyl ester dimethyl 1,2-benzenedicarboxylate dimethyl benzene-o-dicarboxylate dimethyl benzeneorthodicar boxylate dimethyl o-phthalate o-dimethyl phthalate DMP Easttnan DMP Eermine-, Kodaflex DMP methyl benzene-1,2dicarboxylate Mipax Palatinol M phthalic acid dimethyl ester phthalic acid methyl ester Repeftal Solvanom Soluarone Unimoll DM"}, {"id": "dimethyl-sulfoxide", "n": "Dimethyl Sulfoxide", "nv": "Dimethyl Sulfoxide", "g": ["Chất tăng thấm", "Dung môi"], "ge": ["Permeation enhancer", "Solvent"], "cas": "67-68-5", "f": [["Là dung môi đặc biệt tốt cho cả chất hữu cơ và vô cơ; tăng thấm thuốc qua da nhờ khả năng thay thế nước liên kết ở lớp sừng, kèm chiết lipid và thay đổi cấu hình protein.", "1, tr.331"]], "fe": [["It is a particularly good solvent for both organic and inorganic substances; Increases drug absorption through the skin thanks to the ability to replace bound water in the stratum corneum, along with lipid extraction and changes in protein configuration.", "1, tr.331"]], "t": [["Có thể phản ứng với chất oxy hóa.", "1, tr.331"]], "te": [["May react with oxidizing agents.", "1, tr.331"]], "d": [["Chất lỏng phân cực mạnh, aprotic.", "1, tr.331"], ["Trộn lẫn với nước (tỏa nhiệt), ethanol 95%, ether và đa số dung môi hữu cơ; không trộn lẫn với paraffin, hydrocarbon.", "1, tr.331"]], "de": [["Strongly polar, aprotic liquid.", "1, tr.331"], ["Miscible with water (exothermic), 95% ethanol, ether and most organic solvents; Do not mix with paraffin or hydrocarbons.", "1, tr.331"]], "a": "dimethyl sulfoxide dmso dimethyl sulfoxid 67-68-5 Deltan dimexide dimethylis sulfoxidum dimethyl sulphoxide DMSO Kemsol methylsulfinylmethane methyl sulfoxide ProczRimso-50 Dimethyl Sulfoxide"}, {"id": "dimethyl-beta-cyclodextrin", "n": "Dimethyl-β-cyclodextrin", "nv": "Dimethyl-β-cyclodextrin", "g": ["Chất tạo phức", "Tá dược phóng thích biến đổi", "Chất vi nang hóa", "Chất làm tăng độ tan", "Chất điều chỉnh đẳng trương"], "ge": ["Chelating / Complexing agent", "Modified-release agent", "Microencapsulating agent", "Solubilizing agent", "Tonicity agent"], "cas": "51166-71-3", "f": [["Dùng để cải thiện hòa tan, độ tan, sinh khả dụng và độ ổn định của thuốc kém tan qua tạo phức bao, trong chế phẩm uống, dùng ngoài, nhỏ mắt, trực tràng, mũi và phổi; tan trong nước tốt hơn β-cyclodextrin không thế.", "1, tr.336"]], "fe": [["Used to improve solubility, solubility, bioavailability and stability of poorly soluble drugs through complexation, in oral, topical, ocular, rectal, nasal and lung preparations; Soluble in water better than unsubstituted β-cyclodextrin.", "1, tr.336"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.336"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.336"]], "d": [["Dẫn chất β-cyclodextrin methyl hóa, không ion; bột kết tinh màu trắng hoặc gần trắng.", "1, tr.336"], ["Tan 1 trong 135 phần ethanol 95% và 1 trong 1,75 phần nước ở 25 °C; tan trong nước cao hơn β-cyclodextrin không thế; độ tan trong nước giảm khi nhiệt độ tăng.", "1, tr.336"]], "de": [["Methylated, non-ionic β-cyclodextrin derivative; White or almost white crystalline powder.", "1, tr.336"], ["Soluble in 1 in 135 parts of 95% ethanol and 1 in 1.75 parts of water at 25 °C; Higher water solubility than unsubstituted β-cyclodextrin; Water solubility decreases as temperature increases.", "1, tr.336"]], "a": "dimethyl-beta-cyclodextrin dimethyl-p-cyclodextrin dm-beta-cd heptakis dimethyl beta cyclodextrin 51166-71-3 dimeb 2,6-di-O-methyl-P-cyclodextrin 2,6-dimethyl-P-cyclodextrin DM-P'CD hepta-(2,6-di-oxy-methyl)-P-cyclodextrin heptakis(2,6-di-O-methyl)-p-cyclodextrin heptakis(2,6-di-Omethyl)cyclomaltoheptaose tetradeca-Omethyl-P-cyclodextrin"}, {"id": "dimethylacetamide", "n": "Dimethylacetamide", "nv": "Dimethylacetamide", "g": ["Dung môi"], "ge": ["Solvent"], "cas": "127-19-5", "f": [["Dùng làm dung môi trong chế phẩm uống và tiêm; làm đồng dung môi hòa tan thuốc kém tan; được nghiên cứu làm tá dược cho tiêm peptid nhỏ và ảnh hưởng kích thước/tốc độ giải phóng thuốc từ tiểu phân nano.", "1, tr.334"]], "fe": [["Used as a solvent in oral and injectable preparations; make a co-solvent to dissolve poorly soluble drugs; studied as an excipient for small peptide injections and affects the size/rate of drug release from nanoparticles.", "1, tr.334"]], "t": [["Tương kỵ với carbon tetraclorid, chất oxy hóa, hợp chất halogen hóa và sắt; ăn mòn chất dẻo và cao su; tiếp xúc chất oxy hóa mạnh có thể gây cháy.", "1, tr.334"]], "te": [["Incompatible with carbon tetrachloride, oxidizing agents, halogenated compounds and iron; corrodes plastics and rubber; Contact with strong oxidizers may cause fire.", "1, tr.334"]], "d": [["Chất lỏng trong, không màu, hơi hút ẩm, mùi amoniac/tanh nhẹ.", "1, tr.334"], ["Trộn lẫn với ethanol 95%, nước và đa số dung môi hữu cơ thông thường.", "1, tr.334"]], "de": [["Clear, colorless liquid, slightly hygroscopic, mild ammonia/fishy odor.", "1, tr.334"], ["Miscible with 95% ethanol, water and most common organic solvents.", "1, tr.334"]], "a": "dimethylacetamide dma n,n-dimethylacetamide 127-19-5 Dimethylacetamide Acetdimethylamide acetic acid dimethylamide acetyldimethyla mine dimethylacetamidum dimethylacetone amide dimethyla mide acetate DMA"}, {"id": "dipropylene-glycol", "n": "Dipropylene Glycol", "nv": "Dipropylen glycol", "g": ["Dung môi", "Thành phần hệ trị liệu qua da"], "ge": ["Solvent", "Transdermal delivery component"], "cas": "25265-71-8", "f": [["Dùng làm thành phần lớp dính trong miếng dán niêm mạc miệng và qua da giải phóng kiểm soát; cũng dùng trong mỹ phẩm (chế phẩm làm sạch da, lăn khử mùi, son, nước hoa).", "1, tr.338"]], "fe": [["Used as an adhesive layer component in controlled-release oral and transdermal patches; Also used in cosmetics (skin cleansing products, deodorant, lipstick, perfume).", "1, tr.338"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.338"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.338"]], "d": [["Chất lỏng không màu, gần như không mùi.", "1, tr.338"], ["Trộn lẫn với nước, dầu và hydrocarbon.", "1, tr.338"]], "de": [["Colorless, almost odorless liquid.", "1, tr.338"], ["Miscible with water, oils and hydrocarbons.", "1, tr.338"]], "a": "dipropylene glycol dipropylen glycol 25265-71-8 2,2'-dihydroxydipropyl ether 4-oxaheptane-2,6-diol l,l'-dimethyldiethylene glycol 1,1'oxydi-2-propanol l,l'-oxydi-2-propanol 2-propanol, 1,1'oxybis(b) 1,2-Dipropylene glycol 2,2'-oxydipropanol DPG methyl-2(methyl2)oxybispropanol 4-oxa-2,6-heptandiol oxydipropanol propanol, oxybis"}, {"id": "docusate-sodium", "n": "Docusate Sodium", "nv": "Docusate Sodium", "g": ["Chất diện hoạt anion"], "ge": ["Anionic surfactant"], "cas": "577-11-7", "f": [["Dùng rộng rãi làm chất diện hoạt anion; chủ yếu trong viên nang, viên nén, chế phẩm lỏng và siro, và trong viên dập thẳng để hỗ trợ thấm ướt và hòa tan.", "1, tr.340"], ["Nồng độ tham khảo: chất diện hoạt (thấm ướt/phân tán/nhũ hóa) 0,01–1,0%; tiêm bắp 0,015%; tá dược rã ≤0,5%.", "1, tr.340"]], "fe": [["Widely used as an anionic surfactant; primarily in capsules, tablets, liquid preparations and syrups, and in straight tablets to aid wetting and dissolution.", "1, tr.340"], ["Reference concentration: surfactant (wetting/dispersing/emulsifying) 0.01–1.0%; intramuscular injection 0.015%; excipient disintegration ≤0.5%.", "1, tr.340"]], "t": [["Thêm chất điện giải (như NaCl 3%) vào dung dịch nước có thể gây đục; tương kỵ với acid ở pH <1 và kiềm ở pH >10.", "1, tr.340"]], "te": [["Adding electrolytes (such as 3% NaCl) to an aqueous solution may cause cloudiness; Incompatible with acids at pH < 1 and alkalis at pH > 10.", "1, tr.340"]], "d": [["Chất rắn dẻo như sáp màu trắng/gần trắng, vị đắng, mùi giống octanol; hút ẩm, thường ở dạng viên, mảnh hoặc cuộn mỏng.", "1, tr.340"]], "de": [["White/near white waxy solid, bitter taste, octanol-like odor; hygroscopic, usually in the form of tablets, flakes or thin rolls.", "1, tr.340"]], "a": "docusate sodium docusat natri dioctyl sodium sulfosuccinate dss 577-11-7 Docusate Sodium Bis(2-ethylhexyl) sodium sulfosuccinate dioctyl sodium sulfosucci nate DSS natrii docusas sodium l,4-bis(2-ethylhexyl) sulfosucci nate sodium dioctyl sulfosuccinate"}, {"id": "edetate-disodium", "n": "Edetate Disodium", "nv": "Disodium Edetate; Disodium Edetate Hydrate; Edetate Disodium", "g": ["Chất tạo phức"], "ge": ["Chelating / Complexing agent"], "cas": "139-33-3, 6381-92-6", "f": [["Dùng làm chất tạo phức trong nhiều chế phẩm (nước súc miệng, nhỏ mắt, dùng ngoài) ở nồng độ 0,005–0,1% kl/tt; tạo phức chelat tan trong nước bền với ion kiềm thổ và kim loại nặng (sequestering), độ bền phức phụ thuộc ion kim loại và pH.", "1, tr.347"]], "fe": [["Used as a complexing agent in many preparations (mouthwash, eye drops, external use) at concentrations of 0.005–0.1% w/w; create water-soluble chelate complexes that are stable with alkaline earth ions and heavy metals (sequestering). The complex stability depends on the metal ion and pH.", "1, tr.347"]], "t": [["Là acid yếu, đẩy CO₂ khỏi carbonat và phản ứng với kim loại sinh hydro; tương kỵ với chất oxy hóa mạnh, base mạnh, ion kim loại và hợp kim; thêm vào phenylmercuric nitrat và thimerosal làm giảm hiệu lực bảo quản.", "1, tr.347"]], "te": [["A weak acid, it displaces CO₂ from carbonates and reacts with metals to produce hydrogen; Incompatible with strong oxidizers, strong bases, metal ions and alloys; Adding phenylmercuric nitrate and thimerosal reduces the preservative effect.", "1, tr.347"]], "d": [["Bột kết tinh màu trắng, không mùi, vị hơi chua.", "1, tr.347"], ["Thực tế không tan trong cloroform và ether; ít tan trong ethanol 95%; tan 1 trong 11 phần nước.", "1, tr.347"]], "de": [["White crystalline powder, odorless, slightly sour taste.", "1, tr.347"], ["Practically insoluble in chloroform and ether; Slightly soluble in 95% ethanol; Dissolves 1 in 11 parts of water.", "1, tr.347"]], "a": "edetate disodium dinatri edetat disodium edta edta disodium 6381-92-6 E386 Disodium Edetate Disodium Edetate Hydrate Edetate Disodium Dinatrii edetas disodium edetate disodium EDTA disodium ethylenediaminetetraacetate edathamil disodium edetic acid, dis odium salt Versene"}, {"id": "edetic-acid", "n": "Edetic Acid", "nv": "Edetic Acid", "g": ["Chất tạo phức"], "ge": ["Chelating / Complexing agent"], "cas": "60-00-4", "f": [["Acid edetic và các muối edetat dùng làm chất tạo phức, tạo chelat tan trong nước bền với ion kiềm thổ và kim loại nặng.", "1, tr.350"], ["Có phần hoạt tính kháng khuẩn (nhất là với vi khuẩn Gram âm); dùng đơn độc chưa đủ hiệu lực nhưng thể hiện hiệp lực rõ khi phối hợp với các chất bảo quản khác (benzalkonium clorid, bronopol, cetrimid, paraben, phenol...).", "1, tr.350"]], "fe": [["Edetic acid and edetate salts are used as complexing agents, creating water-soluble chelates that are stable with alkaline earth ions and heavy metals.", "1, tr.350"], ["Has antibacterial activity (especially against Gram-negative bacteria); Used alone, it is not effective enough but shows clear synergy when combined with other preservatives (benzalkonium chloride, bronopol, cetrimid, paraben, phenol...).", "1, tr.350"]], "t": [["Tương kỵ với chất oxy hóa mạnh, base mạnh và ion kim loại đa hóa trị (đồng, nickel); là acid yếu; có thể bất hoạt một số loại insulin (do chelat kẽm) và chelat kim loại vết trong dịch nuôi dưỡng tĩnh mạch.", "1, tr.350"]], "te": [["Incompatible with strong oxidizers, strong bases and multivalent metal ions (copper, nickel); is a weak acid; May inactivate some insulins (due to zinc chelation) and trace metal chelation in intravenous fluids.", "1, tr.350"]], "d": [["Bột kết tinh hoặc tinh thể không màu, màu trắng/gần trắng, không mùi.", "1, tr.350"]], "de": [["Colorless, white/near white, odorless crystalline powder or crystals.", "1, tr.350"]], "a": "edetic acid acid edetic edta ethylenediaminetetraacetic acid 60-00-4 Edetic Acid Acidum edeticum 3,6-bis(carboxymethyl)-3,5-diazooctanedioic acid ethylenebis(iminodiacetic acid) Dissolvine edathamil EDTA (ethylenedinitrilo)tetraacetic acid Sequestrene AA tetracemic acid Versene Acid"}, {"id": "erythorbic-acid", "n": "Erythorbic Acid", "nv": "Erythorbic Acid", "g": ["Chất chống oxy hóa"], "ge": ["Antioxidant"], "cas": "89-65-6", "f": [["Dùng làm chất chống oxy hóa trong chế phẩm dược (muối natri erythorbat là chất liên quan, E316).", "1, tr.352"]], "fe": [["Used as an antioxidant in pharmaceutical preparations (sodium salt erythorbate is a related substance, E316).", "1, tr.352"]], "t": [["Tương kỵ với kim loại hoạt động hóa học (nhôm, đồng, magnesi, kẽm), base mạnh và chất oxy hóa mạnh.", "1, tr.352"]], "te": [["Incompatible with chemically active metals (aluminum, copper, magnesium, zinc), strong bases and strong oxidizers.", "1, tr.352"]], "d": [["Tinh thể hoặc bột dạng hạt óng ánh, màu trắng hoặc hơi vàng; sẫm màu dần khi tiếp xúc ánh sáng.", "1, tr.352"], ["Tan 1 trong 20 phần nước; ít tan trong ethanol 95%; thực tế không tan trong ether.", "1, tr.352"]], "de": [["Iridescent, white or yellowish crystals or granular powder; gradually darkens when exposed to light.", "1, tr.352"], ["Dissolve 1 in 20 parts water; Slightly soluble in 95% ethanol; practically insoluble in ether.", "1, tr.352"]], "a": "erythorbic acid acid erythorbic d-isoascorbic acid 89-65-6 E315 Erythorbic Acid Araboascorbic acid D-araboascorbic acid 2,3-D-didehydro-Deryí/7ro-hexono-l,4-lactone erycorbin D-erythorbic acid D-erythro-ascorbic acid o-erythro-hex-2-enoic acid D-erythro-3ketohexonic acid lactone D-ery thrO-3-oxohexonic acid lactone glucosaccharonic acid D-isoascorbic acid isovitamin C y-lactone mercate ‘5' neo-cebicure"}, {"id": "erythritol", "n": "Erythritol", "nv": "Erythritol", "g": ["Chất tạo ngọt", "Tá dược độn (viên nén/nang)", "Chất che vị"], "ge": ["Sweetening agent", "Tablet / capsule diluent", "Taste-masking agent"], "cas": "149-32-6", "f": [["Là tá dược không gây sâu răng dùng trong nhiều chế phẩm: tá dược độn viên nén và trong màng bao; nghiên cứu dùng cho bột hít; dùng trong viên ngậm không đường, siro và kẹo cao su thuốc.", "1, tr.354"], ["Ít hút ẩm nên trơn chảy tốt và ổn định, phù hợp làm chất mang trong gói bột và nang, và tá dược độn dập thẳng; dùng làm chất độn xát hạt ướt với thuốc nhạy ẩm.", "1, tr.354"]], "fe": [["It is an excipient that does not cause tooth decay and is used in many preparations: excipient to fill tablets and in coating films; research for inhalation powder; used in sugar-free lozenges, syrups and medicinal gum.", "1, tr.354"], ["Low hygroscopicity, so it flows well and is stable, suitable as a carrier in powder and capsule packages, and straight filler excipients; Used as a filler for wet granulation with moisture-sensitive drugs.", "1, tr.354"]], "t": [["Tương kỵ với chất oxy hóa mạnh và base mạnh.", "1, tr.354"]], "te": [["Incompatible with strong oxidizing agents and strong bases.", "1, tr.354"]], "d": [["Đường-alcol (polyol); bột hoặc chất kết tinh/hạt màu trắng/gần trắng, vị ngọt dịu (~60–70% sucrose).", "1, tr.354"], ["Dễ tan trong nước; ít tan trong ethanol 95%; thực tế không tan trong ether và chất béo.", "1, tr.354"]], "de": [["Sugar-alcohol (polyol); White/near white powder or crystalline substance/granules, mildly sweet (~60–70% sucrose).", "1, tr.354"], ["Easily soluble in water; Slightly soluble in 95% ethanol; Practically insoluble in ether and fats.", "1, tr.354"]], "a": "erythritol 149-32-6 E968 Erythritol Butane 1,2,3,4-tetrol 1,2,3,4-butanetetrol C^Eridex erythrit erythrite erythritolum erythroglucin erythrol meso-erythritol L-(-)-threitol paycite phycite phycitol tetrahydroxybutane Zerose"}, {"id": "ethanol", "n": "Ethanol", "nv": "Ethanol; Alcohol", "g": ["Chất bảo quản kháng khuẩn", "Chất tăng thấm", "Dung môi"], "ge": ["Antimicrobial preservative", "Permeation enhancer", "Solvent"], "cas": "64-17-5", "f": [["Ethanol và dung dịch ethanol-nước ở nhiều nồng độ dùng rộng rãi làm dung môi (kể cả trong bào chế dạng rắn); cũng dùng làm chất sát khuẩn và chất bảo quản kháng khuẩn trong dung dịch.", "1, tr.356"], ["Dung dịch ethanol dùng ngoài được dùng làm chất tăng thấm và đồng diện hoạt trong hệ dẫn thuốc qua da.", "1, tr.356"]], "fe": [["Ethanol and ethanol-water solutions at many concentrations are widely used as solvents (including in solid formulations); Also used as an antiseptic and antibacterial preservative in solution.", "1, tr.356"], ["Topical ethanol solutions are used as permeation enhancers and cosurfactants in transdermal drug delivery systems.", "1, tr.356"]], "t": [["Trong điều kiện acid, dung dịch ethanol có thể phản ứng mãnh liệt với chất oxy hóa; hỗn hợp với kiềm có thể sẫm màu (phản ứng với vết aldehyd); có thể tủa muối hữu cơ hoặc gôm arabic khỏi dung dịch nước; tương kỵ với bao bì nhôm.", "1, tr.356"]], "te": [["Under acidic conditions, ethanol solutions can react violently with oxidants; mixtures with alkalis may darken (reaction with aldehyde stains); can precipitate organic salts or gum arabic from aqueous solutions; Incompatible with aluminum packaging.", "1, tr.356"]], "d": [["Chất lỏng trong, không màu, linh động, dễ bay hơi, mùi nhẹ đặc trưng, vị nóng.", "1, tr.356"]], "de": [["Clear, colorless liquid, flexible, volatile, characteristic mild odor, hot taste.", "1, tr.356"]], "a": "ethanol ethyl alcohol con alcohol 64-17-5 Ethanol (96 per cent) Ethanol Alcohol ethanolum (96 per centum) ethyl alcohol, undenatured ethyl hydrate ethyl hydroxide grain alcohol"}, {"id": "ethyl-acetate", "n": "Ethyl Acetate", "nv": "Ethyl Acetate", "g": ["Chất tạo hương", "Dung môi"], "ge": ["Flavoring agent", "Solvent"], "cas": "141-78-6", "f": [["Chủ yếu dùng làm dung môi (trong dung dịch và gel dùng ngoài, mực in ăn được cho viên nén); cũng dùng làm chất tạo hương; dùng trong bào chế vi cầu và điều chỉnh dạng đa hình tinh thể của một số thuốc.", "1, tr.359"]], "fe": [["Mainly used as a solvent (in solutions and gels for external use, edible inks for tablets); also used as a flavoring agent; Used in preparing microspheres and adjusting the crystal polymorphism of some drugs.", "1, tr.359"]], "t": [["Phản ứng mãnh liệt với chất oxy hóa mạnh, kiềm mạnh, acid mạnh và nitrat (nguy cơ cháy nổ); phản ứng mạnh với acid clorosulfonic, lithi nhôm hydrid, kali t-butoxid.", "1, tr.359"]], "te": [["Reacts violently with strong oxidizers, strong alkalis, strong acids and nitrates (danger of fire and explosion); Reacts strongly with chlorosulfonic acid, lithium aluminum hydride, potassium t-butoxide.", "1, tr.359"]], "d": [["Chất lỏng trong, không màu, dễ bay hơi, mùi trái cây thơm đặc trưng, hơi chua; vị dễ chịu khi pha loãng.", "1, tr.359"], ["Tan 1 trong 10 phần nước ở 25 °C; trộn lẫn với aceton, cloroform, dicloromethan, ethanol 95%, ether, glycerin.", "1, tr.359"]], "de": [["Clear, colorless, volatile liquid, characteristic fruity aroma, slightly sour; Pleasant taste when diluted.", "1, tr.359"], ["Dissolves 1 in 10 parts of water at 25 °C; Mixed with acetone, chloroform, dichloromethane, 95% ethanol, ether, glycerin.", "1, tr.359"]], "a": "ethyl acetate ethyl acetat 141-78-6 Ethyl Acetate Acetic acid ethyl ester acetic ester acetic ether acetoxyethane aethylis acetas aethylium aceticum ethyl ethanoate ethylis acetas vinegar naphtha"}, {"id": "ethyl-lactate", "n": "Ethyl Lactate", "nv": "Ethyl lactat", "g": ["Chất tạo hương", "Dung môi"], "ge": ["Flavoring agent", "Solvent"], "cas": "97-64-3", "f": [["Dùng làm dung môi/đồng dung môi trong chế phẩm lỏng, nhũ tương, vi nhũ tương và phân tán lỏng; được nghiên cứu làm dung môi 'xanh' cho dạng thuốc phân hủy sinh học; cũng làm chất tạo hương.", "1, tr.362"]], "fe": [["Used as a solvent/co-solvent in liquid preparations, emulsions, microemulsions and liquid dispersions; researched as a 'green' solvent for biodegradable drugs; Also used as a flavoring agent.", "1, tr.362"]], "t": [["Tương kỵ với base hoặc kiềm mạnh; có thể gây cháy nổ với chất oxy hóa mạnh.", "1, tr.362"]], "te": [["Incompatible with strong bases or alkalis; May cause explosion with strong oxidizing agents.", "1, tr.362"]], "d": [["Chất lỏng trong, không màu, mùi gắt đặc trưng.", "1, tr.362"], ["Trộn lẫn với nước (phân hủy một phần), ethanol 95%, ether, cloroform, ceton, ester và hydrocarbon.", "1, tr.362"]], "de": [["Clear, colorless liquid, characteristic strong odor.", "1, tr.362"], ["Miscible with water (partially decomposed), 95% ethanol, ether, chloroform, ketones, esters and hydrocarbons.", "1, tr.362"]], "a": "ethyl lactate ethyl lactat 687-47-8 Actylol Acytol Dermol EL ethyl a-hydroxypropionate ethyl-2hydroxypropanoate ethyl-2-hydroxypropionate ethyl-S-(-)-2hydroxypropionate 2-hydroxypropanoic acid ethyl ester lactic acid ethyl ester propanoic acid 2-hydroxy-ethyl ester Purasolv EL Solactol"}, {"id": "ethyl-maltol", "n": "Ethyl Maltol", "nv": "Ethyl Maltol", "g": ["Chất tăng cường hương vị", "Chất tạo hương"], "ge": ["Flavor enhancer", "Flavoring agent"], "cas": "4940-11-8", "f": [["Dùng làm chất tạo hương/tăng cường hương vị tương tự maltol nhưng mạnh gấp 4–6 lần; dùng trong siro uống ở nồng độ khoảng 0,004–0,61%.", "1, tr.364"]], "fe": [["Used as a flavoring/flavor enhancer similar to maltol but 4–6 times stronger; used in oral syrup at concentrations of about 0.004–0.61%.", "1, tr.364"]], "t": [["Tương kỵ với chất oxy hóa; hơi acid nên tạo muối với base; tạo phức chelat với kim loại kể cả sắt.", "1, tr.364"]], "te": [["Incompatible with oxidizing agents; Slightly acidic so it forms salt with base; chelating with metals including iron.", "1, tr.364"]], "d": [["Chất rắn kết tinh màu trắng, mùi và vị caramel rất ngọt đặc trưng; dung dịch loãng có hương vị ngọt như trái cây.", "1, tr.364"]], "de": [["White crystalline solid, characteristic very sweet caramel odor and taste; The dilute solution has a sweet, fruity taste.", "1, tr.364"]], "a": "ethyl maltol ethyl maltol 4940-11-8 Ethyl Maltol 3-hydroxy-2-ethyl-gamma-pyrone Piromatol E Veltol Plus"}, {"id": "ethyl-oleate", "n": "Ethyl Oleate", "nv": "Ethyl Oleate", "g": ["Tá dược dầu", "Dung môi"], "ge": ["Oleaginous vehicle", "Solvent"], "cas": "111-62-6", "f": [["Chủ yếu dùng làm tá dược cho một số thuốc tiêm bắp; cũng dùng làm dung môi cho thuốc trong nang phân hủy sinh học cấy dưới da và trong vi nhũ tương; nghiên cứu cho dùng ngoài, nhỏ mắt và hệ tự vi nhũ hóa đường uống.", "1, tr.366"]], "fe": [["Mainly used as an excipient for some intramuscular drugs; also used as a solvent for drugs in biodegradable capsules implanted under the skin and in microemulsions; Research for external use, eye drops and oral self-microemulsification system.", "1, tr.366"]], "t": [["Hòa tan hoặc làm trương một số loại cao su; có thể phản ứng với chất oxy hóa.", "1, tr.366"]], "te": [["Dissolves or swells some types of rubber; May react with oxidizing agents.", "1, tr.366"]], "d": [["Chất lỏng dạng dầu, linh động, màu vàng nhạt đến gần không màu, vị giống dầu ô liu, mùi nhẹ không ôi;
