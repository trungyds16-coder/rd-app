: ["Chất làm mềm da", "Chất nhũ hóa", "Chất ổn định nhũ tương", "Chất diện hoạt không ion hóa", "Tá dược dầu", "Chất tăng thấm", "Chất làm tăng độ tan", "Chất làm tăng độ nhớt"], "ge": ["Emollient", "Emulsifying agent", "Emulsion stabilizer", "Nonionic surfactant", "Oleaginous vehicle", "Permeation enhancer", "Solubilizing agent", "Viscosity-increasing agent"], "cas": "22788-19-8", "f": [["Dùng làm tá dược lipid trong nhũ tương, vi nhũ tương, nang gelatin mềm, thuốc đặt, lotion, kem và chế phẩm đưa thuốc qua da; là chất tăng thấm qua da.", "1, tr.800"]], "fe": [["Used as a lipid excipient in emulsions, microemulsions, soft gelatin capsules, suppositories, lotions, creams and transdermal drug delivery preparations; is a substance that increases skin permeability.", "1, tr.800"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.800"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.800"]], "d": [["Chất lỏng dạng dầu, trong, không màu hoặc vàng nhạt.", "1, tr.800"]], "de": [["Oily liquid, clear, colorless or pale yellow.", "1, tr.800"]], "a": "propylene glycol dilaurate propylen glycol dilaurat 22788-19-8 Propylene Glycol Dilaurate Capmul PG-2L 2-dodecanoyloxypropyl dodecanoate dodecanoic acid, l-methyl-1,2ethanediyl ester E477 Emalex PG di-L propane-l,2-diyl didodecanoate l-methyl-1,2ethanediyl ester dodecanoic acid propylene dilaurate propylene ester lauric acid propylenglycoli dilauras"}, {"id": "propylene-glycol-monolaurate", "n": "Propylene Glycol Monolaurate", "nv": "Propylene Glycol Monolaurate", "g": ["Chất làm mềm da", "Chất nhũ hóa", "Chất diện hoạt không ion hóa", "Tá dược dầu", "Chất tăng thấm", "Chất làm tăng độ tan"], "ge": ["Emollient", "Emulsifying agent", "Nonionic surfactant", "Oleaginous vehicle", "Permeation enhancer", "Solubilizing agent"], "cas": "27194-74-7", "f": [["Dùng làm tá dược độn trong nang gelatin mềm và cứng; là chất tăng thấm trong hệ dẫn thuốc qua da; làm đồng nhũ hóa trong vi nhũ tương và dung môi cho hoạt chất ưa lipid.", "1, tr.801"]], "fe": [["Used as a filler in soft and hard gelatin capsules; is a permeability enhancer in the drug delivery system through the skin; co-emulsifying in microemulsions and solvents for lipophilic active ingredients.", "1, tr.801"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.801"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.801"]], "d": [["Chất lỏng dạng dầu, không màu hoặc vàng nhạt ở 20 °C.", "1, tr.801"], ["Thực tế không tan trong nước; rất dễ tan trong alcol, aceton, n-hexan, methanol và methylen clorid.", "1, tr.801"]], "de": [["Oily liquid, colorless or pale yellow at 20 °C.", "1, tr.801"], ["Practically insoluble in water; Very soluble in alcohol, acetone, n-hexane, methanol and methylene chloride.", "1, tr.801"]], "a": "propylene glycol monolaurate propylen glycol monolaurat lauroglycol 27194-74-7 Propylene Glycol Monolaurate Capmul PG-12 Cithrol PGML E477 Emalex PGML Imwitor 412 lauric acid, 2hydroxypropyl ester Lauroglycol 90 Lauroglycol ECG 1,2-Propanediol, 1-laurate propylene glycol monododecanoate propylenglycoli monolauras Schercemol PGML STELLIESTERS LPG"}, {"id": "propylparaben", "n": "Propylparaben", "nv": "Propyl Parahydroxybenzoate; Propylparaben", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "94-13-3", "f": [["Dùng rộng rãi làm chất bảo quản kháng khuẩn trong mỹ phẩm, thực phẩm và dược phẩm, đơn độc hoặc phối hợp với paraben/chất kháng khuẩn khác; hiệu lực trên khoảng pH rộng, mạnh nhất với nấm men và nấm mốc; thường dùng muối natri do độ tan kém.", "1, tr.803"]], "fe": [["Widely used as an antibacterial preservative in cosmetics, foods and pharmaceuticals, alone or in combination with parabens/other antibacterials; Effective over a wide pH range, strongest against yeast and mold; Sodium salt is often used due to its poor solubility.", "1, tr.803"]], "t": [["Hoạt tính giảm đáng kể khi có chất diện hoạt không ion (do tạo micelle); bị hấp phụ bởi chất dẻo tùy loại.", "1, tr.803"]], "te": [["The activity is significantly reduced in the presence of non-ionic surfactants (due to micelle formation); Adsorbed by plastic depending on type.", "1, tr.803"]], "d": [["Bột kết tinh màu trắng, không mùi, không vị.", "1, tr.803"], ["Thể hiện hoạt tính kháng khuẩn ở pH 4–8; hiệu lực giảm khi pH tăng (tạo anion phenolat).", "1, tr.803"]], "de": [["White crystalline powder, odorless, tasteless.", "1, tr.803"], ["Shows antibacterial activity at pH 4–8; Potency decreases as pH increases (forms phenolate anion).", "1, tr.803"]], "a": "propylparaben nipasol propyl parahydroxybenzoate 94-13-3 E216 Propyl Parahydroxybenzoate Propyl Hydroxybenzoate Propylparaben Aseptoform P CoSept P 4-hydroxybenzoic acid propyl ester Nipagin P Nipasol M propagin Propyl Aseptoform propyl butex Propyl Chemosept propylis parahydroxybenzoas propyl phydroxybenzoate Propyl Parasept Solbrol P Tegosept P Uniphen P-23"}, {"id": "propylparaben-sodium", "n": "Propylparaben Sodium", "nv": "Sodium Propyl Hydroxybenzoate; Propylparaben Sodium", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "35285-69-9", "f": [["Dùng thay propylparaben nhờ độ tan trong nước cao hơn; tuy nhiên có thể làm pH công thức kiềm hơn.", "1, tr.806"]], "fe": [["Used instead of propylparaben due to its higher water solubility; However, it is possible to make the formula pH more alkaline.", "1, tr.806"]], "t": [["Hoạt tính có thể giảm khi có atropin, tinh dầu, sắt, magnesi trisilicat, talc, polysorbat 80 và chất diện hoạt không ion khác, sorbitol, kiềm yếu và acid mạnh.", "1, tr.806"]], "te": [["Activity may be reduced in the presence of atropine, essential oils, iron, magnesium trisilicate, talc, polysorbate 80 and other non-ionic surfactants, sorbitol, weak alkalis and strong acids.", "1, tr.806"]], "d": [["Bột kết tinh màu trắng, không mùi hoặc gần như không mùi.", "1, tr.806"], ["Tan trong nước tốt hơn propylparaben.", "1, tr.806"]], "de": [["White crystalline powder, odorless or almost odorless.", "1, tr.806"], ["Soluble in water better than propylparaben.", "1, tr.806"]], "a": "propylparaben sodium propylparaben natri sodium propyl parahydroxybenzoate 35285-69-9 E217 Sodium Propyl Hydroxybenzoate Sodium Propyl Parahydroxybenzoate Propylparaben Sodium Nipasol M Sodium parasept propyl 4-hydroxybenzoate, sodium salt propyl p-hydroxybenzoate, sodium salt propylis parahydroxybenzoas natricus sodium 4-propoxycarbonylphenolate sodium propyl phydroxybenzoate"}, {"id": "pullulan", "n": "Pullulan", "nv": "Pullulan", "g": ["Vật liệu vỏ nang", "Chất tạo màng bao", "Chất tạo màng", "Tá dược độn (viên nén/nang)", "Tá dược dính (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Capsule shell material", "Coating agent", "Film-forming agent", "Tablet / capsule diluent", "Tablet / capsule binder", "Viscosity-increasing agent"], "cas": "9057-02-7", "f": [["Dùng làm polymer mang để tạo màng ăn được tan nhanh (đổ khuôn dung môi); tạo vỏ nang tan trong nước, độ thấm oxy thấp (hữu ích cho hoạt chất dễ oxy hóa); dạng hạt dùng cải thiện tính nén viên; dùng làm màng bao viên.", "1, tr.808"]], "fe": [["Used as a carrier polymer to create fast-dissolving edible films (solvent casting); create water-soluble capsules with low oxygen permeability (useful for active ingredients that easily oxidize); granular form used to improve tablet compressibility; used as tablet coating.", "1, tr.808"]], "t": [["Tài liệu chưa đề cập.", "1, tr.808"]], "te": [["Documents not mentioned.", "1, tr.808"]], "d": [["Bột màu trắng đến trắng ngà, không mùi.", "1, tr.808"], ["Dễ tan trong nước lạnh và nóng; tan trong dimethylformamid, DMSO; thực tế không tan trong ethanol và dung môi hữu cơ.", "1, tr.808"]], "de": [["White to off-white powder, odorless.", "1, tr.808"], ["Easily soluble in cold and hot water; soluble in dimethylformamide, DMSO; Practically insoluble in ethanol and organic solvents.", "1, tr.808"]], "a": "pullulan 9057-02-7 E1204 Pullulan 1,4-1,6-a-D-glucan 1,6-a-D-glucan 1,6-a-linked malto triose PhlluIan PI-10"}, {"id": "pyroxylin", "n": "Pyroxylin", "nv": "Pyroxylin", "g": ["Chất tạo màng"], "ge": ["Film-forming agent"], "cas": "9004-70-0", "f": [["Dùng điều chế collodion bôi lên da bảo vệ vết cắt/trầy nhỏ (pyroxylin là chất tạo màng; khi dung môi bay hơi tạo màng trong suốt, kín, mềm dẻo); cũng nghiên cứu làm vi nang và hệ giải phóng kiểm soát đáp ứng nhiệt.", "1, tr.810"]], "fe": [["Use collodion preparation to apply to the skin to protect small cuts/scratches (pyroxylin is a film-forming agent; when the solvent evaporates, it creates a transparent, tight, flexible film); also researched microencapsulation and heat-responsive controlled release systems.", "1, tr.810"]], "t": [["Tương kỵ với chất oxy hóa; collodion tương kỵ với acetyl peroxid, clor, acid/base mạnh và amin; dễ tạo hỗn hợp nổ với không khí.", "1, tr.810"]], "te": [["Incompatible with oxidizing agents; collodion is incompatible with acetyl peroxide, chloride, strong acids/bases and amines; easily forms explosive mixtures with air.", "1, tr.810"]], "d": [["Hạt, mảnh hoặc sợi màu trắng/gần trắng; dạng sợi giống bông thấm nhưng cứng và bột hơn.", "1, tr.810"], ["Dễ tan trong aceton; tan trong methanol, amyl acetat, acid acetic băng; không tan trong nước.", "1, tr.810"]], "de": [["White/nearly white seeds, flakes or fibers; The fiber resembles absorbent cotton but is harder and more powdery.", "1, tr.810"], ["Easily soluble in acetone; Soluble in methanol, amyl acetate, glacial acetic acid; insoluble in water.", "1, tr.810"]], "a": "pyroxylin nitrocellulose collodion cotton 9004-70-0 Pyroxylin Celloidin cellulose nitrate cellulose tetranitrate collodion wool colloxylin pyroxylin solution nitro cellulose Parlodion"}, {"id": "pyrrolidone", "n": "Pyrrolidone", "nv": "Pyrrolidone", "g": ["Chất tăng thấm", "Chất hóa dẻo", "Chất làm tăng độ tan", "Dung môi"], "ge": ["Permeation enhancer", "Plasticizer", "Solubilizing agent", "Solvent"], "cas": "616-45-5", "f": [["Pyrrolidon và N-methylpyrrolidon chủ yếu dùng làm dung môi trong thuốc tiêm thú y (pyrrolidon là chất tăng độ tan tốt hơn glycerin, propylen glycol, ethanol); trong chế phẩm dùng ngoài là chất tăng thấm hiệu quả; nghiên cứu trong dạng cấy giải phóng kéo dài.", "1, tr.812"]], "fe": [["Pyrrolidone and N-methylpyrrolidone are mainly used as solvents in veterinary injections (pyrrolidone is a better solubility enhancer than glycerin, propylene glycol, ethanol); In topical preparations, it is an effective permeation enhancer; studied in extended-release implants.", "1, tr.812"]], "t": [["Tương kỵ với chất oxy hóa và acid mạnh.", "1, tr.812"]], "te": [["Incompatible with oxidizing agents and strong acids.", "1, tr.812"]], "d": [["Chất lỏng trong, không màu hoặc hơi xám.", "1, tr.812"], ["Trộn lẫn với ethanol 95%, propan-2-ol, nước và nhiều dung môi hữu cơ (benzen, cloroform, ether, ethyl acetat).", "1, tr.812"]], "de": [["Clear, colorless or slightly gray liquid.", "1, tr.812"], ["Miscible with 95% ethanol, propan-2-ol, water and many organic solvents (benzene, chloroform, ether, ethyl acetate).", "1, tr.812"]], "a": "pyrrolidone pyrrolidon 2-pyrrolidone 616-45-5 Pyrrolidone y-Aminobutyric acid lactam 4-aminobutyric acid lactam yaminobutyric lactam y-aminobutyrolactam butyrolactam ybutyrolactam 2-ketopyrrolidine Kollisolv PYR 2-oxopyrrolidine 2-Pyrol a-pyrrolidinone pyrrolidin-2-one a-pyrrolidone pyrrolidonum Soluphor p"}, {"id": "raffinose", "n": "Raffinose", "nv": "Raffinose", "g": ["Tá dược hỗ trợ đông khô"], "ge": ["Lyophilization bulking agent"], "cas": "512-69-6, 17629-30-0", "f": [["Là trisaccharid dùng làm chất độn, ổn định và hút nước trong đông khô (ổn định chế phẩm đông khô); làm chất ức chế kết tinh trong dung dịch sucrose; nghiên cứu trong bột phun sấy cho bột hít.", "1, tr.814"]], "fe": [["Is a trisaccharide used as a filler, stabilizer and absorbent in lyophilization (stabilizer of freeze-dried products); as a crystallization inhibitor in sucrose solutions; Research in spray drying powder for inhalation powder.", "1, tr.814"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.814"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.814"]], "d": [["Bột kết tinh màu trắng, không mùi, vị ngọt (~10% sucrose).", "1, tr.814"], ["Tan 1 trong 7,1 phần nước; tan trong methanol, pyridin; ít tan trong ethanol 95%; không tan trong ether.", "1, tr.814"]], "de": [["White, odorless, sweet crystalline powder (~10% sucrose).", "1, tr.814"], ["Soluble 1 in 7.1 parts water; soluble in methanol, pyridine; Slightly soluble in 95% ethanol; insoluble in ether.", "1, tr.814"]], "a": "raffinose 512-69-6 Gossypose melitose melitriose D-raffinose D-(+)-raffinose"}, {"id": "saccharin", "n": "Saccharin", "nv": "Saccharin", "g": ["Chất tạo ngọt"], "ge": ["Sweetening agent"], "cas": "81-07-2", "f": [["Chất tạo ngọt nhân tạo mạnh, không sinh năng lượng; dùng trong đồ uống, thực phẩm và sản phẩm răng miệng; trong chế phẩm uống dùng ở 0,02–0,5% kl/kl; dùng trong viên nhai; che vị khó chịu và tăng cường hương vị.", "1, tr.817"]], "fe": [["Strong, non-caloric artificial sweeteners; used in beverages, foods and oral products; in oral preparations used at 0.02–0.5% w/kl; used in chewable tablets; Covers unpleasant tastes and enhances flavor.", "1, tr.817"]], "t": [["Có thể phản ứng với phân tử lớn tạo tủa; tương kỵ với chất oxy hóa mạnh; không tham gia phản ứng Maillard.", "1, tr.817"]], "te": [["Can react with large molecules to form precipitates; Incompatible with strong oxidizing agents; does not participate in the Maillard reaction.", "1, tr.817"]], "d": [["Tinh thể hoặc bột kết tinh màu trắng, không mùi hoặc mùi thơm nhẹ, vị ngọt đậm (phát hiện ở pha loãng 1:100.000), có hậu vị kim loại/đắng.", "1, tr.817"], ["Tan trong dung dịch amoniac loãng, hydroxyd kiềm và carbonat kiềm.", "1, tr.817"]], "de": [["White crystals or crystalline powder, odorless or mildly aromatic, intensely sweet taste (detected at 1:100,000 dilution), with a metallic/bitter aftertaste.", "1, tr.817"], ["Soluble in dilute ammonia, alkaline hydroxide and alkaline carbonates.", "1, tr.817"]], "a": "saccharin 81-07-2 E954 2-Benzisothiazolin-3-one 1,1-dioxide benzoic acid sulfimide benzoic sulfimide benzosulfimide benzo-2-sulphimide benzoyl sulfonic imide l,2-dihydro-2-ketobenzisosulfonazole 2-sulfobenzoic acid imide 2,3-dihydro-3-oxobenzisosulfonazole 2,3dihydroxy-1,2-benzisothiazol-3-one-1,1 -dioxide Gtfrarctose glucid gluside Hermesetas-, kandiset saccharin acid saccharin insoluble saccharine saccharimide saccharinol saccharinose saccharol saccharinum o-benzoic sulfimide o-benzoyl sulfimide o-sulfobenzimide o-sulfobenzoic acid imide saxin Syncal sykose Saccharin"}, {"id": "saccharin-sodium", "n": "Saccharin Sodium", "nv": "Saccharin Sodium", "g": ["Chất tạo hương", "Chất tạo ngọt"], "ge": ["Flavoring agent", "Sweetening agent"], "cas": "6155-57-3, 128-44-9", "f": [["Chất tạo ngọt mạnh dùng trong đồ uống, thực phẩm và nhiều dạng thuốc (viên nén, bột, gel, hỗn dịch, chế phẩm lỏng, nước súc miệng); tan trong nước tốt hơn saccharin nên dùng phổ biến hơn; độ ngọt ~300–600 lần sucrose; che vị đắng (như thuốc tê nha khoa).", "1, tr.820"]], "fe": [["Strong sweetener used in beverages, foods and many medicinal forms (tablets, powders, gels, suspensions, liquid preparations, mouthwash); Soluble in water better than saccharin, so it is more commonly used; ~300–600 times sweeter than sucrose; mask bitter taste (like dental anesthetic).", "1, tr.820"]], "t": [["Tương kỵ với chất oxy hóa mạnh; không tham gia phản ứng Maillard.", "1, tr.820"]], "te": [["Incompatible with strong oxidizing agents; does not participate in the Maillard reaction.", "1, tr.820"]], "d": [["Bột kết tinh màu trắng.", "1, tr.820"], ["Tan tốt trong nước (1 trong 1,21 phần), tan hơn nhiều so với saccharin.", "1, tr.820"]], "de": [["White crystalline powder.", "1, tr.820"], ["Soluble well in water (1 in 1.21 parts), much more soluble than saccharin.", "1, tr.820"]], "a": "saccharin sodium saccharin natri sodium saccharin 128-44-9 E954 Saccharin Sodium ,2-Benzisothiazolin-3-one 1,1 -dioxide, sodium salt 2-sulfobenzoic acid imidesodium salt 2,3-dihvdro-3-oxobenzisosulfonazolesodium salt Crystallose gendorf 450 o-benzoylsulfimide sodium salt o-sulfobenzimidesodium saccharin sodium salt saccharinsodium salthvdrate saccharinum natricum sodium sac charide sodium saccharinate sodium saccharine sodium obenzosulfimide sucra Sucaryl sodium Syncal"}, {"id": "safflower-oil", "n": "Safflower Oil", "nv": "Refined Safflower Oil; Safflower Oil, Refined; Safflower Oil", "g": ["Chất làm mềm da", "Tá dược dầu", "Dung môi"], "ge": ["Emollient", "Oleaginous vehicle", "Solvent"], "cas": "8001-23-8", "f": [["Chủ yếu dùng làm tá dược dầu trong chế phẩm uống và dùng ngoài; làm tá dược cho dạng uống và dung môi cho nang; công thức chứa dầu rum cho sinh khả dụng cao (so với PEG 300 hoặc nước) ở chó.", "1, tr.823"]], "fe": [["Mainly used as an oil excipient in oral and topical preparations; as an excipient for oral formulations and a solvent for capsules; Formulations containing safflower oil showed high bioavailability (compared to PEG 300 or water) in dogs.", "1, tr.823"]], "t": [["Tương kỵ với chất oxy hóa mạnh.", "1, tr.823"]], "te": [["Incompatible with strong oxidizing agents.", "1, tr.823"]], "d": [["Dầu tinh chế trong, nhớt, màu vàng đến vàng nhạt, mùi thực vật nhẹ.", "1, tr.823"], ["Trộn lẫn với ether, cloroform, ether dầu hỏa; thực tế không tan trong alcol; độ tan trong nước <0,1%.", "1, tr.823"]], "de": [["Refined oil is clear, viscous, yellow to light yellow, with a light vegetable odor.", "1, tr.823"], ["Miscible with ether, chloroform, petroleum ether; practically insoluble in alcohol; water solubility <0.1%.", "1, tr.823"]], "a": "safflower oil dau rum 8001-23-8 Refined Safflower Oil Safflower Oil, Refined Safflower Oil Aceite de alazor aceite de cartamo carthami oleum raffinatum dygminu aliejus, rafinuotas huile de carthame safflorolja, raffinerad safflower oil (unhydrogenated) saflonoljy puhdistettu"}, {"id": "saponite", "n": "Saponite", "nv": "Saponit", "g": ["Chất hấp phụ", "Chất nhũ hóa", "Chất làm tăng độ nhớt"], "ge": ["Adsorbent", "Emulsifying agent", "Viscosity-increasing agent"], "cas": "1319-41-1", "f": [["Là vật liệu keo trong nhiều đất sét tự nhiên; dùng làm chất hấp phụ, tăng độ nhớt, gây treo hoặc nhũ hóa dầu/nước; trương nhiều lần thể tích khi thêm nước.", "1, tr.825"]], "fe": [["As a colloidal material in many natural clays; used as an adsorbent, viscosity increaser, suspender or emulsifier of oil/water; expands many times its volume when water is added.", "1, tr.825"]], "t": [["Có thể sinh nhiệt khi tiếp xúc acid hydrofluoric.", "1, tr.825"]], "te": [["May generate heat when exposed to hydrofluoric acid.", "1, tr.825"]], "d": [["Khoáng sét phyllosilicat 2:1 nhóm smectit; là nhôm silicat ngậm nước giàu magnesi, thành phần của một số magnesi nhôm silicat thương mại; bột màu trắng/trắng ngà, xỉn.", "1, tr.825"]], "de": [["2:1 phyllosilicate clay mineral of smectite group; is a magnesium-rich hydrated aluminum silicate, a constituent of some commercial magnesium aluminum silicates; White/ivory white powder, dull.", "1, tr.825"]], "a": "saponite saponit 12199-37-0 Afrodit aluminum-saponite auxite cathkinite ferroan saponite griffithite Imvite 1016 Ionite P Laponite licianite lucianite piotine SapCa-1 Smectiton SA SMI 200H Stevensonite Sumecton 5Â SY 5 Veegum S6198 zebedassite.3 *"}, {"id": "sesame-oil", "n": "Sesame Oil", "nv": "Sesame Oil; Refined Sesame Oil; Sesame Oil, Refined", "g": ["Tá dược dầu", "Dung môi"], "ge": ["Oleaginous vehicle", "Solvent"], "cas": "8008-74-0", "f": [["Chủ yếu dùng làm dung môi trong thuốc tiêm bắp giải phóng kéo dài của steroid (estradiol valerat, testosteron enanthat, nandrolon decanoat) và các thuốc tan trong dầu khác.", "1, tr.827"]], "fe": [["Mainly used as a solvent in extended-release intramuscular injections of steroids (estradiol valerate, testosterone enanthate, nandrolone decanoate) and other lipid-soluble drugs.", "1, tr.827"]], "t": [["Bị xà phòng hóa bởi hydroxyd kiềm.", "1, tr.827"]], "te": [["Saponified by alkaline hydroxide.", "1, tr.827"]], "d": [["Dầu tinh chế trong, màu vàng nhạt, mùi nhẹ dễ chịu, vị nhạt; đông đặc mềm ở ~-4 °C.", "1, tr.827"], ["Không tan trong nước; thực tế không tan trong ethanol 95%; trộn lẫn với ether, cloroform, hexan và ether dầu hỏa.", "1, tr.827"]], "de": [["Refined oil is clear, light yellow in color, has a light, pleasant odor, and has a bland taste; Soft solidifies at ~-4 °C.", "1, tr.827"], ["Insoluble in water; practically insoluble in 95% ethanol; Miscible with ether, chloroform, hexane and petroleum ether.", "1, tr.827"]], "a": "sesame oil dau me dau vung 8008-74-0 Sesame Oil Refined Sesame Oil Sesame Oil, Refined"}, {"id": "shellac", "n": "Shellac", "nv": "Shellac; Purified Shellac; White Shellac", "g": ["Chất tạo màng bao", "Chất tạo màng", "Chất vi nang hóa", "Tá dược phóng thích biến đổi"], "ge": ["Coating agent", "Film-forming agent", "Microencapsulating agent", "Modified-release agent"], "cas": "9000-59-3", "f": [["Dùng rộng rãi làm màng bao chắn ẩm cho viên nén và pellet (độ thấm hơi nước và oxy thấp), thường dạng dung dịch cồn hoặc nước (pharmaceutical glaze); dung dịch amoni shellac dạng nước dùng làm màng bao tan ở ruột cho cốm, pellet, viên và nang.", "1, tr.829"]], "fe": [["Widely used as a moisture barrier for tablets and pellets (low water vapor and oxygen permeability), often in the form of alcohol or water solutions (pharmaceutical glaze); Aqueous ammonium shellac solution used as enteric coating for granules, pellets, tablets and capsules.", "1, tr.829"]], "t": [["Phản ứng với kiềm nước, base hữu cơ, alcol và tác nhân ester hóa nhóm carboxyl (dùng thận trọng khi có các chất này).", "1, tr.829"]], "te": [["Reacts with alkaline water, organic bases, alcohols and carboxyl esterifying agents (use with caution in the presence of these substances).", "1, tr.829"]], "d": [["Nhựa tự nhiên, mảnh cứng giòn màu vàng nhạt đến đỏ sẫm (có hoặc không sáp tùy tinh chế), gần như không vị, mùi nhẹ.", "1, tr.829"]], "de": [["Natural resin, hard, brittle pieces of light yellow to dark red color (with or without wax depending on refinement), almost tasteless, mild odor.", "1, tr.829"]], "a": "shellac canh kien 9000-59-3 Shellac Purified Shellac AT 10-1010 Blonde Bulls Eye Shellac CertiSeal FC 300A Crystalac E904 Excelacs 3-Circles Excelacs 3-Stars Gifu Shellac GBN-PH Gifu Shellac Pearl-811 lac lacca Mantrolac R-49 Mantrolac R-52 Marcoat 125 Opagios R Sepifilm SN SSB Aqùagold SSB 55 Pharma SSB 56 Pharma SSB 57 Pharma White Shellac"}, {"id": "sodium-acetate", "n": "Sodium Acetate", "nv": "Sodium Acetate Trihydrate; Sodium Acetate", "g": ["Chất bảo quản kháng khuẩn", "Chất đệm", "Chất tạo hương"], "ge": ["Antimicrobial preservative", "Buffering agent", "Flavoring agent"], "cas": "127-09-3, 6131-90-4", "f": [["Phối hợp với acid acetic tạo hệ đệm trong nhiều chế phẩm tiêm bắp, tĩnh mạch, dùng ngoài, nhỏ mắt, nhỏ mũi, uống, nhỏ tai và tiêm dưới da; có thể giảm vị đắng của thuốc uống và tăng tính kháng khuẩn của công thức.", "1, tr.835"]], "fe": [["Combined with acetic acid to create a buffer system in many intramuscular, intravenous, external, eye drops, nose drops, oral, ear drops and subcutaneous injections; Can reduce the bitter taste of oral medications and increase the antibacterial properties of the formula.", "1, tr.835"]], "t": [["Phản ứng với thành phần acid và base; phản ứng mãnh liệt với fluor, kali nitrat và diketen.", "1, tr.835"]], "te": [["Reacts with acids and bases; Reacts violently with fluoride, potassium nitrate and diketen.", "1, tr.835"]], "d": [["Tinh thể trong không màu hoặc bột kết tinh dạng hạt màu trắng, mùi acid acetic nhẹ.", "1, tr.835"], ["Tan 1 trong 0,8 phần nước; 1 trong 20 phần ethanol 95%.", "1, tr.835"]], "de": [["Colorless clear crystals or white granular crystalline powder, slight acetic acid odor.", "1, tr.835"], ["Dissolve 1 in 0.8 parts water; 1 in 20 parts 95% ethanol.", "1, tr.835"]], "a": "sodium acetate natri acetat 127-09-3 E262 Sodium Acetate Trihydrate Sodium Acetate Hydrate Sodium Acetate Acetic acid, sodium salt natrii acetas trihydricus sodium ethanoate"}, {"id": "sodium-alginate", "n": "Sodium Alginate", "nv": "Sodium Alginate", "g": ["Tá dược phóng thích biến đổi", "Chất gây treo", "Tá dược dính (viên nén/nang)", "Tá dược rã (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Modified-release agent", "Suspending agent", "Tablet / capsule binder", "Tablet / capsule disintegrant", "Viscosity-increasing agent"], "cas": "9005-38-3", "f": [["Dùng trong nhiều chế phẩm uống và dùng ngoài; trong viên nén làm tá dược dính và rã; làm tá dược độn nang; dùng bào chế dạng uống giải phóng kéo dài (làm chậm hòa tan thuốc), nang tan ở ruột và hệ nổi đa tiểu phân.", "1, tr.837"]], "fe": [["Used in many oral and topical preparations; in tablets as adhesive and disintegrating excipients; as an excipient for cyst filler; Use extended-release oral formulation (slows drug dissolution), enteric capsule and multi-particulate flotation system.", "1, tr.837"]], "t": [["Tương kỵ với dẫn chất acridin, crystal violet, phenylmercuric acetat/nitrat, muối calci, kim loại nặng và ethanol >5%; nồng độ điện giải thấp làm tăng độ nhớt, nồng độ cao gây tách muối (nếu NaCl >4%).", "1, tr.837"]], "te": [["Incompatible with acridine derivatives, crystal violet, phenylmercuric acetate/nitrate, calcium salts, heavy metals and ethanol >5%; Low electrolyte concentrations increase viscosity, high concentrations cause salt separation (if NaCl >4%).", "1, tr.837"]], "d": [["Bột màu trắng đến vàng nhạt.", "1, tr.837"], ["Thực tế không tan trong ethanol 95%, ether, cloroform và dung dịch cồn >30%; không tan trong dung dịch acid pH <3; tan chậm trong nước tạo dung dịch keo nhớt.", "1, tr.837"]], "de": [["White to light yellow powder.", "1, tr.837"], ["Practically insoluble in 95% ethanol, ether, chloroform and >30% alcohol solutions; insoluble in acidic solutions pH <3; Dissolves slowly in water to create a viscous colloidal solution.", "1, tr.837"]], "a": "sodium alginate natri alginat 9005-38-3 E401 Sodium Alginate Alginato sodico algin alginic acid, sodium salt Kelcosol ỉteltone natrii alginas Pronova-, Protanal sodium polymannuronate"}, {"id": "sodium-ascorbate", "n": "Sodium Ascorbate", "nv": "Sodium Ascorbate", "g": ["Chất chống oxy hóa"], "ge": ["Antioxidant"], "cas": "134-03-2", "f": [["Dùng làm chất chống oxy hóa trong chế phẩm dược và thực phẩm.", "1, tr.840"]], "fe": [["Used as an antioxidant in pharmaceutical and food preparations.", "1, tr.840"]], "t": [["Tương kỵ với chất oxy hóa, ion kim loại nặng (đặc biệt đồng, sắt), methenamin, natri nitrit, natri salicylat; dung dịch nước tương kỵ với màng lọc thép không gỉ.", "1, tr.840"]], "te": [["Incompatible with oxidants, heavy metal ions (especially copper, iron), methenamine, sodium nitrite, sodium salicylate; Aqueous solutions are incompatible with stainless steel filters.", "1, tr.840"]], "d": [["Bột kết tinh màu trắng hoặc hơi vàng, gần như không mùi, vị mặn dễ chịu.", "1, tr.840"], ["Tan trong nước; rất ít tan trong ethanol 95%; thực tế không tan trong cloroform và ether.", "1, tr.840"]], "de": [["White or slightly yellow crystalline powder, almost odorless, pleasant salty taste.", "1, tr.840"], ["Soluble in water; very slightly soluble in 95% ethanol; Practically insoluble in chloroform and ether.", "1, tr.840"]], "a": "sodium ascorbate natri ascorbat 134-03-2 E301 Sodium Ascorbate L-Ascorbic acid monosodium salt 3-oxo-L-gulofuranolactone sodium enolate natrii ascorbas SA-99 vitamin c sodium"}, {"id": "sodium-benzoate", "n": "Sodium Benzoate", "nv": "Sodium Benzoate", "g": ["Chất bảo quản kháng khuẩn", "Tá dược trơn bóng (viên nén/nang)"], "ge": ["Antimicrobial preservative", "Tablet / capsule glidant"], "cas": "532-32-1", "f": [["Chủ yếu dùng làm chất bảo quản kháng khuẩn ở nồng độ 0,02–0,5% trong thuốc uống, 0,5% trong thuốc tiêm; hiệu lực bị giới hạn ở khoảng pH hẹp (mạnh ở pH thấp).", "1, tr.843"]], "fe": [["Mainly used as an antibacterial preservative at concentrations of 0.02–0.5% in oral medications, 0.5% in injectable medications; Potency is limited to a narrow pH range (strong at low pH).", "1, tr.843"]], "t": [["Tương kỵ với hợp chất amoni bậc bốn, gelatin, muối sắt (III), muối calci và muối kim loại nặng (bạc, chì, thủy ngân); hoạt tính giảm khi có kaolin hoặc chất diện hoạt không ion; phản ứng với acid ascorbic tạo benzen.", "1, tr.843"]], "te": [["Incompatible with quaternary ammonium compounds, gelatin, iron (III) salts, calcium salts and heavy metal salts (silver, lead, mercury); Activity decreases in the presence of kaolin or non-ionic surfactants; Reacts with ascorbic acid to form benzene.", "1, tr.843"]], "d": [["Bột hoặc hạt kết tinh màu trắng, gần như không mùi, vị hơi ngọt chát.", "1, tr.843"], ["Tan 1 trong 1,8 phần nước; 1 trong 75 phần ethanol 95%.", "1, tr.843"]], "de": [["White crystalline powder or granules, almost odorless, slightly sweet and acrid taste.", "1, tr.843"], ["Dissolve 1 in 1.8 parts water; 1 in 75 parts 95% ethanol.", "1, tr.843"]], "a": "sodium benzoate natri benzoat 532-32-1 E211 Sodium Benzoate Benzoate of soda benzoic acid sodium salt natrii benzoas natrium benzoicum sobenate sodii benzoas sodium benzoic acid"}, {"id": "sodium-bicarbonate", "n": "Sodium Bicarbonate", "nv": "Sodium Bicarbonate; Sodium Hydrogen Carbonate", "g": ["Chất kiềm hóa", "Tá dược độn (viên nén/nang)"], "ge": ["Alkalizing agent", "Tablet / capsule diluent"], "cas": "144-55-8", "f": [["Chủ yếu dùng làm nguồn CO₂ trong viên và cốm sủi; cũng dùng để tạo/duy trì pH kiềm. Trong viên/cốm sủi thường phối hợp với acid citric và/hoặc tartaric (kết hợp cả hai được ưa dùng).", "1, tr.846"]], "fe": [["Mainly used as a source of CO₂ in effervescent tablets and cereals; Also used to create/maintain alkaline pH. Effervescent tablets/granules are often combined with citric and/or tartaric acid (a combination of both is preferred).", "1, tr.846"]], "t": [["Phản ứng với acid, muối acid và nhiều muối alkaloid giải phóng CO₂; làm sẫm màu salicylat; trong hỗn hợp bột, ẩm khí quyển đủ để phản ứng với acid boric hoặc phèn.", "1, tr.846"]], "te": [["Reacts with acids, acid salts and many alkaloid salts to release CO₂; darkening of salicylates; In the powder mixture, atmospheric moisture is sufficient to react with boric acid or alum.", "1, tr.846"]], "d": [["Bột kết tinh màu trắng, không mùi, vị mặn hơi kiềm (tinh thể lăng trụ đơn tà); có nhiều grade cỡ hạt.", "1, tr.846"], ["Tan trong nước; thực tế không tan trong ethanol 95%.", "1, tr.846"]], "de": [["White crystalline powder, odorless, slightly alkaline salty taste (monoclinal prismatic crystals); There are many grain size grades.", "1, tr.846"], ["Soluble in water; Practically insoluble in 95% ethanol.", "1, tr.846"]], "a": "sodium bicarbonate natri bicarbonat natri hydrocarbonat baking soda 144-55-8 E500 Sodium bicarbonate Sodium Hydrogen Carbonate Baking soda Effer-Soda-, monosodium carbonate natrii hydrogenocarbonas Sal de Vichy sodium acid carbonate Sodium Bicarbonate"}, {"id": "sodium-borate", "n": "Sodium Borate", "nv": "Borax; Sodium Borate", "g": ["Chất kiềm hóa", "Chất bảo quản kháng khuẩn", "Chất đệm", "Chất nhũ hóa"], "ge": ["Alkalizing agent", "Antimicrobial preservative", "Buffering agent", "Emulsifying agent"], "cas": "1303-96-4", "f": [["Dùng làm chất bảo quản kháng khuẩn trong thuốc mỡ và kem dùng ngoài, và làm chất nhũ hóa trong kem; cũng dùng trong viên ngậm, nước súc miệng, chế phẩm nhỏ tai (0,3% kl/tt) và dung dịch nhỏ mắt (0,03–1,0% kl/tt).", "1, tr.850"]], "fe": [["Used as an antibacterial preservative in topical ointments and creams, and as an emulsifier in creams; also used in lozenges, mouthwash, ear drops (0.3% w/w) and eye drops (0.03–1.0% wt/w).", "1, tr.850"]], "t": [["Tương kỵ với acid, muối kim loại và alkaloid, chất khử mạnh.", "1, tr.850"]], "te": [["Incompatible with acids, metal salts and alkaloids, strong reducing agents.", "1, tr.850"]], "d": [["Tinh thể cứng, hạt hoặc bột kết tinh màu trắng, không mùi, lên hoa.", "1, tr.850"], ["Tan 1 trong 16 phần nước, 1 trong 1 phần nước sôi, 1 trong 1 phần glycerin; thực tế không tan trong ethanol 95%.", "1, tr.850"]], "de": [["Hard crystals, granules or white crystalline powder, odorless, flowering.", "1, tr.850"], ["Dissolve 1 in 16 parts water, 1 in 1 part boiling water, 1 in 1 part glycerin; Practically insoluble in 95% ethanol.", "1, tr.850"]], "a": "sodium borate natri borat borax sodium tetraborate 1303-96-4 E285 Borax Sodium Borate Borax decahydrate boric acid disodium salt natrii tetra boras natrii tetraboras decahydricus sodium biborate decahydrate sodium pyroborate decahydrate"}, {"id": "sodium-carbonate", "n": "Sodium Carbonate", "nv": "Sodium Carbonate; Dried Sodium Carbonate", "g": ["Chất kiềm hóa", "Chất đệm", "Chất phân tán", "Tá dược độn (viên nén/nang)"], "ge": ["Alkalizing agent", "Buffering agent", "Dispersing agent", "Tablet / capsule diluent"], "cas": "497-19-8, 5968-11-6, 6132-02-1", "f": [["Dùng làm chất kiềm hóa trong chế phẩm tiêm, nhỏ mắt, uống và trực tràng; trong viên/cốm sủi phối hợp với acid (citric/tartaric); nồng độ kiềm hóa 2–5% kl/kl trong viên nén.", "1, tr.852"]], "fe": [["Used as an alkylating agent in injectable, ophthalmic, oral and rectal preparations; in effervescent tablets/granules combined with acid (citric/tartaric); alkalinization concentration of 2–5% w/kl in tablets.", "1, tr.852"]], "t": [["Phân hủy khi tiếp xúc acid có mặt nước tạo CO₂ và sủi bọt; phản ứng mãnh liệt với nhôm, phosphor pentoxid, acid sulfuric, fluor và lithi.", "1, tr.852"]], "te": [["Decomposes when exposed to acid in the presence of water, creating CO₂ and foaming; Reacts violently with aluminum, phosphorus pentoxide, sulfuric acid, fluoride and lithium.", "1, tr.852"]], "d": [["Bột kết tinh hoặc hạt màu trắng/không màu, hút ẩm, không mùi.", "1, tr.852"]], "de": [["White/colorless, hygroscopic, odorless crystalline powder or granules.", "1, tr.852"]], "a": "sodium carbonate natri carbonat soda ash 497-19-8 E500 Sodium Carbonate Dried Sodium Carbonate Bisodium carbonate calcined soda carbonic acid disodium salt Cenzias de Soda crystol carbonate disodium carbonate E500Í Gran-Plus natrii Carbonas anhydricus Novacarb soda calcined Sodium Carbonate IPH"}, {"id": "sodium-chloride", "n": "Sodium Chloride", "nv": "Sodium Chloride", "g": ["Tá dược độn (viên nén/nang)", "Chất điều chỉnh đẳng trương"], "ge": ["Tablet / capsule diluent", "Tonicity agent"], "cas": "7647-14-5", "f": [["Dùng rộng rãi trong chế phẩm tiêm và không tiêm, chủ yếu để tạo dung dịch đẳng trương; cũng dùng làm chất tạo kênh và tác nhân thẩm thấu trong nhân viên giải phóng kiểm soát, chất điều biến độ xốp màng bao và kiểm soát giải phóng thuốc từ vi nang.", "1, tr.854"]], "fe": [["Widely used in injectable and non-injectable preparations, mainly to create isotonic solutions; also used as a channeling agent and osmotic agent in controlled release agents, coating porosity modulators, and controlled drug release from microcapsules.", "1, tr.854"]], "t": [["Dung dịch nước ăn mòn sắt; tạo tủa với muối bạc, chì, thủy ngân; chất oxy hóa mạnh giải phóng clor từ dung dịch acid hóa; làm giảm độ tan của methylparaben và giảm độ nhớt gel carbomer/HEC/HPC.", "1, tr.854"]], "te": [["Aqueous solutions corrode iron; precipitate with silver, lead, and mercury salts; Strong oxidizer liberates chlorine from acidified solution; reduces the solubility of methylparaben and reduces carbomer/HEC/HPC gel viscosity.", "1, tr.854"]], "d": [["Bột kết tinh màu trắng hoặc tinh thể không màu, vị mặn.", "1, tr.854"], ["Tan trong nước; ít tan trong ethanol.", "1, tr.854"]], "de": [["White crystalline powder or colorless crystals, salty taste.", "1, tr.854"], ["Soluble in water; Slightly soluble in ethanol.", "1, tr.854"]], "a": "sodium chloride natri clorid muoi an 7647-14-5 Sodium Chloride Alberger chlorure de sodium common salt hopper salt natrii chloridum natural halite rock salt saline salt sea salt table salt"}, {"id": "sodium-citrate-dihydrate", "n": "Sodium Citrate Dihydrate", "nv": "Sodium Citrate; Sodium Citrate Hydrate", "g": ["Chất kiềm hóa", "Chất đệm", "Chất tạo phức", "Chất nhũ hóa"], "ge": ["Alkalizing agent", "Buffering agent", "Chelating / Complexing agent", "Emulsifying agent"], "cas": "6132-04-3", "f": [["Dùng rộng rãi làm chất đệm và kiềm hóa và làm chất tạo phức để gắn ion kim loại; dạng khan dùng trong viên sủi. Nồng độ tham khảo: đệm 0,3–2,0%; tạo phức 0,3–2,0%.", "1, tr.858"]], "fe": [["Widely used as a buffering and alkylating agent and as a complexing agent to bind metal ions; Anhydrous form used in effervescent tablets. Reference concentration: buffer 0.3–2.0%; complexation 0.3–2.0%.", "1, tr.858"]], "t": [["Dung dịch hơi kiềm, phản ứng với chất acid; có thể tủa muối alkaloid; muối calci và stronti gây tủa citrat; tương kỵ với base, chất khử và chất oxy hóa.", "1, tr.858"]], "te": [["Slightly alkaline solution, reacts with acids; may precipitate alkaloid salts; Calcium and strontium salts cause citrate precipitation; Incompatible with bases, reducing agents and oxidizing agents.", "1, tr.858"]], "d": [["Tinh thể đơn tà không màu, không mùi hoặc bột kết tinh màu trắng, vị mặn mát; hơi chảy nước trong không khí ẩm, lên hoa trong không khí khô ấm.", "1, tr.858"], ["Tan 1 trong 1,5 phần nước; thực tế không tan trong ethanol 95%.", "1, tr.858"]], "de": [["Colorless, odorless monoclinic crystals or white crystalline powder, cool salty taste; Waters slightly in humid air, blooms in warm dry air.", "1, tr.858"], ["Dissolve 1 in 1.5 parts water; Practically insoluble in 95% ethanol.", "1, tr.858"]], "a": "sodium citrate dihydrate natri citrat dihydrat trisodium citrate 6132-04-3 E331 Sodium Citrate Sodium Citrate Hydrate Citric acid trisodium salt natrii citras sodium citrate tertiary"}, {"id": "sodium-cyclamate", "n": "Sodium Cyclamate", "nv": "Sodium Cyclamate", "g": ["Chất tạo ngọt"], "ge": ["Sweetening agent"], "cas": "139-05-9", "f": [["Chất tạo ngọt mạnh; ở nồng độ loãng (đến ~0,17% kl/tt) độ ngọt gấp ~30 lần sucrose, nhưng ở nồng độ cao hơn (0,5%) xuất hiện vị đắng; thường phối hợp với saccharin (tỷ lệ ~10:1).", "1, tr.860"]], "fe": [["Strong sweetener; At dilute concentrations (up to ~0.17% w/w) the sweetness is ~30 times that of sucrose, but at higher concentrations (0.5%) a bitter taste appears; Often combined with saccharin (ratio ~ 10:1).", "1, tr.860"]], "t": [["Tài liệu chưa đề cập.", "1, tr.860"]], "te": [["Documents not mentioned.", "1, tr.860"]], "d": [["Tinh thể hoặc bột kết tinh màu trắng, không mùi hoặc gần như không mùi, vị ngọt đậm.", "1, tr.860"], ["Tan trong nước; thực tế không tan trong benzen, cloroform, ethanol 95%.", "1, tr.860"]], "de": [["White crystals or crystalline powder, odorless or almost odorless, intensely sweet taste.", "1, tr.860"], ["Soluble in water; Practically insoluble in benzene, chloroform, and 95% ethanol.", "1, tr.860"]], "a": "sodium cyclamate natri cyclamat 139-05-9 E952 Sodium Cyclamate Cyclamate sodium cyclohexylsulfamic acid monosodium salt natrii cyclamas sodium cyclohexanesulfamate"}, {"id": "sodium-formaldehyde-sulfoxylate", "n": "Sodium Formaldehyde Sulfoxylate", "nv": "Sodium Formaldehyde Sulfoxylate", "g": ["Chất chống oxy hóa"], "ge": ["Antioxidant"], "cas": "149-44-0, 6035-47-8", "f": [["Là chất chống oxy hóa tan trong nước (thường dùng dạng dihydrat); dùng trong thuốc tiêm ở nồng độ tới 0,1% kl/tt trong chế phẩm cuối cùng.", "1, tr.863"]], "fe": [["Is a water-soluble antioxidant (usually used in dihydrate form); used in injections at concentrations up to 0.1% w/w in the final product.", "1, tr.863"]], "t": [["Tương kỵ với chất oxy hóa mạnh; bị acid loãng phân hủy.", "1, tr.863"]], "te": [["Incompatible with strong oxidizing agents; decomposed by dilute acid.", "1, tr.863"]], "d": [["Khi mới điều chế là tinh thể màu trắng, không mùi; nhanh chóng có mùi tỏi đặc trưng khi để lâu.", "1, tr.863"], ["Dễ tan trong nước; ít tan trong ethanol, cloroform, ether và benzen.", "1, tr.863"]], "de": [["When first prepared, it is a white, odorless crystal; quickly develops a characteristic garlic smell when kept for a long time.", "1, tr.863"], ["Easily soluble in water; Slightly soluble in ethanol, chloroform, ether and benzene.", "1, tr.863"]], "a": "sodium formaldehyde sulfoxylate natri formaldehyd sulfoxylat rongalite 149-44-0 Sodium Formaldehyde Sulfoxylate formaldehyde sodium sulfoxylate formaldehydesulfoxylic acid sodium salt methanesulfinic acid, hydroxy-, monosodium salt monosodium hydroxymethane sulfi nate Rongalite sodium hydroxymethane sulfinate sodium hydro xymethylsulfinate sodium methanalsulfoxylate"}, {"id": "sodium-hyaluronate", "n": "Sodium Hyaluronate", "nv": "Sodium Hyaluronate; Purified Sodium Hyaluronate", "g": ["Chất giữ ẩm", "Tá dược trơn", "Tá dược phóng thích biến đổi"], "ge": ["Humectant", "Lubricant", "Modified-release agent"], "cas": "9067-32-7", "f": [["Là dạng ưu thế của acid hyaluronic ở pH sinh lý; gel hyaluronan khâu mạch dùng làm hệ đưa thuốc; là glycosaminoglycan tích điện âm phổ biến trong dịch kính, tương tác với phức ADN polymer/liposom; giúp tăng khả năng sẵn có và thời gian lưu của thuốc.", "1, tr.864"]], "fe": [["Is the dominant form of hyaluronic acid at physiological pH; cross-chain hyaluronan gel used as a drug delivery system; is a negatively charged glycosaminoglycan common in the vitreous humor, interacting with DNA polymer/liposomal complexes; Helps increase drug availability and retention time.", "1, tr.864"]], "t": [["Tài liệu chưa đề cập.", "1, tr.864"]], "te": [["Documents not mentioned.", "1, tr.864"]], "d": [["Bột (thường màu trắng); tan trong nước (tốc độ tan phụ thuộc phân tử lượng); ít tan trong hỗn hợp dung môi hữu cơ với nước.", "1, tr.864"]], "de": [["Powder (usually white); soluble in water (dissolution rate depends on molecular weight); Slightly soluble in mixtures of organic solvents and water.", "1, tr.864"]], "a": "sodium hyaluronate natri hyaluronat hyaluronic acid hyaluronan 9067-32-7 Sodium Hyaluronate Purified Sodium Hyaluronate Hyaluronan hyaluronate sodium natrii hyaluronas RITA HA C1-C. o"}, {"id": "sodium-hydroxide", "n": "Sodium Hydroxide", "nv": "Sodium Hydroxide", "g": ["Chất kiềm hóa"], "ge": ["Alkalizing agent"], "cas": "1310-73-2", "f": [["Dùng rộng rãi để điều chỉnh pH dung dịch; cũng dùng phản ứng với acid yếu tạo muối.", "1, tr.866"]], "fe": [["Widely used to adjust solution pH; Also used to react with weak acids to form salts.", "1, tr.866"]], "t": [["Là base mạnh, tương kỵ với chất dễ thủy phân hoặc oxy hóa; phản ứng với acid, ester và ether, nhất là trong dung dịch nước.", "1, tr.866"]], "te": [["A strong base, incompatible with substances that can easily be hydrolyzed or oxidized; Reacts with acids, esters and ethers, especially in aqueous solutions.", "1, tr.866"]], "d": [["Khối rắn nung chảy màu trắng/gần trắng (viên, mảnh, que), cứng giòn; rất chảy nước, hấp thụ CO₂ và nước từ không khí.", "1, tr.866"]], "de": [["White/nearly white molten solid mass (tablets, flakes, sticks), hard and brittle; Very watery, absorbs CO₂ and water from the air.", "1, tr.866"]], "a": "sodium hydroxide natri hydroxyd xut caustic soda 1310-73-2 E524 Sodium Hydroxide Caustic soda lye natrii hydroxidum soda lye sodium hydrate"}, {"id": "sodium-lactate", "n": "Sodium Lactate", "nv": "Sodium Lactate", "g": ["Chất bảo quản kháng khuẩn", "Chất đệm", "Chất nhũ hóa", "Chất tạo hương", "Chất giữ ẩm"], "ge": ["Antimicrobial preservative", "Buffering agent", "Emulsifying agent", "Flavoring agent", "Humectant"], "cas": "72-17-3", "f": [["Dùng rộng rãi trong mỹ phẩm, thực phẩm và dược phẩm gồm chế phẩm tiêm và dùng ngoài (làm chất đệm, giữ ẩm, bảo quản).", "1, tr.868"]], "fe": [["Widely used in cosmetics, foods and pharmaceuticals including injectable and external preparations (as buffering, moisturizing, preservative).", "1, tr.868"]], "t": [["Xem mục Acid lactic.", "1, tr.868"]], "te": [["See Lactic Acid section.", "1, tr.868"]], "d": [["Chất lỏng trong, không màu, hơi sánh, hút ẩm, gần như không mùi hoặc mùi nhẹ, vị mặn đặc trưng.", "1, tr.868"], ["Trộn lẫn với ethanol 95% và nước.", "1, tr.868"]], "de": [["Clear, colorless, slightly viscous, hygroscopic liquid, almost odorless or mild odor, characteristic salty taste.", "1, tr.868"], ["Mix with 95% ethanol and water.", "1, tr.868"]], "a": "sodium lactate natri lactat 72-17-3 E325 Sodium Lactate Sodium L-Lactate 2-hydroxypropanoic acid monosodium salt Lacolin lactic acid monosodium salt lactic acid sodium salt natrii lactatis solutio Patlac, Purasal Ritalac NAL sodium a-hydroxypropionate"}, {"id": "sodium-lauryl-sulfate", "n": "Sodium Lauryl Sulfate", "nv": "Sodium Lauryl Sulfate", "g": ["Chất diện hoạt anion", "Chất nhũ hóa", "Tá dược phóng thích biến đổi", "Chất tăng thấm", "Chất làm tăng độ tan", "Tá dược trơn bóng (viên nén/nang)"], "ge": ["Anionic surfactant", "Emulsifying agent", "Modified-release agent", "Permeation enhancer", "Solubilizing agent", "Tablet / capsule glidant"], "cas": "151-21-3", "f": [["Chất diện hoạt anion dùng rộng rãi trong nhiều chế phẩm không tiêm và mỹ phẩm; là chất tẩy rửa và thấm ướt hiệu quả trong cả môi trường acid và kiềm; nồng độ nhũ hóa 0,5–2,5%. Cũng dùng trong kỹ thuật điện di (SDS-PAGE).", "1, tr.869"]], "fe": [["Anionic surfactants are widely used in many non-injectable products and cosmetics; is an effective cleaning and wetting agent in both acid and alkaline environments; emulsifying concentration 0.5–2.5%. Also used in electrophoresis (SDS-PAGE).", "1, tr.869"]], "t": [["Phản ứng với chất diện hoạt cation gây mất hoạt tính; tương kỵ với muối ion kim loại đa hóa trị (nhôm, chì, thiếc, kẽm) và tủa với muối kali; dung dịch (pH 9,5–10) ăn mòn nhẹ thép, đồng, đồng thau, nhôm.", "1, tr.869"]], "te": [["Reacts with cationic surfactants causing loss of activity; Incompatible with multivalent metal ion salts (aluminum, lead, tin, zinc) and precipitates with potassium salts; solution (pH 9.5–10) is mildly corrosive to steel, copper, brass, and aluminum.", "1, tr.869"]], "d": [["Tinh thể, mảnh hoặc bột màu trắng đến kem/vàng nhạt, sờ mượt, vị đắng như xà phòng, mùi béo nhẹ.", "1, tr.869"], ["Dễ tan trong nước (dung dịch đục); tan một phần trong ethanol 96%; thực tế không tan trong cloroform và ether.", "1, tr.869"]], "de": [["White to cream/light yellow crystals, flakes or powder, smooth to touch, bitter soapy taste, mild fatty odor.", "1, tr.869"], ["Easily soluble in water (cloudy solution); Partially soluble in 96% ethanol; Practically insoluble in chloroform and ether.", "1, tr.869"]], "a": "sodium lauryl sulfate sls sds sodium dodecyl sulfate natri lauryl sulfat 151-21-3 Sodium Lauryl Sulfate Sodium Laurilsulfate dodecyl sodium sulfate dodecylsulfate sodium salt Elfan 240 lauryl sodium sulfate lauryl sulfate, sodium salt monododecyl sodium sulfate natrii laurilsulfas sodium N-dodecyl sulfate sodium laurilsulfate sodium monododecyl sulfate sodium monolauryl sulfate SDS SLS penetration enhancer"}, {"id": "sodium-metabisulfite", "n": "Sodium Metabisulfite", "nv": "Sodium Metabisulfite; Sodium Pyrosulfite", "g": ["Chất bảo quản kháng khuẩn", "Chất chống oxy hóa"], "ge": ["Antimicrobial preservative", "Antioxidant"], "cas": "7681-57-4", "f": [["Dùng làm chất chống oxy hóa trong chế phẩm uống, tiêm và dùng ngoài ở nồng độ 0,01–1,0% kl/tt; chủ yếu dùng trong chế phẩm acid (chế phẩm kiềm dùng natri sulfit); có phần hoạt tính kháng khuẩn (mạnh ở pH acid).", "1, tr.873"]], "fe": [["Used as an antioxidant in oral, injectable and topical preparations at concentrations of 0.01–1.0% w/w; Mainly used in acid preparations (alkaline preparations using sodium sulfite); Has some antibacterial activity (strong at acidic pH).", "1, tr.873"]], "t": [["Phản ứng với thuốc cường giao cảm và dẫn chất o-/p-hydroxybenzyl alcol (như epinephrin) tạo dẫn chất sulfonic mất hoạt tính; tương kỵ với cloramphenicol; bất hoạt cisplatin; tương kỵ với muối phenylmercuric.", "1, tr.873"]], "te": [["Reactions with sympathomimetics and o-/p-hydroxybenzyl alcohol derivatives (such as epinephrine) create inactive sulfonic derivatives; Incompatible with chloramphenicol; inactivation of cisplatin; Incompatible with phenylmercuric salts.", "1, tr.873"]], "d": [["Tinh thể lăng trụ không màu hoặc bột kết tinh màu trắng đến trắng kem, mùi SO₂, vị acid mặn.", "1, tr.873"], ["Tan trong nước; tan trong glycerin; thực tế không tan trong ethanol.", "1, tr.873"]], "de": [["Colorless prismatic crystals or white to creamy white crystalline powder, SO₂ odor, salty acid taste.", "1, tr.873"], ["Soluble in water; soluble in glycerin; Practically insoluble in ethanol.", "1, tr.873"]], "a": "sodium metabisulfite natri metabisulfit sodium pyrosulfite 7681-57-4 E223 Sodium Metabisulfite Sodium Pyrosulfite Disodium disulfite disodium pyrosulfite disulfurous acid, sodium salt natrii disulfis natrii metabisulfis sodium acid sulfite sodium disulfite"}, {"id": "sodium-phosphate-dibasic", "n": "Sodium Phosphate, Dibasic", "nv": "Anhydrous Disodium Hydrogen Phosphate; Disodium Hydrogen Phosphate Dihydrate; Dibasic Sodium Phosphate Hydrate; Disodium Phosphate, Anhydrous; Disodium Phosphate Dodecahydrate", "g": ["Chất đệm", "Chất tạo phức"], "ge": ["Buffering agent", "Chelating / Complexing agent"], "cas": "7558-79-4, 10028-24-7, 10039-32-4", "f": [["Dùng rộng rãi làm chất đệm và tạo phức; cũng dùng làm chất nhũ hóa trong thực phẩm (phô mai chế biến).", "1, tr.876"]], "fe": [["Widely used as a buffer and complexing agent; also used as an emulsifier in foods (processed cheese).", "1, tr.876"]], "t": [["Tương kỵ với alkaloid, antipyrin, chloral hydrat, chì acetat, pyrogallol, resorcinol, calci gluconat và ciprofloxacin; tương tác calci–phosphat tạo tủa calci phosphat không tan trong dịch tiêm.", "1, tr.876"]], "te": [["Incompatible with alkaloids, antipyrin, chloral hydrate, lead acetate, pyrogallol, resorcinol, calcium gluconate and ciprofloxacin; Calcium–phosphate interaction precipitates insoluble calcium phosphate in the injection solution.", "1, tr.876"]], "d": [["Dạng khan là bột màu trắng; dạng ngậm nước (2, 7 hoặc 12 phân tử nước) là tinh thể không màu/trắng, lên hoa.", "1, tr.876"], ["Rất dễ tan trong nước (tan hơn trong nước nóng); thực tế không tan trong ethanol 95%.", "1, tr.876"]], "de": [["The anhydrous form is a white powder; The hydrated form (2, 7 or 12 water molecules) is colorless/white, flowering crystals.", "1, tr.876"], ["Very soluble in water (more soluble in hot water); Practically insoluble in 95% ethanol.", "1, tr.876"]], "a": "dibasic sodium phosphate natri phosphat dibasic disodium hydrogen phosphate 7558-79-4 E339 Dibasic Sodium Phosphate Hydrate Disodium Phosphate, Anhydrous Dibasic Sodium Phosphate Dinatrii phosphas anhydricus dinatrii phosphas dihydricus dinatrii phosphas dodecahydricus disodium phosphate phosphoric acid, disodium salt sec ondary sodium phosphate sodium orthophosphate Anhydrous Disodium Hydrogen Phosphate Disodium Hydrogen Phosphate Dihydrate Disodium Hydrogen Phosphate Dodecahydrate Disodium Phosphate Dihydrate Disodium Phosphate Dodecahydrate"}, {"id": "sodium-phosphate-monobasic", "n": "Sodium Phosphate, Monobasic", "nv": "Sodium Dihydrogen Phosphate Dihydrate; Monobasic Sodium Phosphate", "g": ["Chất đệm", "Chất tạo phức"], "ge": ["Buffering agent", "Chelating / Complexing agent"], "cas": "7558-80-7, 10049-21-5, 13472-35-0", "f": [["Dùng rộng rãi làm chất đệm và tạo phức; trong thực phẩm làm chất acid hóa và tạo phức khô.", "1, tr.879"]], "fe": [["Widely used as a buffer and complexing agent; in foods as an acidifier and dry complexing agent.", "1, tr.879"]], "t": [["Là muối acid nên tương kỵ với chất kiềm và carbonat (dung dịch acid làm carbonat sủi bọt); không nên dùng đồng thời với muối nhôm, calci, magnesi (gắn phosphat); tương tác calci–phosphat tạo tủa.", "1, tr.879"]], "te": [["Being an acid salt, it is incompatible with alkalis and carbonates (acid solutions make carbonates foam); Should not be used concurrently with aluminum, calcium, magnesium salts (phosphate binding); Calcium–phosphate interaction causes precipitation.", "1, tr.879"]], "d": [["Dạng ngậm nước là tinh thể không màu/trắng, hơi chảy nước; dạng khan là bột hoặc hạt kết tinh màu trắng, không mùi.", "1, tr.879"], ["Tan 1 trong 1 phần nước; rất ít tan trong ethanol 95%.", "1, tr.879"]], "de": [["The hydrated form is a colorless/white, slightly watery crystal; The anhydrous form is a white, odorless crystalline powder or granule.", "1, tr.879"], ["Dissolve 1 part in 1 part water; Very slightly soluble in 95% ethanol.", "1, tr.879"]], "a": "monobasic sodium phosphate natri phosphat monobasic sodium dihydrogen phosphate 7558-80-7 E339 Monobasic Sodium Phosphate Acid sodium phosphate Kalipol 32 monosodium orthopho sphate monosodium phosphate natrii dihydrogenophosphas dihydricus phosphoric acid, monosodium salt primary sodium phosphate sodium biphosphate sodium dihydrogen orthopho sphate Sodium Dihydrogen Phosphate Dihydrate"}, {"id": "sodium-polystyrene-sulfonate", "n": "Sodium Polystyrene Sulfonate", "nv": "Sodium Polystyrene Sulfonate", "g": ["Chất tạo phức", "Tá dược phóng thích biến đổi", "Chất làm tăng độ tan", "Chất che vị"], "ge": ["Chelating / Complexing agent", "Modified-release agent", "Solubilizing agent", "Taste-masking agent"], "cas": "9003-59-2", "f": [["Là nhựa trao đổi cation; tạo phức ('resinat') với thuốc để điều biến giải phóng, cải thiện độ tan và che vị; ion Na⁺ được thay bằng cation thuốc; mức nạp thuốc điển hình 5–75% dung lượng trao đổi (~5 mEq/g).", "1, tr.882"]], "fe": [["Is a cation exchange resin; forming complexes ('resinates') with drugs to modulate release, improve solubility and mask taste; Na⁺ ion is replaced by drug cation; Typical loading levels are 5–75% of exchange capacity (~5 mEq/g).", "1, tr.882"]], "t": [["Tương kỵ với chất oxy hóa.", "1, tr.882"]], "te": [["Incompatible with oxidizing agents.", "1, tr.882"]], "d": [["Bột màu gần trắng, nâu nhạt hoặc nâu vàng (dạng hạt cầu 0,2–1,2 mm).", "1, tr.882"], ["Thực tế không tan trong nước, ethanol 96%, methylen clorid, aceton và ether.", "1, tr.882"]], "de": [["Nearly white, light brown or yellow brown powder (0.2–1.2 mm globules).", "1, tr.882"], ["Practically insoluble in water, 96% ethanol, methylene chloride, acetone and ether.", "1, tr.882"]], "a": "sodium polystyrene sulfonate natri polystyren sulfonat 9003-59-2 Sodium Polystyrene Sulfonate Sodium Polystyrene Sulphonate AMBERLITE IRP69 Kayexalate Kionex natrii polystyrenesulfonas polistirex Resonium Â Solystat"}, {"id": "sodium-propionate", "n": "Sodium Propionate", "nv": "Sodium Propionate", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "6700-17-0, 137-40-6", "f": [["Dùng trong chế phẩm uống làm chất bảo quản kháng khuẩn; như acid propionic, có tính kìm nấm và kìm khuẩn với một số cầu khuẩn Gram dương; mạnh với nấm mốc hơn natri benzoat, gần như không tác dụng với nấm men; cũng dùng bảo quản thuốc nhỏ mắt.", "1, tr.884"]], "fe": [["Used in oral preparations as an antibacterial preservative; such as propionic acid, which has fungistatic and bacteriostatic properties against some Gram-positive cocci; Stronger against mold than sodium benzoate, almost ineffective against yeast; Also used to preserve eye drops.", "1, tr.884"]], "t": [["Tương kỵ tương tự các acid hữu cơ yếu khác.", "1, tr.884"]], "te": [["Incompatibility is similar to other weak organic acids.", "1, tr.884"]], "d": [["Tinh thể trong không màu hoặc bột kết tinh trơn chảy, không mùi hoặc mùi nhẹ, chảy nước trong không khí ẩm, vị hơi như phô mai.", "1, tr.884"], ["Tan 1 trong 1 phần nước; tan 1 trong 24 phần ethanol 95%; thực tế không tan trong cloroform, ether.", "1, tr.884"]], "de": [["Colorless clear crystals or smooth flowing crystalline powder, odorless or slight odor, watery in moist air, slightly cheese-like taste.", "1, tr.884"], ["Dissolve 1 part in 1 part water; soluble in 1 in 24 parts of 95% ethanol; Practically insoluble in chloroform and ether.", "1, tr.884"]], "a": "sodium propionate natri propionat 137-40-6 E281 Sodium Propionate ethylformic acid, sodium salt methylacetic acid, sodium salt napropion natrii propionas prophyllin sodium propanoate sodium propionate. 2"}, {"id": "sodium-starch-glycolate", "n": "Sodium Starch Glycolate", "nv": "Sodium Starch Glycolate", "g": ["Tá dược rã (viên nén/nang)"], "ge": ["Tablet / capsule disintegrant"], "cas": "9063-38-1", "f": [["Dùng rộng rãi làm tá dược rã cho viên nang và viên nén đường uống; dùng trong cả dập thẳng và xát hạt ướt; nồng độ thường 2–8%; lực nén không ảnh hưởng thời gian rã.", "1, tr.887"]], "fe": [["Widely used as a disintegrant for oral capsules and tablets; used in both straight stamping and wet granulation; Concentrations are typically 2–8%; Compression force does not affect disintegration time.", "1, tr.887"]], "t": [["Tương kỵ với acid ascorbic.", "1, tr.887"]], "te": [["Incompatible with ascorbic acid.", "1, tr.887"]], "d": [["Bột trơn chảy màu trắng/gần trắng, rất hút ẩm; hạt hình bầu dục/quả lê 30–100 µm hoặc tròn 10–35 µm.", "1, tr.887"], ["Không tan trong nước nhưng trương mạnh (có thể tới 300 lần thể tích).", "1, tr.887"]], "de": [["White/almost white, slippery powder, very hygroscopic; Seeds are oval/pear-shaped 30–100 µm or round 10–35 µm.", "1, tr.887"], ["Insoluble in water but swells strongly (up to 300 times its volume).", "1, tr.887"]], "a": "sodium starch glycolate natri starch glycolat explotab primojel 9063-38-1 Sodium Starch Glycolate Carboxymethyl starch, sodium salt carboxymethylamylum natricum Explosol Explotab Glycolys Primoịel SSG Sanaq starch carboxymethyl ether, sodium salt Tablo Vivastar Low pH Viva star p"}, {"id": "sodium-stearate", "n": "Sodium Stearate", "nv": "Sodium Stearate", "g": ["Chất nhũ hóa", "Chất tạo gel", "Chất điều hòa sự chảy", "Tá dược phóng thích biến đổi", "Chất làm tăng độ đặc", "Tá dược trơn bóng (viên nén/nang)"], "ge": ["Emulsifying agent", "Gelling agent", "Glidant", "Modified-release agent", "Stiffening agent", "Tablet / capsule glidant"], "cas": "822-16-2", "f": [["Dùng làm chất nhũ hóa và làm cứng trong kem dùng ngoài và chế phẩm trực tràng (thuốc đặt glycerin); làm tá dược trơn viên nén/nang; làm chất điều hòa trơn chảy và điều biến giải phóng; dùng trong vi nhũ tương.", "1, tr.891"]], "fe": [["Used as an emulsifier and hardening agent in topical creams and rectal preparations (glycerin suppositories); as excipient for smooth tablets/capsules; as a flow regulator and release modulator; used in microemulsions.", "1, tr.891"]], "t": [["Tương kỵ với acid mạnh và chất oxy hóa.", "1, tr.891"]], "te": [["Incompatible with strong acids and oxidizing agents.", "1, tr.891"]], "d": [["Bột mịn màu trắng hoặc hơi vàng, trơn nhờn khi sờ, mùi nhẹ như mỡ.", "1, tr.891"]], "de": [["White or slightly yellow fine powder, greasy to the touch, light smell like grease.", "1, tr.891"]], "a": "sodium stearate natri stearat 822-16-2 Sodium Stearate Kemilub ES natrii stearas octadecanoic acid, sodium salt Prodhygine stearic acid, sodium salt"}, {"id": "sodium-stearyl-fumarate", "n": "Sodium Stearyl Fumarate", "nv": "Sodium Stearyl Fumarate", "g": ["Tá dược trơn bóng (viên nén/nang)"], "ge": ["Tablet / capsule glidant"], "cas": "4070-80-8", "f": [["Dùng làm tá dược trơn cho viên nang và viên nén ở nồng độ 0,5–2,0% kl/kl (thay thế cho magnesi stearat, ít làm chậm hòa tan hơn).", "1, tr.892"]], "fe": [["Used as a plain excipient for capsules and tablets at concentrations of 0.5–2.0% w/w (replacement for magnesium stearate, less retards dissolution).", "1, tr.892"]], "t": [["Tương kỵ với chlorhexidin acetat; là muối natri nên có các tương kỵ điển hình của muối natri ở hoạt độ nước cao; amin bậc 1 có thể cộng vào nối đôi olefin của phần fumarat.", "1, tr.892"]], "te": [["Incompatible with chlorhexidine acetate; is a sodium salt so it has typical incompatibilities of sodium salts at high water activity; Primary amines can add to the olefin double bond of the fumarate portion.", "1, tr.892"]], "d": [["Bột mịn màu trắng gồm các cụm tiểu phân dạng phiến lục giác ~5–10 µm; điểm chảy 224–245 °C (kèm phân hủy).", "1, tr.892"]], "de": [["White fine powder consisting of ~5–10 µm hexagonal lamellar particle clusters; melting point 224–245 °C (with decomposition).", "1, tr.892"]], "a": "sodium stearyl fumarate natri stearyl fumarat pruv 4070-80-8 Sodium Stearyl Fumarate Lubripharm-, natrii stearylis fumaras Pruv sodium monostearyl fumarate. 3 CO2N8"}, {"id": "sodium-sulfite", "n": "Sodium Sulfite", "nv": "Sodium Sulfite; Dried Sodium Sulfite", "g": ["Chất bảo quản kháng khuẩn", "Chất chống oxy hóa"], "ge": ["Antimicrobial preservative", "Antioxidant"], "cas": "7757-83-7", "f": [["Dùng làm chất chống oxy hóa tương tự natri metabisulfit; cũng là chất bảo quản kháng khuẩn hiệu quả (nhất là với nấm ở pH thấp); ưu tiên trong chế phẩm kiềm.", "1, tr.895"]], "fe": [["Used as an antioxidant similar to sodium metabisulfite; It is also an effective antibacterial preservative (especially against fungi at low pH); Priority in alkaline preparations.", "1, tr.895"]], "t": [["Tương kỵ với acid, chất oxy hóa, nhiều protein và vitamin B1. Xem thêm Natri metabisulfit.", "1, tr.895"]], "te": [["Incompatible with acids, oxidants, many proteins and vitamin B1. See also Sodium metabisulfite.", "1, tr.895"]], "d": [["Bột màu trắng không mùi hoặc tinh thể lăng trụ lục giác.", "1, tr.895"], ["Tan 1 trong 3,2 phần nước; tan trong glycerin; thực tế không tan trong ethanol 96%, aceton.", "1, tr.895"]], "de": [["Odorless white powder or hexagonal prismatic crystals.", "1, tr.895"], ["Dissolve 1 in 3.2 parts water; soluble in glycerin; Practically insoluble in 96% ethanol and acetone.", "1, tr.895"]], "a": "sodium sulfite natri sulfit 7757-83-7 E221 Sodium Sulfite Dried Sodium Sulfite Disodium sulfite exsiccated sodium sulfite natrii sulfis anhydricus natrii sulfis siccatus"}, {"id": "sodium-thiosulfate", "n": "Sodium Thiosulfate", "nv": "Sodium Thiosulfate; Sodium Thiosulfate Hydrate", "g": ["Chất chống oxy hóa"], "ge": ["Antioxidant"], "cas": "7772-98-7, 10102-17-7", "f": [["Dùng làm chất chống oxy hóa trong chế phẩm dược (nhỏ mắt, tiêm tĩnh mạch và uống).", "1, tr.897"]], "fe": [["Used as an antioxidant in pharmaceutical preparations (eye drops, intravenous injection and oral administration).", "1, tr.897"]], "t": [["Tương kỵ với iod, acid, và muối calci, chì, thủy ngân, bạc; có thể làm giảm hoạt tính của một số chất bảo quản (bronopol, muối phenylmercuric, thimerosal).", "1, tr.897"]], "te": [["Incompatible with iodine, acids, and calcium salts, lead, mercury, silver; May reduce the activity of some preservatives (bronopol, phenylmercuric salt, thimerosal).", "1, tr.897"]], "d": [["Tinh thể không màu, bột kết tinh hoặc hạt, không mùi; lên hoa trong không khí khô, chảy nước trong không khí ẩm.", "1, tr.897"], ["Tan trong nước; thực tế không tan trong ethanol 95%.", "1, tr.897"]], "de": [["Colorless crystals, crystalline powder or granules, odorless; Flowers in dry air, water in moist air.", "1, tr.897"], ["Soluble in water; Practically insoluble in 95% ethanol.", "1, tr.897"]], "a": "sodium thiosulfate natri thiosulfat 7772-98-7 Sodium Thiosulfate Sodium Thiosulphate Sodium Thiosulfate Hydrate Ametox disodium thiosulfate disodium thiosulfate pentahydrate natrii thiosulfas natrium thiosulfuricum sodium hyposulfite sodium subsulfite Sodothiol Sulfothiorine thiosulfuric acid disodium salt"}, {"id": "sorbic-acid", "n": "Sorbic Acid", "nv": "Sorbic Acid", "g": ["Chất bảo quản kháng khuẩn"], "ge": ["Antimicrobial preservative"], "cas": "22500-92-1", "f": [["Là chất bảo quản kháng khuẩn (kháng khuẩn và kháng nấm) dùng trong dược phẩm và chế phẩm dinh dưỡng đường ruột; thường ở 0,05–0,2% trong chế phẩm uống và dùng ngoài, nhất là loại chứa chất diện hoạt không ion; chủ yếu là chất kháng nấm; hoạt tính tối thiểu ở pH >6.", "1, tr.899"]], "fe": [["As an antibacterial (antibacterial and antifungal) preservative used in pharmaceuticals and enteral nutrition products; usually at 0.05–0.2% in oral and topical preparations, especially those containing non-ionic surfactants; mainly antifungal; Minimal activity at pH >6.", "1, tr.899"]], "t": [["Tương kỵ với base, chất oxy hóa và chất khử; giảm hoạt tính khi có chất diện hoạt không ion và chất dẻo; muối kim loại nặng xúc tác oxy hóa; phản ứvới amino acid chứa lưu huỳnh (ngăn bằng acid ascorbic, propyl gallat hoặc BHT).", "1, tr.899"]], "te": [["Incompatible with bases, oxidizing agents and reducing agents; Reduced activity in the presence of non-ionic surfactants and plasticizers; Heavy metal salts catalyze oxidation; Reacts with sulfur-containing amino acids (prevented with ascorbic acid, propyl gallate or BHT).", "1, tr.899"]], "d": [["Bột kết tinh màu trắng đến trắng vàng, không vị, mùi nhẹ đặc trưng.", "1, tr.899"], ["Tan 1 trong 8 phần ethanol; tan 1 trong 400 phần nước; ít tan trong cloroform (1 trong 15).", "1, tr.899"]], "de": [["White to yellowish white crystalline powder, tasteless, characteristic mild odor.", "1, tr.899"], ["Dissolves 1 in 8 parts ethanol; Dissolve 1 in 400 parts water; Slightly soluble in chloroform (1 in 15).", "1, tr.899"]], "a": "sorbic acid acid sorbic 110-44-1 E200 Sorbic Acid Acidum sorbicum (2-butenylidene) acetic acid crotylidene acetic acid hexadienic acid hexadienoic acid 2,4-hexadienoic acid 1,3-pentadiene-l-carboxylic acid 2-propenylacrylic acid (E,E)-sorbic acid Sorbistat"}, {"id": "sorbitan-esters", "n": "Sorbitan Esters", "nv": "Sorbitan Sesquioleate; Sorbitan Trioleate; Sorbitan Laurate; Sorbitan Palmitate; Sorbitan Stearate; Sorbitan Monooleate", "g": ["Chất phân tán", "Chất nhũ hóa", "Chất diện hoạt không ion hóa", "Chất làm tăng độ tan", "Chất gây treo", "Tá chất vaccine"], "ge": ["Dispersing agent", "Emulsifying agent", "Nonionic surfactant", "Solubilizing agent", "Suspending agent", "Vaccine adjuvant"], "cas": "", "f": [["Là chất diện hoạt không ion ưa lipid; chủ yếu dùng làm chất nhũ hóa trong kem, nhũ tương và thuốc mỡ dùng ngoài; đơn độc tạo nhũ tương nước/dầu và vi nhũ tương bền, thường phối hợp với polysorbat để đạt HLB mong muốn.", "1, tr.902"]], "fe": [["It is a lipophilic non-ionic surfactant; Mainly used as an emulsifier in topical creams, emulsions and ointments; Creates stable water/oil emulsions and microemulsions alone, often combined with polysorbate to achieve the desired HLB.", "1, tr.902"]], "t": [["Tài liệu chưa đề cập.", "1, tr.902"]], "te": [["Documents not mentioned.", "1, tr.902"]], "d": [["Chất lỏng hoặc rắn màu kem đến hổ phách, mùi và vị đặc trưng; là hỗn hợp ester một phần của sorbitol và anhydrid của nó với acid béo.", "1, tr.902"], ["Nói chung tan hoặc phân tán trong dầu; tan trong đa số dung môi hữu cơ; không tan nhưng phân tán trong nước.", "1, tr.902"]], "de": [["Cream to amber colored liquid or solid, characteristic odor and taste; is a mixture of partial esters of sorbitol and its anhydride with fatty acids.", "1, tr.902"], ["Generally soluble or dispersed in oil; Soluble in most organic solvents; insoluble but dispersible in water.", "1, tr.902"]], "a": "sorbitan esters sorbitan ester span sorbitan monooleate sorbitan monostearate sorbitan monolaurate 1338-41-6 E491 Sorbitan Sesquioleate Sorbitan Laurate Sorbitan Monolaurate (sorbitan, esters monodecanoate) 2 See Table I Sorbitan Trioleate Sorbitan Oleate Sorbitan Palmitate Sorbitan Stearate Sorbitan Monooleate Sorbitan Monopalmitate Sorbitan Monostearate Span 20 Span 25 Span 40 Span 60 Span 65 Span 80 Span 85 Arlacel 20 Arlacel 40 Arlacel 60 Arlacel 80 Arlacel 83 Arlacel 85 Arlacel 987 E492 E493 E494 E495 sorbitan laurate sorbitan palmitate sorbitan stearate sorbitan oleate sorbitan monopalmitate sorbitan sesquioleate sorbitan trioleate"}, {"id": "sorbitol", "n": "Sorbitol", "nv": "Sorbitol", "g": ["Chất giữ ẩm", "Chất hóa dẻo", "Chất tạo ngọt", "Tá dược độn (viên nén/nang)"], "ge": ["Humectant", "Plasticizer", "Sweetening agent", "Tablet / capsule diluent"], "cas": "50-70-4", "f": [["Dùng rộng rãi làm tá dược độn trong viên nén (xát hạt ướt hoặc dập thẳng); đặc biệt hữu ích trong viên nhai nhờ vị ngọt và cảm giác mát; nghiên cứu trong viên/pellet rã nhanh và bột hít; trong nang dùng làm chất hóa dẻo cho gelatin.", "1, tr.906"]], "fe": [["Widely used as a filler excipient in tablets (wet granulation or straight stamping); Especially useful in chewable tablets due to its sweet taste and cooling sensation; studies in rapidly disintegrating tablets/pellets and inhalation powders; In capsules, it is used as a plasticizer for gelatin.", "1, tr.906"]], "t": [["Tạo chelat tan với nhiều ion kim loại hóa trị 2 và 3 ở điều kiện acid/kiềm mạnh; thêm PEG lỏng tạo gel sáp; phản ứvới oxid sắt gây đổi màu; làm tăng tốc độ phân hủy penicillin trong dung dịch nước trung tính.", "1, tr.906"]], "te": [["Create soluble chelates with many divalent and trivalent metal ions under strong acid/alkaline conditions; Add liquid PEG to create wax gel; reacts with iron oxide causing discoloration; accelerates the decomposition of penicillin in neutral aqueous solutions.", "1, tr.906"]], "d": [["Bột hoặc hạt kết tinh màu trắng, vị ngọt, tạo cảm giác mát.", "1, tr.906"], ["Rất dễ tan trong nước; ít tan trong ethanol.", "1, tr.906"]], "de": [["White crystalline powder or granules, sweet taste, creating a cool feeling.", "1, tr.906"], ["Very soluble in water; Slightly soluble in ethanol.", "1, tr.906"]], "a": "sorbitol d-sorbitol glucitol 50-70-4 E420 Sorbitol D-Sorbitol C''PharmSorbidex 1,2,3,4,5,6-hexanehexol Liponic 70NC Liponic 76-NC Merisorb Meritol Neosorb Sorbitab Sorbitab SD 250 sorbite D-sorbitol Sorbitol Instant Sorbitol special sorbitolum Sorbogem"}, {"id": "soybean-oil", "n": "Soybean Oil", "nv": "Soybean Oil; Refined Soya Oil; Soya-Bean Oil, Refined", "g": ["Tá dược dầu", "Dung môi"], "ge": ["Oleaginous vehicle", "Solvent"], "cas": "8001-22-7", "f": [["Nhũ tương chứa dầu đậu nành dùng làm tá dược cho thuốc uống và tiêm tĩnh mạch (nhũ tương lipid tiêm trong nuôi dưỡng ngoài đường tiêu hóa); nhiều thuốc kém tan được đưa vào nhũ tương này (amphotericin, diazepam, retinoid, vitamin, steroid, ibuprofen).", "1, tr.910"]], "fe": [["Emulsions containing soybean oil used as excipients for oral and intravenous drugs (lipid emulsions for injection in parenteral nutrition); Many poorly soluble drugs are included in this emulsion (amphotericin, diazepam, retinoids, vitamins, steroids, ibuprofen).", "1, tr.910"]], "t": [["Nhũ tương dầu đậu nành tương kỵ ở 25 °C với calci clorid, calci gluconat, magnesi clorid, phenytoin natri và tetracyclin hydroclorid.", "1, tr.910"]], "te": [["Soybean oil emulsion is incompatible at 25 °C with calcium chloride, calcium gluconate, magnesium chloride, phenytoin sodium and tetracycline hydrochloride.", "1, tr.910"]], "d": [["Dầu tinh chế từ hạt đậu nành Glycine max.", "1, tr.910"], ["Thực tế không tan trong ethanol 95% và nước; trộn lẫn với ether, cloroform và ether dầu hỏa.", "1, tr.910"]], "de": [["Oil refined from soybeans Glycine max.", "1, tr.910"], ["Practically insoluble in 95% ethanol and water; miscible with ether, chloroform and petroleum ether.", "1, tr.910"]], "a": "soybean oil dau dau nanh soya oil 8001-22-7 Soybean Oil Refined Soya Oil Soya-Bean Oil, Refined Aceite de soja Calchem IVO-114 Lipex 107 Lipex 200 Shogun CT soiae oleum raffinatum soja bean oil soyabean oil"}, {"id": "squalane", "n": "Squalane", "nv": "Squalane", "g": ["Chất làm mềm da", "Tá dược thuốc mỡ", "Chất tăng thấm"], "ge": ["Emollient", "Ointment base", "Permeation enhancer"], "cas": "111-01-3", "f": [["Dùng trong chế phẩm dùng ngoài để tăng thấm qua da (do trộn lẫn với bã nhờn người); làm chất mang thuốc tan trong lipid cho thuốc đặt; làm tá chất vaccine và thành phần vi/nhũ tương nano; làm chất làm mềm trong mỹ phẩm.", "1, tr.913"]], "fe": [["Used in external preparations to increase skin permeability (due to mixing with human sebum); as a lipid-soluble drug carrier for suppositories; as vaccine adjuvant and micro/nano emulsion component; as an emollient in cosmetics.", "1, tr.913"]], "t": [["Tương kỵ với chất oxy hóa.", "1, tr.913"]], "te": [["Incompatible with oxidizing agents.", "1, tr.913"]], "d": [["Là hydrocarbon no (dẫn chất hydrogen hóa của squalen), thành phần của bã nhờn người.", "1, tr.913"], ["Thực tế không tan trong nước và ethanol 96%; trộn lẫn với cloroform, ether và đa số chất béo, dầu; dễ tan trong aceton và cyclohexan.", "1, tr.913"]], "de": [["A saturated hydrocarbon (hydrogenated derivative of squalene), a component of human sebum.", "1, tr.913"], ["Practically insoluble in water and 96% ethanol; mixed with chloroform, ether and most fats and oils; Easily soluble in acetone and cyclohexane.", "1, tr.913"]], "a": "squalane squalan 111-01-3 Squalane Carolane Cosbiol dodecahydrosqualene Fitoderm perhydrosqua lene Phytolane LS Robane spinacane squalanum Vitabiosol Wax-O-SoL 6 Functional Category Emollient ointment base penetration enhancer. 7"}, {"id": "starch", "n": "Starch", "nv": "Corn Starch; Maize Starch", "g": ["Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Tá dược rã (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Tablet / capsule binder", "Tablet / capsule diluent", "Tablet / capsule disintegrant", "Viscosity-increasing agent"], "cas": "9005-25-8", "f": [["Chủ yếu dùng trong dạng rắn uống làm tá dược dính, độn và rã; làm chất độn để chuẩn hóa hỗn hợp phẩm màu/hoạt chất mạnh; dùng trong nang đóng khô để điều chỉnh thể tích và cải thiện lưu tính; 10% kl/kl có thể làm chất chống dính và điều hòa trơn chảy.", "1, tr.915"]], "fe": [["Mainly used in oral solid form as a binding, bulking and disintegrating excipient; as a filler to standardize strong color/active ingredient mixtures; used in dry capsules to adjust volume and improve fluidity; 10% w/kl can make non-stick and smooth-flowing conditioner.", "1, tr.915"]], "t": [["Tương kỵ với chất oxy hóa mạnh; tạo hợp chất bao màu với iod.", "1, tr.915"]], "te": [["Incompatible with strong oxidizing agents; Create color coating compounds with iodine.", "1, tr.915"]], "d": [["Bột mịn màu trắng đến trắng ngà, không mùi, không vị; gồm các hạt cầu/bầu dục rất nhỏ, cỡ và hình đặc trưng theo loài.", "1, tr.915"], ["Thực tế không tan trong ethanol 96% lạnh và nước lạnh; trương ~5–10% trong nước ở 37 °C; tan trong nước nóng trên nhiệt độ hồ hóa.", "1, tr.915"]], "de": [["White to off-white fine powder, odorless, tasteless; Consists of very small spherical/oval particles, typical size and shape depending on the species.", "1, tr.915"], ["Practically insoluble in cold 96% ethanol and cold water; swells ~5–10% in water at 37 °C; Soluble in hot water above gelatinization temperature.", "1, tr.915"]], "a": "starch tinh bot corn starch maize starch potato starch 9005-25-8 Corn Starch Maize Starch 5 Amido amidon amilo amylum Claria C*PharmGel Eurylon fecule Farmal, Hylon Marisita maydis amylum Melojel Meritena oryzae amylum Perfectamyl, pisi amylum Pure-Dent Purity, Remy, solani amylum Starkina', tritici amylum"}, {"id": "starch-modified", "n": "Starch, Modified", "nv": "Tinh bột biến tính", "g": ["Vật liệu vỏ nang", "Chất tạo màng bao", "Chất ổn định nhũ tương", "Chất nhũ hóa", "Tá dược phóng thích biến đổi", "Tá dược dính (viên nén/nang)", "Chất làm tăng độ nhớt"], "ge": ["Capsule shell material", "Coating agent", "Emulsion stabilizer", "Emulsifying agent", "Modified-release agent", "Tablet / capsule binder", "Viscosity-increasing agent"], "cas": "", "f": [["Loại độ nhớt thấp dùng làm tá dược dính khi xát hạt ướt; một số loại dùng tạo màng bao (chức năng và không chức năng) hoặc làm vật liệu vỏ nang/nang mềm; loại octenyl succinat (E1450) làm chất nhũ hóa; cũng làm chất làm đặc và ổn định.", "1, tr.921"]], "fe": [["Low viscosity type used as adhesive excipient when rubbing wet granules; Some types are used to form capsules (functional and non-functional) or as capsule/soft capsule material; type octenyl succinate (E1450) as an emulsifier; Also works as a thickener and stabilizer.", "1, tr.921"]], "t": [["Tương kỵ với chất oxy hóa mạnh; tạo hợp chất bao màu với iod.", "1, tr.921"]], "te": [["Incompatible with strong oxidizing agents; Create color coating compounds with iodine.", "1, tr.921"]], "d": [["Bột mịn màu trắng đến trắng ngà, không mùi, không vị.", "1, tr.921"], ["Grade dạng hạt thực tế không tan trong ethanol 96% và nước lạnh; loại hồ hóa tan một phần trong nước lạnh và tạo độ nhớt.", "1, tr.921"]], "de": [["White to off-white fine powder, odorless, tasteless.", "1, tr.921"], ["Granular grade is practically insoluble in 96% ethanol and cold water; Gelatin is partially soluble in cold water and creates viscosity.", "1, tr.921"]], "a": "modified starch tinh bot bien tinh octenyl succinate starch e1450 Amprac amylum modificatum C*Pharm Capsul Clearam Cleargum E1401-1452 Hi-Cap Instant Pure-Cote Lycoat Pure-Cote Pure-Gel Purity Purity Gum"}, {"id": "starch-pregelatinized", "n": "Starch, Pregelatinized", "nv": "Pregelatinised Starch; Starch, Pregelatinised", "g": ["Tá dược dính (viên nén/nang)", "Tá dược độn (viên nén/nang)", "Tá dược rã (viên nén/nang)"], "ge": ["Tablet / capsule binder", "Tablet / capsule diluent", "Tablet / capsule disintegrant"], "cas": "9005-25-8", "f": [["Dùng trong viên nang và viên nén làm tá dược dính, độn và rã; so với tinh bột thường có lưu tính và tính nén cải thiện nên dùng làm tá dược dính trong dập thẳng; loại hồ hóa hoàn toàn tự bôi trơn, nhưng khi phối hợp tá dược khác có thể cần thêm chất trơn (magnesi stearat ~0,25%).", "1, tr.924"]], "fe": [["Used in capsules and tablets as a binding, bulking and disintegrating excipient; Compared to regular starch, it has improved fluidity and compressibility, so it is used as an adhesive excipient in straight stamping; The gelatinized type is completely self-lubricating, but when combining other excipients, additional lubricants may be needed (magnesium stearate ~0.25%).", "1, tr.924"]], "t": [["Xem mục Tinh bột (tương kỵ với chất oxy hóa mạnh).", "1, tr.924"]], "te": [["See Starch section (incompatible with strong oxidizing agents).", "1, tr.924"]], "d": [["Bột thô đến mịn màu trắng đến trắng ngà, không mùi, vị nhẹ đặc trưng.", "1, tr.924"], ["Thực tế không tan trong dung môi hữu cơ; tan một phần trong nước lạnh tùy mức hồ hóa.", "1, tr.924"]], "de": [["Coarse to fine white to ivory white powder, odorless, characteristic mild taste.", "1, tr.924"], ["Practically insoluble in organic solvents; Partially soluble in cold water depending on the degree of gelatinization.", "1, tr.924"]], "a": "pregelatinized starch tinh bot ho hoa starch 1500 9005-25-8 Pregelatinised Starch Starch, Pregelatinised Pregelatinized Starch Amylum pregelificatum compressible starch C>:'PharmGel Instastarch Lycatab C Lycatab PGS Merigel National 78-1551 Pharma-Gel Preịel Sepistab ST200 Spress B820 Starch 1500 G Tablitz Unipưre LD Unipure WG220"}, {"id": "starch-sterilizable-maize", "n": "Starch, Sterilizable Maize", "nv": "Absorbable Dusting Powder", "g": ["Tá dược trơn"], "ge": ["Lubricant"], "cas": "", "f": [["Là tinh bột ngô biến tính không hồ hóa khi gặp ẩm/hơi tiệt khuẩn; chủ yếu dùng làm chất bôi trơn cho găng khám và găng phẫu thuật (nay ít khuyến cáo vì lo ngại an toàn); cũng làm tá dược cho bột rắc dược.", "1, tr.928"]], "fe": [["Is modified corn starch that does not gelatinize when exposed to moisture/sterilized steam; Mainly used as a lubricant for examination and surgical gloves (now rarely recommended due to safety concerns); Also used as an excipient for medicinal powder.", "1, tr.928"]], "t": [["Tài liệu chưa đề cập.", "1, tr.928"]], "te": [["Documents not mentioned.", "1, tr.928"]], "d": [["Bột trơn chảy màu trắng, không mùi; hạt tròn hoặc đa diện.", "1, tr.928"], ["Rất ít tan trong cloroform và ethanol 95%; thực tế không tan trong nước.", "1, tr.928"]], "de": [["White, odorless, slippery
