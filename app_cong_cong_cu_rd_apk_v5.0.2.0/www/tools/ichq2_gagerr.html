<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thẩm định Phương pháp ICH Q2 & Gage R&R — Cổng RD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --fg: #1f1f1f;
  --muted: #5f6368;
  --line: #dce5ef;
  --grid-line: #cfd9e6;
  --accent: #1558B0;
  --accent-soft: #eaf1fa;
  --ok: #137333;
  --ok-soft: #e6f4ea;
  --warn: #b06000;
  --warn-soft: #fef7e0;
  --danger: #b3261e;
  --danger-soft: #fce8e6;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
}
:root[data-theme="dark"] {
  --bg: #121316;
  --surface: #1e1f22;
  --surface-2: #282a2e;
  --fg: #e3e3e3;
  --muted: #9aa0a6;
  --line: #2d3540;
  --grid-line: #363f4d;
  --accent: #3b8cf5;
  --accent-soft: #162436;
  --ok: #81c995;
  --ok-soft: rgba(129, 201, 149, 0.14);
  --warn: #fdd663;
  --warn-soft: rgba(253, 214, 99, 0.14);
  --danger: #f28b82;
  --danger-soft: rgba(242, 139, 130, 0.14);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13.5px;
  line-height: 1.48;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 1240px;
  margin: 0 auto;
  padding: 10px 12px 36px;
}

/* Navigation Tabs (No language/theme toggles — controlled by parent portal) */
.nav-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 5px 6px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}
.tabs {
  display: flex;
  gap: 4px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 7px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.tab-btn:hover { background: var(--surface-2); color: var(--fg); }
.tab-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 28%, transparent);
}

.panel { display: none; }
.panel.active { display: block; }

/* Cards & Layout */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.card-title { margin: 0; font-size: 14.5px; font-weight: 700; color: var(--fg); }
.card-sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 820px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 420px) {
  .app { padding: 8px 8px 28px; }
  .card { padding: 11px; }
  .grid-4 { grid-template-columns: 1fr 1fr; gap: 8px; }
}

/* Controls */
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--fg);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 6px 11px;
  min-height: 32px;
  border-radius: 7px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background 0.15s, border-color 0.15s, opacity 0.15s;
}
.btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.btn-primary:hover { background: var(--accent); color: #ffffff; opacity: 0.9; }
.btn-sm { padding: 4px 9px; min-height: 28px; font-size: 12px; }
.btn-xs { padding: 2px 6px; min-height: 22px; font-size: 11px; border-radius: 4px; }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

.field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
.field label { font-size: 11.5px; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="number"], select, textarea {
  width: 100%;
  background: var(--surface-2);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 9px;
  font-family: inherit;
  font-size: 12.5px;
  transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

.inline-fields {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin-bottom: 10px;
}
.inline-fields .field { margin-bottom: 0; flex: 1; min-width: 120px; }

.check-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--fg);
  cursor: pointer;
  min-height: 32px;
}

.seg {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 2px;
  gap: 2px;
  flex-wrap: wrap;
}
.seg-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 11px;
  border-radius: 5px;
  cursor: pointer;
}
.seg-btn.active { background: var(--accent); color: #ffffff; }

/* Standard Result Tables */
.tw {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-bottom: 8px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  background: var(--surface);
}
th, td {
  padding: 6px 9px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
}
th {
  background: var(--surface-2);
  color: var(--muted);
  font-weight: 700;
  font-size: 11.5px;
}
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 140px; }

/* =========================================================================
   COMPACT EXCEL-LIKE SPREADSHEET INPUT GRID
   ========================================================================= */
.xl-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 5px;
}
.xl-bar-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--fg);
}
.xl-hint {
  font-size: 11px;
  color: var(--muted);
}
.xl-wrap {
  width: 100%;
  max-height: 210px;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--grid-line);
  border-radius: 6px;
  background: var(--surface);
}
.xl-wrap.xl-tall { max-height: 240px; }
.xl-tbl {
  width: 100%;
  border-collapse: collapse;
  table-layout: auto;
  font-size: 12px;
  background: var(--surface);
}
.xl-tbl th, .xl-tbl td {
  border: 1px solid var(--grid-line);
  padding: 0;
  height: 26px;
  vertical-align: middle;
}
.xl-tbl thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 700;
  padding: 0 6px;
  height: 28px;
  text-align: center;
  user-select: none;
}
.xl-tbl th.xl-rn, .xl-tbl td.xl-rn {
  width: 30px;
  min-width: 30px;
  max-width: 34px;
  background: var(--surface-2);
  color: var(--muted);
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  user-select: none;
  padding: 0 4px;
}
.xl-th-inner {
  display: flex;
  align-items: center;
  gap: 2px;
}
.xl-th-in {
  width: 100%;
  min-width: 64px;
  border: none !important;
  border-radius: 0 !important;
  background: transparent !important;
  color: var(--fg);
  font-weight: 700;
  font-size: 11.5px;
  text-align: center;
  padding: 3px 4px !important;
  height: 26px;
}
.xl-th-in:focus {
  background: var(--accent-soft) !important;
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.xl-col-del {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  line-height: 1;
  padding: 2px 4px;
  cursor: pointer;
  border-radius: 3px;
}
.xl-col-del:hover { color: var(--danger); background: var(--danger-soft); }

.xl-cell {
  width: 100%;
  min-width: 68px;
  height: 25px;
  border: none !important;
  border-radius: 0 !important;
  background: transparent !important;
  color: var(--fg);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Be Vietnam Pro', monospace;
  font-size: 12px;
  padding: 2px 6px !important;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.xl-cell.xl-text {
  font-family: inherit;
  text-align: left;
  min-width: 96px;
}
.xl-cell.xl-num-sm {
  min-width: 48px;
  max-width: 64px;
  text-align: center;
}
.xl-cell:focus {
  background: var(--accent-soft) !important;
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.xl-tbl tbody tr:hover td:not(.xl-rn) {
  background: color-mix(in srgb, var(--accent-soft) 35%, transparent);
}
.xl-td-pad { padding: 2px 6px !important; }

/* KPI & Badges */
.kpi {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
}
.kpi-label { font-size: 11px; color: var(--muted); font-weight: 600; }
.kpi-val { font-size: 18px; font-weight: 700; color: var(--fg); margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-info { background: var(--accent-soft); color: var(--accent); }

.alert {
  border-radius: 8px;
  padding: 9px 12px;
  margin-bottom: 10px;
  font-size: 12.5px;
  border-left: 4px solid var(--accent);
  background: var(--accent-soft);
  color: var(--fg);
}
.alert-ok { border-left-color: var(--ok); background: var(--ok-soft); }
.alert-warn { border-left-color: var(--warn); background: var(--warn-soft); }
.alert-danger { border-left-color: var(--danger); background: var(--danger-soft); }

/* SVG Chart Wrapper */
.chart-box {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  overflow: hidden;
}
.chart-box svg { width: 100%; height: auto; display: block; }

/* Paste Box Collapsible */
.paste-panel {
  background: var(--surface-2);
  border: 1px dashed var(--accent);
  border-radius: 8px;
  padding: 9px;
  margin-bottom: 10px;
  display: none;
}
.paste-panel.open { display: block; }

/* Toast */
.toast {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: var(--fg);
  color: var(--bg);
  padding: 8px 13px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
  z-index: 999;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* Subtle Scientific Reference Strip */
.ref-strip {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 8px;
  margin-top: 6px;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 11.5px;
  color: var(--muted);
}
.ref-lbl {
  font-weight: 600;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-right: 2px;
}
.ref-link {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: var(--muted);
  text-decoration: none;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 11px;
  font-weight: 500;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.ref-link:hover {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  background: var(--accent-soft);
}
.ref-ext { font-size: 10px; opacity: 0.7; }

.print-header { display: none; }

@media print {
  :root, :root[data-theme="dark"] {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --fg: #111111;
    --muted: #555555;
    --line: #d0d7de;
    --grid-line: #c8d1dc;
    --accent: #1558B0;
    --accent-soft: #eaf1fa;
    --ok: #137333;
    --ok-soft: #e6f4ea;
    --warn: #b06000;
    --warn-soft: #fef7e0;
    --danger: #b3261e;
    --danger-soft: #fce8e6;
  }
  body { background: #ffffff; color: #111111; font-size: 11px; }
  .app { max-width: 100%; padding: 0; }
  .nav-wrap, .no-print, .btn, .paste-panel, .toast { display: none !important; }
  .xl-wrap { max-height: none !important; overflow: visible !important; }
  .print-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid #1558B0;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .card { box-shadow: none; border: 1px solid #d0d7de; break-inside: avoid; page-break-inside: avoid; }
  .chart-box, .tw { break-inside: avoid; page-break-inside: avoid; }
}
</style>
</head>
<body>
<div class="app">
  <div class="print-header">
    <div><strong id="printTitle">Thẩm định Phương pháp ICH Q2(R2) &amp; Gage R&amp;R — Báo cáo R&amp;D</strong></div>
    <div id="printMeta" style="font-size:11px;color:#555;"></div>
  </div>


  <div class="nav-wrap no-print" style="justify-content:space-between;align-items:center;padding:8px 12px;">
    <span style="font-size:12.5px;font-weight:700;color:var(--accent);" data-i18n="tab3"></span>
    <button class="btn btn-sm no-print" id="btnPrint" type="button"></button>
  </div>
  <section id="panel-t3" class="panel active">
    <div class="card">
      <div class="card-head">
        <div>
          <h2 class="card-title" data-i18n="t3_title"></h2>
          <p class="card-sub" data-i18n="t3_sub"></p>
        </div>
        <div class="btn-row no-print">
          <div class="seg" role="group">
            <button class="seg-btn active" id="t3SubBtnIch" type="button" data-i18n="t3_sub_ich"></button>
            <button class="seg-btn" id="t3SubBtnGage" type="button" data-i18n="t3_sub_gage"></button>
          </div>
          <button class="btn btn-sm" id="t3SampleBtn" type="button" data-i18n="btn_sample"></button>
          <button class="btn btn-primary btn-sm" id="t3RunBtn" type="button" data-i18n="btn_analyze"></button>
        </div>
      </div>

      <!-- Sub-mode 1: ICH Q2(R2) -->
      <div id="t3IchPanel">
        <div class="grid-2">
          <div>
            <div class="xl-bar">
              <span class="xl-bar-label" data-i18n="t3_lin_lbl"></span>
              <div class="btn-row no-print">
                <button class="btn btn-xs" id="t3LinAddRow" type="button" data-i18n="btn_add_row"></button>
                <button class="btn btn-xs btn-danger" id="t3LinClear" type="button" data-i18n="btn_clear"></button>
              </div>
            </div>
            <div id="t3LinSheetWrap" class="xl-wrap" style="margin-bottom:8px"></div>
            <div class="field" style="max-width:230px;margin-bottom:0">
              <label for="t3NomConc" data-i18n="t3_nom_conc"></label>
              <input type="number" id="t3NomConc" step="any" value="100">
            </div>
          </div>
          <div>
            <div class="xl-bar">
              <span class="xl-bar-label" data-i18n="t3_rec_lbl"></span>
              <div class="btn-row no-print">
                <button class="btn btn-xs" id="t3RecAddRow" type="button" data-i18n="btn_add_row"></button>
                <button class="btn btn-xs btn-danger" id="t3RecClear" type="button" data-i18n="btn_clear"></button>
              </div>
            </div>
            <div id="t3RecSheetWrap" class="xl-wrap"></div>
          </div>
        </div>
      </div>

      <!-- Sub-mode 2: Gage R&R -->
      <div id="t3GagePanel" style="display:none">
        <div class="inline-fields">
          <div class="field" style="max-width:210px">
            <label for="t3Tol" data-i18n="t3_tol_lbl"></label>
            <input type="number" id="t3Tol" step="any" value="10.0">
          </div>
          <label class="check-label">
            <input type="checkbox" id="t3PoolInt" checked>
            <span data-i18n="t3_pool_int"></span>
          </label>
        </div>
        <div class="xl-bar no-print">
          <span class="xl-bar-label" data-i18n="t3_gage_lbl"></span>
          <div class="btn-row">
            <button class="btn btn-xs" id="t3GageAddRow" type="button" data-i18n="btn_add_row"></button>
            <button class="btn btn-xs btn-danger" id="t3GageClear" type="button" data-i18n="btn_clear"></button>
          </div>
        </div>
        <div id="t3GageSheetWrap" class="xl-wrap xl-tall"></div>
      </div>
    </div>

    <div id="t3Output"></div>
    <footer class="ref-strip" aria-label="References">
      <span class="ref-lbl"><span aria-hidden="true">&#128214;</span><span data-i18n="ref_title"></span></span>
      <a class="ref-link" href="https://www.ema.europa.eu/en/scientific-guidelines/ich-q2r2-validation-analytical-procedures" target="_blank" rel="noopener noreferrer">EMA — ICH Q2(R2) Validation of Analytical Procedures<span class="ref-ext">↗</span></a>
      <a class="ref-link" href="https://www.fda.gov/regulatory-information/search-fda-guidance-documents/q2r2-validation-analytical-procedures" target="_blank" rel="noopener noreferrer">FDA — Q2(R2) Guidance<span class="ref-ext">↗</span></a>
      <a class="ref-link" href="https://support.minitab.com/en-us/minitab/help-and-how-to/quality-and-process-improvement/measurement-system-analysis/how-to/gage-study/crossed-gage-r-r-study/methods-and-formulas/anova-table/" target="_blank" rel="noopener noreferrer">Minitab — Crossed Gage R&amp;R ANOVA<span class="ref-ext">↗</span></a>
      <a class="ref-link" href="https://support.minitab.com/en-us/minitab/help-and-how-to/quality-and-process-improvement/measurement-system-analysis/how-to/gage-study/crossed-gage-r-r-study/methods-and-formulas/gage-r-r-table/" target="_blank" rel="noopener noreferrer">Minitab — Gage R&amp;R Variance &amp; %Tolerance<span class="ref-ext">↗</span></a>
    </footer>

  function tr(key) {
    return (I18N[state.lang] && I18N[state.lang][key]) || I18N.vi[key] || key;
  }

  function initParentSync() {
    let pLang = null, pTheme = null;
    try {
      if (window.parent && window.parent !== window) {
        if (window.parent.L === 'vi' || window.parent.L === 'en') pLang = window.parent.L;
        if (window.parent.currentTheme === 'dark' || window.parent.currentTheme === 'light') pTheme = window.parent.currentTheme;
      }
    } catch (e) {}

    if (!pLang) {
      try {
        const ls = localStorage.getItem('lang');
        if (ls === 'vi' || ls === 'en') pLang = ls;
      } catch (e) {}
    }
    if (!pTheme) {
      try {
        const ts = localStorage.getItem('theme');
        if (ts === 'dark' || ts === 'light') pTheme = ts;
      } catch (e) {}
    }
    state.lang = pLang || 'vi';
    state.theme = pTheme || 'light';
    applyTheme(state.theme);
  }

  function applyTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    state.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
  }

  window.addEventListener('message', function(e) {
    if (!e || !e.data || typeof e.data !== 'object') return;
    let changed = false;
    if (e.data.theme === 'dark' || e.data.theme === 'light') {
      applyTheme(e.data.theme);
      changed = true;
    }
    if (e.data.lang === 'vi' || e.data.lang === 'en') {
      state.lang = e.data.lang;
      changed = true;
    }
    if (changed) {
      renderAllI18n();
      renderAllGrids();
      rerenderActiveOutputs();
    }
  });

  function showToast(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;

  function escHtml(s) {

      .replace(/&/g, '&amp;').replace(/</g, '&lt;')

  }

  function fmt(x, d = 4) {

    return x.toFixed(d);
  }

  function fmtP(p) {
    if (p == null || !Number.isFinite(p)) return '—';
    if (p < 0.0001) return '< 0.0001';
    return p.toFixed(4);
  }

  function parseTokenNum(tok) {
    if (tok == null) return NaN;
    let s = String(tok).trim().replace(/\s+/g, '');
    if (!s) return NaN;
    if (s.includes(',') && s.includes('.')) {
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (s.includes(',')) {
      if (/^[+-]?\d+,\d+$/.test(s)) s = s.replace(',', '.');
      else s = s.replace(/,/g, '');

    return Number.isFinite(v) ? v : NaN;
  }

  function splitRowCells(line) {
    const t = line.trim();
    if (!t) return [];
    if (t.includes('\t')) return t.split('\t').map(s => s.trim());
    if (t.includes(';')) return t.split(';').map(s => s.trim());
    if (t.includes('|')) return t.split('|').map(s => s.trim());
    if (t.includes(',')) {
      const parts = t.split(',').map(s => s.trim());
      if (parts.length === 2 && /^[+-]?\d+$/.test(parts[0]) && /^\d+$/.test(parts[1])) return [t];

  /**
   * Renders a compact Excel-style bordered spreadsheet grid into `containerEl`.
   * Supports direct Ctrl+V multi-cell paste from Excel, Enter/Arrow key nav,
   * and optional editable column headers (for Tab 1).
   */
  function renderExcelGrid(containerEl, cfg) {
    // cfg: { headers, rows, colTypes, editableHeaders, minCols, onChange, onHeaderChange, onDeleteCol }
    const nCols = cfg.headers.length;
    const rows = cfg.rows;

    let thead = '<thead><tr><th class="xl-rn">#</th>';
    for (let c = 0; c < nCols; c++) {
      if (cfg.editableHeaders) {
        thead += `<th><div class="xl-th-inner">
          <input type="text" class="xl-th-in" data-c="${c}" value="${escHtml(cfg.headers[c])}" aria-label="Column ${c + 1}">
          ${nCols > (cfg.minCols || 2) ? `<button type="button" class="xl-col-del no-print" data-c="${c}" title="Remove column">×</button>` : ''}
        </div></th>`;
      } else {
        thead += `<th>${escHtml(cfg.headers[c])}</th>`;
      }
    }
    thead += '</tr></thead>';

    let tbody = '<tbody>';
    for (let r = 0; r < rows.length; r++) {
      tbody += `<tr><td class="xl-rn">${r + 1}</td>`;
      for (let c = 0; c < nCols; c++) {
        const val = rows[r][c] == null ? '' : rows[r][c];
        const isText = cfg.colTypes && cfg.colTypes[c] === 'text';
        tbody += `<td><input type="text" class="xl-cell${isText ? ' xl-text' : ''}" data-r="${r}" data-c="${c}" value="${escHtml(val)}" autocomplete="off" spellcheck="false"></td>`;
      }
      tbody += '</tr>';
    }
    tbody += '</tbody>';

    containerEl.innerHTML = `<table class="xl-tbl">${thead}${tbody}</table>`;

    // Header edits
    if (cfg.editableHeaders) {
      containerEl.querySelectorAll('.xl-th-in').forEach(inp => {
        inp.addEventListener('input', e => {
          const c = Number(e.target.dataset.c);
          cfg.headers[c] = e.target.value;
          if (cfg.onHeaderChange) cfg.onHeaderChange();
        });
      });
      containerEl.querySelectorAll('.xl-col-del').forEach(btn => {
        btn.addEventListener('click', e => {
          const c = Number(e.target.dataset.c);
          if (cfg.onDeleteCol) cfg.onDeleteCol(c);
        });
      });
    }

    // Cell input, keyboard nav & Excel paste
    const cells = containerEl.querySelectorAll('.xl-cell');
    cells.forEach(inp => {
      inp.addEventListener('input', e => {
        const r = Number(e.target.dataset.r), c = Number(e.target.dataset.c);
        rows[r][c] = e.target.value;
        if (cfg.onChange) cfg.onChange();
      });

      inp.addEventListener('keydown', e => {
        const r = Number(e.target.dataset.r), c = Number(e.target.dataset.c);
        let nr = r, nc = c, move = false;
        if (e.key === 'Enter' || e.key === 'ArrowDown') {
          nr = r + 1; move = true;
          if (nr >= rows.length) {
            rows.push(new Array(nCols).fill(''));
            renderExcelGrid(containerEl, cfg);
            const next = containerEl.querySelector(`.xl-cell[data-r="${nr}"][data-c="${nc}"]`);
            if (next) next.focus();
            e.preventDefault();
            return;
          }
        } else if (e.key === 'ArrowUp' && r > 0) {
          nr = r - 1; move = true;
        }
        if (move) {
          e.preventDefault();
          const target = containerEl.querySelector(`.xl-cell[data-r="${nr}"][data-c="${nc}"]`);
          if (target) { target.focus(); target.select(); }
        }
      });

      inp.addEventListener('paste', e => {
        const clip = (e.clipboardData || window.clipboardData)?.getData('text');
        if (!clip) return;
        // Multi-cell or multi-line paste from Excel
        if (clip.includes('\n') || clip.includes('\t')) {
          e.preventDefault();
          const startR = Number(e.target.dataset.r);
          const startC = Number(e.target.dataset.c);
          const pastedLines = clip.replace(/\r/g, '').split('\n').filter((l, i, arr) => l !== '' || i < arr.length - 1);
          const matrix = pastedLines.map(l => l.includes('\t') ? l.split('\t').map(s => s.trim()) : splitRowCells(l));

          // Expand columns if editableHeaders allows it
          const maxPasteCols = Math.max(...matrix.map(r => r.length));
          if (cfg.editableHeaders && startC + maxPasteCols > cfg.headers.length) {
            while (cfg.headers.length < startC + maxPasteCols) {
              cfg.headers.push('CT' + cfg.headers.length);
              rows.forEach(row => row.push(''));
            }
          }
          // Expand rows if needed
          while (rows.length < startR + matrix.length) {
            rows.push(new Array(cfg.headers.length).fill(''));
          }
          for (let dr = 0; dr < matrix.length; dr++) {
            for (let dc = 0; dc < matrix[dr].length; dc++) {
              const cc = startC + dc;
              if (cc < cfg.headers.length) rows[startR + dr][cc] = matrix[dr][dc];
            }
          }
          renderExcelGrid(containerEl, cfg);
          if (cfg.onHeaderChange) cfg.onHeaderChange();
          if (cfg.onChange) cfg.onChange();
          showToast(tr('paste_applied'));
        }
      });
    });
  }

      if (n < 1) return { W: 0, z: 0, p: 1, nNonZero: 0 };
      const { ranks, tieSum } = rankWithTies(diffs.map(Math.abs));
      let wPlus = 0, wMinus = 0;
      for (let i = 0; i < n; i++) { if (diffs[i] > 0) wPlus += ranks[i]; else wMinus += ranks[i]; }
      const W = Math.min(wPlus, wMinus);
      const mu = n * (n + 1) / 4;
      const sigma = Math.sqrt(Math.max(0, n * (n + 1) * (2 * n + 1) / 24 - tieSum / 48));
      if (sigma === 0) return { W, z: 0, p: 1, nNonZero: n };
      const z = (Math.abs(W - mu) - 0.5) / sigma;
      return { W, wPlus, wMinus, z: (wPlus - mu) / sigma, p: Math.min(1, Math.max(0, 2 * (1 - normCDF(Math.max(0, z))))), nNonZero: n };
    }

    function kruskalWallis(groups) {
      const k = groups.length, all = [];
      groups.forEach(g => g.forEach(v => all.push(v)));
      const N = all.length;
      if (k < 2 || N <= k) return { H: NaN, df: k - 1, p: NaN };
      const { ranks, tieSum } = rankWithTies(all);
      let offset = 0, sumR2n = 0;
      for (const g of groups) {
        let Rg = 0;
        for (let i = 0; i < g.length; i++) Rg += ranks[offset + i];
        sumR2n += (Rg * Rg) / g.length;
        offset += g.length;
      }
      let H = (12 / (N * (N + 1))) * sumR2n - 3 * (N + 1);
      const denom = 1 - tieSum / (N * N * N - N);
      H = denom > 0 ? H / denom : 0;
      return { H, df: k - 1, p: chi2PValue(Math.max(0, H), k - 1) };
    }

    const GL16_X = [
      -0.9894009349916499, -0.9445750230732326, -0.8656312023878318, -0.7554044083550030,
      -0.6178762444026438, -0.4580167776572274, -0.2816035507792589, -0.0950125098376374,
       0.0950125098376374,  0.2816035507792589,  0.4580167776572274,  0.6178762444026438,
       0.7554044083550030,  0.8656312023878318,  0.9445750230732326,  0.9894009349916499
    ];
    const GL16_W = [
      0.0271524594117541, 0.0622535239386479, 0.0951585116824928, 0.1246289712555339,
      0.1495959888165767, 0.1691565193950025, 0.1826034150449236, 0.1894506104550685,
      0.1894506104550685, 0.1826034150449236, 0.1691565193950025, 0.1495959888165767,
      0.1246289712555339, 0.0951585116824928, 0.0622535239386479, 0.0271524594117541
    ];

    function studentizedRangeCDF(q, k, df) {
      if (q <= 0) return 0;
      if (k < 2) return 1;
      const rangeCDF = (w) => {
        if (w <= 0) return 0;
        let acc = 0;
        for (let i = 0; i < 16; i++) {
          const z = 6 * GL16_X[i];
          const phi = Math.exp(-0.5 * z * z) / Math.sqrt(2 * Math.PI);
          const diff = Math.max(0, normCDF(z + w) - normCDF(z));
          acc += GL16_W[i] * phi * Math.pow(diff, k - 1);
        }
        return Math.min(1, Math.max(0, k * 6 * acc));
      };
      if (df > 500) return rangeCDF(q);
      const v2 = df / 2, logC = v2 * Math.log(v2) - logGamma(v2) + Math.log(2);
      const spread = 1 / Math.sqrt(2 * df);
      const sLo = Math.max(1e-4, 1 - 6 * spread), sHi = 1 + 7 * spread;
      const mid = 0.5 * (sLo + sHi), half = 0.5 * (sHi - sLo);
      let total = 0;
      for (let i = 0; i < 16; i++) {
        const s = mid + half * GL16_X[i];
        const pdf = Math.exp(logC + (df - 1) * Math.log(s) - v2 * s * s);
        total += GL16_W[i] * pdf * rangeCDF(q * s);
      }
      return Math.min(1, Math.max(0, half * total));
    }

    function tukeyQCrit(alpha, k, df) {
      let lo = 0, hi = 12;
      while (studentizedRangeCDF(hi, k, df) < 1 - alpha && hi < 200) hi *= 2;
      for (let i = 0; i < 45; i++) {
        const mid = 0.5 * (lo + hi);
        if (studentizedRangeCDF(mid, k, df) < 1 - alpha) lo = mid; else hi = mid;
      }
      return 0.5 * (lo + hi);
    }

    function dunnettCDF(d, nTreats, nCtrl, df) {
      if (d <= 0) return 0;
      const m = nTreats.length;
      if (m === 0) return 1;
      const lam = nTreats.map(ni => Math.sqrt(ni / (ni + nCtrl)));
      const inner = (ds) => {
        let acc = 0;
        for (let i = 0; i < 16; i++) {
          const z = 6 * GL16_X[i];
          const phi = Math.exp(-0.5 * z * z) / Math.sqrt(2 * Math.PI);
          let prod = 1;
          for (let j = 0; j < m; j++) {
            const denom = Math.sqrt(Math.max(1e-12, 1 - lam[j] * lam[j]));
            prod *= Math.max(0, normCDF((ds + lam[j] * z) / denom) - normCDF((-ds + lam[j] * z) / denom));
          }
          acc += GL16_W[i] * phi * prod;
        }
        return Math.min(1, Math.max(0, 6 * acc));
      };
      if (df > 500) return inner(d);
      const v2 = df / 2, logC = v2 * Math.log(v2) - logGamma(v2) + Math.log(2);
      const spread = 1 / Math.sqrt(2 * df);
      const sLo = Math.max(1e-4, 1 - 6 * spread), sHi = 1 + 7 * spread;
      const mid = 0.5 * (sLo + sHi), half = 0.5 * (sHi - sLo);
      let total = 0;
      for (let i = 0; i < 16; i++) {
        const s = mid + half * GL16_X[i];
        const pdf = Math.exp(logC + (df - 1) * Math.log(s) - v2 * s * s);
        total += GL16_W[i] * pdf * inner(d * s);
      }
      return Math.min(1, Math.max(0, half * total));
    }

    function dunnettCrit(alpha, nTreats, nCtrl, df) {
      let lo = 0, hi = 10;
      while (dunnettCDF(hi, nTreats, nCtrl, df) < 1 - alpha && hi < 200) hi *= 2;
      for (let i = 0; i < 45; i++) {
        const mid = 0.5 * (lo + hi);
        if (dunnettCDF(mid, nTreats, nCtrl, df) < 1 - alpha) lo = mid; else hi = mid;
      }
      return 0.5 * (lo + hi);
    }

    function howeK2(n, conf, cov) {
      if (n < 2) return NaN;
      const df = n - 1;
      const zp = normInv((1 + cov) / 2);
      const chi2 = chi2Inv(1 - conf, df);
      const r = zp * Math.sqrt(1 + 1 / n);
      const u = Math.sqrt(df / chi2);
      const k2 = r * u * Math.sqrt(1 + (df - 3 - chi2) / (2 * (n + 1) * (n + 1)));
      return Number.isFinite(k2) ? k2 : r * u;
    }

    return {
      sum, mean, variance, sd, quantile, median,
      normCDF, normInv, tPValue, tInv, fPValue, chi2PValue, chi2Inv,
      shapiroWilk, leveneTest, oneWayAnovaCore,
      mannWhitneyU, wilcoxonSignedRank, kruskalWallis,
      studentizedRangeCDF, tukeyQCrit, dunnettCDF, dunnettCrit, howeK2
    };
  })();

  function niceTicks(minV, maxV, count = 5) {
    if (!Number.isFinite(minV) || !Number.isFinite(maxV)) return [0, 1];
    if (minV === maxV) { minV -= 1; maxV += 1; }
    const range = maxV - minV;
    const rawStep = range / Math.max(1, count);
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / mag;
    let step = mag;
    if (norm > 5) step = 10 * mag;
    else if (norm > 2) step = 5 * mag;
    else if (norm > 1) step = 2 * mag;
    const start = Math.floor(minV / step) * step;
    const end = Math.ceil(maxV / step) * step;
    const ticks = [];
    for (let v = start; v <= end + step * 0.001; v += step) {
      ticks.push(Number(v.toFixed(10)));
      if (ticks.length > 20) break;
    }
    return ticks;
  }

  function renderScatterSvg(pts, opts) {
    const C = themeColors();
    const W = 420, H = 250, pad = { l: 58, r: 18, t: 22, b: 38 };
    const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;

    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    if (opts.zeroLine) { minY = Math.min(minY, 0); maxY = Math.max(maxY, 0); }
    const sx = (maxX - minX) || 1, sy = (maxY - minY) || 1;
    minX -= sx * 0.06; maxX += sx * 0.06; minY -= sy * 0.12; maxY += sy * 0.12;

    const xt = niceTicks(minX, maxX, 5), yt = niceTicks(minY, maxY, 5);
    const xLo = xt[0], xHi = xt[xt.length - 1], yLo = yt[0], yHi = yt[yt.length - 1];
    const xScale = v => pad.l + ((v - xLo) / (xHi - xLo)) * pw;
    const yScale = v => pad.t + ph - ((v - yLo) / (yHi - yLo)) * ph;

    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${H}" fill="${C.bg}" rx="6"/>`;
    yt.forEach(t => {
      const y = yScale(t);
      svg += `<line x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}" stroke="${C.line}" stroke-dasharray="3,3"/>`;
      const lbl = Math.abs(t) >= 10000 ? (t / 1000).toFixed(0) + 'k' : fmt(t, 1);
      svg += `<text x="${pad.l - 6}" y="${y + 4}" text-anchor="end" fill="${C.muted}" font-size="10">${lbl}</text>`;
    });
    xt.forEach(t => {
      svg += `<text x="${xScale(t)}" y="${pad.t + ph + 16}" text-anchor="middle" fill="${C.muted}" font-size="10">${fmt(t, 1)}</text>`;
    });
    svg += `<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t + ph}" stroke="${C.muted}"/>`;
    svg += `<line x1="${pad.l}" y1="${pad.t + ph}" x2="${W - pad.r}" y2="${pad.t + ph}" stroke="${C.muted}"/>`;

    if (opts.line) {
      const { a, b } = opts.line;
      svg += `<line x1="${xScale(xLo)}" y1="${yScale(a * xLo + b)}" x2="${xScale(xHi)}" y2="${yScale(a * xHi + b)}" stroke="${C.accent}" stroke-width="2"/>`;
    }
    if (opts.zeroLine) {
      const y0 = yScale(0);
      svg += `<line x1="${pad.l}" y1="${y0}" x2="${W - pad.r}" y2="${y0}" stroke="${C.danger}" stroke-width="1.4" stroke-dasharray="5,3"/>`;
    }
    pts.forEach(p => {
      svg += `<circle cx="${xScale(p.x)}" cy="${yScale(p.y)}" r="3.5" fill="${opts.zeroLine ? C.warn : C.accent}" fill-opacity="0.85"/>`;
    });
    svg += `<text x="${W / 2}" y="${H - 6}" text-anchor="middle" fill="${C.muted}" font-size="11">${escHtml(opts.xLabel || 'X')}</text></svg>`;
    return svg;
  }

  function runT3Ich() {
    const out = document.getElementById('t3Output');
    const nomConc = parseFloat(document.getElementById('t3NomConc').value);
    const pts = [];
    state.t3LinRows.forEach(r => {
      const x = parseTokenNum(r[0]), y = parseTokenNum(r[1]);
      if (Number.isFinite(x) && Number.isFinite(y)) pts.push({ x, y });
    });
    if (pts.length < 3) {
      out.innerHTML = `<div class="alert alert-danger">${tr('t3_err_lin')}</div>`;
      return;
    }

    const n = pts.length, xm = Stat.mean(pts.map(p => p.x)), ym = Stat.mean(pts.map(p => p.y));
    let sxx = 0, sxy = 0, syy = 0;
    pts.forEach(p => { sxx += (p.x - xm) * (p.x - xm); sxy += (p.x - xm) * (p.y - ym); syy += (p.y - ym) * (p.y - ym); });
    if (sxx === 0) {
      out.innerHTML = `<div class="alert alert-danger">${tr('t3_err_lin')}</div>`;
      return;
    }

    const slope = sxy / sxx, intercept = ym - slope * xm;
    const resPts = pts.map(p => ({ x: p.x, y: p.y - (slope * p.x + intercept) }));
    const sse = Stat.sum(resPts.map(p => p.y * p.y));
    const r2 = syy > 0 ? 1 - sse / syy : 1;
    const r = Math.sqrt(Math.max(0, r2)) * (slope >= 0 ? 1 : -1);
    const syx = Math.sqrt(Math.max(0, sse / (n - 2)));
    const seInt = syx * Math.sqrt(1 / n + (xm * xm) / sxx);
    const refX = Number.isFinite(nomConc) && nomConc > 0 ? nomConc : xm;
    const yAt100 = slope * refX + intercept;
    const pctYInt = yAt100 !== 0 ? (Math.abs(intercept) / Math.abs(yAt100)) * 100 : NaN;
    const lod = slope !== 0 ? (3.3 * syx) / Math.abs(slope) : NaN;
    const loq = slope !== 0 ? (10.0 * syx) / Math.abs(slope) : NaN;

    const byX = new Map();
    pts.forEach(p => {
      const key = p.x.toFixed(8);
      if (!byX.has(key)) byX.set(key, []);
      byX.get(key).push(p.y);
    });
    let ssPure = 0;
    byX.forEach(ys => { const m = Stat.mean(ys); ys.forEach(y => { ssPure += (y - m) * (y - m); }); });
    const dfPure = n - byX.size, dfLof = byX.size - 2, ssLof = Math.max(0, sse - ssPure);
    let fLof = NaN, pLof = NaN;
    if (dfPure > 0 && dfLof > 0 && ssPure > 0) {
      fLof = (ssLof / dfLof) / (ssPure / dfPure);
      pLof = Stat.fPValue(fLof, dfLof, dfPure);
    }

    let html = `<div class="card"><div class="card-head">
      <h3 class="card-title">${tr('t3_lin_res')}</h3>
      <span class="badge ${r2 >= 0.995 ? 'badge-ok' : 'badge-warn'}">R² = ${fmt(r2, 5)}</span>
    </div>
    <div class="grid-4" style="margin-bottom:10px">
      <div class="kpi"><div class="kpi-label">Regression (y = ax + b)</div><div class="kpi-val" style="font-size:13.5px">y = ${fmt(slope, 2)}x ${intercept >= 0 ? '+' : '−'} ${fmt(Math.abs(intercept), 2)}</div><div class="kpi-sub">r = ${fmt(r, 5)} | S(y/x) = ${fmt(syx, 2)}</div></div>
      <div class="kpi"><div class="kpi-label">% Y-Intercept (@ ${refX})</div><div class="kpi-val" style="color:${pctYInt <= 2 ? 'var(--ok)' : 'var(--warn)'}">${fmt(pctYInt, 2)}%</div><div class="kpi-sub">SE(b) = ${fmt(seInt, 2)}</div></div>
      <div class="kpi"><div class="kpi-label">Lack-of-Fit p-value</div><div class="kpi-val">${Number.isFinite(pLof) ? fmtP(pLof) : 'N/A'}</div><div class="kpi-sub">${Number.isFinite(fLof) ? 'F = ' + fmt(fLof, 3) + ` (df ${dfLof},${dfPure})` : 'Need replicates'}</div></div>
      <div class="kpi"><div class="kpi-label">LOD / LOQ (ICH Q2)</div><div class="kpi-val" style="font-size:15px">${fmt(lod, 3)} / ${fmt(loq, 3)}</div><div class="kpi-sub">3.3σ/S &amp; 10σ/S</div></div>
    </div>
    <div class="grid-2">
      <div><div style="font-size:12px;font-weight:700;margin-bottom:4px">${tr('t3_cal_chart')}</div><div class="chart-box">${renderScatterSvg(pts, { line: { a: slope, b: intercept }, xLabel: 'Concentration' })}</div></div>
      <div><div style="font-size:12px;font-weight:700;margin-bottom:4px">${tr('t3_res_chart')}</div><div class="chart-box">${renderScatterSvg(resPts, { zeroLine: true, xLabel: 'Concentration' })}</div></div>
    </div></div>`;

    // Recovery
    const levels = new Map(), allRec = [];
    state.t3RecRows.forEach(r => {
      const lvl = (r[0] || '').trim();
      const spk = parseTokenNum(r[1]), fnd = parseTokenNum(r[2]);
      let rec = NaN;
      if (Number.isFinite(spk) && spk > 0 && Number.isFinite(fnd)) rec = (fnd / spk) * 100;
      else if (Number.isFinite(spk) && !Number.isFinite(fnd)) rec = spk;
      if (lvl && Number.isFinite(rec)) {
        if (!levels.has(lvl)) levels.set(lvl, []);
        levels.get(lvl).push(rec);
        allRec.push(rec);
      }
    });
    if (allRec.length >= 2) {
      const renderRecRow = (lbl, arr, bold = false) => {
        const m = Stat.mean(arr), s = Stat.sd(arr), rsd = m ? (s / m) * 100 : NaN;
        const tC = arr.length > 1 ? Stat.tInv(0.975, arr.length - 1) : NaN;
        const half = Number.isFinite(tC) && Number.isFinite(s) ? tC * s / Math.sqrt(arr.length) : NaN;
        return `<tr><td>${bold ? '<strong>' + escHtml(lbl) + '</strong>' : escHtml(lbl)}</td>
          <td class="num">${arr.length}</td><td class="num">${fmt(m, 2)}%</td><td class="num">${fmt(s, 3)}</td>
          <td class="num">${fmt(rsd, 2)}%</td><td class="num">${Number.isFinite(half) ? '[' + fmt(m - half, 2) + '%, ' + fmt(m + half, 2) + '%]' : '—'}</td></tr>`;
      };
      html += `<div class="card"><div class="card-head"><h3 class="card-title">${tr('t3_rec_res')}</h3></div>
        <div class="tw"><table><thead><tr>
          <th>Level</th><th class="num">n</th><th class="num">Mean %Recovery</th><th class="num">SD</th><th class="num">%RSD</th><th class="num">95% CI</th>
        </tr></thead><tbody>`;
      levels.forEach((arr, lvl) => { html += renderRecRow(lvl, arr, false); });
      html += renderRecRow('Overall', allRec, true) + `</tbody></table></div></div>`;
    }
    out.innerHTML = html;
  }

  function renderGageCharts(varRows, parts, ops, cellMeans) {

    let svg1 = `<svg viewBox="0 0 ${W1} ${H1}" xmlns="http://www.w3.org/2000/svg"><rect width="${W1}" height="${H1}" fill="${C.bg}" rx="6"/>`;
    [0, 25, 50, 75, 100].forEach(t => {
      const y = yS1(t);
      svg1 += `<line x1="${pad1.l}" y1="${y}" x2="${W1 - pad1.r}" y2="${y}" stroke="${C.line}" stroke-dasharray="3,3"/>`;
      svg1 += `<text x="${pad1.l - 6}" y="${y + 4}" text-anchor="end" fill="${C.muted}" font-size="10">${t}%</text>`;
    });
    const grpW = pw1 / cats.length;
    cats.forEach((r, idx) => {
      const gx = pad1.l + idx * grpW + grpW * 0.14, bw = Math.min(18, (grpW * 0.72) / 3);
      [{ v: r.pctContrib, col: C.accent }, { v: r.pctStudy, col: C.warn }, { v: r.pctTol || 0, col: C.ok }].forEach((b, bi) => {
        const y = yS1(b.v);
        svg1 += `<rect x="${gx + bi * (bw + 2)}" y="${y}" width="${bw}" height="${Math.max(1, pad1.t + ph1 - y)}" fill="${b.col}" rx="2"/>`;
      });
      svg1 += `<text x="${pad1.l + (idx + 0.5) * grpW}" y="${pad1.t + ph1 + 16}" text-anchor="middle" fill="${C.fg}" font-size="10">${escHtml(r.short)}</text>`;
    });
    svg1 += `<g font-size="10" fill="${C.muted}">
      <rect x="${pad1.l}" y="6" width="10" height="10" fill="${C.accent}"/><text x="${pad1.l + 14}" y="15">%Contrib</text>
      <rect x="${pad1.l + 82}" y="6" width="10" height="10" fill="${C.warn}"/><text x="${pad1.l + 96}" y="15">%StudyVar</text>
      <rect x="${pad1.l + 172}" y="6" width="10" height="10" fill="${C.ok}"/><text x="${pad1.l + 186}" y="15">%Tolerance</text>
    </g></svg>`;

    const W2 = 420, H2 = 240, pad2 = { l: 50, r: 18, t: 28, b: 40 };
    const pw2 = W2 - pad2.l - pad2.r, ph2 = H2 - pad2.t - pad2.b;
    const allM = [];
    parts.forEach(p => ops.forEach(o => allM.push(cellMeans.get(p + '||' + o))));
    let lo = Math.min(...allM), hi = Math.max(...allM);
    const sp = (hi - lo) || 1; lo -= sp * 0.12; hi += sp * 0.12;
    const yt2 = niceTicks(lo, hi, 4);
    const yLo2 = yt2[0], yHi2 = yt2[yt2.length - 1];
    const yS2 = v => pad2.t + ph2 - ((v - yLo2) / (yHi2 - yLo2)) * ph2;
    const xS2 = idx => pad2.l + (parts.length > 1 ? (idx / (parts.length - 1)) * pw2 : pw2 / 2);

    let svg2 = `<svg viewBox="0 0 ${W2} ${H2}" xmlns="http://www.w3.org/2000/svg"><rect width="${W2}" height="${H2}" fill="${C.bg}" rx="6"/>`;
    yt2.forEach(t => {
      const y = yS2(t);
      svg2 += `<line x1="${pad2.l}" y1="${y}" x2="${W2 - pad2.r}" y2="${y}" stroke="${C.line}" stroke-dasharray="3,3"/>`;
      svg2 += `<text x="${pad2.l - 6}" y="${y + 4}" text-anchor="end" fill="${C.muted}" font-size="10">${fmt(t, 1)}</text>`;
    });
    parts.forEach((p, idx) => { svg2 += `<text x="${xS2(idx)}" y="${pad2.t + ph2 + 16}" text-anchor="middle" fill="${C.fg}" font-size="10">${escHtml(p)}</text>`; });
    ops.forEach((o, oi) => {
      const col = C.palette[oi % C.palette.length];
      let linePts = '';
      parts.forEach((p, pi) => {
        const x = xS2(pi), y = yS2(cellMeans.get(p + '||' + o));
        linePts += `${x.toFixed(1)},${y.toFixed(1)} `;
        svg2 += `<circle cx="${x}" cy="${y}" r="3.4" fill="${col}"/>`;
      });
      svg2 += `<polyline points="${linePts.trim()}" fill="none" stroke="${col}" stroke-width="1.8"/>`;
      svg2 += `<rect x="${pad2.l + oi * 74}" y="6" width="10" height="10" fill="${col}"/><text x="${pad2.l + oi * 74 + 14}" y="15" font-size="10" fill="${C.muted}">${escHtml(o)}</text>`;
    });
    svg2 += `</svg>`;
    return { svg1, svg2 };
  }

  function runT3Gage() {
    const out = document.getElementById('t3Output');
    const tol = parseFloat(document.getElementById('t3Tol').value);
    const autoPool = document.getElementById('t3PoolInt').checked;

    const rows = [];
    state.t3GageRows.forEach(r => {
      const p = (r[0] || '').trim(), o = (r[1] || '').trim(), y = parseTokenNum(r[2]);
      if (p && o && Number.isFinite(y)) rows.push({ p, o, y });
    });

    const parts = [...new Set(rows.map(r => r.p))], ops = [...new Set(rows.map(r => r.o))];
    const P = parts.length, O = ops.length;
    if (P < 2 || O < 2) { out.innerHTML = `<div class="alert alert-danger">${tr('t3_err_gage')}</div>`; return; }

    const cells = new Map();
    rows.forEach(r => { const k = r.p + '||' + r.o; if (!cells.has(k)) cells.set(k, []); cells.get(k).push(r.y); });
    let repCount = null;
    for (const p of parts) {
      for (const o of ops) {
        const arr = cells.get(p + '||' + o);
        if (!arr || arr.length < 2 || (repCount !== null && arr.length !== repCount)) {
          out.innerHTML = `<div class="alert alert-danger">${tr('t3_err_gage')}</div>`;
          return;
        }
        repCount = arr.length;
      }
    }

    const R = repCount, N = P * O * R, grandMean = Stat.mean(rows.map(r => r.y));
    const partMeans = new Map(), opMeans = new Map(), cellMeans = new Map();
    parts.forEach(p => partMeans.set(p, Stat.mean(rows.filter(r => r.p === p).map(r => r.y))));
    ops.forEach(o => opMeans.set(o, Stat.mean(rows.filter(r => r.o === o).map(r => r.y))));
    cells.forEach((arr, k) => cellMeans.set(k, Stat.mean(arr)));

    let ssP = 0, ssO = 0, ssPO = 0, ssE = 0;
    parts.forEach(p => { ssP += O * R * Math.pow(partMeans.get(p) - grandMean, 2); });
    ops.forEach(o => { ssO += P * R * Math.pow(opMeans.get(o) - grandMean, 2); });
    parts.forEach(p => ops.forEach(o => {
      const cm = cellMeans.get(p + '||' + o);
      ssPO += R * Math.pow(cm - partMeans.get(p) - opMeans.get(o) + grandMean, 2);
      cells.get(p + '||' + o).forEach(v => { ssE += Math.pow(v - cm, 2); });
    }));

    const dfP = P - 1, dfO = O - 1, dfPO = (P - 1) * (O - 1), dfE = P * O * (R - 1);
    const msP = ssP / dfP, msO = ssO / dfO, msPO = ssPO / dfPO, msE = ssE / dfE;
    const fPO = msE > 0 ? msPO / msE : 0, pPO = Stat.fPValue(fPO, dfPO, dfE);

    const pooled = autoPool && pPO > 0.25;
    let msEquip, dfEquip, varRep, varOp, varInt, varPart, fP, pP, fO, pO;
    if (pooled) {
      dfEquip = dfE + dfPO; msEquip = (ssE + ssPO) / dfEquip;
      fP = msEquip > 0 ? msP / msEquip : 0; pP = Stat.fPValue(fP, dfP, dfEquip);
      fO = msEquip > 0 ? msO / msEquip : 0; pO = Stat.fPValue(fO, dfO, dfEquip);
      varRep = msEquip; varOp = Math.max(0, (msO - msEquip) / (P * R)); varInt = 0; varPart = Math.max(0, (msP - msEquip) / (O * R));
    } else {
      dfEquip = dfE; msEquip = msE;
      fP = msPO > 0 ? msP / msPO : 0; pP = Stat.fPValue(fP, dfP, dfPO);
      fO = msPO > 0 ? msO / msPO : 0; pO = Stat.fPValue(fO, dfO, dfPO);
      varRep = msE; varInt = Math.max(0, (msPO - msE) / R); varOp = Math.max(0, (msO - msPO) / (P * R)); varPart = Math.max(0, (msP - msPO) / (O * R));
    }

    const varReprod = varOp + varInt, varGRR = varRep + varReprod, varTotal = varGRR + varPart;
    const sdGRR = Math.sqrt(varGRR), sdPart = Math.sqrt(varPart), sdTot = Math.sqrt(varTotal);
    const pctStudyGRR = sdTot > 0 ? (sdGRR / sdTot) * 100 : 0;
    const pctTolGRR = (Number.isFinite(tol) && tol > 0) ? (6 * sdGRR / tol) * 100 : NaN;
    const ndc = sdGRR > 0 ? Math.max(1, Math.floor(1.41 * (sdPart / sdGRR))) : 99;

    const evalMetric = Number.isFinite(pctTolGRR) ? pctTolGRR : pctStudyGRR;
    let statusCls = 'badge-ok', statusLbl = tr('pass') + ' (<10%)';
    if (evalMetric > 30) { statusCls = 'badge-danger'; statusLbl = tr('fail') + ' (>30%)'; }
    else if (evalMetric >= 10) { statusCls = 'badge-warn'; statusLbl = tr('cond') + ' (10–30%)'; }

    const varRows = [
      { name: 'Total Gage R&R', short: 'Gage R&R', v: varGRR },
      { name: '  Repeatability', short: 'Repeat', v: varRep },
      { name: '  Reproducibility', short: 'Reprod', v: varReprod },
      { name: 'Part-to-Part', short: 'Part-Part', v: varPart },
      { name: 'Total Variation', short: 'Total', v: varTotal }
    ].map(r => {
      const sd = Math.sqrt(Math.max(0, r.v));
      return { ...r, sd, sv: 6 * sd, pctContrib: varTotal > 0 ? (r.v / varTotal) * 100 : 0, pctStudy: sdTot > 0 ? (sd / sdTot) * 100 : 0, pctTol: (Number.isFinite(tol) && tol > 0) ? (6 * sd / tol) * 100 : NaN };
    });

    const charts = renderGageCharts(varRows, parts, ops, cellMeans);
    out.innerHTML = `<div class="card"><div class="card-head">
      <h3 class="card-title">${tr('t3_gage_var')} (${P} Parts × ${O} Operators × ${R} Reps)</h3>
      <span class="badge ${statusCls}">${statusLbl}</span>
    </div>
    <div class="grid-4" style="margin-bottom:10px">
      <div class="kpi"><div class="kpi-label">%Study Var (Gage R&amp;R)</div><div class="kpi-val">${fmt(pctStudyGRR, 2)}%</div><div class="kpi-sub">6×SD = ${fmt(6 * sdGRR, 4)}</div></div>
      <div class="kpi"><div class="kpi-label">%Tolerance (USL−LSL)</div><div class="kpi-val">${Number.isFinite(pctTolGRR) ? fmt(pctTolGRR, 2) + '%' : '—'}</div><div class="kpi-sub">Tol = ${fmt(tol, 2)}</div></div>
      <div class="kpi"><div class="kpi-label">ndc (Distinct Categories)</div><div class="kpi-val" style="color:${ndc >= 5 ? 'var(--ok)' : 'var(--danger)'}">${ndc}</div><div class="kpi-sub">AIAG Target ≥ 5</div></div>
      <div class="kpi"><div class="kpi-label">Model Used</div><div class="kpi-val" style="font-size:14px">${pooled ? 'Reduced (Pooled)' : 'With Interaction'}</div><div class="kpi-sub">Interaction p = ${fmtP(pPO)}</div></div>
    </div>
    <div class="tw"><table><thead><tr>
      <th>Source</th><th class="num">VarComp</th><th class="num">%Contrib</th><th class="num">SD</th><th class="num">Study Var (6×SD)</th><th class="num">%Study Var</th><th class="num">%Tolerance</th>
    </tr></thead><tbody>
      ${varRows.map((r, i) => `<tr>
        <td>${i === 0 || i === 4 ? '<strong>' + escHtml(r.name) + '</strong>' : escHtml(r.name)}</td>
        <td class="num">${fmt(r.v, 5)}</td><td class="num">${fmt(r.pctContrib, 2)}%</td><td class="num">${fmt(r.sd, 4)}</td>
        <td class="num">${fmt(r.sv, 4)}</td><td class="num">${fmt(r.pctStudy, 2)}%</td>
        <td class="num">${Number.isFinite(r.pctTol) ? fmt(r.pctTol, 2) + '%' : '—'}</td>
      </tr>`).join('')}
    </tbody></table></div></div>
    <div class="card"><div class="card-head"><h3 class="card-title">${tr('t3_gage_anova')}</h3></div>
      <div class="tw"><table><thead><tr>
        <th>Source</th><th class="num">DF</th><th class="num">SS</th><th class="num">MS</th><th class="num">F</th><th class="num">p-value</th>
      </tr></thead><tbody>
        <tr><td>Part</td><td class="num">${dfP}</td><td class="num">${fmt(ssP, 4)}</td><td class="num">${fmt(msP, 4)}</td><td class="num">${fmt(fP, 3)}</td><td class="num">${fmtP(pP)}</td></tr>
        <tr><td>Operator</td><td class="num">${dfO}</td><td class="num">${fmt(ssO, 4)}</td><td class="num">${fmt(msO, 4)}</td><td class="num">${fmt(fO, 3)}</td><td class="num">${fmtP(pO)}</td></tr>
        ${!pooled ? `<tr><td>Part × Operator</td><td class="num">${dfPO}</td><td class="num">${fmt(ssPO, 4)}</td><td class="num">${fmt(msPO, 4)}</td><td class="num">${fmt(fPO, 3)}</td><td class="num">${fmtP(pPO)}</td></tr>` : ''}
        <tr><td>Repeatability${pooled ? ' (Pooled)' : ''}</td><td class="num">${dfEquip}</td><td class="num">${fmt(pooled ? ssE + ssPO : ssE, 4)}</td><td class="num">${fmt(msEquip, 4)}</td><td class="num">—</td><td class="num">—</td></tr>
        <tr><td><strong>Total</strong></td><td class="num">${N - 1}</td><td class="num">${fmt(ssP + ssO + ssPO + ssE, 4)}</td><td class="num">—</td><td class="num">—</td><td class="num">—</td></tr>
      </tbody></table></div></div>
    <div class="card"><div class="card-head"><h3 class="card-title">${tr('t3_gage_charts')}</h3></div>
      <div class="grid-2"><div class="chart-box">${charts.svg1}</div><div class="chart-box">${charts.svg2}</div></div></div>`;
  }

  function runT3() { if (state.t3Sub === 'ich') runT3Ich(); else runT3Gage(); }


  function renderAllI18n() {
    document.documentElement.lang = state.lang;
    const bp = document.getElementById('btnPrint');
    if (bp) bp.textContent = tr('print');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  }

  function renderAllGrids() {
    renderT3Grids();
  }

  function rerenderActiveOutputs() {
    runT3();
  }

  function bindEvents() {
    document.getElementById('btnPrint').addEventListener('click', () => {
      document.getElementById('printMeta').textContent = new Date().toLocaleString(state.lang === 'vi' ? 'vi-VN' : 'en-US');
      window.print();
    });
    function switchT3Sub(sub) {
      state.t3Sub = sub;
      document.getElementById('t3SubBtnIch').classList.toggle('active', sub === 'ich');
      document.getElementById('t3SubBtnGage').classList.toggle('active', sub === 'gage');
      document.getElementById('t3IchPanel').style.display = sub === 'ich' ? '' : 'none';
      document.getElementById('t3GagePanel').style.display = sub === 'gage' ? '' : 'none';
      if ((sub === 'ich' && !state.t3LinRows.length) || (sub === 'gage' && !state.t3GageRows.length)) loadT3Sample();
      else runT3();
    }
    document.getElementById('t3SubBtnIch').addEventListener('click', () => switchT3Sub('ich'));
    document.getElementById('t3SubBtnGage').addEventListener('click', () => switchT3Sub('gage'));
    document.getElementById('t3SampleBtn').addEventListener('click', loadT3Sample);
    document.getElementById('t3RunBtn').addEventListener('click', runT3);
    document.getElementById('t3LinAddRow').addEventListener('click', () => { state.t3LinRows.push(['', '']); renderT3Grids(); });
    document.getElementById('t3LinClear').addEventListener('click', () => { state.t3LinRows = Array.from({ length: 6 }, () => ['', '']); renderT3Grids(); });
    document.getElementById('t3RecAddRow').addEventListener('click', () => { state.t3RecRows.push(['', '', '']); renderT3Grids(); });
    document.getElementById('t3RecClear').addEventListener('click', () => { state.t3RecRows = Array.from({ length: 6 }, () => ['', '', '']); renderT3Grids(); });
    document.getElementById('t3GageAddRow').addEventListener('click', () => { state.t3GageRows.push(['', '', '']); renderT3Grids(); });
    document.getElementById('t3GageClear').addEventListener('click', () => { state.t3GageRows = Array.from({ length: 8 }, () => ['', '', '']); renderT3Grids(); });
  }

  window.__MINITAB_RD_STAT__ = Stat;

  initParentSync();
  renderAllI18n();
  bindEvents();
  loadT3Sample();
})();
</script>
</body>
