<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đánh giá Rủi ro ICH Q9 (FMEA) & Pareto — Cổng RD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --fg: #1f1f1f;
  --muted: #5f6368;
  --line: #dce5ef;
  --grid-line: #cfd9e6;
  --accent: #1558B0;
  --accent-soft: #eaf1fa;
  --ok: #137333;
  --ok-soft: #e6f4ea;
  --warn: #b06000;
  --warn-soft: #fef7e0;
  --danger: #b3261e;
  --danger-soft: #fce8e6;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
}
:root[data-theme="dark"] {
  --bg: #121316;
  --surface: #1e1f22;
  --surface-2: #282a2e;
  --fg: #e3e3e3;
  --muted: #9aa0a6;
  --line: #2d3540;
  --grid-line: #363f4d;
  --accent: #3b8cf5;
  --accent-soft: #162436;
  --ok: #81c995;
  --ok-soft: rgba(129, 201, 149, 0.14);
  --warn: #fdd663;
  --warn-soft: rgba(253, 214, 99, 0.14);
  --danger: #f28b82;
  --danger-soft: rgba(242, 139, 130, 0.14);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13.5px;
  line-height: 1.48;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 1240px;
  margin: 0 auto;
  padding: 10px 12px 36px;
}

/* Navigation Tabs (No language/theme toggles — controlled by parent portal) */
.nav-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 5px 6px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}
.tabs {
  display: flex;
  gap: 4px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 7px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.tab-btn:hover { background: var(--surface-2); color: var(--fg); }
.tab-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 28%, transparent);
}

.panel { display: none; }
.panel.active { display: block; }

/* Cards & Layout */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.card-title { margin: 0; font-size: 14.5px; font-weight: 700; color: var(--fg); }
.card-sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 820px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 420px) {
  .app { padding: 8px 8px 28px; }
  .card { padding: 11px; }
  .grid-4 { grid-template-columns: 1fr 1fr; gap: 8px; }
}

/* Controls */
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--fg);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 6px 11px;
  min-height: 32px;
  border-radius: 7px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background 0.15s, border-color 0.15s, opacity 0.15s;
}
.btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.btn-primary:hover { background: var(--accent); color: #ffffff; opacity: 0.9; }
.btn-sm { padding: 4px 9px; min-height: 28px; font-size: 12px; }
.btn-xs { padding: 2px 6px; min-height: 22px; font-size: 11px; border-radius: 4px; }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

.field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
.field label { font-size: 11.5px; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="number"], select, textarea {
  width: 100%;
  background: var(--surface-2);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 9px;
  font-family: inherit;
  font-size: 12.5px;
  transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

.inline-fields {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin-bottom: 10px;
}
.inline-fields .field { margin-bottom: 0; flex: 1; min-width: 120px; }

.check-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--fg);
  cursor: pointer;
  min-height: 32px;
}

.seg {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 2px;
  gap: 2px;
  flex-wrap: wrap;
}
.seg-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 11px;
  border-radius: 5px;
  cursor: pointer;
}
.seg-btn.active { background: var(--accent); color: #ffffff; }

/* Standard Result Tables */
.tw {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-bottom: 8px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  background: var(--surface);
}
th, td {
  padding: 6px 9px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
}
th {
  background: var(--surface-2);
  color: var(--muted);
  font-weight: 700;
  font-size: 11.5px;
}
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 140px; }

/* =========================================================================
   COMPACT EXCEL-LIKE SPREADSHEET INPUT GRID
   ========================================================================= */
.xl-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 5px;
}
.xl-bar-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--fg);
}
.xl-hint {
  font-size: 11px;
  color: var(--muted);
}
.xl-wrap {
  width: 100%;
  max-height: 210px;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--grid-line);
  border-radius: 6px;
  background: var(--surface);
}
.xl-wrap.xl-tall { max-height: 240px; }
.xl-tbl {
  width: 100%;
  border-collapse: collapse;
  table-layout: auto;
  font-size: 12px;
  background: var(--surface);
}
.xl-tbl th, .xl-tbl td {
  border: 1px solid var(--grid-line);
  padding: 0;
  height: 26px;
  vertical-align: middle;
}
.xl-tbl thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 700;
  padding: 0 6px;
  height: 28px;
  text-align: center;
  user-select: none;
}
.xl-tbl th.xl-rn, .xl-tbl td.xl-rn {
  width: 30px;
  min-width: 30px;
  max-width: 34px;
  background: var(--surface-2);
  color: var(--muted);
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  user-select: none;
  padding: 0 4px;
}
.xl-th-inner {
  display: flex;
  align-items: center;
  gap: 2px;
}
.xl-th-in {
  width: 100%;
  min-width: 64px;
  border: none !important;
  border-radius: 0 !important;
  background: transparent !important;
  color: var(--fg);
  font-weight: 700;
  font-size: 11.5px;
  text-align: center;
  padding: 3px 4px !important;
  height: 26px;
}
.xl-th-in:focus {
  background: var(--accent-soft) !important;
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.xl-col-del {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  line-height: 1;
  padding: 2px 4px;
  cursor: pointer;
  border-radius: 3px;
}
.xl-col-del:hover { color: var(--danger); background: var(--danger-soft); }

.xl-cell {
  width: 100%;
  min-width: 68px;
  height: 25px;
  border: none !important;
  border-radius: 0 !important;
  background: transparent !important;
  color: var(--fg);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Be Vietnam Pro', monospace;
  font-size: 12px;
  padding: 2px 6px !important;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.xl-cell.xl-text {
  font-family: inherit;
  text-align: left;
  min-width: 96px;
}
.xl-cell.xl-num-sm {
  min-width: 48px;
  max-width: 64px;
  text-align: center;
}
.xl-cell:focus {
  background: var(--accent-soft) !important;
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.xl-tbl tbody tr:hover td:not(.xl-rn) {
  background: color-mix(in srgb, var(--accent-soft) 35%, transparent);
}
.xl-td-pad { padding: 2px 6px !important; }

/* KPI & Badges */
.kpi {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
}
.kpi-label { font-size: 11px; color: var(--muted); font-weight: 600; }
.kpi-val { font-size: 18px; font-weight: 700; color: var(--fg); margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-info { background: var(--accent-soft); color: var(--accent); }

.alert {
  border-radius: 8px;
  padding: 9px 12px;
  margin-bottom: 10px;
  font-size: 12.5px;
  border-left: 4px solid var(--accent);
  background: var(--accent-soft);
  color: var(--fg);
}
.alert-ok { border-left-color: var(--ok); background: var(--ok-soft); }
.alert-warn { border-left-color: var(--warn); background: var(--warn-soft); }
.alert-danger { border-left-color: var(--danger); background: var(--danger-soft); }

/* SVG Chart Wrapper */
.chart-box {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  overflow: hidden;
}
.chart-box svg { width: 100%; height: auto; display: block; }

/* Paste Box Collapsible */
.paste-panel {
  background: var(--surface-2);
  border: 1px dashed var(--accent);
  border-radius: 8px;
  padding: 9px;
  margin-bottom: 10px;
  display: none;
}
.paste-panel.open { display: block; }

/* Toast */
.toast {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: var(--fg);
  color: var(--bg);
  padding: 8px 13px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
  z-index: 999;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* Subtle Scientific Reference Strip */
.ref-strip {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 8px;
  margin-top: 6px;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 11.5px;
  color: var(--muted);
}
.ref-lbl {
  font-weight: 600;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-right: 2px;
}
.ref-link {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: var(--muted);
  text-decoration: none;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 11px;
  font-weight: 500;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.ref-link:hover {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  background: var(--accent-soft);
}
.ref-ext { font-size: 10px; opacity: 0.7; }

.print-header { display: none; }

@media print {
  :root, :root[data-theme="dark"] {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --fg: #111111;
    --muted: #555555;
    --line: #d0d7de;
    --grid-line: #c8d1dc;
    --accent: #1558B0;
    --accent-soft: #eaf1fa;
    --ok: #137333;
    --ok-soft: #e6f4ea;
    --warn: #b06000;
    --warn-soft: #fef7e0;
    --danger: #b3261e;
    --danger-soft: #fce8e6;
  }
  body { background: #ffffff; color: #111111; font-size: 11px; }
  .app { max-width: 100%; padding: 0; }
  .nav-wrap, .no-print, .btn, .paste-panel, .toast { display: none !important; }
  .xl-wrap { max-height: none !important; overflow: visible !important; }
  .print-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid #1558B0;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .card { box-shadow: none; border: 1px solid #d0d7de; break-inside: avoid; page-break-inside: avoid; }
  .chart-box, .tw { break-inside: avoid; page-break-inside: avoid; }
}
</style>
</head>
<body>
<div class="app">
  <div class="print-header">
    <div><strong id="printTitle">Đánh giá Rủi ro ICH Q9 (FMEA) &amp; Biểu đồ Pareto — Báo cáo R&amp;D</strong></div>
    <div id="printMeta" style="font-size:11px;color:#555;"></div>
  </div>


  <div class="nav-wrap no-print" style="justify-content:space-between;align-items:center;padding:8px 12px;">
    <span style="font-size:12.5px;font-weight:700;color:var(--accent);" data-i18n="tab4"></span>
    <button class="btn btn-sm no-print" id="btnPrint" type="button"></button>
  </div>
  <section id="panel-t4" class="panel active">
    <!-- FMEA Card -->
    <div class="card">
      <div class="card-head">
        <div>
          <h2 class="card-title" data-i18n="t4_fmea_title"></h2>
          <p class="card-sub" data-i18n="t4_fmea_sub"></p>
        </div>
        <div class="btn-row no-print">
          <button class="btn btn-sm" id="t4SampleBtn" type="button" data-i18n="btn_sample"></button>
          <button class="btn btn-sm" id="t4AddFmeaBtn" type="button" data-i18n="t4_add_row"></button>
          <button class="btn btn-primary btn-sm" id="t4SortFmeaBtn" type="button" data-i18n="t4_sort_rpn"></button>
        </div>
      </div>

      <div id="t4FmeaKpi" class="grid-4" style="margin-bottom:10px;"></div>
      <div class="xl-wrap xl-tall">
        <table class="xl-tbl">
          <thead>
            <tr>
              <th class="xl-rn">#</th>
              <th data-i18n="t4_col_param"></th>
              <th data-i18n="t4_col_effect"></th>
              <th>S (1–10)</th>
              <th>O (1–10)</th>
              <th>D (1–10)</th>
              <th>RPN</th>
              <th data-i18n="t4_col_risk"></th>
              <th data-i18n="t4_col_action"></th>
              <th class="no-print" style="width:28px"></th>
            </tr>
          </thead>
          <tbody id="t4FmeaBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Pareto Card -->
    <div class="card">
      <div class="card-head">
        <div>
          <h2 class="card-title" data-i18n="t4_pareto_title"></h2>
          <p class="card-sub" data-i18n="t4_pareto_sub"></p>
        </div>
        <div class="btn-row no-print">
          <button class="btn btn-sm" id="t4AddParetoBtn" type="button" data-i18n="t4_add_defect"></button>
          <button class="btn btn-primary btn-sm" id="t4RunParetoBtn" type="button" data-i18n="btn_analyze"></button>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <div class="xl-wrap" style="margin-bottom:8px">
            <table class="xl-tbl">
              <thead>
                <tr>
                  <th class="xl-rn">#</th>
                  <th data-i18n="t4_col_defect"></th>
                  <th data-i18n="t4_col_freq"></th>
                  <th class="no-print" style="width:28px"></th>
                </tr>
              </thead>
              <tbody id="t4ParetoInputBody"></tbody>
            </table>
          </div>
          <div id="t4ParetoTableOut"></div>
        </div>
        <div id="t4ParetoChartOut"></div>
      </div>
    </div>
    <footer class="ref-strip" aria-label="References">
      <span class="ref-lbl"><span aria-hidden="true">&#128214;</span><span data-i18n="ref_title"></span></span>
      <a class="ref-link" href="https://www.ema.europa.eu/en/scientific-guidelines/ich-q9-quality-risk-management" target="_blank" rel="noopener noreferrer">EMA — ICH Q9(R1) Quality Risk Management<span class="ref-ext">↗</span></a>
      <a class="ref-link" href="https://www.fda.gov/regulatory-information/search-fda-guidance-documents/q9r1-quality-risk-management" target="_blank" rel="noopener noreferrer">FDA — Q9(R1) Guidance<span class="ref-ext">↗</span></a>
      <a class="ref-link" href="https://support.minitab.com/en-us/minitab/help-and-how-to/quality-and-process-improvement/quality-tools/how-to/pareto-chart/before-you-start/overview/" target="_blank" rel="noopener noreferrer">Minitab — Pareto Chart Overview<span class="ref-ext">↗</span></a>
    </footer>
  </section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function() {
  'use strict';

  /* =========================================================================
     1. I18N DICTIONARY (VI / EN)
     ========================================================================= */
  const I18N = {
    vi: {
      tab1: '1. So sánh Công thức (ANOVA)',
      tab2: '2. Độ đồng đều USP <905>',
      tab3: '3. Thẩm định ICH Q2 & MSA',
      tab4: '4. Rủi ro FMEA & Pareto',
      print: 'In / Xuất PDF',
      btn_sample: 'Nạp dữ liệu mẫu Dược phẩm',
      btn_analyze: 'Phân tích',
      btn_paste_excel: 'Dán nhanh từ Excel',
      btn_apply_paste: 'Áp dụng dữ liệu dán',
      btn_close: 'Đóng',

  /* =========================================================================
     2. STATE & PARENT PORTAL SYNCHRONIZATION
     ========================================================================= */
  const state = {
    lang: 'vi',
    theme: 'light',
    activeTab: 't1',
    t3Sub: 'ich',
    t1Headers: [],
    t1Rows: [],       // array of row arrays [c0, c1, ...]
    t2Rows: [],       // array of [s1, s2]
    t3LinRows: [],    // array of [x, y]
    t3RecRows: [],    // array of [lvl, spk, fnd]
    t3GageRows: [],   // array of [part, op, val]
    fmeaRows: [],
    paretoRows: []
  };

  function tr(key) {
    return (I18N[state.lang] && I18N[state.lang][key]) || I18N.vi[key] || key;
  }

  function initParentSync() {
    let pLang = null, pTheme = null;
    try {
      if (window.parent && window.parent !== window) {
        if (window.parent.L === 'vi' || window.parent.L === 'en') pLang = window.parent.L;
        if (window.parent.currentTheme === 'dark' || window.parent.currentTheme === 'light') pTheme = window.parent.currentTheme;
      }
    } catch (e) {}

    if (!pLang) {
      try {
        const ls = localStorage.getItem('lang');
        if (ls === 'vi' || ls === 'en') pLang = ls;
      } catch (e) {}
    }
    if (!pTheme) {
      try {
        const ts = localStorage.getItem('theme');
        if (ts === 'dark' || ts === 'light') pTheme = ts;
      } catch (e) {}
    }
    state.lang = pLang || 'vi';
    state.theme = pTheme || 'light';
    applyTheme(state.theme);
  }

  function applyTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    state.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
  }

  window.addEventListener('message', function(e) {
    if (!e || !e.data || typeof e.data !== 'object') return;
    let changed = false;
    if (e.data.theme === 'dark' || e.data.theme === 'light') {
      applyTheme(e.data.theme);
      changed = true;
    }
    if (e.data.lang === 'vi' || e.data.lang === 'en') {
      state.lang = e.data.lang;
      changed = true;
    }
    if (changed) {
      renderAllI18n();
      renderAllGrids();
      rerenderActiveOutputs();
    }
  });

  function showToast(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove('show'), 2100);
  }

  /* =========================================================================
     3. PARSING, FORMATTING & REUSABLE EXCEL-GRID ENGINE
     ========================================================================= */
  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmt(x, d = 4) {
    if (x == null || !Number.isFinite(x)) return '—';
    return x.toFixed(d);
  }

  function fmtP(p) {
    if (p == null || !Number.isFinite(p)) return '—';
    if (p < 0.0001) return '< 0.0001';
    return p.toFixed(4);
  }

  function parseTokenNum(tok) {
    if (tok == null) return NaN;
    let s = String(tok).trim().replace(/\s+/g, '');
    if (!s) return NaN;
    if (s.includes(',') && s.includes('.')) {
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');

  function splitRowCells(line) {
    const t = line.trim();
    if (!t) return [];
    if (t.includes('\t')) return t.split('\t').map(s => s.trim());
    if (t.includes(';')) return t.split(';').map(s => s.trim());
    if (t.includes('|')) return t.split('|').map(s => s.trim());
    if (t.includes(',')) {
      const parts = t.split(',').map(s => s.trim());
      if (parts.length === 2 && /^[+-]?\d+$/.test(parts[0]) && /^\d+$/.test(parts[1])) return [t];

  /**
   * Renders a compact Excel-style bordered spreadsheet grid into `containerEl`.
   * Supports direct Ctrl+V multi-cell paste from Excel, Enter/Arrow key nav,
   * and optional editable column headers (for Tab 1).
   */
  function renderExcelGrid(containerEl, cfg) {
    // cfg: { headers, rows, colTypes, editableHeaders, minCols, onChange, onHeaderChange, onDeleteCol }
    const nCols = cfg.headers.length;
    const rows = cfg.rows;

    let thead = '<thead><tr><th class="xl-rn">#</th>';
    for (let c = 0; c < nCols; c++) {
      if (cfg.editableHeaders) {
        thead += `<th><div class="xl-th-inner">
          <input type="text" class="xl-th-in" data-c="${c}" value="${escHtml(cfg.headers[c])}" aria-label="Column ${c + 1}">
          ${nCols > (cfg.minCols || 2) ? `<button type="button" class="xl-col-del no-print" data-c="${c}" title="Remove column">×</button>` : ''}
        </div></th>`;
      } else {
        thead += `<th>${escHtml(cfg.headers[c])}</th>`;
      }
    }
    thead += '</tr></thead>';

    let tbody = '<tbody>';
    for (let r = 0; r < rows.length; r++) {
      tbody += `<tr><td class="xl-rn">${r + 1}</td>`;
      for (let c = 0; c < nCols; c++) {
        const val = rows[r][c] == null ? '' : rows[r][c];
        const isText = cfg.colTypes && cfg.colTypes[c] === 'text';
        tbody += `<td><input type="text" class="xl-cell${isText ? ' xl-text' : ''}" data-r="${r}" data-c="${c}" value="${escHtml(val)}" autocomplete="off" spellcheck="false"></td>`;
      }
      tbody += '</tr>';
    }
    tbody += '</tbody>';

    containerEl.innerHTML = `<table class="xl-tbl">${thead}${tbody}</table>`;

    // Header edits
    if (cfg.editableHeaders) {
      containerEl.querySelectorAll('.xl-th-in').forEach(inp => {
        inp.addEventListener('input', e => {
          const c = Number(e.target.dataset.c);
          cfg.headers[c] = e.target.value;
          if (cfg.onHeaderChange) cfg.onHeaderChange();
        });
      });
      containerEl.querySelectorAll('.xl-col-del').forEach(btn => {
        btn.addEventListener('click', e => {
          const c = Number(e.target.dataset.c);
          if (cfg.onDeleteCol) cfg.onDeleteCol(c);
        });
      });
    }

    // Cell input, keyboard nav & Excel paste
    const cells = containerEl.querySelectorAll('.xl-cell');
    cells.forEach(inp => {
      inp.addEventListener('input', e => {
        const r = Number(e.target.dataset.r), c = Number(e.target.dataset.c);
        rows[r][c] = e.target.value;
        if (cfg.onChange) cfg.onChange();
      });

      inp.addEventListener('keydown', e => {
        const r = Number(e.target.dataset.r), c = Number(e.target.dataset.c);
        let nr = r, nc = c, move = false;
        if (e.key === 'Enter' || e.key === 'ArrowDown') {
          nr = r + 1; move = true;
          if (nr >= rows.length) {
            rows.push(new Array(nCols).fill(''));
            renderExcelGrid(containerEl, cfg);
            const next = containerEl.querySelector(`.xl-cell[data-r="${nr}"][data-c="${nc}"]`);
            if (next) next.focus();
            e.preventDefault();
            return;
          }
        } else if (e.key === 'ArrowUp' && r > 0) {
          nr = r - 1; move = true;
        }
        if (move) {
          e.preventDefault();
          const target = containerEl.querySelector(`.xl-cell[data-r="${nr}"][data-c="${nc}"]`);
          if (target) { target.focus(); target.select(); }
        }
      });

      inp.addEventListener('paste', e => {
        const clip = (e.clipboardData || window.clipboardData)?.getData('text');
        if (!clip) return;
        // Multi-cell or multi-line paste from Excel
        if (clip.includes('\n') || clip.includes('\t')) {
          e.preventDefault();
          const startR = Number(e.target.dataset.r);
          const startC = Number(e.target.dataset.c);
          const pastedLines = clip.replace(/\r/g, '').split('\n').filter((l, i, arr) => l !== '' || i < arr.length - 1);
          const matrix = pastedLines.map(l => l.includes('\t') ? l.split('\t').map(s => s.trim()) : splitRowCells(l));

          // Expand columns if editableHeaders allows it
          const maxPasteCols = Math.max(...matrix.map(r => r.length));
          if (cfg.editableHeaders && startC + maxPasteCols > cfg.headers.length) {
            while (cfg.headers.length < startC + maxPasteCols) {
              cfg.headers.push('CT' + cfg.headers.length);
              rows.forEach(row => row.push(''));
            }
          }
          // Expand rows if needed
          while (rows.length < startR + matrix.length) {
            rows.push(new Array(cfg.headers.length).fill(''));
          }
          for (let dr = 0; dr < matrix.length; dr++) {
            for (let dc = 0; dc < matrix[dr].length; dc++) {
              const cc = startC + dc;
              if (cc < cfg.headers.length) rows[startR + dr][cc] = matrix[dr][dc];
            }
          }
          renderExcelGrid(containerEl, cfg);
          if (cfg.onHeaderChange) cfg.onHeaderChange();
          if (cfg.onChange) cfg.onChange();
          showToast(tr('paste_applied'));
        }
      });
    });
  }

      groups.forEach(g => g.forEach(v => all.push(v)));
      const N = all.length;
      if (k < 2 || N <= k) return { H: NaN, df: k - 1, p: NaN };
      const { ranks, tieSum } = rankWithTies(all);
      let offset = 0, sumR2n = 0;
      for (const g of groups) {
        let Rg = 0;
        for (let i = 0; i < g.length; i++) Rg += ranks[offset + i];
        sumR2n += (Rg * Rg) / g.length;
        offset += g.length;
      }
      let H = (12 / (N * (N + 1))) * sumR2n - 3 * (N + 1);
      const denom = 1 - tieSum / (N * N * N - N);
      H = denom > 0 ? H / denom : 0;
      return { H, df: k - 1, p: chi2PValue(Math.max(0, H), k - 1) };
    }

    const GL16_X = [
      -0.9894009349916499, -0.9445750230732326, -0.8656312023878318, -0.7554044083550030,
      -0.6178762444026438, -0.4580167776572274, -0.2816035507792589, -0.0950125098376374,
       0.0950125098376374,  0.2816035507792589,  0.4580167776572274,  0.6178762444026438,
       0.7554044083550030,  0.8656312023878318,  0.9445750230732326,  0.9894009349916499
    ];
    const GL16_W = [
      0.0271524594117541, 0.0622535239386479, 0.0951585116824928, 0.1246289712555339,
      0.1495959888165767, 0.1691565193950025, 0.1826034150449236, 0.1894506104550685,
      0.1894506104550685, 0.1826034150449236, 0.1691565193950025, 0.1495959888165767,
      0.1246289712555339, 0.0951585116824928, 0.0622535239386479, 0.0271524594117541
    ];

    function studentizedRangeCDF(q, k, df) {
      if (q <= 0) return 0;
      if (k < 2) return 1;
      const rangeCDF = (w) => {
        if (w <= 0) return 0;
        let acc = 0;
        for (let i = 0; i < 16; i++) {
          const z = 6 * GL16_X[i];
          const phi = Math.exp(-0.5 * z * z) / Math.sqrt(2 * Math.PI);
          const diff = Math.max(0, normCDF(z + w) - normCDF(z));
          acc += GL16_W[i] * phi * Math.pow(diff, k - 1);
        }
        return Math.min(1, Math.max(0, k * 6 * acc));
      };
      if (df > 500) return rangeCDF(q);
      const v2 = df / 2, logC = v2 * Math.log(v2) - logGamma(v2) + Math.log(2);
      const spread = 1 / Math.sqrt(2 * df);
      const sLo = Math.max(1e-4, 1 - 6 * spread), sHi = 1 + 7 * spread;
      const mid = 0.5 * (sLo + sHi), half = 0.5 * (sHi - sLo);
      let total = 0;
      for (let i = 0; i < 16; i++) {
        const s = mid + half * GL16_X[i];
        const pdf = Math.exp(logC + (df - 1) * Math.log(s) - v2 * s * s);
        total += GL16_W[i] * pdf * rangeCDF(q * s);
      }
      return Math.min(1, Math.max(0, half * total));
    }

    function tukeyQCrit(alpha, k, df) {
      let lo = 0, hi = 12;
      while (studentizedRangeCDF(hi, k, df) < 1 - alpha && hi < 200) hi *= 2;
      for (let i = 0; i < 45; i++) {
        const mid = 0.5 * (lo + hi);
        if (studentizedRangeCDF(mid, k, df) < 1 - alpha) lo = mid; else hi = mid;
      }
      return 0.5 * (lo + hi);
    }

    function dunnettCDF(d, nTreats, nCtrl, df) {
      if (d <= 0) return 0;
      const m = nTreats.length;
      if (m === 0) return 1;
      const lam = nTreats.map(ni => Math.sqrt(ni / (ni + nCtrl)));
      const inner = (ds) => {
        let acc = 0;
        for (let i = 0; i < 16; i++) {
          const z = 6 * GL16_X[i];
          const phi = Math.exp(-0.5 * z * z) / Math.sqrt(2 * Math.PI);
          let prod = 1;
          for (let j = 0; j < m; j++) {
            const denom = Math.sqrt(Math.max(1e-12, 1 - lam[j] * lam[j]));
            prod *= Math.max(0, normCDF((ds + lam[j] * z) / denom) - normCDF((-ds + lam[j] * z) / denom));
          }
          acc += GL16_W[i] * phi * prod;
        }
        return Math.min(1, Math.max(0, 6 * acc));
      };
      if (df > 500) return inner(d);
      const v2 = df / 2, logC = v2 * Math.log(v2) - logGamma(v2) + Math.log(2);
      const spread = 1 / Math.sqrt(2 * df);
      const sLo = Math.max(1e-4, 1 - 6 * spread), sHi = 1 + 7 * spread;
      const mid = 0.5 * (sLo + sHi), half = 0.5 * (sHi - sLo);
      let total = 0;
      for (let i = 0; i < 16; i++) {
        const s = mid + half * GL16_X[i];
        const pdf = Math.exp(logC + (df - 1) * Math.log(s) - v2 * s * s);
        total += GL16_W[i] * pdf * inner(d * s);
      }
      return Math.min(1, Math.max(0, half * total));
    }

    function dunnettCrit(alpha, nTreats, nCtrl, df) {
      let lo = 0, hi = 10;
      while (dunnettCDF(hi, nTreats, nCtrl, df) < 1 - alpha && hi < 200) hi *= 2;
      for (let i = 0; i < 45; i++) {
        const mid = 0.5 * (lo + hi);
        if (dunnettCDF(mid, nTreats, nCtrl, df) < 1 - alpha) lo = mid; else hi = mid;
      }
      return 0.5 * (lo + hi);
    }

    function howeK2(n, conf, cov) {
      if (n < 2) return NaN;
      const df = n - 1;
      const zp = normInv((1 + cov) / 2);
      const chi2 = chi2Inv(1 - conf, df);
      const r = zp * Math.sqrt(1 + 1 / n);
      const u = Math.sqrt(df / chi2);
      const k2 = r * u * Math.sqrt(1 + (df - 3 - chi2) / (2 * (n + 1) * (n + 1)));
      return Number.isFinite(k2) ? k2 : r * u;
    }

    return {
      sum, mean, variance, sd, quantile, median,
      normCDF, normInv, tPValue, tInv, fPValue, chi2PValue, chi2Inv,
      shapiroWilk, leveneTest, oneWayAnovaCore,
      mannWhitneyU, wilcoxonSignedRank, kruskalWallis,
      studentizedRangeCDF, tukeyQCrit, dunnettCDF, dunnettCrit, howeK2
    };
  })();

  function themeColors() {
    const cs = getComputedStyle(document.documentElement);
    return {
      bg: cs.getPropertyValue('--surface-2').trim() || '#f8fafc',
      fg: cs.getPropertyValue('--fg').trim() || '#1f1f1f',
      muted: cs.getPropertyValue('--muted').trim() || '#5f6368',
      line: cs.getPropertyValue('--line').trim() || '#dce5ef',
      accent: cs.getPropertyValue('--accent').trim() || '#1558B0',
      ok: cs.getPropertyValue('--ok').trim() || '#137333',
      warn: cs.getPropertyValue('--warn').trim() || '#b06000',
      danger: cs.getPropertyValue('--danger').trim() || '#b3261e',
      palette: ['#1558B0', '#137333', '#b06000', '#7b1fa2', '#00838f', '#b3261e', '#5c6bc0', '#2e7d32']
    };
  }

  function niceTicks(minV, maxV, count = 5) {
    if (!Number.isFinite(minV) || !Number.isFinite(maxV)) return [0, 1];
    if (minV === maxV) { minV -= 1; maxV += 1; }
    const range = maxV - minV;
    const rawStep = range / Math.max(1, count);
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / mag;
    let step = mag;
    if (norm > 5) step = 10 * mag;
    else if (norm > 2) step = 5 * mag;
    else if (norm > 1) step = 2 * mag;
    const start = Math.floor(minV / step) * step;
    const end = Math.ceil(maxV / step) * step;
    const ticks = [];
    for (let v = start; v <= end + step * 0.001; v += step) {
      ticks.push(Number(v.toFixed(10)));
      if (ticks.length > 20) break;
    }
    return ticks;
  }

        { param: 'Tốc độ phun dịch bao phim (CPP)', effect: 'Vỏ cam / Dính đôi / Nứt màng bao', s: 5, o: 5, d: 3, action: 'Hiệu chuẩn bơm nhu động & kiểm soát nhiệt gió vào' },
        { param: 'Kích thước tiểu phân API D90 (CMA)', effect: 'Độ đồng đều hàm lượng AV > 15.0', s: 9, o: 3, d: 2, action: 'Kiểm soát COA tán xạ laser D90 < 30 µm' }
      ];
      state.paretoRows = [
        { name: 'Sứt mẻ cạnh viên', freq: 42 }, { name: 'Dính chày / Bám mặt', freq: 29 },
        { name: 'Tách lớp (Capping)', freq: 18 }, { name: 'Sai lệch khối lượng', freq: 11 },
        { name: 'Đốm màu / Loang bề mặt', freq: 6 }, { name: 'Độ cứng thấp', freq: 4 }
      ];
    }

  function clamp10(v) { const n = Math.round(Number(v)); return (!Number.isFinite(n) || n < 1) ? 1 : Math.min(10, n); }
  function riskBadge(rpn) {
    if (rpn >= 100) return `<span class="badge badge-danger">${tr('t4_risk_high')}</span>`;
    if (rpn >= 40) return `<span class="badge badge-warn">${tr('t4_risk_med')}</span>`;
    return `<span class="badge badge-ok">${tr('t4_risk_low')}</span>`;
  }

  function renderFmea() {
    const body = document.getElementById('t4FmeaBody');
    let high = 0, med = 0, maxRpn = 0;

    body.innerHTML = state.fmeaRows.map((r, i) => {
      const rpn = clamp10(r.s) * clamp10(r.o) * clamp10(r.d);
      if (rpn >= 100) high++; else if (rpn >= 40) med++;
      if (rpn > maxRpn) maxRpn = rpn;
      return `<tr>
        <td class="xl-rn">${i + 1}</td>
        <td><input type="text" class="xl-cell xl-text fmea-in" data-i="${i}" data-k="param" value="${escHtml(r.param)}"></td>
        <td><input type="text" class="xl-cell xl-text fmea-in" data-i="${i}" data-k="effect" value="${escHtml(r.effect)}"></td>
        <td><input type="number" min="1" max="10" class="xl-cell xl-num-sm fmea-num" data-i="${i}" data-k="s" value="${r.s}"></td>
        <td><input type="number" min="1" max="10" class="xl-cell xl-num-sm fmea-num" data-i="${i}" data-k="o" value="${r.o}"></td>
        <td><input type="number" min="1" max="10" class="xl-cell xl-num-sm fmea-num" data-i="${i}" data-k="d" value="${r.d}"></td>
        <td class="num xl-td-pad"><strong>${rpn}</strong></td>
        <td class="xl-td-pad">${riskBadge(rpn)}</td>
        <td><input type="text" class="xl-cell xl-text fmea-in" data-i="${i}" data-k="action" value="${escHtml(r.action)}"></td>
        <td class="no-print" style="text-align:center"><button class="xl-col-del fmea-del" data-i="${i}" type="button">×</button></td>
      </tr>`;
    }).join('');

    document.getElementById('t4FmeaKpi').innerHTML = `
      <div class="kpi"><div class="kpi-label">${tr('t4_total_items')}</div><div class="kpi-val">${state.fmeaRows.length}</div></div>
      <div class="kpi"><div class="kpi-label">${tr('t4_high_cnt')}</div><div class="kpi-val" style="color:var(--danger)">${high}</div></div>
      <div class="kpi"><div class="kpi-label">${tr('t4_med_cnt')}</div><div class="kpi-val" style="color:var(--warn)">${med}</div></div>
      <div class="kpi"><div class="kpi-label">${tr('t4_max_rpn')}</div><div class="kpi-val">${maxRpn}</div></div>`;

    body.querySelectorAll('.fmea-in').forEach(inp => inp.addEventListener('input', e => {
      state.fmeaRows[Number(e.target.dataset.i)][e.target.dataset.k] = e.target.value;
    }));
    body.querySelectorAll('.fmea-num').forEach(inp => inp.addEventListener('change', e => {
      state.fmeaRows[Number(e.target.dataset.i)][e.target.dataset.k] = clamp10(e.target.value);
      renderFmea();
    }));
    body.querySelectorAll('.fmea-del').forEach(btn => btn.addEventListener('click', e => {
      state.fmeaRows.splice(Number(e.target.dataset.i), 1);
      renderFmea();
    }));
  }

  function renderParetoInputs() {
    const body = document.getElementById('t4ParetoInputBody');
    body.innerHTML = state.paretoRows.map((r, i) => `<tr>
      <td class="xl-rn">${i + 1}</td>
      <td><input type="text" class="xl-cell xl-text par-in" data-i="${i}" value="${escHtml(r.name)}"></td>
      <td><input type="number" min="0" class="xl-cell par-num" data-i="${i}" value="${r.freq}"></td>
      <td class="no-print" style="text-align:center"><button class="xl-col-del par-del" data-i="${i}" type="button">×</button></td>
    </tr>`).join('');

    body.querySelectorAll('.par-in').forEach(inp => inp.addEventListener('input', e => {
      state.paretoRows[Number(e.target.dataset.i)].name = e.target.value;
    }));
    body.querySelectorAll('.par-num').forEach(inp => inp.addEventListener('input', e => {
      state.paretoRows[Number(e.target.dataset.i)].freq = Math.max(0, Number(e.target.value) || 0);
    }));
    body.querySelectorAll('.par-del').forEach(btn => btn.addEventListener('click', e => {
      state.paretoRows.splice(Number(e.target.dataset.i), 1);
      renderParetoInputs();
      runPareto();
    }));
  }

  function runPareto() {
    const tblOut = document.getElementById('t4ParetoTableOut');
    const chartOut = document.getElementById('t4ParetoChartOut');
    const sorted = state.paretoRows
      .filter(r => (r.name || '').trim() !== '' && Number(r.freq) > 0)
      .map(r => ({ name: r.name.trim(), freq: Number(r.freq) }))
      .sort((a, b) => b.freq - a.freq);

    const total = Stat.sum(sorted.map(r => r.freq));
    if (!sorted.length || total <= 0) {
      tblOut.innerHTML = '';
      chartOut.innerHTML = `<div class="alert alert-warn">${tr('err_min_data')}</div>`;
      return;
    }

    let cum = 0;
    const rows = sorted.map(r => { cum += r.freq; return { ...r, pct: (r.freq / total) * 100, cum, cumPct: (cum / total) * 100 }; });

    tblOut.innerHTML = `<div class="tw"><table><thead><tr>
      <th>${tr('t4_col_defect')}</th><th class="num">${tr('t4_col_freq')}</th><th class="num">${tr('t4_col_pct')}</th><th class="num">${tr('t4_col_cum')}</th><th class="num">${tr('t4_col_cumpct')}</th>
    </tr></thead><tbody>
      ${rows.map(r => `<tr><td>${escHtml(r.name)}</td><td class="num">${r.freq}</td><td class="num">${fmt(r.pct, 1)}%</td><td class="num">${r.cum}</td><td class="num"><strong>${fmt(r.cumPct, 1)}%</strong></td></tr>`).join('')}
    </tbody></table></div>`;

    const C = themeColors();
    const W = 540, H = 300, pad = { l: 48, r: 48, t: 24, b: 66 };
    const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
    const yCount = v => pad.t + ph - (v / total) * ph;
    const yPct = p => pad.t + ph - (p / 100) * ph;
    const step = pw / rows.length, bw = Math.min(46, step * 0.68);

    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pareto Chart">`;
    svg += `<rect width="${W}" height="${H}" fill="${C.bg}" rx="6"/>`;
    [0, 20, 40, 60, 80, 100].forEach(p => {
      const y = yPct(p);
      svg += `<line x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}" stroke="${p === 80 ? C.danger : C.line}" stroke-dasharray="${p === 80 ? '5,3' : '3,3'}" stroke-width="${p === 80 ? 1.4 : 1}"/>`;
      svg += `<text x="${W - pad.r + 6}" y="${y + 4}" fill="${p === 80 ? C.danger : C.muted}" font-size="10" font-weight="${p === 80 ? 700 : 400}">${p}%</text>`;
      svg += `<text x="${pad.l - 6}" y="${y + 4}" text-anchor="end" fill="${C.muted}" font-size="10">${Math.round((p / 100) * total)}</text>`;
    });
    svg += `<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t + ph}" stroke="${C.muted}"/>`;
    svg += `<line x1="${W - pad.r}" y1="${pad.t}" x2="${W - pad.r}" y2="${pad.t + ph}" stroke="${C.muted}"/>`;
    svg += `<line x1="${pad.l}" y1="${pad.t + ph}" x2="${W - pad.r}" y2="${pad.t + ph}" stroke="${C.muted}"/>`;

    let polyPts = '';
    rows.forEach((r, idx) => {
      const cx = pad.l + step * (idx + 0.5), yB = yCount(r.freq);
      const isVital = r.cumPct <= 80.5 || idx === 0;
      svg += `<rect x="${cx - bw / 2}" y="${yB}" width="${bw}" height="${Math.max(1, pad.t + ph - yB)}" fill="${isVital ? C.accent : C.muted}" fill-opacity="${isVital ? 0.85 : 0.45}" rx="2"/>`;
      svg += `<text x="${cx}" y="${yB - 5}" text-anchor="middle" fill="${C.fg}" font-size="10" font-weight="600">${r.freq}</text>`;
      polyPts += `${cx.toFixed(1)},${yPct(r.cumPct).toFixed(1)} `;
      const shortLbl = r.name.length > 14 ? r.name.slice(0, 13) + '…' : r.name;
      svg += `<text x="${cx}" y="${pad.t + ph + 14}" text-anchor="end" transform="rotate(-28 ${cx} ${pad.t + ph + 14})" fill="${C.fg}" font-size="10.5">${escHtml(shortLbl)}</text>`;
    });

    svg += `<polyline points="${polyPts.trim()}" fill="none" stroke="${C.danger}" stroke-width="2.2"/>`;
    rows.forEach((r, idx) => {
      svg += `<circle cx="${pad.l + step * (idx + 0.5)}" cy="${yPct(r.cumPct)}" r="3.8" fill="${C.danger}" stroke="${C.bg}" stroke-width="1.2"/>`;
    });
    svg += `</svg>`;
    chartOut.innerHTML = `<div class="chart-box">${svg}</div>`;
  }


  function renderAllI18n() {
    document.documentElement.lang = state.lang;
    const bp = document.getElementById('btnPrint');
    if (bp) bp.textContent = tr('print');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  }

  function renderAllGrids() {
    renderFmea(); renderParetoInputs();
  }

  function rerenderActiveOutputs() {
    renderFmea(); runPareto();
  }

  function bindEvents() {
    document.getElementById('btnPrint').addEventListener('click', () => {
      document.getElementById('printMeta').textContent = new Date().toLocaleString(state.lang === 'vi' ? 'vi-VN' : 'en-US');
      window.print();
    });
    document.getElementById('t4SampleBtn').addEventListener('click', loadT4Sample);
    document.getElementById('t4AddFmeaBtn').addEventListener('click', () => { state.fmeaRows.push({ param: '', effect: '', s: 5, o: 5, d: 5, action: '' }); renderFmea(); });
    document.getElementById('t4SortFmeaBtn').addEventListener('click', () => { state.fmeaRows.sort((a, b) => (b.s * b.o * b.d) - (a.s * a.o * a.d)); renderFmea(); });
    document.getElementById('t4AddParetoBtn').addEventListener('click', () => { state.paretoRows.push({ name: '', freq: 1 }); renderParetoInputs(); });
    document.getElementById('t4RunParetoBtn').addEventListener('click', runPareto);
  }

  window.__MINITAB_RD_STAT__ = Stat;

  initParentSync();
  renderAllI18n();
  bindEvents();
  loadT4Sample();
})();
